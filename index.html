<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001334">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SolidWave">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="color-scheme" content="light">
<title>SolidWave Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PROJECT TRACKER
   Same visual language as PAT: IBM Plex Sans + JetBrains Mono, the
   light-sky palette, colour-coded lanes, tagged field groups, a
   stage checklist and a typed activity log.

   Every colour is a token. The two themes redefine this block and
   nothing else. Every text pair clears 4.5:1 on the surface it sits on.

   color-scheme names the look actually on screen. Without it, a browser
   set to show websites dark (Firefox: Website appearance → Dark) draws
   its own parts — dropdown highlights, date pickers, scrollbars — in
   dark-mode colours over this light page: white text on a white row.
   ============================================================ */
:root{
  color-scheme:light;
  /* SolidWave (the owner's pick of three, 2026-10-19, "A"): the logo's navy (#001334) and blues (#0069EC,
     #0046C2, #0086FC). The left bar and the top bar are the navy "frame", with the logo in its corner */
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EBF0F6; --surface-3:#DCE4EE;
  --border:#C9D4E2; --border-soft:#DFE6EF;
  --text:#0B1730; --text-dim:#25344F; --text-muted:#4F607A;
  --accent:#0069EC; --accent-strong:#0046C2; --accent-soft:#E3EEFF; --on-accent:#FFFFFF;
  --blue:#0046C2;
  --frame:#001334; --frame-2:#0A2552; --frame-3:#163A73; --frame-line:#2A4A80; --frame-text:#B4C4DC; --frame-muted:#93A9CB;
  --green:#1F6B43; --green-soft:#E2F1E8;
  --amber:#8A5A12; --amber-soft:#F8EEDB;
  --danger:#B91C1C; --danger-soft:#FBE8E8;
  --slate:#4A5E72; --slate-soft:#E6ECF2;
  --purple:#6B4C98; --purple-soft:#EEE7F7;
  --indigo:#4338CA; --indigo-soft:#E7E8FB;
  --teal:#0F6E6A; --teal-soft:#DDF0EE;
  --on-tone:#FFFFFF;
  /* store brands. Home Depot's logo orange (#F96302) is too light to read
     on white, so this one is deepened just enough; Lowe's logo blue reads as is */
  --hd:#C85000; --hd-tag:#A84300; --hd-soft:#FFF0E5;
  /* on the Routes list's store headings (the darker heading band), deep enough to read at heading size */
  --hd-head:#A84300;
  --lowes:#004990; --lowes-soft:#E5EEF8;
  --header-bg:#E3E9F2;
  --field-bg:#F7F9FC; --field-border:#7C90AC;
  --shade:0,19,52;
  /* a focused text box: a solid accent edge with a soft glow outside it */
  --focus-ring:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft);
  --shadow:0 1px 2px rgba(var(--shade),.06),0 1px 3px rgba(var(--shade),.05);
  --shadow-lift:0 6px 18px rgba(var(--shade),.12),0 18px 44px rgba(var(--shade),.12);
  --radius:8px; --radius-lg:12px; --radius-xl:16px;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"SF Mono",Menlo,monospace;
  --rail:84px;
}
:root[data-theme="night"]{
  color-scheme:dark;
  --bg:#081631; --surface:#0E1F3F; --surface-2:#13284E; --surface-3:#1A335E;
  --border:#2A4370; --border-soft:#1D3561;
  --text:#EEF3FA; --text-dim:#C8D5E8; --text-muted:#9EB2CF;
  --accent:#3D8BFF; --accent-strong:#8FBCFF; --accent-soft:#16305C; --on-accent:#03102A;
  --blue:#8FBCFF;
  --frame:#020B1E; --frame-2:#0B1D3D; --frame-3:#16305C; --frame-line:#24406E; --frame-text:#A9BCD8; --frame-muted:#8EA5C7;
  --green:#72CE9B; --green-soft:#163128;
  --amber:#E8BB68; --amber-soft:#342A17;
  --danger:#F79393; --danger-soft:#3B1F24;
  --slate:#AFC0D1; --slate-soft:#26313D;
  --purple:#C2ADEE; --purple-soft:#2D2641;
  --indigo:#AEB3F8; --indigo-soft:#262B4B;
  --teal:#66CFC6; --teal-soft:#15322F;
  --on-tone:#0B1620;
  /* on dark, Home Depot gets its exact logo orange; Lowe's blue is lightened to read */
  --hd:#F96302; --hd-tag:#F96302; --hd-soft:#2E1E14;
  --hd-head:#FF8B42;
  --lowes:#5B9BE0; --lowes-soft:#16263A;
  --header-bg:#142B54;
  --field-bg:#0A1A36; --field-border:#5A75A0;
  --shade:0,0,0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25);
  --shadow-lift:0 8px 24px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.45);
}

/* tones: one variable pair that every lane, pill, tag and stage reads */
.tone-slate {--tone:var(--slate); --tone-soft:var(--slate-soft)}
.tone-purple{--tone:var(--purple);--tone-soft:var(--purple-soft)}
.tone-indigo{--tone:var(--indigo);--tone-soft:var(--indigo-soft)}
.tone-blue  {--tone:var(--blue);  --tone-soft:var(--accent-soft)}
.tone-teal  {--tone:var(--teal);  --tone-soft:var(--teal-soft)}
.tone-green {--tone:var(--green); --tone-soft:var(--green-soft)}
.tone-amber {--tone:var(--amber); --tone-soft:var(--amber-soft)}
.tone-red   {--tone:var(--danger);--tone-soft:var(--danger-soft)}
.tone-muted {--tone:var(--text-muted);--tone-soft:var(--surface-2)}
/* a store's company: Home Depot orange, Lowe's blue (see brandOf) */
.brand-hd   {--tone:var(--hd-tag);--tone-soft:var(--hd-soft)}
.brand-lowes{--tone:var(--lowes); --tone-soft:var(--lowes-soft)}

*{box-sizing:border-box;margin:0;padding:0}
/* --top-h follows the top bar's real height (it grows when its buttons wrap), so whatever
   Tab moves to is never hidden under it; the extra 12px clears the focus outline */
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top-h,90px) + 12px);background:var(--bg)}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:var(--accent-strong)}
ul,ol{list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1 1 auto}
/* numbers that line up; the typewriter font is only for codes read out letter by letter (VIN, plate, CDL #,
   account #: .inp.mono), the owner's design review, 2026-10-16 */
.mono{font-variant-numeric:tabular-nums}
.meta{color:var(--text-muted);font-size:13px}
.skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:9px;
  font:600 14px var(--sans);border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  transition:background .12s,border-color .12s,color .12s,box-shadow .12s;white-space:nowrap;text-decoration:none;touch-action:manipulation}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-tone)}
.btn.danger-fill:hover{filter:brightness(.92);color:var(--on-tone)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px;gap:5px}
.btn.sm svg.i{width:15px;height:15px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- shell: PAT's left rail ---------- */
/* the left bar is the navy frame; the logo sits in its top corner and reaches into the top bar, navy too */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--frame);border-right:1px solid var(--frame);
  display:flex;flex-direction:column;align-items:center;padding:88px 0 14px;gap:6px;z-index:40}
.brand{position:absolute;left:12px;top:9px;z-index:45;line-height:0}
.brand img{display:block;height:56px;width:auto}
/* a page open over everything covers part of the logo: it steps away until the page closes */
body:has(#scrim.on) .rail .brand{visibility:hidden}
.navbtn{width:68px;min-height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--frame-text);font:600 12px var(--sans);border:1.5px solid transparent;position:relative;
  transition:background .12s,color .12s,border-color .12s}
.navbtn svg.i{width:24px;height:24px}
.navbtn:hover{background:var(--frame-2);color:#fff;border-color:var(--frame-3)}
.navbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.navbtn.tut-on,.navbtn.tut-on:hover{background:var(--purple);color:var(--on-tone);border-color:var(--purple);box-shadow:0 2px 8px rgba(var(--shade),.18)}
/* a new version is ready: a green dot on Settings */
.navbtn .upd{position:absolute;top:8px;right:15px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--frame)}
.navbtn .dot{position:absolute;top:6px;right:9px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--on-tone);
  font:700 12px/18px var(--sans);padding:0 5px;text-align:center;box-shadow:0 0 0 2px var(--frame)}
.rail .spacer{flex:1}
/* on a wide screen the page stops at 1600px across and sits in the middle, and the top bar's
   title, search and buttons line up with it (the bar's color still runs edge to edge) */
.main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column;--gutter:max(24px, calc((100% - 1600px) / 2 + 24px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--frame);border-bottom:1px solid var(--frame);padding:14px var(--gutter) 13px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
/* the page's name starts clear of the logo, which reaches into the top bar */
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0;margin-left:72px}
.ttl h1{font:700 26px/1.12 var(--sans);letter-spacing:-.5px;color:#fff}
.ttl .sub{color:var(--frame-text);font-size:13px}
.acts{display:flex;gap:8px;align-items:center}
/* on the navy frame a plain button is an outline; the main one stays blue */
.top .btn:not(.primary){background:transparent;border-color:var(--frame-line);color:#fff}
.top .btn:not(.primary):hover{background:var(--frame-2);border-color:var(--frame-text);color:#fff}
.search{position:relative;width:min(400px,100%)}
.search input{width:100%;height:40px;border:1.5px solid var(--frame-line);border-radius:20px;background:var(--frame-2);padding:0 40px 0 38px;font-size:14px;color:#fff}
.search input::placeholder{color:var(--frame-muted)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:var(--focus-ring)}
.search input::-webkit-search-cancel-button{display:none}
.search > svg.i{position:absolute;left:13px;top:11px;color:var(--frame-muted);pointer-events:none}
.search kbd{position:absolute;right:12px;top:10px;font:600 12px var(--mono);color:var(--frame-muted);border:1px solid var(--frame-line);border-radius:5px;padding:1px 6px;background:var(--frame);pointer-events:none}
.search input:focus ~ kbd{display:none}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lift);
  max-height:min(62vh,520px);overflow:auto;padding:6px;display:none;z-index:60}
.results.on{display:block}
.results .grp{font:600 12px var(--sans);color:var(--text-muted);padding:9px 10px 4px}
.results .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;min-height:44px}
.results .opt[aria-selected="true"],.results .opt:hover{background:var(--accent-soft)}
.results .opt .ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);flex:0 0 auto}
.results .opt b{display:block;font-weight:600}
.results .opt small{display:block;color:var(--text-muted);font-size:12px}
.results .none{padding:16px 12px;color:var(--text-muted)}

.page{padding:20px var(--gutter) 48px;flex:1;outline:none}

/* ---------- shared bits ---------- */
/* a stage (or a document's kind): a colored dot and the word, in normal case, the same everywhere */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--text);white-space:nowrap}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tone);flex:0 0 auto}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--sans);border-radius:5px;padding:3px 7px;
  background:var(--tone-soft,var(--slate-soft));color:var(--tone,var(--slate));white-space:nowrap}
.iss{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;background:var(--danger-soft);color:var(--danger);font:700 12px var(--sans);white-space:nowrap}
.iss svg.i{width:13px;height:13px}
.av{border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;flex:0 0 auto;font-weight:700;color:#fff;background:var(--c,#4A5E72);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px 2px 3px;border-radius:15px;border:1.5px solid var(--border);
  background:var(--surface);font:600 13px var(--sans);color:var(--text);max-width:100%;min-width:0;position:relative}
.chip:hover{border-color:var(--accent);color:var(--accent-strong)}
.chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-dim);flex:0 0 auto}
.chip .ci svg.i{width:14px;height:14px}
.chip .sd{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:0 0 auto}
.chip .sd.ok{background:var(--green)}
.chip.flagged{border-color:var(--danger)}
.chip.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
.chip.empty{border-style:dashed;color:var(--text-muted);background:transparent;padding-left:8px}
.chip.empty:hover{color:var(--accent-strong)}
.chip.empty svg.i{width:14px;height:14px}
.prog{display:flex;align-items:center;gap:8px;font:600 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.prog .bar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--tone,var(--accent));border-radius:3px}
.warnline{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--amber)}
.warnline.bad{color:var(--danger)}
.warnline svg.i{width:14px;height:14px}

/* ---------- panels (PAT's section chrome) ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h h2{font:700 18px var(--sans);color:var(--text);display:flex;align-items:center;gap:8px}
.panel-h h2 svg.i{width:18px;height:18px;color:var(--accent-strong)}

.chev{transition:transform .15s;color:var(--text-muted)}
[aria-expanded="true"] > .chev{transform:rotate(90deg)}
.st-abbr{font:700 12px var(--sans);letter-spacing:.3px;color:var(--accent-strong);background:var(--accent-soft);border-radius:6px;padding:3px 7px}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:var(--surface)}}

/* ---------- home (the owner, 2026-10-19): Needs attention across the top, its kinds side by side; under it the
   calendar, with Today in a column on its right. Each a flat section in its own color like a page's Overview ---------- */
.home{display:flex;flex-direction:column;gap:18px}
.home-main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.att-sec .ag-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px 28px;align-items:start}
.ovb-h h2{margin:0;font:700 18px/1.3 var(--sans);color:var(--text)}
/* Needs attention: a line per kind, how many first and what's in it under; clicking one opens it in place */
.ag-list{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.ag-h{display:flex;align-items:flex-start;gap:10px;width:100%;padding:7px 8px;border-radius:10px;text-align:left}
.ag-h:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.ag-ico{display:grid;place-items:center;width:24px;height:24px;flex:0 0 auto;color:var(--tone)}
.ag-ico svg.i{width:19px;height:19px}
.ag-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.ag-t{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;font-size:15px;font-weight:600;color:var(--text)}
.ag-t b{font:700 18px/1.25 var(--sans);color:var(--tone);font-variant-numeric:tabular-nums}
.ag-chev{width:16px;height:16px;color:var(--text-muted);transition:transform .15s}
.ag.open .ag-chev{transform:rotate(180deg)}
.ag-s{font-size:13px;color:var(--text-dim);overflow-wrap:anywhere}
.ag-body{margin:0 0 8px 34px}
.ag-items{display:flex;flex-direction:column}
.ag-it{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;width:100%;padding:5px 8px;border-radius:8px;text-align:left;font-size:14px;line-height:1.4}
.ag-it:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.ag-it:hover .ag-x{text-decoration:underline}
.ag-w{font-weight:700;color:var(--text)}
.ag-x{color:var(--text);overflow-wrap:anywhere}
.ag-when{flex-basis:100%;font-size:13px;color:var(--text-muted)}
.ag-more{margin:2px 0 0 2px}
/* Today's overdue line opens to its tasks; the rest of today and the day's dates follow */
.today-p > .ag{margin:0 -8px 4px}
.today-p .tlist.ag-body{margin:0 8px 6px}
.today-p .tlist.autos{display:flex;flex-direction:column;gap:4px;padding:8px 0 0;border-top:0}
.today-p .tlist.autos .cc-t{white-space:normal;overflow-wrap:anywhere}
.t-more{margin:4px 0 0 2px}
/* a list showing one of those groups (from Home): what it's showing, and Show all right after */
.need-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--amber-soft);
  font-size:15px;font-weight:600;color:var(--text)}
.need-bar svg.i{width:18px;height:18px;color:var(--amber)}
.need-bar .linkbtn{font-size:15px}
.cal-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.cal-bar h2{font:700 18px/1.2 var(--sans);letter-spacing:-.3px;margin:0 8px 0 6px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--field-border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-b{min-height:30px;padding:0 13px;font-size:13px;font-weight:600;color:var(--text-dim)}
.seg-b + .seg-b{border-left:1px solid var(--field-border)}
.seg-b:hover{background:var(--surface-2);color:var(--text)}
.seg-b[aria-pressed="true"]{background:var(--accent-strong);color:var(--on-accent)}
.seg-b:focus-visible{outline-offset:-3px}
/* what sits on a day: your tasks (blue), starts and pickups (teal), paperwork running out (amber) */
.k-task,.cchip.task{--k:var(--accent);--k-soft:var(--accent-soft)}
.k-start{--k:var(--teal);--k-soft:var(--teal-soft)}
.k-due{--k:var(--amber);--k-soft:var(--amber-soft)}
.cchip{display:flex;align-items:center;gap:5px;width:100%;min-height:24px;margin-top:3px;padding:3px 7px;border-radius:5px;border-left:3px solid var(--k);background:var(--k-soft);color:var(--text);
  font-size:12px;line-height:1.35;text-align:left;overflow:hidden;user-select:none}
.cc-t{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* on the month and a week's all-day row the words wrap instead of being cut off (the owner, 2026-10-16), with
   the store or person after them; a day's starts, pickups or papers due, two or more, are one ("3 starting") */
.cal-month .cchip,.tg-allc .cchip{align-items:flex-start}
.cal-month .cc-t,.tg-allc .cc-t{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.cc-t .cc-st{display:inline-block;margin-left:3px;vertical-align:1px}
.cc-t .cc-st.who{max-width:none}
.cchip:hover{box-shadow:inset 0 0 0 1px var(--k)}
.cchip b{font-weight:700}
.cchip svg.i.rep{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
.cchip.late{--k:var(--danger);--k-soft:var(--danger-soft)}
.cchip.done{--k:var(--border);--k-soft:var(--surface-2);color:var(--text-muted);text-decoration:line-through}
[data-drag-task]{cursor:grab}
.cchip.dragging{opacity:.35}
.cchip-ghost{position:fixed;z-index:400;margin:0;pointer-events:none;box-shadow:var(--shadow-lift)}
body.tdragging,body.tdragging *{cursor:grabbing!important;user-select:none}
.drop-on{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)}
/* month */
.cal-month{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-month th{font:600 12px var(--sans);color:var(--text-muted);padding:8px 9px 6px;text-align:left;border-bottom:1px solid var(--border)}
.cal-d{position:relative;vertical-align:top;height:122px;padding:5px 6px 7px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
/* an empty spot on a day lights up, with a + in the corner: clicking it adds a task that day */
.cal-d:hover:not(:has(button:hover)),.tg-allc:hover:not(:has(button:hover)){background:var(--surface-2)}
.cal-d:hover:not(:has(button:hover))::after{content:"+";position:absolute;top:6px;right:9px;font:600 18px/1 var(--sans);color:var(--accent-strong);pointer-events:none}
.cal-d:last-child{border-right:0}
.cal-month tr:last-child .cal-d{border-bottom:0}
.cal-d.out{background:var(--field-bg)}
.cal-n{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;font:600 13px var(--sans);color:var(--text-dim)}
.cal-n:hover{background:var(--surface-3);color:var(--text)}
.cal-d.out .cal-n{color:var(--text-muted)}
.cal-d.today .cal-n{background:var(--accent-strong);color:var(--on-accent)}
.cal-more{display:block;min-height:24px;margin-top:2px;padding:2px 7px;border-radius:5px;font-size:12px;font-weight:600;color:var(--accent-strong);text-align:left}
.cal-more:hover{background:var(--surface-3);text-decoration:underline}
/* week and day: an all-day row, then the hours */
.tg-head,.tg-all{display:grid;grid-template-columns:var(--cols);border-bottom:1px solid var(--border)}
.tg-day{display:flex;flex-direction:column;align-items:center;padding:6px 4px 7px;border-left:1px solid var(--border-soft);min-width:0}
.tg-day .w{font:600 12px var(--sans);color:var(--text-muted)}
.tg-day .n{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 5px;border-radius:16px;font:600 18px var(--sans)}
.tg-day:hover .n{background:var(--surface-3)}
.tg-day.today .n{background:var(--accent-strong);color:var(--on-accent)}
.tg-lbl{font:600 12px var(--sans);color:var(--text-muted);padding:9px 8px 0 0;text-align:right}
.tg-allc{border-left:1px solid var(--border-soft);padding:2px 4px 6px;min-height:36px;min-width:0}
.tg-body{display:grid;grid-template-columns:var(--cols);position:relative;overflow:hidden}
.tg-hours{position:relative}
.tg-hours span{position:absolute;right:8px;margin-top:3px;font:600 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-muted);white-space:nowrap}
.tg-col{position:relative;min-width:0;border-left:1px solid var(--border-soft);
  background-image:repeating-linear-gradient(to bottom,var(--border-soft) 0 1px,transparent 1px 48px)}
.tg-col.today{background-color:var(--field-bg)}
.tg-ev{position:absolute;z-index:1;display:flex;min-width:0}
.tg-ev:hover .cchip{box-shadow:inset 0 0 0 1px var(--k)}
/* a task's top and bottom edges: hover shows a small bar and the up-down arrow, dragging changes the time */
.tg-grip{position:absolute;left:0;right:0;height:7px;z-index:2;cursor:ns-resize}
.tg-grip.g-top{top:-2px}
.tg-grip.g-bot{top:calc(var(--h,24px) - 5px)}
.tg-grip::after{content:"";position:absolute;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--accent-strong);opacity:0}
.tg-grip.g-top::after{top:3px}
.tg-grip.g-bot::after{bottom:3px}
.tg-ev:hover .tg-grip::after{opacity:.8}
body.tresizing,body.tresizing *{cursor:ns-resize!important;user-select:none}
/* the empty hour under the mouse: clicking it adds a task then */
.tg-hover{position:absolute;left:2px;right:2px;z-index:0;display:flex;align-items:flex-start;gap:4px;padding:3px 7px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-strong);font-size:12px;font-weight:600;pointer-events:none}
.tg-hover svg.i{width:14px;height:14px}
/* the store a task is about, before its name: Home Depot and Lowe's in their own colors */
.cc-st{flex:0 0 auto;padding:0 3px;border-radius:3px;background:var(--surface);font:700 12px/15px var(--sans);color:var(--accent-strong)}
.cc-st.brand-hd,.cc-st.brand-lowes{color:var(--tone)}
/* or the driver it's about, by name (a truck goes by its unit, like a store's number) */
.cc-st.who{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 12px/15px var(--sans);letter-spacing:0}
.tg-ev .cchip{height:100%;margin:0;align-items:flex-start;line-height:16px}
.tg-ev .cc-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines);white-space:normal}
.tg-ev.short .cc-t{display:block;white-space:nowrap}
/* pointing at a task in the hours, or tabbing to it, shows all of it (the owner, 2026-10-16: nothing cut off): the
   box grows to fit its words, across the whole day, over what's beside or under it. Not while dragging */
body:not(.tdragging):not(.tresizing) .tg-ev:hover,body:not(.tdragging):not(.tresizing) .tg-ev:focus-within{z-index:4;height:auto!important;min-height:var(--h);left:2px!important;width:calc(100% - 4px)!important}
body:not(.tdragging):not(.tresizing) .tg-ev:hover .cchip,body:not(.tdragging):not(.tresizing) .tg-ev:focus-within .cchip{min-height:var(--h);box-shadow:var(--shadow-lift)}
body:not(.tdragging):not(.tresizing) .tg-ev:hover .cc-t,body:not(.tdragging):not(.tresizing) .tg-ev:focus-within .cc-t{display:block;-webkit-line-clamp:unset;white-space:normal;overflow:visible}
/* the time now: under the tasks, so it never looks like one is crossed out */
.tg-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:0;pointer-events:none}
.tg-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.tg-drop{position:absolute;left:2px;right:2px;z-index:3;padding:2px 7px;border:2px dashed var(--accent);border-radius:6px;background:var(--accent-soft);
  font-size:12px;line-height:16px;color:var(--text);pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:var(--shadow-lift)}
.cal-leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--text-dim)}
.cal-leg i{display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-2px;border-radius:3px;border-left:3px solid var(--k);background:var(--k-soft)}
.cal-leg .fhelp{margin-left:auto}
/* Today, and the tasks on a page */
.tlist > li{border-bottom:1px solid var(--border-soft)}
.tlist > li:last-child{border-bottom:0}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;align-items:start;padding:8px 16px 9px 12px}
.tbox{position:relative;grid-row:span 2;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;cursor:pointer}
.tbox:hover{background:var(--surface-2)}
.tbox:hover .box{border-color:var(--accent)}
.t-title{min-height:24px;padding:2px 0;font-weight:600;text-align:left;overflow-wrap:anywhere}
.t-title:hover{color:var(--accent-strong);text-decoration:underline}
.t-when{grid-column:2;font-size:13px;color:var(--text-muted)}
.trow.late .t-when{color:var(--danger);font-weight:600}
.trow.done .t-title{color:var(--text-muted);text-decoration:line-through}
.tlist.autos{padding:8px 16px 12px;border-top:1px solid var(--border-soft)}
.tlist.autos > li{border:0}
.today-none{padding:18px 16px;color:var(--text-dim)}
.t-add{margin-top:10px}
/* a new account: what to do first */
.welcome-s{padding:18px 18px 20px}
.welcome-s h2{font:700 18px/1.25 var(--sans);letter-spacing:-.2px;margin-bottom:10px}
.welcome-s > p{color:var(--text-dim);margin-bottom:14px}
.welcome-s .steps{margin-bottom:14px}
.welcome-s .row{display:flex;gap:8px;flex-wrap:wrap}
/* the task form */
.dlg.wide{width:min(560px,100%)}
.dlg-b .three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
.tk-hint{margin-top:-6px}
.ck-line{display:flex;align-items:center;gap:10px;min-height:32px;font-weight:600;cursor:pointer}
.ck-line input{width:18px;height:18px;accent-color:var(--accent-strong)}
/* the photo window: the pictures among a driver's documents, and the circle the face is framed in */
.ph-docs{display:flex;flex-wrap:wrap;gap:10px}
.ph-doc{width:132px;display:flex;flex-direction:column;gap:6px;padding:6px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);text-align:left}
.ph-doc:hover{border-color:var(--accent)}
.ph-doc[aria-pressed="true"]{border-color:var(--accent-strong);box-shadow:0 0 0 2px var(--accent-soft)}
.ph-thumb{width:100%;aspect-ratio:4/3;border-radius:7px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:var(--text-muted)}
.ph-thumb svg.i{width:22px;height:22px}
.ph-nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-or{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ph-crop{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.ph-crop canvas{border-radius:12px;background:var(--surface-2);cursor:grab;touch-action:none}
.ph-crop canvas.grabbing{cursor:grabbing}
.ph-crop canvas:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.ph-zoom{width:min(280px,100%)}
.ph-zoom input{width:100%;accent-color:var(--accent-strong)}


/* ---------- welcome ---------- */
.welcome{max-width:760px;margin:20px auto;padding:28px 30px}
.welcome h2{font:700 22px/1.2 var(--sans);letter-spacing:-.4px;margin-bottom:8px}
.welcome > p{color:var(--text-dim);margin-bottom:18px;font-size:15px}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s;font-size:15px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);
  display:grid;place-items:center;font:700 13px var(--sans)}
.welcome .row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- boards (PAT's lanes) ---------- */
.boardbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
/* position:relative keeps the hidden screen-reader labels inside the scroller;
   without it they escape and stretch the whole page sideways */
.boardwrap{overflow-x:auto;border-radius:var(--radius-lg);box-shadow:var(--shadow);position:relative}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(190px,1fr));border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--surface);min-height:calc(100vh - 210px);min-width:min-content}
.lane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);background:color-mix(in srgb,var(--tone) 5%,var(--surface))}
.lane:last-child{border-right:0}
.lane-h{padding:10px 12px 9px;border-bottom:3px solid var(--tone);background:color-mix(in srgb,var(--tone) 9%,var(--surface))}
.lane:first-child .lane-h{border-top-left-radius:var(--radius-lg)}
.lane:last-child .lane-h{border-top-right-radius:var(--radius-lg)}
.lane-t{display:flex;align-items:center;gap:8px}
.lane-t .nm{font:700 15px var(--sans);color:var(--tone)}
.lane-t .ct{display:inline-block;margin-left:auto;font:700 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--tone);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 7px;min-width:24px;text-align:center}
.lane-h .hint{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.35}
.lane-b{padding:18px 10px 10px;display:flex;flex-direction:column;gap:20px;flex:1;transition:background .12s}
.lane.drop .lane-b{background:color-mix(in srgb,var(--tone) 14%,var(--surface));outline:2px dashed var(--tone);outline-offset:-6px;border-radius:10px}
.lane-empty{border:1.5px dashed var(--border);border-radius:10px;padding:16px 10px;text-align:center;color:var(--text-muted);font-size:13px}
/* the grey "Add driver" stand-in card at the bottom of each column */
.ghost-card{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:10px 12px;border:1.5px dashed var(--border);
  border-radius:var(--radius-lg);background:color-mix(in srgb,var(--surface) 50%,transparent);color:var(--text-muted);
  font:600 14px var(--sans);text-align:left;transition:border-color .12s,background .12s,color .12s}
.ghost-card:hover,.ghost-card:focus-visible{border-color:var(--accent);border-style:solid;background:var(--surface);color:var(--accent-strong)}
.gc-shape{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-muted);flex:0 0 auto}
.gc-shape.round{border-radius:50%}
.gc-shape svg.i{width:20px;height:20px}
.ghost-card:hover .gc-shape,.ghost-card:focus-visible .gc-shape{background:var(--accent-soft);color:var(--accent-strong)}
.gc-txt{display:flex;align-items:center;gap:5px}
.gc-txt svg.i{width:15px;height:15px}

/* ---------- Financials (called Money until 2026-10-19; inside, the view is still "money"): the week, pay days,
   costs and reports (the owner's five pictures, 2026-10-16) ---------- */
.mw{display:flex;flex-direction:column;gap:16px;max-width:1400px}
.mw-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.mw-week{display:flex;align-items:center;gap:6px;margin-right:6px}
.mw-wk{font:700 18px var(--sans);color:var(--text);min-width:170px;text-align:center}
.mw-lock{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--sans);color:var(--green);padding:0 2px 0 6px}
.mw-lock svg.i{width:16px;height:16px}
.mw-heads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mw-heads .ovb{padding:14px 18px 16px}
.mw-heads .ovb-h{margin-bottom:6px}
.ovb.green{--tone:var(--green);--tone-soft:var(--green-soft)}
.ovb.red{--tone:var(--danger);--tone-soft:var(--danger-soft)}
.mw-n{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.mw-n b{font:700 26px var(--sans);color:var(--text)}
.mw-n b small{font:600 14px var(--sans);color:var(--text-dim);margin-left:8px}
.mw-n span{font-size:15px;color:var(--text-dim)}
.mw-d{margin-top:4px;font:700 15px var(--sans);color:var(--text)}
.mw-d.bad{color:var(--danger)} .mw-d.good{color:var(--green)}
.mw-hint{margin:0;font-size:14px;color:var(--text-dim)}
.mw-note{margin:0;padding:12px 16px;font-size:14px;color:var(--text-dim)}
.mw-t{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.mw-t .r{display:grid;align-items:center;min-height:44px;padding:0 16px;gap:8px;border-bottom:1px solid var(--border-soft);font-size:15px;color:var(--text);width:100%;text-align:left}
.mw-t .r:last-child{border-bottom:0}
.mw-t .r.h{min-height:38px;background:var(--header-bg);font-weight:600;color:var(--text-dim);font-size:13px}
.mw-t .r.g{min-height:38px;background:var(--surface-2);font-size:14px}
.mw-t .r.g .g-n{text-align:left;color:var(--text-dim)}
.mw-t .r.sum{background:var(--surface-2)}
.mw-t .r.sum > .rt{font-weight:600}
.mw-t .r.left{font-weight:700;background:var(--green-soft)}
.mw-t .r.left.neg{background:var(--danger-soft)}
.mw-t .c{text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.mw-t .wk{font-weight:700}
.mw-t .dim{color:var(--text-dim)}
.mw-t .sur{color:var(--amber);font-weight:700}
.mw-t .rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-route{display:inline-flex;align-items:baseline;gap:8px;min-height:32px;max-width:100%;padding:6px 0;text-align:left;border-radius:6px;color:var(--text)}
.mw-route b{font-weight:700}
.mw-route span{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-route:hover b,.mw-route:hover{color:var(--accent-strong)}
.mw-route:hover b{text-decoration:underline}
.mw-cell{min-height:34px;padding:0 8px;border-radius:7px;color:var(--text);font-size:15px}
.mw-cell:hover{background:var(--accent-soft)}
.mw-cell.fut{color:var(--text-muted)}
.mw-cell.off{color:var(--danger);font-weight:600}
.mw-cell.closed{color:var(--text-dim);font-weight:600}
.mw-dh{min-height:32px;padding:0 6px;border-radius:6px;font:600 13px var(--sans);color:var(--text-dim)}
.mw-dh:hover{background:var(--surface-3);color:var(--text)}
.mw-dh.today{color:var(--accent-strong)}
.mw-diff ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.mw-diff li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text);line-height:1.45}
.mw-diff li > svg.i{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
.mw-diff .x > svg.i{color:var(--danger)} .mw-diff .w > svg.i{color:var(--amber)} .mw-diff .k > svg.i{color:var(--green)} .mw-diff .i > svg.i{color:var(--accent-strong)}
.mw-diff b{font-weight:700}
.mw-diff .hlink{margin-left:8px}
.mw-terms{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0;font-size:15px;color:var(--text-dim)}
.mw-terms svg.i{width:18px;height:18px;color:var(--accent-strong)}
.mw-h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:4px 0 -4px}
.mw-h2 h2{margin:0;font:700 18px var(--sans);color:var(--text)}
.mw-all{display:block;padding:12px 16px}
.mp .r{grid-template-columns:130px minmax(0,1.3fr) 110px 110px minmax(0,1.8fr)}
.mp-row:hover,.mb-row:hover,.cl-row:hover{background:var(--surface-2)}
.mp .st{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.mp .st svg.i{width:16px;height:16px;flex:0 0 auto}
.mp .held{color:var(--amber)} .mp .ok{color:var(--green)} .mp .bad{color:var(--danger)} .mp .due{color:var(--text-dim);font-weight:400} .mp .more{color:var(--accent-strong)}
.mb .r{grid-template-columns:minmax(0,1fr) 150px 250px 200px}
.mb .dots{display:flex;gap:6px;align-items:center}
.mb .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--green);display:inline-block}
.mb .dots i.on{background:var(--green)}
.mb .dots span{margin-left:6px}
.mb .bad{color:var(--danger);font-weight:600}
.mw-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.mw-box{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.mw-box-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.mw-box-h h2{margin:0;font:700 18px var(--sans);color:var(--text)}
.mw-box-h .n{font-size:14px;color:var(--text-dim)}
.ct .r{display:grid;grid-template-columns:minmax(0,1.4fr) 92px 92px 96px;gap:10px;align-items:center;min-height:50px;padding:4px 16px;border-bottom:1px solid var(--border-soft);font-size:15px;color:var(--text)}
.ct .r.h{min-height:36px;background:var(--header-bg);font-weight:600;color:var(--text-dim);font-size:13px}
.ct .r.t{font-weight:700;border-bottom:0;background:var(--surface-2);min-height:44px}
.ct .c{text-align:right;font-variant-numeric:tabular-nums}
.ct .more{color:var(--danger);font-weight:600} .ct .less{color:var(--green);font-weight:600} .ct .same{color:var(--text-dim)}
.ct .nm b{font-weight:600}
.ct .nm small{font-size:13px;color:var(--text-dim);margin-left:6px}
.ct .bar{display:block;height:6px;border-radius:3px;background:var(--surface-3);margin-top:6px;overflow:hidden;max-width:220px}
.ct .bar > i{display:block;height:100%;background:var(--accent)}
.cl .r{display:grid;grid-template-columns:58px minmax(0,1fr) auto 92px;gap:12px;align-items:center;min-height:54px;padding:5px 16px;border-bottom:1px solid var(--border-soft);font-size:15px;color:var(--text);width:100%;text-align:left}
.cl .d{color:var(--text-dim);font-weight:600;font-size:14px}
.cl .w{min-width:0}
.cl .w b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .w small{display:block;font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .tags{display:flex;align-items:center;gap:6px}
.cl .tag{display:inline-flex;align-items:center;font:600 12px var(--sans);color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:2px 8px}
.cl .tag.est{color:var(--accent-strong);background:var(--accent-soft)}
.cl .rec{color:var(--text-dim);display:inline-flex}
.cl .rec svg.i{width:17px;height:17px}
.cl .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cl .est .c{color:var(--text-dim)}
.rc{padding:18px 24px 14px}
.rc-plot{position:relative;display:grid;gap:var(--rc-gap,20px);padding:0 20px}
.rc-col{position:relative;height:100%}
.rc-bar{position:absolute;left:50%;transform:translateX(-50%);width:min(84px,70%);border-radius:5px 5px 0 0;background:var(--green)}
.rc-bar.neg{background:var(--danger);border-radius:0 0 5px 5px}
/* an amount sits centered on its bar, even when it's wider than the bar's room */
.rc-v{position:absolute;left:50%;transform:translateX(-50%);text-align:center;font:700 14px var(--sans);color:var(--text);white-space:nowrap}
.rc-exp{position:absolute;left:6%;right:6%;border-top:2px dashed var(--accent)}
.rc-base{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
.rc-x{display:grid;gap:var(--rc-gap,20px);padding:8px 20px 0;font-size:14px;font-weight:600;color:var(--text-dim);text-align:center}
.rc-x small{display:block;font-size:13px;font-weight:400;color:var(--text-dim)}
.rc.fc .rc-v,.rc.fc .rc-x{font-size:13px}
.rc .wd-x{visibility:hidden}
.rc-tip{display:none}
.rr .r{grid-template-columns:90px minmax(0,1.5fr) 100px 110px 110px 110px 110px}
.rr .pos{color:var(--green);font-weight:700} .rr .low{color:var(--amber);font-weight:700} .rr .neg{color:var(--danger);font-weight:700}
.rr .mw-route{font-weight:700}
.mn-file{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:40px}
.mn-fname{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--text)}
.mn-fname svg.i{width:18px;height:18px;color:var(--danger)}
.mn-kind{margin-top:-6px}
.mn-rent{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}
.fld[hidden]{display:none}
/* ---------- Forecast (the owner's pick from three pictures, 2026-10-17): a scenario's routes as lines, like their
   handwritten sheet, each value in its own box; under them what it comes to, then the cash week by week ---------- */
.fc-tag{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--purple);background:var(--purple-soft);border-radius:8px;padding:5px 10px}
.fc-tag svg.i{width:15px;height:15px}
.fc-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow-x:auto}
.fc-lines{min-width:1210px}
.fc-lines .r{display:grid;grid-template-columns:minmax(204px,2fr) 50px 80px 50px 80px 168px 168px 76px 80px minmax(118px,1fr) 28px;gap:8px;align-items:center;
  min-height:58px;padding:6px 12px 6px 16px;border-bottom:1px solid var(--border-soft);font-size:15px;color:var(--text)}
.fc-lines .r.h{min-height:46px;background:var(--header-bg);font-weight:600;color:var(--text-dim);font-size:13px;line-height:1.25}
.fc-lines .r.h .c{text-align:right}
.fc-lines .inp{height:38px;padding:0 10px}
.fc-lines .money .inp{padding-left:22px}
.fc-lines .money::before{left:10px}
.fc-rent{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:6px;align-items:center}
/* its lists a little tighter, so a kind's whole name and "a month" fit */
.fc-lines .fp-btn{gap:4px;padding:0 8px;font-size:14px}
.fc-lines .fp-btn .fp-ic{width:14px;height:14px}
/* a laptop's narrower window: the same lines, packed closer, so they fit without scrolling sideways */
@media (max-width:1380px){
  .fc-lines{min-width:1060px}
  .fc-lines .r{grid-template-columns:minmax(196px,2fr) 44px 74px 44px 74px 160px 160px 70px 74px minmax(100px,1fr) 28px;gap:6px;padding:6px 10px 6px 12px}
  .fc-rent{grid-template-columns:minmax(0,1fr) 84px}
  .fc-left .io{display:none}
}
.fc-empty > span{flex:1 1 320px;min-width:0}
.fc-left{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.fc-left.neg{color:var(--danger)}
.fc-left small{display:block;font-weight:400;font-size:13px;color:var(--text-dim)}
.fc-none{color:var(--text-muted);padding-left:10px}
.fc-foot{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:10px 16px;background:var(--surface-2)}
#fcOut{display:flex;flex-direction:column;gap:16px}
.fc-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1.5px solid var(--field-border);border-radius:16px;background:var(--surface);
  font:600 13px var(--sans);color:var(--text-dim)}
.fc-chip svg.i{width:14px;height:14px}
.fc-chip:hover{border-color:var(--accent)}
.fc-chip[aria-pressed="true"]{border-color:var(--accent-strong);background:var(--accent-soft);color:var(--accent-strong)}
.cmp .r{gap:12px;min-height:46px}
.cmp .r.h{min-height:68px}
.cmp .r.h .c small{display:block;font-size:13px;color:var(--text-dim);font-weight:400}
.cmp .r > span:first-child{font-weight:600;color:var(--text-dim)}
.cmp .best{color:var(--green);font-weight:700}
.cmp .best::before{content:"Best";margin-right:8px;font:700 11px var(--sans);color:var(--green);background:var(--green-soft);border-radius:8px;padding:2px 7px;vertical-align:2px}
.cmp .r.big{min-height:54px;background:var(--green-soft)}
.cmp .r.big .c{font-weight:700;font-size:17px}
.cmp .r.f .c{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;padding:8px 0}
.fc-open{display:inline-flex;align-items:center;min-height:30px;font:700 16px var(--sans);color:var(--text);text-align:right;border-radius:4px}
.fc-open:hover{color:var(--accent-strong);text-decoration:underline}
/* routes that aren't running yet (accepted or being set up), when Money counts them: in indigo */
.mw-t .r.soon{background:var(--indigo-soft)}
.mw-cell.soon{color:var(--indigo);font-weight:600}
.mw-d.soon{color:var(--indigo)}
.soon-tag{display:inline-flex;align-items:center;flex:0 0 auto;font:600 12px var(--sans);color:var(--indigo);background:var(--surface);border:1px solid var(--indigo);border-radius:10px;padding:1px 8px;white-space:nowrap}
.mw-soon{display:flex;justify-content:center;align-items:center}
.mw-t .rt.has-tag{display:flex;align-items:center;gap:8px}
.mw-t .rt.has-tag .mw-route{min-width:0;overflow:hidden}
.rr .soon-tag{margin-right:8px}
@media (max-width:1100px){ .mw-heads,.mw-two{grid-template-columns:1fr} }
/* ---------- lists: Routes, Drivers and Trucks as slim rows, so hundreds still fit ---------- */
.lpage{display:flex;flex-direction:column;gap:12px;container-type:inline-size}
/* the Trucks page's two tabs (Trucks, Trailers); the one showing is underlined */
.ptabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.ptab{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;margin-bottom:-1px;border-bottom:3px solid transparent;font-size:15px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.ptab:hover{color:var(--text);background:var(--surface-2)}
.ptab[aria-pressed="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.ptab[aria-pressed="true"] .tcnt{background:var(--accent-soft);color:var(--accent-strong)}
/* the stage tabs, each with its count */
.ltabs{display:flex;flex-wrap:wrap;gap:6px}
.ltab{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--surface);font:600 13px var(--sans);color:var(--text-dim)}
.ltab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tone,var(--text-muted))}
.ltab.all::before{display:none}
.ltab b{font:700 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.ltab:hover{border-color:var(--accent);color:var(--text)}
.ltab[aria-pressed="true"]{border-color:var(--tone,var(--accent-strong));background:var(--tone-soft,var(--accent-soft));color:var(--tone,var(--accent-strong))}
.ltab[aria-pressed="true"] b{color:inherit}
/* search and filters on one line */
.lfilters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lfilters .inp{width:auto;flex:0 1 220px}
.lfilters .lq{flex:1 1 280px}
/* what's ticked and what to do with it: under the list, held at the bottom of the window while
   the list scrolls, so ticking a box never shifts the rows */
.selbar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding:8px 10px;
  border:1.5px solid var(--accent);border-radius:var(--radius-lg);background:var(--accent-soft);box-shadow:var(--shadow-lift)}
.selbar .sb-n{font-weight:700;color:var(--accent-strong);padding:0 4px}
.selbar .inp{width:auto;height:32px;font-size:13px}
/* groups: a vendor's trucks, a store's drivers, a store's routes */
/* clipped to its rounded corners without becoming a scroll box, so the column names inside can stay in view */
.lgroup{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);overflow:clip}
.lgroup + .lgroup{margin-top:10px}
.lg-h{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 0;background:var(--header-bg);border-bottom:1px solid var(--border)}
.lgroup.shut .lg-h,.lgroup.empty .sg-h{border-bottom:0}
.lg-tog{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;min-height:36px;padding:0 6px;text-align:left;border-radius:6px}
.lg-tog .chev{width:16px;height:16px;flex:0 0 auto;transition:transform .12s}
.lg-tog[aria-expanded="true"] > .chev{transform:none}
.lg-tog[aria-expanded="false"] > .chev{transform:rotate(-90deg)}
.lg-nm{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-n{font:700 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.lg-sub{font-size:13px;color:var(--text-dim);white-space:nowrap}
/* one row per item: its tick box, then a button across the rest that opens it */
.lrows > li{display:flex;align-items:stretch;border-bottom:1px solid var(--border-soft)}
.lrows > li:last-child{border-bottom:0}
.lrows > li:hover{background:var(--surface-2)}
.lrows > li.on{background:var(--accent-soft)}
.lrows > li.fresh{animation:flash 1.6s ease-out}
/* the whole cell is the tick box's target, in a row and in a group's heading */
.lr-ck{display:grid;place-items:center;width:40px;min-height:36px;flex:0 0 auto;align-self:stretch;cursor:pointer}
.lr-ck input{width:17px;height:17px;margin:0;accent-color:var(--accent-strong);cursor:pointer}
.lr-main{flex:1 1 auto;min-width:0;display:grid;align-items:center;gap:10px;min-height:44px;padding:6px 12px 6px 4px;text-align:left;font-size:14px;color:var(--text)}
/* columns: name, kind (or phone), stage, state, route, cost (trucks), its tasks, the last note (trucks),
   paperwork and problems */
.lrows.truck .lr-main,.lhead.truck .lh-main{grid-template-columns:var(--idw,78px) minmax(0,1.1fr) 124px 66px minmax(0,.7fr) 150px minmax(0,1.1fr) minmax(0,1.3fr) 64px}
.lrows.driver .lr-main,.lhead.driver .lh-main{grid-template-columns:minmax(0,1.3fr) 132px 124px 66px minmax(0,1fr) minmax(0,1.9fr) 64px}
/* trailers: number, kind, its truck, VIN, plate, rent, paperwork */
.lrows.trailer .lr-main,.lhead.trailer .lh-main{grid-template-columns:var(--idw,78px) minmax(0,1fr) minmax(0,.8fr) minmax(0,1.4fr) minmax(0,.9fr) 116px 40px}
span.lc-st{display:flex;align-items:center;gap:4px}
.lc-st .more{font:600 12px var(--sans);color:var(--text-dim)}
.lc-st.lc-dim{font-size:13px}
.lrows.route .lr-main,.lhead.route .lh-main{grid-template-columns:100px 124px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 46px}
.lr-main > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the column names, inside each box under its heading (the owner, 2026-10-19: "needs to be in the box"), lined
   up with the rows' columns. While a long box scrolls by they stay in view under the top bar */
.lhead{position:sticky;top:var(--top-h,90px);z-index:2;display:flex;align-items:center;min-height:32px;background:var(--surface);border-bottom:1px solid var(--border)}
.lh-ck{width:40px;flex:0 0 auto;align-self:stretch}
.lh-main{flex:1 1 auto;min-width:0;display:grid;align-items:center;gap:10px;padding:0 12px 0 4px;font:700 13px var(--sans);color:var(--text-muted)}
.lh-main > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-main:hover .lc-id{color:var(--accent-strong);text-decoration:underline}
.lc-id{font-weight:700}
.lc-id.mono{font:700 14px var(--sans)}
span.lc-id.who{display:flex;align-items:center;gap:8px}
.lc-id.who > span{overflow:hidden;text-overflow:ellipsis}
.lc-dim{color:var(--text-muted)}
.lc-need{color:var(--amber);font-weight:600}
/* its tasks: the soonest with its day, an overdue one in red, "+2" for more */
span.lc-tk{display:flex;align-items:center;gap:6px;font-size:13px}
.lc-tk svg.i{width:14px;height:14px;flex:0 0 auto;color:var(--accent-strong)}
.lc-tk .tk-t{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lc-tk .tk-w{flex:0 0 auto;color:var(--text-dim)}
.lc-tk .tk-more{flex:0 0 auto;font:700 12px var(--sans);color:var(--text-dim);background:var(--surface-2);border-radius:9px;padding:1px 6px}
.lc-tk.late,.lc-tk.late .tk-w,.lc-tk.late svg.i{color:var(--danger)}
.lc-tk.lc-dim{font-size:13px}
/* a truck's last note: its kind as a small icon in the kind's color, the words, then the day */
span.lc-nt{display:flex;align-items:center;gap:6px;font-size:13px}
.lc-nt svg.i{width:14px;height:14px;flex:0 0 auto;color:var(--tone)}
.lc-nt .nt-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lc-nt .nt-w{flex:0 0 auto;color:var(--text-dim)}
span.lc-is{justify-self:end;display:flex;align-items:center;gap:4px;overflow:visible}
/* paperwork running out: a clock, amber when it's soon, red once it's past */
.xp{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:11px;background:var(--amber-soft);color:var(--amber)}
.xp.bad{background:var(--danger-soft);color:var(--danger)}
.xp svg.i{width:13px;height:13px}
/* a smaller window drops the trucks' last note first, so the other columns keep their room */
@container (max-width:1360px){
  .lrows.truck .lr-main,.lhead.truck .lh-main{grid-template-columns:var(--idw,78px) minmax(0,1.1fr) 124px 66px minmax(0,.9fr) 150px minmax(0,1.6fr) 64px}
  .lrows.truck .lc-nt,.lhead .lh-nt{display:none}
}
/* a narrow window drops the kind (trucks) or the phone (drivers) first, so the tasks stay */
@container (max-width:880px){
  .lrows.truck .lr-main,.lhead.truck .lh-main{grid-template-columns:var(--idw,70px) 118px 60px minmax(0,1fr) 140px minmax(0,1.4fr) 58px}
  .lrows.driver .lr-main,.lhead.driver .lh-main{grid-template-columns:minmax(0,1.3fr) 118px 60px minmax(0,1fr) minmax(0,1.5fr) 58px}
  .lrows.trailer .lr-main,.lhead.trailer .lh-main{grid-template-columns:var(--idw,70px) minmax(0,.8fr) minmax(0,1.4fr) minmax(0,.9fr) 104px 36px}
  .lrows.truck .lc-a,.lrows.driver .lc-a,.lrows.trailer .lc-a,.lhead .lc-a{display:none}
}
/* Routes: a heading per state, then each store with its routes under it */
.lst-state{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font:700 15px var(--sans);color:var(--text)}
.lst-state.first{margin-top:4px}
.lst-state span{font-size:13px;font-weight:600;color:var(--text-muted)}
.sg-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:4px 10px 4px 0;background:var(--header-bg);border-bottom:1px solid var(--border);cursor:pointer}
.sg-h.nostore{cursor:default}
.sg-h.nostore .sg-name .num{font-family:var(--sans);letter-spacing:0}
.sg-h.flash{animation:flash 1.6s ease-out}
/* the company and the store number read as one title, so they're one size */
.sg-name{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;min-width:0;min-height:30px;font:700 15px var(--sans);text-align:left;border-radius:6px}
.sg-name .shop{color:var(--text-dim)}
.sg-name .shop.brand-hd{color:var(--hd-head)}
.sg-name .shop.brand-lowes{color:var(--lowes)}
.sg-name .num{color:var(--text)}
.sg-name .city{font:600 14px var(--sans);color:var(--text-dim)}
.sg-name:hover .num{color:var(--accent-strong);text-decoration:underline}
.sg-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);white-space:nowrap}
/* the forms that add several at once: one line per vendor (trucks) or per person (drivers) */
.dlg.many{width:min(840px,100%)}
.mlines{display:flex;flex-direction:column;gap:8px}
.mline,.mhead{display:grid;gap:8px 12px;align-items:center}
.mlines.trucks .mline,.mhead.trucks{grid-template-columns:minmax(0,1.2fr) 72px minmax(0,1.4fr) 112px 96px 36px}
.mlines.drivers .mline,.mhead.drivers{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}
.mlines.trailers .mline,.mhead.trailers{grid-template-columns:minmax(0,1.3fr) 72px minmax(0,1.4fr) 112px 36px}
/* one line has nothing to take away: no x, and its boxes reach the form's edge like the ones under them */
.mlines.trucks.one .mline,.mhead.trucks.one{grid-template-columns:minmax(0,1.2fr) 72px minmax(0,1.4fr) 112px 96px}
.mlines.drivers.one .mline,.mhead.drivers.one{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mlines.trailers.one .mline,.mhead.trailers.one{grid-template-columns:minmax(0,1.3fr) 72px minmax(0,1.4fr) 112px}
.mhead.one > span:last-child{display:none}
/* each box in a line; its own name shows on a phone only (see the phone part at the end) */
.mf{display:block;min-width:0}
.mf-l{display:none}
.mhead{font:600 14px var(--sans);color:var(--text-dim);margin-bottom:-2px}
.madd{align-self:flex-start}
.board-hint{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-bottom:12px;flex-wrap:wrap}

/* the state filter: one big button, centered above each board */
.state-filter{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.sf-anchor{position:relative;width:min(460px,100%)}
.sf-btn{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:10px 26px 10px 24px;border-radius:38px;text-align:left;
  border:2px solid var(--field-border);background:var(--surface);color:var(--text);box-shadow:var(--shadow-lift);
  transition:background .12s,border-color .12s,color .12s}
.sf-btn:hover{border-color:var(--accent)}
.sf-btn > svg.i{width:32px;height:32px;color:var(--accent-strong)}
.sf-txt{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px}
.sf-k{font:600 13px var(--sans);color:var(--text-muted)}
.sf-v{font:700 26px/1.1 var(--sans);letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-btn svg.sf-chev{width:26px;height:26px;color:var(--text-muted);transition:transform .15s}
.sf-btn[aria-expanded="true"] svg.sf-chev{transform:rotate(180deg)}
.sf-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sf-btn.on:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.sf-btn.on > svg.i,.sf-btn.on .sf-k,.sf-btn.on svg.sf-chev{color:var(--on-accent)}
.sf-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lift);padding:8px;max-height:min(62vh,520px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.sf-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 14px;border-radius:12px;font:600 18px var(--sans);color:var(--text);text-align:left}
.sf-opt:hover,.sf-opt:focus-visible{background:var(--surface-2)}
.sf-opt[aria-checked="true"]{background:var(--accent-soft);color:var(--accent-strong)}
.sf-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--field-border);display:grid;place-items:center;color:transparent;flex:0 0 auto}
.sf-tick svg.i{width:14px;height:14px;stroke-width:3.2}
.sf-opt[aria-checked="true"] .sf-tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sf-name{flex:1;min-width:0}
.sf-n{font:700 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-dim);background:var(--surface-2);border-radius:12px;padding:3px 10px}
.sf-opt[aria-checked="true"] .sf-n{background:var(--surface)}
.sf-empty{padding:10px 14px;color:var(--text-dim);font-size:14px;line-height:1.5}
/* a list's compact pickers (state; vendor or store): a button, and the big state filter's menu, smaller */
.lp{position:relative}
.lp-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;max-width:300px;padding:0 12px 0 14px;border:1.5px solid var(--field-border);
  border-radius:18px;background:var(--surface);color:var(--text);font:600 14px var(--sans);white-space:nowrap}
.lp-btn:hover{border-color:var(--accent)}
.lp-btn.on{border-color:var(--accent-strong);background:var(--accent-soft);color:var(--accent-strong)}
.lp-k{font:600 13px var(--sans);color:var(--text-muted)}
.lp-btn.on .lp-k{color:var(--accent-strong)}
.lp-v{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lp-btn svg.lp-chev{width:16px;height:16px;flex:0 0 auto;color:var(--text-muted);transition:transform .15s}
.lp-btn[aria-expanded="true"] svg.lp-chev{transform:rotate(180deg)}
.lp-menu{right:auto;min-width:250px;max-width:min(380px,90vw);border-radius:14px;padding:6px}
.lp-menu .sf-opt{min-height:40px;gap:10px;padding:0 10px;border-radius:9px;font-size:14px}
.lp-menu .sf-tick{width:20px;height:20px}
.lp-menu .sf-tick svg.i{width:12px;height:12px}
.lp-menu .sf-n{font-size:12px;padding:2px 8px}
.sf-cap{font-size:15px;color:var(--text-dim);text-align:center}
/* a text link: the words in the accent color, underlined when pointed at (the same look as .hlink) */
.linkbtn{color:var(--accent-strong);font-weight:600;text-decoration:none;padding:2px 0;min-height:24px;border-radius:4px}
.linkbtn:hover{text-decoration:underline}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;position:relative;min-width:0;border-top:3px solid var(--tone)}
.card:hover{border-color:var(--accent);border-top-color:var(--tone);box-shadow:var(--shadow-lift)}
.card.dragging{opacity:.45}
.c-top{display:flex;align-items:flex-start;gap:10px;min-width:0}
.c-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
/* the padding and matching negative margin make it a 24px-tall click target without moving anything */
.c-title{font:700 15px/1.25 var(--sans);text-align:left;color:var(--text);min-width:0;overflow-wrap:anywhere;border-radius:5px;padding:3px 0;margin:-3px 0}
.c-title.mono{font-variant-numeric:tabular-nums}
.c-title:hover{color:var(--accent-strong);text-decoration:underline}
.c-top > .c-title{flex:1}
.c-sub{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:5px;min-width:0}
.c-sub svg.i{width:13px;height:13px;color:var(--text-muted)}
.c-sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-contact{font-size:13px;color:var(--text);align-items:flex-start}
.c-contact svg.i{margin-top:2px}
.c-contact span{white-space:normal;overflow-wrap:anywhere}
.c-contact.none{color:var(--text-muted)}
/* the tab on the card's top-right corner: store number and state, sitting
   on the card's top edge so it never takes room from the name */
.c-corner{position:absolute;top:-12px;right:10px;z-index:1;display:flex;align-items:center;gap:5px;height:23px;padding:0 4px 0 9px;
  max-width:calc(100% - 20px);background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  font:700 12px var(--sans);color:var(--text);box-shadow:var(--shadow);white-space:nowrap}
.c-corner .st-abbr{font-size:12px;padding:1px 6px;border-radius:6px}
.c-corner .more{color:var(--text-dim);padding-right:4px}
.c-corner.none{color:var(--text-dim);font-weight:600}
.c-corner.bare{padding-right:9px}
.card:hover .c-corner{border-color:var(--accent)}
.c-links{display:flex;flex-wrap:wrap;gap:6px}
.c-foot{display:flex;align-items:center;gap:8px}
.c-foot .prog{flex:1}
.av.nophoto{outline:1.5px dashed var(--amber);outline-offset:2px}

/* ---------- project window (sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(var(--shade),.45);z-index:80;display:none;justify-content:center;padding:22px}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:min(1260px,100%);border-radius:var(--radius-xl);box-shadow:var(--shadow-lift);display:flex;overflow:hidden;
  border:1px solid var(--border);animation:rise .18s ease-out}
/* the page itself: header on top, then the two columns. A store's window adds its tabs on the left,
   and is wider by their width so a route's page keeps its room */
.sh-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.sheet.has-rail{width:min(1472px,100%)}
.sh-rail{flex:0 0 212px;display:flex;flex-direction:column;gap:4px;padding:14px 10px 16px;background:var(--surface);border-right:1px solid var(--border);
  overflow:auto;overscroll-behavior:contain}
.rail-tab{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;padding:10px 11px;border-radius:10px;border:1.5px solid transparent;
  text-align:left;color:var(--text);transition:background .12s}
.rail-tab:hover{background:var(--surface-2)}
.rail-tab[aria-current="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.rt-name{font:700 15px/1.25 var(--sans);overflow-wrap:anywhere}
.rt-name .mono,.rail-route .rt-name{font-variant-numeric:tabular-nums}
.rt-sub{font-size:13px;color:var(--text-muted)}
.rt-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rail-lbl{margin:12px 8px 2px;font:600 13px var(--sans);color:var(--text-muted)}
.rail-none{margin:2px 8px;font-size:13px;color:var(--text-muted)}
.rail-add{display:flex;align-items:center;gap:10px;margin-top:6px;padding:9px 11px;border-radius:10px;color:var(--text-muted);font-weight:700;font-size:13px}
.rail-add:hover,.rail-add:focus-visible{color:var(--accent-strong)}
.rail-add svg.i{width:18px;height:18px;padding:2px;border-radius:50%;color:var(--accent-strong);box-sizing:border-box}
.rail-add:hover svg.i{background:var(--accent);color:var(--on-accent)}
/* a store's name: the company in its logo color, the number after it, one size. The tab's small
   name takes Home Depot's deeper orange, which stays readable at that size */
.st-shop{color:var(--text-dim)}
.st-shop.brand-hd{color:var(--hd)}
.st-shop.brand-lowes{color:var(--lowes)}
.rail-tab .st-shop.brand-hd{color:var(--hd-tag)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sh-head{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px 14px;display:flex;flex-direction:column;gap:12px;flex:0 0 auto;
  border-top:4px solid var(--tone)}
.sh-nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;min-height:36px}
.sh-nav > [data-act="sheet-back"]{grid-column:1;justify-self:start}
/* what this page is (a driver, a truck, a route and its store): in the middle of the bar, big enough to see
   (the owner, 2026-10-20: "you can barely see the Truck and Driver label… bring that to the middle") */
.crumbs{grid-column:2;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px var(--sans);color:var(--text-muted);min-width:0;flex-wrap:wrap;text-align:center}
.sh-tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:4px}
.crumbs svg.i{width:18px;height:18px}
.crumbs b{color:var(--text);font-weight:700;font-size:18px}
.sh-pos{font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--text-muted);min-width:54px;text-align:center}
.sh-id{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:16px;row-gap:10px}
.sh-id:has(> .sh-keys) > .av-btn,.sh-id:has(> .sh-keys) > .sh-ident{grid-row:1 / span 2;align-self:start}
/* under the name: a driver's phone over their email, each with its icon buttons in front (copy; call or
   email), then the store and route as buttons that stand out */
.sh-keys{grid-column:2 / -1;display:flex;align-items:center;flex-wrap:wrap;gap:12px 32px;min-width:0}
/* a driver's store and route sit at the far right, across from the phone and email (the owner, 2026-10-19) */
.sh-keys:has(> .hk-col) > .wchips{margin-left:auto}
.hk-col{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.hk{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.hk-v{font-size:15px;font-weight:600;color:var(--text);overflow-wrap:anywhere;user-select:text;margin-left:6px}
.hk-phone .hk-v{font-size:22px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
/* an icon button: a tinted square, so it reads as something to click; it says what it does when pointed at */
.ibtn{position:relative;width:34px;height:34px;display:inline-grid;place-items:center;flex:0 0 auto;border-radius:9px;text-decoration:none;
  border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--accent-strong);transition:background .12s,color .12s,border-color .12s}
.ibtn svg.i{width:17px;height:17px}
.ibtn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ibtn.done,.ibtn.done:hover{background:var(--green-soft);border-color:var(--green);color:var(--green)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);z-index:60;
  padding:5px 9px;border-radius:7px;background:var(--text);color:var(--surface);font:600 12px/1.2 var(--sans);white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.hk-add{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1.5px dashed var(--border);border-radius:10px;font-size:14px;font-weight:600;color:var(--text-dim)}
.hk-add:hover{border-color:var(--accent);color:var(--accent-strong)}
.hk-add svg.i{width:15px;height:15px}
.wchips{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
.wchip{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:5px 16px 5px 11px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--tone) 40%,transparent);
  background:var(--tone-soft);color:var(--tone);text-align:left;max-width:100%;min-width:0}
.wchip:hover{border-color:var(--tone)}
.wchip > svg.i{width:20px;height:20px;flex:0 0 auto}
.wc-tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.wc-t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-s{font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip.add{background:transparent;border:1.5px dashed var(--border);color:var(--text-dim)}
.wchip.add:hover{border-color:var(--accent);color:var(--accent-strong)}
.sh-ident{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);flex:0 0 auto}
.sh-ident svg.i{width:30px;height:30px}
.av-btn{position:relative;border-radius:50%;flex:0 0 auto}
.av-btn .cam{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;color:var(--text-dim);box-shadow:var(--shadow)}
.av-btn .cam svg.i{width:15px;height:15px}
.av-btn:hover .cam{border-color:var(--accent);color:var(--accent-strong)}
.sh-tt{min-width:0;flex:1 1 260px}
.sh-title{font:700 26px/1.12 var(--sans);letter-spacing:-.5px;outline:none;overflow-wrap:anywhere}
.sh-title.mono{font-variant-numeric:tabular-nums}
.sh-sub{color:var(--text-dim);font-size:14px;margin-top:3px}
.sh-stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* the stage bar: a piece per stage (done green, the one it's in blue, still to come gray), the way out apart */
/* the stage bar (the owner's pick of three, 2026-10-19: "A"): arrows one after another, like a path. The ones
   done green with a tick, the one it's in blue, the rest gray; the one whose steps show has a bar along its
   bottom edge. The arrow shape is cut with clip-path (clicks follow it too), so a keyboard ring goes round
   the words instead */
.stbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.stb-steps{flex:1 1 560px;display:flex;min-width:0;border-radius:12px;overflow:hidden}
.stb{position:relative;flex:1 1 0;min-width:0;height:46px;display:flex;align-items:center;justify-content:center;padding:0 16px 0 27px;margin-left:-9px;
  background:var(--surface-3);color:var(--text-dim);text-align:center;transition:background .15s,color .15s;
  clip-path:polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)}
.stb:first-child{margin-left:0;padding-left:16px;clip-path:polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)}
.stb:last-child{padding-right:14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,15px 50%)}
.stb:only-child{clip-path:none}
.stb:hover{background:color-mix(in srgb,var(--accent) 20%,var(--surface-3));color:var(--text)}
.stb.done{background:var(--green);color:var(--on-tone)}
.stb.done:hover{background:color-mix(in srgb,var(--green) 86%,#000)}
.stb.cur{background:var(--accent);color:var(--on-accent)}
.stb.cur:hover{background:var(--accent-strong)}
.stb-nm{display:inline-flex;align-items:center;gap:6px;min-width:0;font-size:14px;font-weight:600}
.stb-nm svg.i{width:16px;height:16px;flex:0 0 auto}
.stb-tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stb.cur .stb-nm{font-weight:700}
.stb[aria-pressed="true"]{box-shadow:inset 0 -4px 0 rgba(var(--shade),.4)}
.stb.next[aria-pressed="true"]{box-shadow:inset 0 -4px 0 var(--accent)}
.stb:focus-visible{outline:none}
.stb:focus-visible .stb-nm{outline:2.5px solid currentColor;outline-offset:3px;border-radius:4px}
.stb-out{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.stb-out svg.i{width:15px;height:15px}
.stb-out:hover{border-color:var(--danger);color:var(--danger)}
.stb-out.on{border-style:solid;border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.stb-out[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.stb-edit{margin-left:0}
.stb-out{position:relative;margin-left:auto}
.stb-out::before{content:"";position:absolute;left:-15px;top:6px;bottom:6px;width:1px;background:var(--border)}
/* the tabs sit on the header's bottom edge; the one showing is underlined */
.sh-tabs{display:flex;gap:2px;margin:0 -6px -14px;overflow-x:auto}
.sh-tab{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-bottom:3px solid transparent;border-radius:0;font-size:14px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.sh-tab:hover{color:var(--text);background:var(--surface-2)}
.sh-tab[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.tcnt{font-size:12px;font-weight:700;color:var(--text-dim);background:var(--surface-2);border-radius:10px;padding:1px 7px}
.sh-tab[aria-selected="true"] .tcnt{background:var(--accent-soft);color:var(--accent-strong)}
.tcnt.bad,.sh-tab[aria-selected="true"] .tcnt.bad{background:var(--danger-soft);color:var(--danger)}
.sh-body{flex:1;overflow:auto;padding:18px 20px 28px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:18px;align-items:start;overscroll-behavior:contain;position:relative;background:var(--bg)}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
/* a page squeezed by a store's tabs goes to one column, like a narrow window does */
@container (max-width:1000px){ .sh-body{grid-template-columns:1fr} }

/* ---------- documents ---------- */
/* the Documents page (2026-10-16): the filters like the lists', then a heading with Add right after it and the lines
   of a driver's Documents tab; files dropped anywhere on the page are added */
.docbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:18px}
.docbar .docq{flex:1 1 260px;width:auto}
.docs-page{max-width:1320px;border-radius:12px;min-height:240px}
.docs-page.drop{outline:2px dashed var(--accent);outline-offset:8px;background:var(--accent-soft)}
.docs-page .ss-h h2{font:700 18px/1.3 var(--sans);color:var(--text);margin:0}
/* folders on the left, held in view while the page scrolls; what's in the open one on the right */
.docs-cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.ftree{position:sticky;top:calc(var(--top-h,90px) + 16px);max-height:calc(100vh - var(--top-h,90px) - 32px);overflow:auto;padding:0 4px 12px 0}
.ft-h{display:flex;align-items:center;gap:12px;min-height:40px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.ft-h h3{font:700 18px/1.3 var(--sans);color:var(--text);margin:0}
.ft{list-style:none;margin:0;padding:0}
.ft-row{display:flex;align-items:center;gap:2px;padding-left:calc(var(--lvl,0) * 16px);border-radius:8px;min-height:34px}
.ft-row:hover{background:var(--surface-2)}
.ft-row.on{background:var(--accent-soft)}
.ft-row.on .ft-nm{color:var(--accent-strong);font-weight:700}
.ft-tg{display:grid;place-items:center;width:24px;height:30px;flex:0 0 auto;color:var(--text-muted);border-radius:6px}
button.ft-tg:hover{background:var(--surface-3);color:var(--text)}
.ft-tg svg.i{width:14px;height:14px}
.ft-nm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px 0 4px;font-size:14px;font-weight:600;color:var(--text);text-align:left;border-radius:6px}
.ft-nm svg.i{width:17px;height:17px;flex:0 0 auto;color:var(--amber)}
.ft-row[data-fdrop="root"] .ft-nm svg.i{color:var(--accent-strong)}
.ft-tx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft-n{flex:0 0 auto;font:600 12px var(--sans);color:var(--text-muted)}
