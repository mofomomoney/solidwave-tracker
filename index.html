/* the list's pickers: the state, and the vendor (trucks) or store (drivers). Each lists only what this
   list has, with how many each would show as everything else is filtered now (the owner, 2026-10-14:
   "why is New York showing if there is nothing in New York"); the one picked stays listed even at 0 */
let LPICK="";   /* the picker whose menu is open: "state", "pick" or none */
function pickerOpts(t, which){
  const u=LU(t), counts=new Map(), names={}, tags={}; let none=0, total=0;
  if(which==="state"){
    const sf=stateFilter();
    if(t==="route"){
      /* on Routes it counts stores, the way the list is laid out (routes with no store count under "No state yet") */
      routeStoresShown("").forEach(x=>{ total++; if(x.s.state) counts.set(x.s.state, (counts.get(x.s.state)||0)+1); else none++; });
      const orphans=listShown("route", listBase("route", "state")).filter(r=>!storeOf(r)).length; none+=orphans; total+=orphans;
    }else listShown(t, listBase(t, "state")).forEach(e=>{
      total++; const st=statesOf(t, e);
      if(!st.size) none++; st.forEach(s=>counts.set(s, (counts.get(s)||0)+1));
    });
    if(sf && sf!=="__none" && !counts.has(sf)) counts.set(sf, 0);
    return [{v:"", name:"All states", n:total}]
      .concat([...counts.keys()].sort((a,b)=>stateName(a).localeCompare(stateName(b))).map(s=>({v:s, name:stateName(s), tag:s, n:counts.get(s)})))
      .concat(none || sf==="__none" ? [{v:"__none", name:"No state yet", n:none}] : []);
  }
  listShown(t, listBase(t, "pick")).forEach(e=>{
    total++;
    if(t==="truck"){ const k=vendorKey(e); if(!k){ none++; return; } if(!names[k]) names[k]=String(e.vendor).trim(); counts.set(k, (counts.get(k)||0)+1); }
    else{ const s=driverStore(e); if(!s){ none++; return; } names[s.id]=storeLabel(s); tags[s.id]=s.state||""; counts.set(s.id, (counts.get(s.id)||0)+1); }
  });
  if(u.pick && u.pick!=="__none" && !counts.has(u.pick)){
    const tk=t==="truck" ? S.trucks.find(x=>vendorKey(x)===u.pick) : null, s=t==="driver" ? storeById(u.pick) : null;
    if(tk){ names[u.pick]=String(tk.vendor).trim(); counts.set(u.pick, 0); }
    else if(s){ names[s.id]=storeLabel(s); tags[s.id]=s.state||""; counts.set(s.id, 0); }
    else u.pick="";
  }
  const keys=[...counts.keys()].sort(t==="truck" ? (a,b)=>natural(names[a], names[b]) : (a,b)=>cmpStores(storeById(a), storeById(b)));
  return [{v:"", name:t==="truck" ? "All vendors" : "All stores", n:total}]
    .concat(keys.map(k=>({v:k, name:names[k], tag:tags[k]||"", n:counts.get(k)})))
    .concat(none || u.pick==="__none" ? [{v:"__none", name:t==="truck" ? "No vendor yet" : "No store yet", n:none}] : []);
}
function listPicker(which, label, opts, cur){
  const open=LPICK===which, sel=opts.find(o=>o.v===(cur||""))||opts[0], id="lp-"+which;
  let h='<div class="lp" id="'+id+'"><button type="button" class="lp-btn'+(cur ? " on" : "")+'" id="'+id+'-btn" data-act="lp-toggle" data-v="'+which+'"'
    +' aria-haspopup="menu" aria-expanded="'+open+'"'+(open ? ' aria-controls="'+id+'-menu"' : '')+'>'
    +'<span class="lp-k">'+esc(label)+'</span><span class="lp-v">'+esc(sel.name)+'</span>'+ic("chevD","lp-chev")+'</button>';
  if(open) h+='<div class="sf-menu lp-menu" id="'+id+'-menu" role="menu" aria-label="'+esc(label)+'">'
    +opts.map(o=>'<button type="button" role="menuitemradio" class="sf-opt" data-act="lp-set" data-k="'+which+'" data-v="'+esc(o.v)+'" aria-checked="'+(o.v===(cur||""))+'">'
      +'<span class="sf-tick" aria-hidden="true">'+ic("check")+'</span>'+(o.tag ? '<span class="st-abbr">'+esc(o.tag)+'</span>' : '')
      +'<span class="sf-name">'+esc(o.name)+'</span><span class="sf-n">'+o.n+'</span></button>').join("")+'</div>';
  return h+'</div>';
}
/* a picker's menu opened (only the filters line is redrawn), or closed where it is */
function lpOpen(which){
  const t=listTypeNow() || (VIEW==="money" ? "money" : ""), box=$("#lFilters"); if(!t || !box) return;
  LPICK=which; box.innerHTML=t==="money" ? moneyBarInner() : t==="trailer" ? vTrailerFilters() : vListFilters(t);
  const m=$("#lp-"+which+"-menu"), to=m && ($('[aria-checked="true"]', m)||$(".sf-opt", m));
  /* near the window's right edge it opens leftward, so none of it is cut off */
  if(m && m.getBoundingClientRect().right>innerWidth-8){ m.style.left="auto"; m.style.right="0"; }
  if(to) to.focus();
}
function lpClose(focusBtn){
  const k=LPICK; LPICK="";
  $$(".lp-menu").forEach(m=>m.remove());
  $$('.lp-btn[aria-expanded="true"]').forEach(b=>{ b.setAttribute("aria-expanded", "false"); b.removeAttribute("aria-controls"); });
  if(focusBtn && k){ const b=$("#lp-"+k+"-btn"); if(b) b.focus(); }
}
/* list or the column board, for drivers and trucks */
function listSwitch(t){
  const on=listMode(t);
  return '<div class="seg" role="group" aria-label="Show '+FLOWS[t].many+' as">'
    +'<button type="button" class="seg-b" data-act="list-view" data-v="" aria-pressed="'+on+'">List</button>'
    +'<button type="button" class="seg-b" data-act="list-view" data-v="board" aria-pressed="'+!on+'">Board</button></div>';
}
/* the column names (the owner, 2026-10-19: "there aren't any column labels"), inside each box under its heading
   ("needs to be in the box"), in the rows' columns. The second one (a truck's or trailer's kind, a driver's CDL
   and phone) goes when the window is narrow, as in the rows */
const LIST_COLS={
  route:["Route", "Status", "Driver", "Truck", "Rate · Company", ""],
  driver:["Driver", "Phone", "Status", "State", "Route", "Tasks", ""],
  truck:["Truck", "Configuration", "Status", "State", "Route", "Cost", "Tasks", "Last note", ""],
  trailer:["Trailer", "Configuration", "Truck", "VIN", "Plate", "Rent", ""]
};
function listHead(t, idw){
  return '<div class="lhead '+t+'" aria-hidden="true"'+(idw ? ' style="--idw:calc('+Math.ceil(idw*1.15)+'ch + 8px)"' : '')+'><span class="lh-ck"></span><span class="lh-main">'
    +LIST_COLS[t].map((c, i)=>'<span'+(i===1 && t!=="route" ? ' class="lc-a"' : c==="Last note" ? ' class="lh-nt"' : '')+'>'+esc(c)+'</span>').join("")+'</span></div>';
}
function vListBody(t){
  if(t==="route") return vRouteBody();
  const f=FLOWS[t], shown=listShown(t, listBase(t));
  SEL[t].forEach(id=>{ if(!byId(t, id)) SEL[t].delete(id); });
  if(!all(t).length) return '<div class="board-hint">'+ic(f.icon)+'<span><b>No '+f.many+' yet.</b> '+esc(emptyHint(t))+'</span><span class="grow"></span>'
    +'<button type="button" class="btn primary sm" data-act="new" data-type="'+t+'">'+ic("plus")+'Add '+f.many+'</button></div>';
  if(!shown.length) return '<div class="lk-empty">No '+f.many+' here. <button type="button" class="linkbtn" data-act="list-clear">Show them all</button></div>'+selBar(t);
  /* the trucks' name column is as wide as the longest name shown (up to a point), so a name like
     "5002 - T1" isn't cut off; the same width in every group keeps the columns lined up */
  const idw=t==="truck" ? Math.min(26, Math.max(6, ...shown.map(e=>title(t, e).length))) : 0;
  return listGroups(t, shown).map(g=>vGroup(t, g, idw)).join("")+selBar(t);
}
/* trucks by vendor (with what they cost a month together), drivers by store; "No vendor" or "No store" last */
function listGroups(t, shown){
  const map=new Map();
  shown.forEach(e=>{
    const k=listKeyOf(t, e);
    if(!map.has(k)) map.set(k, {key:k, list:[], store:t==="driver" && k!=="__none" ? storeById(k) : null, vendor:t==="truck" ? String(e.vendor||"").trim() : ""});
    map.get(k).list.push(e);
  });
  const gs=[...map.values()];
  gs.forEach(g=>{
    if(t==="truck"){ g.label=g.key==="__none" ? "No vendor yet" : g.vendor; const m=g.list.reduce((n, x)=>n+truckMonthly(x), 0); g.sub=m ? money(m)+"/mo" : ""; }
    else{ g.label=g.store ? storeName(g.store) : "No store yet"; const h=g.list.filter(isHiredish).length; g.sub=h ? h+" hired" : ""; }
  });
  return gs.sort((a,b)=>(a.key==="__none")-(b.key==="__none") || (t==="truck" ? natural(a.label, b.label) : cmpStores(a.store, b.store)));
}
function vGroup(t, g, idw){
  const f=FLOWS[t], u=LU(t), shut=!!u.shut[g.key], ids=g.list.map(e=>e.id), on=ids.filter(id=>SEL[t].has(id)).length;
  return '<section class="lgroup'+(shut ? " shut" : "")+'" aria-label="'+esc(g.label)+'">'
    +'<div class="lg-h"><label class="lr-ck"><input type="checkbox" data-sel-group="'+esc(g.key)+'"'+(on===ids.length ? ' checked' : '')+(on && on<ids.length ? ' data-mixed="1"' : '')
    +' aria-label="'+esc("Select all "+plural(ids.length, f.one, f.many)+" in "+g.label)+'"></label>'
    +'<button type="button" class="lg-tog" data-act="list-group" data-v="'+esc(g.key)+'" aria-expanded="'+!shut+'">'+ic("chevD","chev")
    +'<span class="lg-nm">'+esc(g.label)+'</span><span class="lg-n">'+ids.length+'<span class="sr"> '+(ids.length===1 ? f.one : f.many)+'</span></span>'
    +(g.sub ? '<span class="lg-sub">· '+esc(g.sub)+'</span>' : '')+'</button>'
    +'<button type="button" class="hlink" data-act="list-add" data-v="'+esc(g.key)+'" aria-label="'+esc("Add "+f.many+(g.key==="__none" ? "" : " to "+g.label))+'">'+ic("plus")+'Add</button></div>'
    +(shut ? '' : listHead(t, idw)+'<ul class="lrows '+t+'"'+(idw ? ' style="--idw:calc('+Math.ceil(idw*1.15)+'ch + 8px)"' : '')+'>'+g.list.map(e=>vRow(t, e)).join("")+'</ul>')+'</section>';
}
/* the state a driver or truck is in, as a tag ("NY"): its own, else its store's or its route's.
   A second state shows as "+1"; with none it says so, so it can be filled in */
function stateCell(t, e){
  const all=[...statesOf(t, e)], own=e.state && all.indexOf(e.state)>=0 ? e.state : all[0];
  if(!own) return '<span class="lc-st lc-dim">No state</span>';
  const rest=all.filter(s=>s!==own);
  return '<span class="lc-st" title="'+esc(all.map(stateName).join(", "))+'"><span class="st-abbr" aria-hidden="true">'+esc(own)+'</span>'
    +(rest.length ? '<span class="more" aria-hidden="true">+'+rest.length+'</span>' : '')+'<span class="sr">'+esc(all.map(stateName).join(", "))+'</span></span>';
}
/* one driver or truck: its tick box, then the rest opens it */
function vRow(t, e){
  const st=stageOf(t, e.stage), n=openIssues(e).length, on=SEL[t].has(e.id);
  const rs=t==="driver" ? routesOfDriver(e) : routesOfTruck(e);
  /* a truck's cost: the month (rent and insurance) and what the vendor charges a mile, side by side to compare vendors */
  const tc=t==="truck" ? e.cost||{} : {}, m=t==="truck" ? truckMonthly(e) : 0, mi=num(tc.mile);
  /* rent by the week or the day reads the way it's charged */
  const cost=[tc.per==="week" || tc.per==="day" ? rentText(tc.monthly, tc.per) : m ? money(m)+"/mo" : "", mi ? money(mi)+"/mi" : ""].filter(Boolean).join(" · ");
  const dim=x=>x ? '' : ' class="lc-dim"', who=fmtPhone(e.phone);
  return '<li class="'+(on ? "on" : "")+(FRESH.has(e.id) ? " fresh" : "")+'"><label class="lr-ck"><input type="checkbox" data-sel="'+e.id+'"'+(on ? ' checked' : '')+' aria-label="Select '+esc(title(t,e))+'"></label>'
    +'<button type="button" class="lr-main" data-open="'+t+':'+e.id+'">'
    +(t==="truck" ? '<span class="lc-id mono" title="'+esc(title(t,e))+'">'+esc(title(t,e))+'</span><span class="lc-a'+(configLabel(e) ? '' : ' lc-dim')+'">'+esc((configLabel(e)||"Configuration not set")+(trailerOf(e) ? " · "+trailerOf(e).num : ""))+'</span>'
      : '<span class="lc-id who">'+avatar(e,28)+'<span>'+esc(title(t,e))+'</span></span><span class="lc-a'+(who ? '' : ' lc-dim')+'">'+esc(who||"No phone yet")+'</span>')
    +'<span><span class="pill tone-'+st.tone+'">'+esc(st.name)+'</span></span>'
    +stateCell(t, e)
    +'<span'+dim(rs.length)+'>'+esc(rs.length ? rs.map(r=>title("route",r)).join(", ") : "Not on a route")+'</span>'
    +(t==="truck" ? '<span'+dim(cost)+(cost ? ' title="'+esc(cost)+'"' : '')+'>'+esc(cost||"No rent yet")+'</span>' : '')
    +taskCell(t, e)
    +(t==="truck" ? noteCell(e) : '')
    +'<span class="lc-is">'+expiryBadge(t, e)+(n ? '<span class="iss">'+ic("alert")+n+'<span class="sr"> open issues</span></span>' : '')+'</span>'
    +'</button></li>';
}
/* the tasks on its page, shown in its row as they are (the owner, 2026-10-15: "put whatever tasks this
   person has there so i can see the tasks at face value"): the soonest still to do with its day (an
   overdue one in red), and how many more; pointing at it lists them all */
function taskCell(t, e){
  const key=t+":"+e.id, open=S.tasks.filter(k=>k.link===key).map(k=>({k:k, iso:nextOpen(k)})).filter(o=>o.iso)
    .sort((a,b)=>a.iso.localeCompare(b.iso) || (mins(a.k.time)||0)-(mins(b.k.time)||0));
  if(!open.length) return '<span class="lc-tk lc-dim">No tasks</span>';
  const o=open[0], late=isLate(o.k), when=late ? "overdue" : dayWord(o.iso)+(o.k.time ? " "+fmtTimeShort(o.k.time) : "");
  const list=open.map(x=>x.k.title+" · "+(isLate(x.k) ? "overdue since "+fmtDay(x.iso) : taskWhen(x.k, x.iso))).join("\n");
  return '<span class="lc-tk'+(late ? " late" : "")+'" title="'+esc(list)+'">'+ic(late ? "clock" : "calendar")
    +'<span class="tk-t">'+esc(o.k.title)+'</span><span class="tk-w">'+esc(when)+'</span>'
    +(open.length>1 ? '<span class="tk-more">+'+(open.length-1)+'<span class="sr"> more tasks</span></span>' : '')
    +'<span class="sr">'+esc(open.length>1 ? ". All: "+list.replace(/\n/g, "; ") : "")+'</span></span>';
}
/* a truck's last word from Notes and calls, in its row (the owner, 2026-10-20: "For trucks, I need last note here
   in this empty white space"): the newest note, call or problem on one line with its day, its kind as the icon;
   pointing at it shows all of it */
function noteCell(e){
  const x=(e.log||[]).filter(l=>String(l.text||"").trim()).sort((a,b)=>b.t-a.t)[0];
  if(!x) return '<span class="lc-nt lc-dim">No notes</span>';
  const L=LOG_TYPES.find(l=>l[0]===x.type)||LOG_TYPES[0], isI=x.type==="issue", open=isI && !x.resolved;
  const tone=isI ? (open ? "red" : "green") : L[3];
  const d=new Date(x.t), iso=isoOf(d), n=daysUntil(iso);
  const when=n===0 ? "Today" : n===-1 ? "Yesterday"
    : fmtDay(iso, d.getFullYear()===new Date().getFullYear() ? {month:"short", day:"numeric"} : {month:"short", day:"numeric", year:"numeric"});
  const kind=L[1]+(isI ? (open ? ", still open" : ", resolved") : "");
  return '<span class="lc-nt tone-'+tone+'" title="'+esc(kind+" · "+fmtWhen(x.t)+"\n"+x.text)+'">'+ic(isI && !open ? "check" : L[2])
    +'<span class="sr">'+esc(kind)+': </span><span class="nt-t">'+esc(x.text)+'</span><span class="nt-w">'+esc(when)+'</span></span>';
}
/* paperwork running out (a CDL, a medical card, a registration): a clock beside any open problems */
function expiryBadge(t, e){
  const xs=expiries(t, e); if(!xs.length) return '';
  const bad=xs.some(x=>x.level==="bad"), text=xs.map(x=>x.text).join("\n");
  return '<span class="xp'+(bad ? " bad" : "")+'" title="'+esc(text)+'">'+ic("clock")+'<span class="sr">'+esc(xs.map(x=>x.text).join(", "))+'</span></span>';
}

/* ---------- ticked routes, drivers or trucks, and what can be done to all of them at once ---------- */
function picked(t){ return all(t).filter(e=>SEL[t].has(e.id)); }
function selBar(t){
  const list=picked(t); if(!list.length) return '';
  const f=FLOWS[t], here=f.stages.filter(s=>list.some(e=>e.stage===s.k));
  const steps=(here.length ? here : f.stages).map(s=>'<optgroup label="'+esc(s.name)+'">'
    +s.items.filter(a=>a[2]!=="auto").map(a=>'<option value="'+a[0]+'">'+esc(a[1])+'</option>').join("")+'</optgroup>').join("");
  /* routes set up before their stores are known go to their store from here, one or several at a time */
  const toStore=t==="route" ? '<select class="inp" id="bkStore" data-act="bulk-store" aria-label="Move the ticked routes to a store"><option value="">Move to store…</option>'
    +S.stores.slice().sort(cmpStores).map(s=>'<option value="'+s.id+'">'+esc(storeName(s))+'</option>').join("")+'<option value="__none">No store yet</option></select>' : '';
  return '<div class="selbar" role="region" aria-label="'+esc("Ticked "+f.many)+'"><span class="sb-n">'+plural(list.length, f.one, f.many)+' ticked</span><button type="button" class="hlink" data-act="sel-clear">Untick all</button>'
    +toStore

function bulkDelete(t){

/* ---------- Trailers: a tab of their own on the Trucks page (the owner, 2026-10-16: "own tab within

   the ones on none, and the ones whose paperwork runs out within 30 days. Ticked ones can be filled
   in, taken off their trucks or deleted together; "Add trailers" adds several at once ---------- */
const TL_TABS=[["", "All", ""], ["on", "On a truck", "green"], ["off", "Not on a truck", "amber"], ["due", "Paperwork due", "red"]];
/* the Trucks page holds two lists, each on its own tab: the trucks, and the trailers. This computer
   remembers which one was showing (S.ui.truckTab) */
function trailersOn(){ return VIEW==="trucks" && S.ui.truckTab==="trailers"; }
function vTrucksTabs(){

/* the list the page shows: a route's, driver's or truck's tab, or the trailers */
function listTypeNow(){ return trailersOn() ? "trailer" : TAB_TYPE[VIEW] || ""; }
function tlTab(){ const k=LU("trailer").stage; return TL_TABS.some(t=>t[0]===k) ? k : ""; }
function tlTabHit(k, x){ return !k || (k==="on" ? !!trailerTruck(x) : k==="off" ? !trailerTruck(x) : expiries("truck", x).length>0); }
function tlText(x){ const tk=trailerTruck(x); return [x.num, x.vin, x.plate, x.vendor, trailerKind(x), tk && tk.unit, x.notes].join(" "); }
/* what gets past the search and the vendor picked (every tab); skip "pick" to count each vendor's */
function tlBase(skip){
  const u=LU("trailer"), w=qWords("trailer");
  return S.trailers.filter(x=>{
    if(skip!=="pick" && u.pick && (u.pick==="__none" ? vendorKey(x) : vendorKey(x)!==u.pick)) return false;
    return !w.length || qHit(w, tlText(x));

}
function tlShown(base){ const k=tlTab(); return (base || tlBase()).filter(x=>tlTabHit(k, x)).sort((a, b)=>natural(a.num, b.num)); }
function tlPicked(){ return S.trailers.filter(x=>SEL.trailer.has(x.id)); }

/* the vendors these trailers come from, with how many each would show */
function tlVendorOpts(){
  const u=LU("trailer"), counts=new Map(), names={}; let none=0, total=0;
  tlShown(tlBase("pick")).forEach(x=>{
    total++; const k=vendorKey(x); if(!k){ none++; return; }
    if(!names[k]) names[k]=String(x.vendor).trim(); counts.set(k, (counts.get(k)||0)+1);
  });
  if(u.pick && u.pick!=="__none" && !counts.has(u.pick)){
    const o=S.trailers.find(x=>vendorKey(x)===u.pick);
    if(o){ names[u.pick]=String(o.vendor).trim(); counts.set(u.pick, 0); } else u.pick="";
  }
  return [{v:"", name:"All vendors", n:total}]
    .concat([...counts.keys()].sort((a, b)=>natural(names[a], names[b])).map(k=>({v:k, name:names[k], n:counts.get(k)})))
    .concat(none || u.pick==="__none" ? [{v:"__none", name:"No vendor yet", n:none}] : []);

function tlBulkOff(){

/* new ones show up where they were added: past the filters, in an open group, flashing once */

/* ---------- Routes: each state, its stores, and each store's routes as rows ---------- */
/* the stores the Routes list shows in a state ("" every state), each with its routes in this tab. A store
   with none of them shows only under All (and, when searching, only if it's what was searched for), so a
   new store waiting on its first route is still there */
function routeStoresShown(f){
  const u=LU("route"), w=qWords("route"), shown=listShown("route", listBase("route", "state"));
  return S.stores.filter(s=>!f || (f!=="__none" && s.state===f))
    .map(s=>({s:s, rs:shown.filter(r=>r.storeId===s.id)}))
    .filter(x=>x.rs.length || (!u.stage && !needOf("route") && (!w.length || qHit(w, storeText(x.s)))))
    .sort((a,b)=>cmpStores(a.s, b.s));
}
/* the groups the Routes list ticks together: each store's routes shown, then the ones with no store yet */
function routeGroups(){
  return routeStoresShown(stateFilter()).map(x=>({key:x.s.id, list:x.rs}))
    .concat([{key:"__none", list:listShown("route", listBase("route")).filter(r=>!storeOf(r))}]);
}
/* a group heading's tick box: all its routes ticked, some (shown as a dash), or none */
function groupBox(key, list, label){
  const ids=list.map(r=>r.id), on=ids.filter(id=>SEL.route.has(id)).length;
  if(!ids.length) return '<span class="lr-ck" aria-hidden="true"></span>';
  return '<label class="lr-ck"><input type="checkbox" data-sel-group="'+esc(key)+'"'+(on===ids.length ? ' checked' : '')+(on && on<ids.length ? ' data-mixed="1"' : '')
    +' aria-label="'+esc("Select all "+plural(ids.length, "route")+" "+label)+'"></label>';
}
function vRouteBody(){
  const shown=listShown("route", listBase("route"));
  SEL.route.forEach(id=>{ if(!byId("route", id)) SEL.route.delete(id); });
  if(!S.stores.length && !S.routes.length) return '<div class="board-hint">'+ic("store")+'<span><b>No stores yet.</b> Add a store, then its routes with <b>+ Route</b>, or add routes now and give them their store later.</span><span class="grow"></span>'
    +'<button type="button" class="btn primary sm" data-act="new-store">'+ic("store")+'Add store</button></div>';

  if(!stores.length && !orphans.length) return '<div class="lk-empty">Nothing here. <button type="button" class="linkbtn" data-act="list-clear">Show everything</button></div>'+selBar("route");
  let h='', last=null;
  stores.forEach(x=>{
    if(x.s.state!==last){
      last=x.s.state;
      h+='<h2 class="lst-state'+(h ? '' : ' first')+'">'+esc(stateName(last))+' <span>· '+plural(stores.filter(y=>y.s.state===last).length, "store")+'</span></h2>';
    }

    +'<section class="lgroup" aria-label="Routes with no store yet"><div class="sg-h nostore">'+groupBox("__none", orphans, "with no store yet")
    +'<span class="sg-name"><span class="num">No store yet</span></span>'
    +'<span class="sg-meta"><span>Tick them, then Move to store…</span>'
    +'<button type="button" class="hlink" data-act="new-route-at" data-v="" aria-label="Add routes with no store yet">'+ic("plus")+'Route</button></span></div>'
    +listHead("route")+'<ul class="lrows route">'+orphans.map(vRouteRow).join("")+'</ul></section>';

}
/* a store: the company and number (one title), its city, how many routes and drivers, and + Route */

/* one route: its number, stage, driver, truck, pay, and any open problems. A missing driver or

/* the column board: one column per stage, a card for each driver or truck (the list is the usual view) */
function vBoard(t){

    +'<button type="button" class="btn primary sm" data-act="new" data-type="'+t+'">'+ic("plus")+'Add '+f.many+'</button></div>';
  h+='<div class="boardbar"><span class="meta">Drag a card to another column to move it along, or open it to make changes. Some steps move it to the next column when they’re ticked; they say so beside them.</span>'
    +'<span class="grow"></span>'
    +(nClosed?'<button type="button" class="btn sm" data-act="toggle-closed" data-type="'+t+'" aria-pressed="'+showC+'">'
      +(showC?"Hide ":"Show ")+esc(f.closed.name.toLowerCase())+' ('+nClosed+')</button>':'')+listSwitch(t)+'</div>';
  h+='<div class="boardwrap"><div class="board" style="--n:'+lanes.length+'">';

      +'<header class="lane-h"><div class="lane-t"><h2 class="nm" id="'+hid+'">'+esc(st.name)+'</h2>'

      +(st.k==="closed" ? (cards.length ? '' : '<div class="lane-empty">None</div>') : ghostCard(t, st))+'</div>'
      +'</section>';
  });

/* the grey stand-in card at the bottom of every column: a faded outline of
   a card that says "Add driver". The new one starts in that column. */
function ghostCard(t, st){
  const f=FLOWS[t];
  return '<button type="button" class="ghost-card" data-act="new" data-type="'+t+'" data-stage="'+st.k+'" aria-label="Add a '+f.one+' to '+esc(st.name)+'">'
    +'<span class="gc-shape'+(t==="driver" ? " round" : "")+'" aria-hidden="true">'+ic(f.icon)+'</span>'

}
/* the tab on a card's top-right corner: store number and state, e.g.
   "#1234 KS". A route uses its store; a driver uses the store they're with,
   then the stores of their routes; a truck the stores of its routes (with
   "+1" when there's more than one), or else the state on its own page. It
   sits on the card's top edge, so it never crowds the name; the city and
   full state name show when you hover over it. */
function cornerTag(t, e){
  const stores=[], seen={}, add=s=>{ if(s && !seen[s.id]){ seen[s.id]=1; stores.push(s); } };
  if(t==="driver") add(storeById(e.storeId));
  (t==="route" ? [e] : t==="driver" ? routesOfDriver(e) : routesOfTruck(e)).forEach(r=>add(storeOf(r)));
  if(stores.length){
    const s=stores[0];
    const full=stores.map(storeName).join("\n");
    return '<div class="c-corner" title="'+esc(full)+'"><span>#'+esc(s.num)+'</span>'
      +(s.state ? '<b class="st-abbr">'+esc(s.state)+'</b>' : '')
      +(stores.length>1 ? '<span class="more">+'+(stores.length-1)+'</span>' : '')+'</div>';
  }
  const own=t==="route" ? "" : e.state;
  return '<div class="c-corner none'+(own ? '' : ' bare')+'" title="'+esc(own ? "No store yet · "+stateName(own) : "No store or state yet")+'">'
    +'<span>No store</span>'+(own ? '<b class="st-abbr">'+esc(own)+'</b>' : '')+'</div>';
}
function vCard(t, e){
  const st=stageOf(t,e.stage), pr=progress(t,e), n=openIssues(e).length, exp=expiries(t,e);
  let top="", body="";
  if(t==="route"){
    const rd=readiness(e), pay=[e.company, payText(e.pay,ROUTE_PAY,true)].filter(Boolean).join(" · ");
    top='<button type="button" class="c-title mono" data-open="route:'+e.id+'">'+esc(title(t,e))+'</button>';
    body=(pay?'<div class="c-sub">'+ic("dollar")+'<span>'+esc(pay)+'</span></div>':'')
      +'<div class="c-links">'+driverChip(rd.d,e)+truckChip(rd.t,e)+'</div>';
  }else if(t==="driver"){
    const rs=routesOfDriver(e), hasP=!!photoOf(e.id), cdl=cdlShort(e);
    /* phone and email each get a full-width line; a long email wraps instead of being cut off */
    const contact=(icon, value, none)=>'<div class="c-sub c-contact'+(value ? '' : ' none')+'">'+ic(icon)+'<span>'+esc(value || none)+'</span></div>';
    top=avatar(e,42,hasP?"":"nophoto")+'<div class="c-name"><button type="button" class="c-title" data-open="driver:'+e.id+'">'+esc(title(t,e))+'</button>'
      +(cdl ? '<span class="c-sub"><span>'+esc(cdl)+'</span></span>' : '')+'</div>';
    body=contact("phone", fmtPhone(e.phone), "No phone yet")+contact("mail", e.email, "No email yet")
      +'<div class="c-links">'+(rs.length ? rs.map(routeChip).join("")
      : '<button type="button" class="chip empty" data-open="driver:'+e.id+'" data-focus="f__routes">'+ic("plus")+'<span>Route</span></button>')+'</div>';
  }else{
    const rs=routesOfTruck(e), ds=driversOfTruck(e), m=truckMonthly(e);
    top='<button type="button" class="c-title mono" data-open="truck:'+e.id+'">'+esc(title(t,e))+'</button>';
    body=(configLabel(e)?'<div class="c-sub">'+ic("truck")+'<span>'+esc(configLabel(e))+'</span></div>':'')
      +((e.vendor||m)?'<div class="c-sub">'+ic("dollar")+'<span>'+esc([e.vendor, m?money(m)+"/mo":""].filter(Boolean).join(" · "))+'</span></div>':'')
      +(e.location?'<div class="c-sub">'+ic("pin")+'<span>'+esc(e.location)+'</span></div>':'')
      +'<div class="c-links">'+(rs.length ? rs.map(routeChip).join("")
        : '<button type="button" class="chip empty" data-open="truck:'+e.id+'" data-focus="f__routes">'+ic("plus")+'<span>Route</span></button>')
      +ds.map(x=>driverChip(x.d,x.r)).join("")+'</div>';
  }
  return '<article class="card tone-'+st.tone+'" draggable="true" data-card="'+t+':'+e.id+'">'
    +cornerTag(t, e)
    +'<div class="c-top">'+top+(n?'<span class="iss" title="'+plural(n,"open issue")+'">'+ic("alert")+n+'<span class="sr"> open issues</span></span>':'')+'</div>'
    +body
    +exp.map(x=>'<div class="warnline'+(x.level==="bad"?" bad":"")+'">'+ic("clock")+esc(x.text)+'</div>').join("")
    +'<div class="c-foot"><div class="prog" title="Checklist: '+pr.done+' of '+pr.total+' done"><span class="bar" aria-hidden="true"><i style="width:'+pr.pct+'%"></i></span>'
    +'<span>'+pr.done+'/'+pr.total+'<span class="sr"> steps done</span></span></div></div>'
    +'</article>';
}
