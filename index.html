/* ============================================================
   PROJECT WINDOW — PAT's project modal: header, tagged details,
   the stage checklist and the activity log
   ============================================================ */
/* tab: the page's tab; view: the stage picked on the stage bar ("" is the one it's in); groups: Details
   groups opened while still empty; addStep: the stage whose "a step for this one only" box is open */
const sheet={open:false, type:null, id:null, stack:[], logFilter:"all", logType:"note", draft:"", openStages:{}, returnKey:null,
  tab:"overview", view:"", groups:{}, addStep:"", edit:"", editWas:undefined};
const PHONE=matchMedia("(max-width:760px)");
PHONE.addEventListener("change", ()=>{ if(sheet.open) refreshSheet(); });
const LOG_TYPES=[["note","Note","note","slate"],["call","Call","phone","blue"],["issue","Issue","alert","red"]];

function openSheet(t, id, opt){
  opt=opt||{};
  if(!byId(t,id)) return;
  const same=sheet.open && sheet.type===t && sheet.id===id;
  /* moving between a store and its own routes is a change of tab, not a step to come Back from */
  const sideways=sheet.open && !!railOf(t, id) && railOf(t, id)===railOf(sheet.type, sheet.id);
  if(sheet.open){ if(!same && opt.push!==false && !sideways) sheet.stack.push({type:sheet.type, id:sheet.id}); }
  else { sheet.stack=[]; sheet.returnKey=t+":"+id; }
  if(!same){
    sheet.logFilter="all"; sheet.draft=""; sheet.openStages={}; sheet.logType="note"; sheet.view=""; sheet.groups={}; sheet.addStep=""; sheet.edit="";
    /* stepping to the next driver keeps the tab (filling in Details for one after another); anything else starts on Overview */
    if(!opt.keepTab || !sheet.open || sheet.type!==t) sheet.tab="overview";
  }
  sheet.open=true; sheet.type=t; sheet.id=id;
  if(opt.focus){ const tb=tabFor(opt.focus), g=groupOfField(t, opt.focus); if(tb) sheet.tab=tb; if(g) sheet.groups[g]=true; }
  closeResults();
  $("#scrim").classList.add("on");
  document.body.classList.add("locked");
  renderSheet(!same);
  requestAnimationFrame(()=>{
    if(opt.focus) focusTarget(opt.focus);
    else if(opt.focusSel){ const b=$(opt.focusSel); if(b) b.focus({preventScroll:true}); }
    else { const h=$("#shTitle"); if(h) h.focus({preventScroll:true}); }
  });
}
function closeSheet(){
  if(!sheet.open) return;
  if(saveTimer) flush();
  sheet.open=false; sheet.stack=[];
  $("#scrim").classList.remove("on");
  document.body.classList.remove("locked");
  $("#sheet").innerHTML="";
  $$("#scrim > .ac-pop").forEach(p=>p.remove());
  const k=sheet.returnKey; sheet.type=sheet.id=null;
  render();
  if(k){
    const el=$('[data-card="'+k+'"] [data-open="'+k+'"]') || $('[data-open="'+k+'"]');
    if(el) el.focus({preventScroll:true});
  }
}
function sheetBack(){
  const p=sheet.stack.pop();
  if(p && byId(p.type,p.id)){
    sheet.type=p.type; sheet.id=p.id; sheet.logFilter="all"; sheet.draft=""; sheet.openStages={};
    sheet.view=""; sheet.groups={}; sheet.addStep=""; sheet.edit=""; sheet.tab="overview";
    renderSheet(true);
    const h=$("#shTitle"); if(h) h.focus({preventScroll:true});
  }else closeSheet();
}
function stepSheet(dir){
  const t=sheet.type, list=boardOrder(t);
  if(list.length<2) return;
  const i=list.findIndex(x=>x.id===sheet.id), nx=list[(i+dir+list.length)%list.length];
  openSheet(t, nx.id, {push:false, keepTab:true, focusSel:'[data-act="sheet-step"][data-v="'+dir+'"]'});
}
function renderSheet(fresh){
  const t=sheet.type, e=byId(t, sheet.id);
  if(!e){ closeSheet(); return; }
  const tab=sheetTab(t);
  /* a redraw keeps the place on the page; another tab starts at its top. On a phone the whole page scrolls, its
     top part too (the owner, 2026-10-21: the top took most of the screen): a redraw keeps the place there as well,
     another tab keeps the tabs where they were, and another page starts at its top */
  const el=$("#sheet"), body=$(".sh-body", el), same=!fresh && body && body.dataset.tab===tab, scroll=same ? body.scrollTop : 0, pageScroll=el.scrollTop;
  const oldRail=$(".sh-rail", el), railScroll=oldRail ? oldRail.scrollTop : 0, railLeft=oldRail ? oldRail.scrollLeft : 0;
  const rs=railStore();
  PMB=null;
  el.className="sheet "+(t==="store" ? brandOf(e.retailer)||"tone-slate" : "tone-"+stageOf(t,e.stage).tone)+(rs ? " has-rail" : "");
  const page=(t==="store" ? storeHead(e) : sheetHead(t,e))
    +'<div class="sh-body tabbed" data-tab="'+tab+'" id="shPanel" role="tabpanel" aria-labelledby="shTab-'+tab+'">'+sheetPanel(t, e, tab)+'</div>';
  el.innerHTML=(rs ? sheetRail(rs) : '')+'<div class="sh-main">'+page+'</div>';
  const nb=$(".sh-body", el); if(nb) nb.scrollTop=scroll;
  const nr=$(".sh-rail", el); if(nr){ nr.scrollTop=railScroll; nr.scrollLeft=railLeft; }
  if(fresh) el.scrollTop=0;
  else if(same) el.scrollTop=pageScroll;
  else{ const tb=$(".sh-tabs", el); el.scrollTop=tb ? Math.min(pageScroll, tb.getBoundingClientRect().top-el.getBoundingClientRect().top+el.scrollTop) : 0; }
  /* a phone's store tabs are a strip that slides sideways: the page shown is brought into it, if it's out of sight */
  const on=fresh && nr && nr.scrollWidth>nr.clientWidth ? $('[aria-current="true"]', nr) : null;
  if(on){
    const a=on.getBoundingClientRect(), b=nr.getBoundingClientRect();
    if(a.right>b.right) nr.scrollLeft+=a.right-b.right+12; else if(a.left<b.left) nr.scrollLeft-=b.left-a.left+12;
  }
  if(t==="store") storeAddressLookup(e);
}

/* ---------- a store's window: the store, then each of its routes, as tabs down the left ---------- */
function railOf(t, id){
  if(t==="store") return id;
  if(t==="route"){ const r=byId("route", id); return r ? r.storeId||"" : ""; }
  return "";
}
function railStore(){ return storeById(railOf(sheet.type, sheet.id)); }
function sheetRail(s){
  const rs=S.routes.filter(r=>r.storeId===s.id).sort((a,b)=>(isClosed(a)-isClosed(b)) || SORT.route(a,b));
  const cur=k=>sheet.type+":"+sheet.id===k ? ' aria-current="true"' : '';
  const issues=n=>n ? '<span class="iss">'+ic("alert")+n+'<span class="sr"> open issues</span></span>' : '';
  let h='<nav class="sh-rail" aria-label="Store #'+esc(s.num)+' and its routes">'
    +'<button type="button" class="rail-tab rail-store" data-open="store:'+s.id+'"'+cur("store:"+s.id)+'>'
    +'<span class="rt-name">'+storeTitleHTML(s)+'</span>'
    +'<span class="rt-sub">'+esc([s.city, s.state].filter(Boolean).join(", ") || "Store details")+'</span>'
    +issues(openIssues(s).length)+'</button>'
    +'<p class="rail-lbl">Routes'+(rs.length ? ' · '+rs.length : '')+'</p>';
  rs.forEach(r=>{
    const st=stageOf("route", r.stage);
    h+='<button type="button" class="rail-tab rail-route" data-open="route:'+r.id+'"'+cur("route:"+r.id)+'>'
      +'<span class="rt-name">'+esc(title("route",r))+'</span>'
      +'<span class="rt-row"><span class="pill tone-'+st.tone+'">'+esc(st.name)+'</span>'+issues(openIssues(r).length)+'</span></button>';
  });
  if(!rs.length) h+='<p class="rail-none">No routes yet.</p>';
  return h+'<button type="button" class="rail-add" data-act="new-route-at" data-v="'+s.id+'">'+ic("plus")+'Add route</button></nav>';
}
/* the store's name: the company in its logo color, then the number, at one size (like its card) */
function storeTitleHTML(s){
  return (s.retailer ? '<span class="st-shop '+brandOf(s.retailer)+'">'+esc(s.retailer)+'</span> ' : '')+'<span class="mono">#'+esc(s.num)+'</span>';
}
/* under a store's name: its city and state, and how many routes are ready (the address has its own line) */
function storeSub(s){
  const rs=routesOfStore(s), where=[s.city, s.state].filter(Boolean).join(", ");
  return [where, rs.length ? plural(rs.length,"route")+" · "+rs.filter(routeReady).length+" ready to run" : "No routes yet"].filter(Boolean).join(" · ");
}
/* Google Maps, in the web browser, on the store's address (or its name and city until there is one) */
function mapsUrl(s){
  const q=s.address || (s.city ? [s.retailer, s.num ? "#"+s.num : "", s.city, s.state].filter(Boolean).join(" ") : "");
  return q ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q) : "";
}
function storeHead(s){
  const list=boardOrder("store"), pos=list.findIndex(x=>x.id===s.id);
  const prev=sheet.stack.length ? sheet.stack[sheet.stack.length-1] : null, prevE=prev ? byId(prev.type, prev.id) : null;
  const map=mapsUrl(s);
  return '<header class="sh-head">'
    +'<div class="sh-nav">'
    +(prevE?'<button type="button" class="btn sm" data-act="sheet-back">'+ic("back")+'Back<span class="bk-to"> to '+esc(title(prev.type,prevE))+'</span></button>':'')
    +'<div class="crumbs"><span>'+esc(stateName(s.state))+'</span>'+ic("chevR")+'<b>Store</b></div>'
    +'<div class="sh-tools">'
    +'<button type="button" class="btn sm icon ghost" data-act="sheet-step" data-v="-1" aria-label="Previous store"'+(list.length<2?' disabled':'')+'>'+ic("chevL")+'</button>'
    +'<span class="sh-pos">'+(pos+1)+' of '+list.length+'</span>'
    +'<button type="button" class="btn sm icon ghost" data-act="sheet-step" data-v="1" aria-label="Next store"'+(list.length<2?' disabled':'')+'>'+ic("chevR")+'</button>'
    +'<button type="button" class="btn sm icon ghost danger" data-act="sheet-delete" aria-label="Delete this store">'+ic("trash")+'</button>'
    +'<button type="button" class="btn sm icon" data-act="sheet-close" aria-label="Close">'+ic("x")+'</button>'
    +'</div></div>'
    +'<div class="sh-id"><span class="sh-ident" aria-hidden="true">'+ic("store")+'</span>'
    +'<div class="sh-tt"><h2 class="sh-title" id="shTitle" tabindex="-1">'+storeTitleHTML(s)+'</h2>'
    +'<div class="sh-sub" id="shSub">'+esc(storeSub(s))+'</div></div>'
    +'<div class="sh-keys">'+storeKeys(s, map)+'</div></div>'
    +tabBar("store", s)
    +'</header>';
}
/* under a store's name (the owner picked it from mockups, 2026-10-16, "like the other pages"): its main
   contact and its address, each with its buttons in front, like a driver's phone and email. Copy and call
   (or email) the contact; copy the address or open it in Maps. Either one missing offers to add it */
function storeKeys(s, map){
  const c=(s.contacts||[])[0], out=[];
  const copy=(v, what)=>'<button type="button" class="ibtn" data-act="copy" data-v="'+esc(v)+'" data-what="'+what+'" data-tip="Click to copy" aria-label="Click to copy the '+what+'">'+ic("copy")+'</button>';
  if(c){
    const tel=String(c.phone||"").replace(/[^\d+]/g,""), name=c.name||"No name";
    out.push('<div class="hk hk-ct">'+(tel ? copy(fmtPhone(c.phone), "phone number")+'<a class="ibtn" href="tel:'+esc(tel)+'" data-tip="Click to call" aria-label="Click to call '+esc(name)+'">'+ic("phone")+'</a>'
        : c.email ? copy(c.email, "email")+'<a class="ibtn" href="mailto:'+esc(c.email)+'" data-tip="Click to email" aria-label="Click to email '+esc(name)+'">'+ic("mail")+'</a>' : '')
      +'<span class="hk-v">'+esc(name)+'</span><span class="hk-s">'+esc([c.role, fmtPhone(c.phone) || c.email].filter(Boolean).join(" · "))+'</span></div>');
  }else out.push('<button type="button" class="hk-add" data-act="ct-add">'+ic("plus")+'Add contact</button>');
  const mapBtn=map ? '<a class="ibtn" href="'+esc(map)+'" target="_blank" rel="noopener" data-tip="Open in Maps" aria-label="Open '+esc(s.address ? s.address : "the store")+' in Maps">'+ic("pin")+'</a>' : '';
  out.push(s.address ? '<div class="hk hk-addr">'+copy(s.address, "address")+mapBtn+'<span class="hk-v">'+esc(s.address)+'</span></div>'
    : '<div class="hk hk-addr">'+mapBtn+'<button type="button" class="hk-add" data-act="focus" data-v="f_address">'+ic("plus")+'Add address</button></div>');
  return '<div class="hk-col">'+out.join("")+'</div>';
}
/* a store's address box looks real addresses up as it's typed (addressLookup). Picking one fills in the
   city and state too when they're still empty, saved the way a typed change is (commitStoreField) */
function storeAddressLookup(s){
  const a=document.getElementById("f_address"); if(!a || a.tagName!=="INPUT") return;
  const part=k=>({_v:null, get value(){ return String(s[k]||""); }, set value(v){ this._v=v; },
    dispatchEvent(){ if(this._v!=null) commitStoreField(s, {dataset:{f:k}, value:this._v}, true); return true; },
    addEventListener(){}});
  addressLookup(a, {city:part("city"), state:part("state")});
}
/* a change typed on a store's page. The number, state and city can't be left empty, and the
   same number can't be in the same state twice: a box like that keeps the last good value */
function commitStoreField(s, el, final){
  const k=el.dataset.f, warn=document.getElementById("sw_"+k);
  let v=el.value;
  if(k==="num") v=v.trim().replace(/^#/,"");
  const num=k==="num" ? v : s.num, state=k==="state" ? v : s.state;
  const problem=(k==="num" && !v) ? "A store needs a number."
    : (k==="city" && !v.trim()) ? "A store needs a city."
    : (k==="state" && !v) ? "A store needs a state."
    : ((k==="num" || k==="state") && S.stores.some(x=>x!==s && String(x.num).toLowerCase()===String(num).toLowerCase() && x.state===state))
      ? "Store #"+num+" in "+state+" is already here." : "";
  /* said once the box is left, not while it's still being typed in */
  if(warn){ warn.hidden=!(problem && final); warn.innerHTML=problem && final ? ic("alert")+esc(problem+" Kept the last one.") : ""; }
  if(problem){ if(final) el.value=k==="num" ? s.num : s[k]||""; return; }
  s[k]=(final || k==="num") ? (k==="num" ? v : v.trim()) : v;
  if(final && k!=="state" && el.value!==s[k]) el.value=s[k];
  touch(s);
  if(final) followOwnerName("store:"+s.id);
  save();
  const h=$("#shTitle"); if(h) h.innerHTML=storeTitleHTML(s);
  const sub=$("#shSub"); if(sub) sub.textContent=storeSub(s);
  if(final){ render(); refreshSheet(); }
}

/* ---------- a store's Overview, like the route, driver and truck pages (the owner, 2026-10-19: a small Todoist,
   each part on its own band): what needs attention (amber), its routes, its drivers, its contacts, its tasks
   and the latest note, one under the other, white and light blue-gray in turn. Each row opens what it's about ---------- */
function vStoreOverview(s){
  return '<div class="td">'+storeAttention(s)+storeRoutesBlock(s)+storeDriversBlock(s)+storeContactsBlock(s)+tdTasks("store", s)+tdLatest("store", s)+'</div>';
}
/* its open problems, and its routes past the early stages that still need a driver or a truck, each with
   the link that fixes it (Pick one opens that route's list, ready to type a name) */
function storeAttention(s){
  const rows=[];
  openIssues(s).forEach(x=>rows.push(tdAttRow("bad", "alert", esc(x.text), esc("Open problem since "+fmtWhen(x.t)),
    '<button type="button" class="hlink" data-act="sheet-tab" data-v="notes">See it</button>')));
  routesOfStore(s).filter(r=>!earlyRoute(r) && (!r.driverId || !r.truckId)).forEach(r=>{
    const both=!r.driverId && !r.truckId, what=both ? "a driver and a truck" : !r.driverId ? "a driver" : "a truck";
    rows.push(tdAttRow("warn", "route", esc(title("route", r)+" needs "+what), "",
      '<button type="button" class="hlink" data-open="route:'+r.id+'" data-focus="'+(r.driverId ? "f_truckId" : "f_driverId")+'">Pick '+(both ? "the driver" : "one")+'</button>'));
  });
  return rows.length ? '<section class="td-sec att" aria-labelledby="tdA">'+tdHead("Needs attention", "tdA", '<span class="td-n">'+rows.length+'</span>')
    +'<ul class="td-list">'+rows.join("")+'</ul></section>' : '';
}
/* its routes: each one's stage and crew in gray (what it still needs in amber, once it's past the early
   stages), then Add route */
function storeRoutesBlock(s){
  const rs=routesOfStore(s), ready=rs.filter(routeReady).length;
  let h='<section class="td-sec" aria-labelledby="ovsR">'+tdHead("Routes", "ovsR", '<span class="td-n">'+(rs.length ? ready+" of "+rs.length+" ready" : "None yet")+'</span>');
  if(rs.length) h+='<div class="sv-list">'+rs.map(r=>{
    const d=driverOf(r), tk=truckOf(r), early=earlyRoute(r), need=w=>early ? "" : '<span class="sv-warn">no '+w+'</span>';
    const sub=[esc(stageOf("route", r.stage).name), d ? esc(shortName(d)) : need("driver"), tk ? esc(title("truck", tk)) : need("truck")].filter(Boolean).join(" · ");
    return '<button type="button" class="sv-row" data-open="route:'+r.id+'">'+linkLead("route", r)
      +'<span class="sv-tx"><span class="sv-t">'+esc(title("route", r))+'</span><span class="sv-s">'+sub+'</span></span></button>';
  }).join("")+'</div>';
  return h+'<button type="button" class="td-add" data-act="new-route-at" data-v="'+s.id+'">'+ic("plus")+'Add route</button></section>';
}
/* ---------- a store's drivers: the ones who go with it (picked on their page or added here, leads
   too, before the store has a route), and anyone on one of its routes. Board order: Lead first ---------- */
function driversOfStore(s){
  return S.drivers.map(d=>({d:d, via:routesOfDriver(d).filter(r=>r.storeId===s.id), tied:d.storeId===s.id}))
    .filter(x=>x.tied || x.via.length)
    .sort((a,b)=>(stageRank("driver", a.d)-stageRank("driver", b.d)) || SORT.driver(a.d, b.d));
}
/* each opens their page; one who's only with the store (not on one of its routes) can be taken off it.
   Add a driver opens a list to type in (one with no store yet, or moved here from another) */
function storeDriversBlock(s){
  const list=driversOfStore(s), live=list.filter(x=>!isClosed(x.d)).length;
  let h='<section class="td-sec alt" aria-labelledby="ovsD">'+tdHead("Drivers", "ovsD", '<span class="td-n">'+(live ? live : "None yet")+'</span>');
  if(list.length) h+='<div class="sv-list">'+list.map(x=>{
    const d=x.d;
    return '<div class="sv-line"><button type="button" class="sv-row" data-open="driver:'+d.id+'">'+avatar(d, 26)
      +'<span class="sv-tx"><span class="sv-t">'+esc(title("driver", d))+'</span><span class="sv-s">'+esc([stageOf("driver", d.stage).name, x.via.length ? "on "+x.via.map(r=>title("route", r)).join(", ") : ""].filter(Boolean).join(" · "))+'</span></span></button>'
      +(x.via.length ? '' : '<button type="button" class="btn sm icon ghost" data-act="store-untie" data-v="'+d.id+'" aria-label="Take '+esc(title("driver", d))+' off this store" title="Take them off this store">'+ic("x")+'</button>')
      +'</div>';
  }).join("")+'</div>';
  return h+'<div class="lk-w"><button type="button" class="td-add" id="f_store_drv" data-act="pick" data-v="storedriver" aria-haspopup="true" aria-expanded="false">'+ic("plus")+'Add a driver</button></div></section>';
}
/* ---------- a store's contacts: call or email in front, then who they are and what they do; clicking one
   changes it (Remove is in its form) ---------- */
function storeContactsBlock(s){
  const cs=s.contacts||[];
  let h='<section class="td-sec" aria-labelledby="ovsC">'+tdHead("Contacts", "ovsC", cs.length ? '' : '<span class="td-n">None yet</span>');
  /* the names line up: a contact without a phone or an email keeps that button's space */
  const anyTel=cs.some(c=>String(c.phone||"").trim()), anyMail=cs.some(c=>String(c.email||"").trim()), gap='<span class="sv-sp" aria-hidden="true"></span>';
  if(cs.length) h+='<div class="sv-list">'+cs.map(c=>{
    const tel=String(c.phone||"").replace(/[^\d+]/g,""), name=c.name||"No name";
    return '<div class="sv-line sv-ct">'
      +(tel ? '<a class="ibtn" href="tel:'+esc(tel)+'" data-tip="Click to call" aria-label="Call '+esc(name)+'">'+ic("phone")+'</a>' : anyTel ? gap : '')
      +(c.email ? '<a class="ibtn" href="mailto:'+esc(c.email)+'" data-tip="Click to email" aria-label="Email '+esc(name)+'">'+ic("mail")+'</a>' : anyMail ? gap : '')
      +'<button type="button" class="sv-row" data-act="ct-edit" data-v="'+c.id+'" title="Change '+esc(name)+'">'
      +'<span class="sv-tx"><span class="sv-t">'+esc(name)+'</span><span class="sv-s">'+esc([c.role, fmtPhone(c.phone), c.email].filter(Boolean).join(" · ") || "No phone or email yet")+'</span></span></button></div>';
  }).join("")+'</div>';
  return h+'<button type="button" class="td-add ct-add" data-act="ct-add">'+ic("plus")+'Add contact</button></section>';
}
/* a driver goes with one store, or none: picked on their page, or from the store's window. Undo puts it back */
function tieDriver(d, s){
  const was=d ? storeById(d.storeId) : null;
  if(!d || (was ? was.id : "")===(s ? s.id : "")) return;
  const before=snap();
  d.storeId=s ? s.id : ""; touch(d);
  save(); render(); if(sheet.open) refreshSheet();
  toast(s ? shortName(d)+" is now with store #"+s.num+(was ? " (was #"+was.num+")" : "") : shortName(d)+" is no longer with store #"+was.num, {undo:()=>restore(before)});
}
function contactDialog(s, c){
  const isNew=!c, d=c || {name:"", role:"", phone:"", email:""};
  const fld=(id, name, label, type, val, ph, req)=>'<label class="fld" for="'+id+'"><span class="fl">'+label+(req?' <span class="req" aria-hidden="true">*</span>':'')+'</span>'
    +'<input id="'+id+'" name="'+name+'" type="'+type+'" class="inp" value="'+esc(val||"")+'" autocomplete="off"'+(ph?' placeholder="'+esc(ph)+'"':'')+(req?' required aria-required="true"':'')+'></label>';
  dialog({title:isNew ? "Add a contact" : "Edit contact", ok:isNew ? "Add contact" : "Save", kind:isNew ? "contact" : "edit-contact",
    /* taking a contact off the store is here, in their form (Undo brings them back) */
    extra:isNew ? '' : '<button type="button" class="btn danger left" data-ct-del>'+ic("trash")+'Remove</button>',
    init:(f, close)=>{ const b=$("[data-ct-del]", f.closest(".dlg") || f); if(b) b.addEventListener("click", ()=>{ close(); removeContact(s, c.id); }); },
    body:fld("ct_name", "name", "Name", "text", d.name, "e.g. Jordan Reyes", true)
      +fld("ct_role", "role", "What they do", "text", d.role, "e.g. Delivery manager")
      +'<div class="two">'+fld("ct_phone", "phone", "Phone", "tel", fmtPhone(d.phone), "e.g. (602)555-0101")+fld("ct_email", "email", "Email", "email", d.email, "e.g. jordan@example.com")+'</div>',
    onOk:f=>{
      const E=f.elements, name=E.name.value.trim(), email=E.email.value.trim();
      if(!name){ E.name.focus(); return "Type their name."; }
      if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ E.email.focus(); return "That email doesn’t look right. Check it, or leave it empty."; }
      if(phoneProblem(E.phone.value)){ E.phone.focus(); return phoneProblem(E.phone.value)+" Check it, or leave it empty."; }
      const vals={name:name, role:E.role.value.trim(), phone:fmtPhone(E.phone.value), email:email};
      if(isNew) s.contacts.push(Object.assign({id:uid("p")}, vals)); else Object.assign(c, vals);
      touch(s); save(); render(); refreshSheet();
      return ()=>toast(isNew ? name+" added to store #"+s.num : "Saved");
    }});
}
function removeContact(s, id){
  const c=(s.contacts||[]).find(x=>x.id===id); if(!c) return;
  const before=snap();
  s.contacts=s.contacts.filter(x=>x.id!==id); touch(s);
  save(); render(); refreshSheet();
  toast("Removed "+(c.name||"the contact"), {undo:()=>restore(before)});
}
/* re-render after the current event settles, putting focus back where it was */
let rsTimer=null;
/* a redraw waits while the mouse button is down, so the click being made still lands on what was under it
   (leaving a box by clicking another value saves the box, and that redraw would swap the value out) */
let ptrDown=0, ptrRefresh=false;
document.addEventListener("pointerdown", ()=>{ ptrDown=Date.now(); }, true);
const ptrUp=()=>{ ptrDown=0; if(ptrRefresh){ ptrRefresh=false; setTimeout(refreshSheet, 0); } };
document.addEventListener("pointerup", ptrUp, true);
document.addEventListener("pointercancel", ptrUp, true);
addEventListener("blur", ptrUp);
function refreshSheet(){
  clearTimeout(rsTimer);
  rsTimer=setTimeout(()=>{
    if(!sheet.open) return;
    if(ptrDown && Date.now()-ptrDown<1500){ ptrRefresh=true; return; }
    const a=document.activeElement, sh=$("#sheet");
    let k=null;
    if(a && a!==document.body && sh.contains(a)){
      k={id:a.id, act:a.dataset.act, item:a.dataset.item, log:a.dataset.log, v:a.dataset.v, stage:a.dataset.stage, route:a.dataset.route,
         open:a.dataset.open ? (a.closest(".sh-rail") ? ".sh-rail " : ".sh-main ")+'[data-open="'+CSS.escape(a.dataset.open)+'"]' : "",
         sel:(typeof a.selectionStart==="number" && a.type!=="number" && a.type!=="email") ? [a.selectionStart, a.selectionEnd] : null};
    }
    renderSheet(false);
    if(!k) return;
    let el=k.id ? document.getElementById(k.id) : null;
    if(!el && k.open) el=$("#sheet "+k.open);
    if(!el && k.act){
      const q='[data-act="'+CSS.escape(k.act)+'"]'
        +(k.item?'[data-item="'+CSS.escape(k.item)+'"]':'')+(k.log?'[data-log="'+CSS.escape(k.log)+'"]':'')
        +(k.v!=null?'[data-v="'+CSS.escape(k.v)+'"]':'')+(k.stage?'[data-stage="'+CSS.escape(k.stage)+'"]':'')
        +(k.route?'[data-route="'+CSS.escape(k.route)+'"]':'');
      el=$("#sheet "+q);
    }
    /* a task just ticked off leaves the list: focus stays in its section */
    if(!el && k.act==="task-done") el=$('#sheet .t-add');
    /* a step just put on the task list shows its day instead of the button; one ticked off loses it */
    if(!el && k.item) el=$('#sheet .ck-task[data-item="'+CSS.escape(k.item)+'"]') || document.getElementById("ck_"+k.item);
    if(!el && k.act==="stage-tasks") el=$('#sheet .td-steps .ck-task') || $("#sheet .td-steps .sr-cb");
    /* moved to another stage: the stage bar, on the stage it's in now */
    if(!el && (k.act==="move-here" || k.act==="advance" || k.act==="stage-view")) el=$('#sheet .stb[aria-pressed="true"]') || $("#sheet .stb-out") || $("#shTitle");
    /* a whole group of Details just filled in: its first box */
    if(!el && k.act==="grp-open") el=$('#sheet .ss-g[data-g="'+CSS.escape(k.v||"")+'"] [data-act="edit"]');
    /* a driver just taken off a store: the box for adding one */
    if(!el && k.act==="store-untie") el=$("#f_store_drv");
    if(el){
      el.focus({preventScroll:true});
      if(k.sel && typeof el.setSelectionRange==="function"){ try{ el.setSelectionRange(k.sel[0], k.sel[1]); }catch(err){} }
    }
  }, 0);
}
function focusTarget(id){
  let el=document.getElementById(id);
  /* on a page the box may be on another tab, or in a group still folded away */
  if(sheet.open && (id==="sec-activity" || !el)){
    const tb=tabFor(id), g=groupOfField(sheet.type, id);
    if(g) sheet.groups[g]=true;
    if(tb) sheet.tab=tb;
    renderSheet(false);
    if(id==="sec-activity"){
      const f=$("#sheet .ent.open [data-act=resolve]") || $("#logText");
      if(f){ f.scrollIntoView({block:"center", behavior:smooth()}); f.focus({preventScroll:true}); }
      return;
    }
    el=document.getElementById(id);
  }
  if(!el) return;
  /* a value in Details: straight into its box, ready to type */
  if(el.dataset && el.dataset.act==="edit"){ el.scrollIntoView({block:"center", behavior:smooth()}); editField(el.dataset.v); return; }
  /* a link ("Needs a driver", "+ Truck"): its list opens, ready to type a name */
  if(el.dataset && el.dataset.act==="pick"){ el.scrollIntoView({block:"center"}); el.focus({preventScroll:true}); pkOpen(el); return; }
  el.scrollIntoView({block:"center", behavior:smooth()});
  el.focus({preventScroll:true});
}

/* ---------- a route's, driver's or truck's page (the owner picked this layout, 2026-10-15, "how to
   improve this clutter"): the name and the next move on top, the stage bar under it, then tabs.
   Overview is what needs doing (the steps of a stage and the tasks), what's still missing and the main
   facts; Details is every box, drawn as plain words until it's clicked; Documents (drivers and stores);
   Notes and calls. A store's window has the same tabs (2026-10-16), with its own header (storeHead) and
   Overview (vStoreOverview) ---------- */
const SHEET_TABS=[["overview","Overview"],["details","Details"],["docs","Documents"],["notes","Notes and calls"]];
function sheetTabs(t){ return SHEET_TABS.filter(x=>x[0]!=="docs" || t==="driver" || t==="store"); }
function sheetTab(t){ return sheetTabs(t).some(x=>x[0]===sheet.tab) ? sheet.tab : "overview"; }
/* the tab a box is on, for the links that jump to one (Home's Needs attention, a step's "Do it"…) */
function tabFor(id){ return id==="sec-activity" ? "notes" : /^f_/.test(id||"") ? "details" : ""; }
/* the group of Details a box is in, so a group folded away as "Nothing yet" opens for it */
function groupOfField(t, id){
  const ln={"link-driver":"f_driverId", "link-truck":"f_truckId", "link-routes":"f__routes", "link-trailer":"f_trailer"};
  const g=(FIELDS[t]||[]).find(x=>x.f.some(fd=>(fd.k && fid(fd.k)===id) || ln[fd.t]===id));
  return g ? g.g : "";
}
function capFirst(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
function lowFirst(s){ s=String(s||""); return /^[A-Z]{2}/.test(s) ? s : s.charAt(0).toLowerCase()+s.slice(1); }
/* "Offer, stage 4 of 6", or "Not hired" */
function stageLine(t, e){
  if(isClosed(e)) return FLOWS[t].closed.name;
  const st=FLOWS[t].stages, i=stageIdx(t, e.stage);
  return i<0 ? stageOf(t, e.stage).name : st[i].name+", stage "+(i+1)+" of "+st.length;
}
/* under the name: the stage, and a route's company and pay or a truck's kind and vendor. The store, route,
   driver and truck have their own buttons under it (headKeys) */
function subtitle(t, e){
  const more=t==="route" ? [e.company, payText(e.pay, ROUTE_PAY)] : t==="truck" ? [configLabel(e), [e.vendor, e.branch].filter(Boolean).join(", ")] : [];
  return [stageLine(t, e)].concat(more).filter(Boolean).join(" · ");
}
/* the header's key line (the owner, 2026-10-15: "make the phone number REALLY visible with a quick copy
   button, same with email. and make the store/route also more visible and standing out"): a driver's
   phone and email, large, each with Copy; then the store and routes (a route's store, driver and truck;
   a truck's route and driver) as buttons that stand out and open them. Anything missing offers to add it */
function headKeys(t, e){
  const out=[];
  if(t==="driver"){
    /* the phone over the email (the owner: "stack the phone and email on top of each other") */
    out.push('<div class="hk-col">'+contactKey("phone", e.phone)+contactKey("email", e.email)+'</div>');
    const s=storeById(e.storeId), rs=routesOfDriver(e);
    out.push('<span class="wchips">'+(s ? whereChip("store", s) : addChip("Store", "f_storeId"))
      +(rs.length ? rs.map(r=>whereChip("route", r)).join("") : addChip("Route", "f__routes"))+'</span>');
  }else if(t==="route"){
    const s=storeOf(e), d=driverOf(e), tk=truckOf(e);
    out.push('<span class="wchips">'+(s ? whereChip("store", s) : addChip("Store", "f_storeId"))
      +(d ? whereChip("driver", d) : addChip("Driver", "f_driverId"))+(tk ? whereChip("truck", tk) : addChip("Truck", "f_truckId"))+'</span>');
  }else{
    const rs=routesOfTruck(e), ds=driversOfTruck(e), tr=trailerOf(e);
    out.push('<span class="wchips">'+(rs.length ? rs.map(r=>whereChip("route", r)).join("") : addChip("Route", "f__routes"))
      +ds.map(x=>whereChip("driver", x.d)).join("")+(tr ? trailerChip(tr) : PULLS_TRAILER[e.config||""] ? addChip("Trailer", "f_trailer") : '')+'</span>');
  }
  return out.join("");
}
/* a phone number or email with its icon buttons in front of it (the owner: "put the icons on the left of
   the text"): copy, then call or email, so the phone or envelope sits right by what it's for. Pointing
   at one says what it does ("Click to copy"); they're tinted squares so they read as buttons */
function contactKey(kind, v){
  v=String(v||"").trim();
  if(kind==="phone") v=fmtPhone(v);
  const phone=kind==="phone", what=phone ? "phone number" : "email";
  if(!v) return '<button type="button" class="hk-add" data-act="focus" data-v="'+(phone ? "f_phone" : "f_email")+'">'+ic("plus")+'Add '+(phone ? "phone" : "email")+'</button>';
  const href=phone ? "tel:"+v.replace(/[^\d+]/g,"") : "mailto:"+v, go=phone ? "call" : "email";
  return '<div class="hk hk-'+kind+'">'
    +'<button type="button" class="ibtn" data-act="copy" data-v="'+esc(v)+'" data-what="'+what+'" data-tip="Click to copy" aria-label="Click to copy the '+what+'">'+ic("copy")+'</button>'
    +'<a class="ibtn" href="'+esc(href)+'" data-tip="Click to '+go+'" aria-label="Click to '+go+' '+esc(v)+'">'+ic(phone ? "phone" : "mail")+'</a>'
    +(phone ? '<a class="ibtn phone-only" href="sms:'+esc(v.replace(/[^\d+]/g,""))+'" aria-label="Text '+esc(v)+'">'+ic("chat")+'</a>' : '')
    +'<span class="hk-v">'+esc(v)+'</span></div>';
}
function whereChip(kind, x){
  const chip=(cls, open, icon, top, sub)=>'<button type="button" class="wchip '+cls+'" data-open="'+open+'">'+icon
    +'<span class="wc-tx"><span class="wc-t">'+esc(top)+'</span>'+(sub ? '<span class="wc-s">'+esc(sub)+'</span>' : '')+'</span></button>';
  if(kind==="store") return chip(brandOf(x.retailer)||"tone-slate", "store:"+x.id, ic("store"), (x.retailer ? x.retailer+" " : "Store ")+"#"+x.num, [x.city, x.state].filter(Boolean).join(", "));
  if(kind==="route") return chip("tone-blue", "route:"+x.id, ic("route"), title("route", x), [payText(x.pay, ROUTE_PAY, true), stageOf("route", x.stage).name].filter(Boolean).join(" · "));
  if(kind==="driver") return chip("tone-slate", "driver:"+x.id, avatar(x, 26), title("driver", x), [stageOf("driver", x.stage).name, fmtPhone(x.phone)].filter(Boolean).join(" · "));
  return chip("tone-slate", "truck:"+x.id, ic("truck"), title("truck", x), stageOf("truck", x.stage).name);
}
function addChip(what, focusId){ return '<button type="button" class="wchip add" data-act="focus" data-v="'+focusId+'">'+ic("plus")+'<span class="wc-tx"><span class="wc-t">'+what+'</span></span></button>'; }
/* a phone number or email copied for pasting elsewhere; its button turns to a green tick for a moment */
function copyText(text, what, btn){
  const ok=()=>{
    toast(capFirst(what||"it")+" copied");
    if(btn && document.contains(btn) && !btn.classList.contains("done")){
      const icon=btn.innerHTML, tip=btn.dataset.tip;
      btn.classList.add("done"); btn.innerHTML=ic("check"); if(tip) btn.dataset.tip="Copied";
      setTimeout(()=>{ if(document.contains(btn)){ btn.classList.remove("done"); btn.innerHTML=icon; if(tip) btn.dataset.tip=tip; } }, 1600);
    }
  };
  /* the older way, for a browser that won't let the page use the clipboard */
  const old=()=>{
    const back=document.activeElement, ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly", ""); ta.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    let r=false; try{ r=document.execCommand("copy"); }catch(err){}
    ta.remove(); if(back && back.focus) back.focus({preventScroll:true});
    return r;
  };
  const fail=()=>toast("Couldn’t copy it. Select it and press Ctrl+C.");
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ()=>{ if(old()) ok(); else fail(); });
  else if(old()) ok(); else fail();
}
/* the stage whose steps the page shows: the one picked on the bar, else the one it's in now */
function sheetView(t, e){
  const v=sheet.view;
  if(v==="closed" || (v && FLOWS[t].stages.some(s=>s.k===v))) return v;
  return isClosed(e) ? "closed" : e.stage;
}
function sheetHead(t, e){
  const f=FLOWS[t], nx=nextStage(t, e.stage), list=boardOrder(t), pos=list.findIndex(x=>x.id===e.id);
  const prev=sheet.stack.length ? sheet.stack[sheet.stack.length-1] : null;
  const prevE=prev ? byId(prev.type, prev.id) : null;
  let crumbs=ic(f.icon)+'<b>'+esc(capFirst(f.one))+'</b>';
  if(t==="route"){
    const s=storeOf(e);
    crumbs = s ? '<span>'+esc(stateName(s.state))+'</span>'+ic("chevR")+'<span>'+esc(storeLabel(s))+'</span>'+ic("chevR")+'<b>Route</b>'
               : '<span>No store yet</span>'+ic("chevR")+'<b>Route</b>';
  }
  let ident;
  if(t==="driver"){
    const p=photoOf(e.id);
    ident='<button type="button" class="av-btn" data-act="photo" aria-label="'+(p?"Change":"Add a")+' photo for '+esc(title(t,e))+'">'
      +avatar(e,64,p?"":"nophoto")+'<span class="cam" aria-hidden="true">'+ic("camera")+'</span></button>';
  }else ident='<span class="sh-ident" aria-hidden="true">'+ic(f.icon)+'</span>';
  return '<header class="sh-head">'
    +'<div class="sh-nav">'
    +(prevE?'<button type="button" class="btn sm" data-act="sheet-back">'+ic("back")+'Back<span class="bk-to"> to '+esc(title(prev.type,prevE))+'</span></button>':'')
    +'<div class="crumbs">'+crumbs+'</div>'
    +'<div class="sh-tools">'
    +'<button type="button" class="btn sm icon ghost" data-act="sheet-step" data-v="-1" aria-label="Previous '+f.one+'"'+(list.length<2?' disabled':'')+'>'+ic("chevL")+'</button>'
    +'<span class="sh-pos">'+(pos+1)+' of '+list.length+'</span>'
    +'<button type="button" class="btn sm icon ghost" data-act="sheet-step" data-v="1" aria-label="Next '+f.one+'"'+(list.length<2?' disabled':'')+'>'+ic("chevR")+'</button>'
    /* a route can be copied: one, or several numbered on (the owner, 2026-10-14) */
    +(t==="route" ? '<button type="button" class="btn sm sh-dup" data-act="route-dup">'+ic("copy")+'<span class="sh-dup-tx">Duplicate</span></button>' : '')
    +'<button type="button" class="btn sm icon ghost danger" data-act="sheet-delete" aria-label="Delete this '+f.one+'">'+ic("trash")+'</button>'
    +'<button type="button" class="btn sm icon" data-act="sheet-close" aria-label="Close">'+ic("x")+'</button>'
    +'</div></div>'
    +'<div class="sh-id">'+ident
    +'<div class="sh-tt"><h2 class="sh-title'+(t==="driver"?"":" mono")+'" id="shTitle" tabindex="-1">'+esc(title(t,e))+'</h2>'
    +'<div class="sh-sub" id="shSub">'+esc(subtitle(t,e))+'</div></div>'
    +'<div class="sh-stage">'
    +(nx && !isClosed(e) ? '<button type="button" class="btn primary" data-act="advance">Move to '+esc(nx.name)+ic("next")+'</button>' : '')
    +'</div>'
    +'<div class="sh-keys">'+headKeys(t, e)+'</div></div>'
    +stageBar(t, e)+tabBar(t, e)
    +'</header>';
}
/* the stage bar: arrows, the ones done green with a tick, the one it's in blue, the rest gray. Picking one
   shows its steps on Overview, with a button to move there. The way out (Not hired, Declined, Returned) sits apart */
function stageBar(t, e){
  const f=FLOWS[t], cur=stageIdx(t, e.stage), closed=isClosed(e), view=sheetView(t, e), here=t==="driver" ? "they’re here now" : "it’s here now";
  const segs=f.stages.map((s, i)=>{
    const state=closed || cur<0 ? "next" : i<cur ? "done" : i===cur ? "cur" : "next";
    return '<button type="button" class="stb '+state+'" data-act="stage-view" data-v="'+esc(s.k)+'" aria-pressed="'+(view===s.k)+'" title="'+esc(s.name)+'">'
      +'<span class="stb-nm">'+(state==="done" ? ic("check") : '')+'<span class="stb-tx">'+esc(s.name)+'</span></span>'
      +(state==="done" ? '<span class="sr">, done</span>' : state==="cur" ? '<span class="sr">, '+here+'</span>' : '')+'</button>';
  }).join("");
  return '<div class="stbar">'
    +'<div class="stb-steps" role="group" aria-label="Stages. Pick one to see its steps">'+segs+'</div>'
    +(TUT.on ? '' : '<button type="button" class="hlink stb-edit" data-act="flow-edit" data-v="'+t+'">'+ic("edit")+'Edit stages</button>')
    /* the way out (Returned, Not hired, Declined) is not a next step (the owner, 2026-10-20: after In service it read as
       "expecting the truck to fail"): it sits apart at the far right, said as an action, or as where it is once there */
    +'<button type="button" class="stb-out'+(closed?" on":"")+'" data-act="stage-view" data-v="closed" aria-pressed="'+(view==="closed")+'">'+ic("xCircle")
    +(closed ? esc(f.closed.name)+'<span class="sr">, '+here+'</span>' : 'Mark as '+esc(lowFirst(f.closed.name)))+'</button>'
    +'</div>';
}
function tabBar(t, e){
  const cur=sheetTab(t), log=e.log||[], openI=openIssues(e).length, nd=(t==="driver" || t==="store") ? docsOf(t+":"+e.id).length : 0;
  return '<div class="sh-tabs" role="tablist" aria-label="'+esc(capFirst(t==="store" ? "store" : FLOWS[t].one))+' page">'
    +sheetTabs(t).map(x=>{
      const on=x[0]===cur;
      const n=x[0]==="docs" ? (nd ? '<span class="tcnt">'+nd+'</span>' : '')
        : x[0]==="notes" ? (openI ? '<span class="tcnt bad">'+openI+' open</span>' : log.length ? '<span class="tcnt">'+log.length+'</span>' : '') : '';
      return '<button type="button" role="tab" class="sh-tab" id="shTab-'+x[0]+'" data-act="sheet-tab" data-v="'+x[0]+'" aria-selected="'+on+'" aria-controls="shPanel" tabindex="'+(on ? 0 : -1)+'">'+x[1]+n+'</button>';
    }).join("")+'</div>';
}
function sheetPanel(t, e, tab){
  if(tab==="details") return vDetails(t, e);
  if(tab==="docs") return vDocsTab(t, e);
  if(tab==="notes") return '<div class="ntab">'+activityHTML(t, e)+'</div>';
  return t==="store" ? vStoreOverview(e) : vOverview(t, e);
}
/* a tab picked: the page shows it from the top; a tab picked with the arrow keys keeps the keyboard on the tabs */
function setSheetTab(v, focusTab){
  sheet.tab=v; sheet.addStep=""; sheet.edit=""; pmClose(false);
  renderSheet(false);
  if(focusTab){ const b=document.getElementById("shTab-"+sheetTab(sheet.type)); if(b) b.focus(); }
}

/* ---------- Details: no cards (the owner, 2026-10-15), but every detail in a box you can see ("why does it
   look like I have no idea that I can enter data anywhere in there"): the label over a field, four across,
   groups under a heading with a thin line. A filled one reads as words ("Oct 15, 2026", "$750"); an empty
   one says what goes there ("Add email"); one picked from a list has an arrow, a date a calendar. Clicking
   one turns it into the box to type in (kept as it's typed); Enter or clicking away turns it back, Escape
   puts back what was there. The links (routes, a route's driver and truck) are boxes too, each opening a
   list to pick from (linkField) */
function fid(k){ return "f_"+String(k).replace(/[^A-Za-z0-9]/g,"_"); }
const GROUP_NAME={driver:{Driver:"Contact"}};
function vDetails(t, e){
  let h='<div class="ss">';
  FIELDS[t].forEach(g=>{
    /* the photo is the round picture at the top, and the stage is the bar: neither is a box here */
    const fs=g.f.filter(fd=>fd.t!=="photo" && fd.t!=="stage");
    if(!fs.length) return;
    const nm=(GROUP_NAME[t]||{})[g.g] || g.g, gid="dtg-"+g.g.replace(/[^A-Za-z0-9]/g,"");
    h+='<section class="ss-g" data-g="'+esc(g.g)+'" aria-labelledby="'+gid+'"><div class="ss-h"><h3 id="'+gid+'">'+esc(nm)+'</h3></div>'
      +'<div class="ss-grid">'+fs.map(fd=>/^(link-|derived-)/.test(fd.t||"") ? linkField(t, e, fd, fs.length===1) : specField(t, e, fd)).join("")+'</div></section>';
  });
  return h+'</div>'+datalists(t);
}
function datalists(t){
  const dl=(id, vals)=>'<datalist id="dl-'+id+'">'+vals.map(v=>'<option value="'+esc(v)+'">').join("")+'</datalist>';
  if(t==="route") return dl("company", uniqVals(S.routes.map(r=>r.company), ["J.B. Hunt"]));
  if(t==="driver") return dl("source", uniqVals(S.drivers.map(d=>d.source), ["Recruiter","Referral","Indeed","Walk-in"]));
  if(t==="store") return dl("retailer", uniqVals(S.stores.map(x=>x.retailer), ["Lowe’s","Home Depot"]));
  return dl("vendor", uniqVals(S.trucks.map(x=>x.vendor), ["Penske","Ryder","Enterprise Truck Rental","Owned"]));
}
function fieldDef(t, k){
  for(const g of FIELDS[t]||[]) for(const fd of g.f) if(fd.k===k) return fd;
  return null;
}
function longDate(iso){ const d=parseISO(iso); return d ? d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}) : iso; }
/* a value as words */
function fieldText(fd, val){
  if(fd.t==="date") return longDate(val);
  if(fd.t==="time") return fmtTime(val);
  if(fd.t==="money") return money(num(val));
  if(fd.t==="state") return stateName(val);
  if(fd.t==="tel") return fmtPhone(val);
  if(fd.t==="store"){ const s=storeById(val); return s ? storeName(s) : val; }
  if(fd.t==="select"){ const o=fd.opts.find(x=>x[0]===val); return capFirst(o ? o[1] : val); }
  return fd.upper ? val.toUpperCase() : val;
}
function specField(t, e, fd){
  if(fd.t==="calc") return '<div class="df calc"><span class="df-l">'+esc(fd.l)+'</span><span class="df-t" data-calc="'+esc(fd.l)+'">'+esc(fd.calc(e))+'</span></div>';
  const id=fid(fd.k), raw=getPath(e, fd.k), val=raw==null ? "" : String(raw), empty=!val.trim();
  const span=fd.w==="full" ? " full" : fd.w===2 ? " w2" : "";
  if(sheet.edit===fd.k) return '<div class="df editing'+span+'"><label class="df-l" for="'+id+'">'+esc(fd.l)+'</label>'+fieldInput(t, e, fd, id, val)
    /* a store's box says why a change wasn't kept (an empty number, one already used in that state) */
    +(t==="store" ? '<span class="fwarn bad" id="sw_'+esc(fd.k)+'" role="alert" hidden></span>' : '')+'</div>';
  const shown=empty ? "" : fieldText(fd, val);
  let warn="";
  if(fd.exp && val){
    const n=daysUntil(val);
    if(n!=null && n<0) warn='<span class="fwarn bad">'+ic("alert")+'Expired</span>';
    else if(n!=null && n<=30) warn='<span class="fwarn">'+ic("clock")+(n===0 ? "Expires today" : "In "+plural(n, "day"))+'</span>';
  }
  const choice=isChoice(fd), hint=fd.ph || (fd.t==="date" ? "Add date" : choice ? "Choose…" : "Add "+lowFirst(fd.l));
  const icon=choice ? ic("chevD", "df-ic") : fd.t==="date" ? ic("calendar", "df-ic") : "";
  return '<div class="df'+span+(empty ? " empty" : "")+'"><span class="df-l" aria-hidden="true">'+esc(fd.l)+'</span>'
    +'<button type="button" class="df-v'+(choice ? " choice" : "")+'" id="'+id+'" data-act="edit" data-v="'+esc(fd.k)+'"'
    +' aria-label="'+esc(fd.l+": "+(empty ? "empty. Click to fill it in" : shown+". Click to change it"))+'"'+(empty ? '' : ' title="'+esc(shown)+'"')+'>'
    +'<span class="df-tx">'+esc(empty ? hint : shown)+'</span>'+icon+'</button>'+warn+'</div>';
}
/* a value picked from a list (class, state, store, paid…) */
function isChoice(fd){ return fd.t==="select" || fd.t==="state" || fd.t==="store"; }
function fieldOptions(fd, val){
  let opts;
  if(fd.t==="select") opts=fd.opts.map(o=>[o[0], o[0] ? capFirst(o[1]) : "None"]);
  else if(fd.t==="state") opts=(fd.req ? [] : [["","None"]]).concat(STATES.map(s=>[s[0], s[1]]));
  else opts=[["","No store"]].concat(S.stores.slice().sort((a,b)=>natural(a.state+" "+a.num, b.state+" "+b.num)).map(s=>[s.id, storeName(s)]))
             .concat([["__new","+ Add a new store…"]]);
  if(fd.t==="select" && val && !opts.some(o=>o[0]===val)) opts.push([val, val]);
  return opts;
}
/* its list: the app's own menu under the value (not the computer's plain one), the one picked ticked.
   The arrow keys move through it, Escape closes it */
function optMenu(btn, fd){
  const t=sheet.type, e=byId(t, sheet.id); if(!e) return;
  const raw=getPath(e, fd.k), val=raw==null ? "" : String(raw);
  pmClose(false);
  btn.insertAdjacentHTML("afterend", '<div class="pm-menu opt" role="menu" aria-label="'+esc(fd.l)+'">'
    +fieldOptions(fd, val).map(o=>'<button type="button" role="menuitemradio" class="pm-i" aria-checked="'+(o[0]===val)+'" data-act="opt-set" data-k="'+esc(fd.k)+'" data-v="'+esc(o[0])+'" tabindex="-1">'
      +(o[0]===val ? ic("check") : '<span class="pm-sp" aria-hidden="true"></span>')+esc(o[1])+'</button>').join("")+'</div>');
  btn.setAttribute("aria-haspopup", "menu"); btn.setAttribute("aria-expanded", "true"); PMB=btn;
  const m=btn.nextElementSibling, box=btn.closest(".sh-body");
  if(m && box) menuUp(btn, m, box);
  const cur=m && (m.querySelector('[aria-checked="true"]') || m.querySelector('[role="menuitemradio"]'));
  if(cur){ cur.focus({preventScroll:true}); cur.scrollIntoView({block:"nearest"}); }
}
/* a pick from that list: kept like a box's change, then the keyboard goes back to the value */
function optSet(k, v){
  sheet.endedK=k; sheet.endedAt=Date.now();
  commitField({dataset:{f:k}, value:v, tagName:"SELECT"}, true);
  if(dialog.active) return;   /* "+ Add a new store…" opened its form */
  renderSheet(false);
  const b=$('#sheet [data-act="edit"][data-v="'+CSS.escape(k)+'"]'); if(b) b.focus();
}
/* the box a value turns into when it's clicked */
function fieldInput(t, e, fd, id, val){
  if(fd.t==="tel") val=fmtPhone(val);
  if(fd.t==="money") return '<span class="money"><input id="'+id+'" class="inp" type="text" inputmode="decimal" data-f="'+fd.k+'" value="'+esc(val)+'" placeholder="0" autocomplete="off"></span>';
  const type={date:"date", time:"time", number:"number", tel:"tel", email:"email"}[fd.t] || "text";
  return '<input id="'+id+'" class="inp'+(fd.mono?" mono":"")+'" type="'+type+'" data-f="'+fd.k+'" value="'+esc(val)+'"'
    +(fd.ph?' placeholder="'+esc(fd.ph)+'"':type==="tel"?' placeholder="e.g. (913)555-0187"':'')+(fd.max?' maxlength="'+fd.max+'"':'')
    +(fd.upper?' data-upper="1" style="text-transform:uppercase" autocapitalize="characters"':'')
    +(type==="number"?' inputmode="numeric" min="0"'+(fd.maxv?' max="'+fd.maxv+'"':''):'')
    +(fd.list?' list="dl-'+fd.list+'"':'')+' autocomplete="off" spellcheck="false">';
}
/* a value clicked: just that one turns into its box (the rest of the page is left alone, so a click on
   another value still lands), with the keyboard in it. One picked from a list opens its menu instead */
function editField(k){
  const t=sheet.type, e=byId(t, sheet.id), fd=e && fieldDef(t, k); if(!fd) return;
  if(sheet.edit && sheet.edit!==k) endEdit(false);
  const b=$('#sheet [data-act="edit"][data-v="'+CSS.escape(k)+'"]'), box=b && b.closest(".df"); if(!box) return;
  if(isChoice(fd)){ if(PMB===b) pmClose(true); else optMenu(b, fd); return; }
  sheet.edit=k; sheet.editWas=getPath(e, k);
  box.outerHTML=specField(t, e, fd);
  const inp=document.getElementById(fid(k)); if(!inp) return;
  sgWire(inp); inp.focus();
  if(inp.type!=="date" && inp.type!=="time"){ try{ inp.select(); }catch(err){} }
  if(t==="store" && k==="address") storeAddressLookup(e);
}
/* back to words; with focusBack the keyboard goes to the value again (Enter, Escape) */
function endEdit(focusBack){
  const k=sheet.edit; if(!k) return;
  sheet.edit=""; sheet.editWas=undefined; sheet.endedK=k; sheet.endedAt=Date.now();
  const t=sheet.type, e=byId(t, sheet.id), fd=e && fieldDef(t, k), box=$("#sheet .df.editing");
  /* the box is let go of first, so taking it away can't save it again (after Escape put the old value back) */
  const inp=document.getElementById(fid(k)); if(inp) inp.removeAttribute("data-f");
  if(box && fd) box.outerHTML=specField(t, e, fd);
  /* a date or time was only kept while it was typed: now the lists and Home catch up with it (the page
     itself is left alone, so a click on another value still lands) */
  if(fd && (fd.t==="date" || fd.t==="time")) render();
  if(focusBack){ const b=$('#sheet [data-act="edit"][data-v="'+CSS.escape(k)+'"]'); if(b) b.focus(); }
}
function finishEdit(){
  const el=document.getElementById(fid(sheet.edit));
  if(el && el.dataset.f && el.tagName!=="SELECT") commitField(el, true);
  endEdit(true);
}
/* Escape: what was there before it was clicked */
function cancelEdit(){
  const k=sheet.edit, t=sheet.type, e=byId(t, sheet.id);
  if(e && k && k!=="storeId"){
    const was=sheet.editWas==null ? "" : String(sheet.editWas), now=getPath(e, k);
    if(String(now==null ? "" : now)!==was){ setPath(e, k, was); touch(e); save(); render(); }
  }
  endEdit(true);
  refreshSheet();
}

/* ---------- links: the same record, edited from either end (the owner, 2026-10-16, on the old lines with a
   pill, a Take off link and a dropdown under them: "clautered dog shit fix it"). Each one is a box like the
   other details: who or what is on it, or "Choose a driver" when nothing is. Clicking it opens a list with
   a box to type in on top, like an assignee picker; with someone on it already, the list also has Open
   their page and Take them off. A driver's or truck's routes are a box each, then one to add another ---------- */
function linkField(t, e, fd, solo){
  /* alone in its group, the group's heading says it already: the label is only for screen readers */
  const lc=solo ? "sr" : "df-l";
  if(fd.t==="link-driver" || fd.t==="link-truck"){
    const kind=fd.t==="link-driver" ? "driver" : "truck", x=kind==="driver" ? driverOf(e) : truckOf(e), id=kind==="driver" ? "f_driverId" : "f_truckId";
    const ready=x && (kind==="driver" ? isHiredish(x) : truckReady(x));
    return '<div class="df w2"><span class="'+lc+'" id="'+id+'_l">'+(kind==="driver" ? "Driver" : "Truck")+'</span>'
      +'<div class="lk-w">'+linkBox(id, kind, x ? linkLead(kind, x)+linkText(title(kind, x), stageOf(kind, x.stage).name+(kind==="truck" && trailerOf(x) ? " · with "+trailerOf(x).num : ""), kind==="truck") : "", x ? "" : "Choose a "+kind, id+"_l")+'</div>'
      +(x && !ready ? '<span class="fwarn">'+ic("alert")+(kind==="driver" ? "Not hired yet, so this route isn’t staffed." : "Not ready for the road yet, so this route isn’t staffed.")+'</span>' : '')
      +'</div>';
  }
  /* a truck's trailer: its own record, picked from the ones on no truck (or moved from another) or added new */
  if(fd.t==="link-trailer"){
    const x=trailerOf(e);
    return '<div class="df w2"><span class="'+lc+'" id="f_trailer_l">Trailer</span>'
      +'<div class="lk-w">'+linkBox("f_trailer", "trailer", x ? '<span class="lk-ico" aria-hidden="true">'+ic("trailer")+'</span>'+linkText(x.num, trailerSub(x)) : "", x ? "" : "Attach a trailer", "f_trailer_l")+'</div>'
      +'<span class="fhelp">'+(x ? "Its VIN, plate and paperwork dates are in its details: open them from this box." : "A trailer has its own VIN and plate. Attach one, or add a new one.")+'</span></div>';
  }
  if(fd.t==="link-routes"){
    const rs=t==="driver" ? routesOfDriver(e) : routesOfTruck(e);
    return '<div class="df '+(t==="driver" ? "full" : "w2")+'"><span class="'+lc+'" id="f__routes_l">'+(t==="driver" ? "Routes" : "Route")+'</span><div class="lk-list">'
      +rs.map(r=>'<div class="lk-w">'+linkBox("lk_r_"+r.id, "on:"+r.id, linkLead("route", r)+linkText(title("route", r), [storeLabel(storeOf(r)), stageOf("route", r.stage).name].join(" · ")), "", "")+'</div>').join("")
      +'<div class="lk-w">'+linkBox("f__routes", "route", "", rs.length ? "Add another route" : "Choose a route", "f__routes_l")+'</div></div></div>';
  }
  /* a truck's driver comes from its route: a box that opens their page */
  const ds=driversOfTruck(e);
  return '<div class="df w2"><span class="'+lc+'">Driver</span>'
    +(ds.length ? '<div class="lk-list">'+ds.map(x=>'<button type="button" class="df-v lk-v lk-ro" data-open="driver:'+x.d.id+'" title="Open '+esc(title("driver", x.d))+'">'
      +linkLead("driver", x.d)+linkText(title("driver", x.d), "via "+title("route", x.r))+ic("next", "df-ic")+'</button>').join("")+'</div>' : '')
    +'<span class="fhelp">'+(ds.length ? "Set on the route, so it always matches." : routesOfTruck(e).length ? "Its route doesn’t have a driver yet." : "Comes from the route. Put this truck on a route that has a driver.")+'</span></div>';
}
/* a link's box: what's on it (or what to choose, gray), and an arrow; clicking opens its list */
function linkBox(id, v, inner, empty, labelId){
  return '<button type="button" class="df-v choice lk-v'+(inner ? "" : " empty")+'" id="'+id+'" data-act="pick" data-v="'+esc(v)+'" aria-haspopup="true" aria-expanded="false"'
    +(labelId ? ' aria-labelledby="'+labelId+' '+id+'"' : '')+'>'+(inner || '<span class="df-tx">'+esc(empty)+'</span>')+ic("chevD", "df-ic")+'</button>';
}
function linkLead(kind, x){ return kind==="driver" ? avatar(x, 26) : '<span class="lk-ico" aria-hidden="true">'+ic(kind)+'</span>'; }
function linkText(name, sub, mono){ return '<span class="df-tx"><span class="lk-t'+(mono ? " mono" : "")+'">'+esc(name)+'</span>'+(sub ? '<span class="lk-s">'+esc(sub)+'</span>' : '')+'</span>'; }
/* ---------- a link's list, under its box: a box to type in on top (it finds by name, number, store or
   stage), then the ones that could go on it in groups, then "Add a new …". A route's drivers come with its
   store first, then hired, then still hiring; its trucks in service first; a driver's or truck's routes
   needing one first. With one on it already, the bottom has Open their page and Take them off. A route
   already on a driver's or truck's page has just Open and Take off. Long lists show the first 60; typing
   narrows them (thousands of drivers stay quick) ---------- */
const PK_MAX=60;
const PK_FROM={driver:"f_driverId", truck:"f_truckId", route:"f__routes", storedriver:"f_store_drv", trailer:"f_trailer"};
/* what the list picks, in words ("a store's driver" is a driver) */
const PK_NOUN={driver:"driver", truck:"truck", route:"route", storedriver:"driver", trailer:"trailer"};
function pkGroups(kind, t, e){
  /* a truck's trailer: the ones on no truck first, then the ones on another truck (picking one moves it here) */
  if(kind==="trailer"){
    const cur=trailerOf(e), live=S.trailers.filter(x=>x!==cur).sort((a, b)=>natural(a.num, b.num));
    const item=x=>{ const on=trailerTruck(x); return {v:x.id, lead:'<span class="lk-ico" aria-hidden="true">'+ic("trailer")+'</span>', t:x.num, m:[trailerKind(x), x.vin ? "VIN "+x.vin : "", on ? "on "+title("truck", on) : ""].filter(Boolean).join(" · ")}; };
    return [{l:"Not on a truck", its:live.filter(x=>!trailerTruck(x)).map(item)}, {l:"On another truck (picking one moves it here)", its:live.filter(x=>trailerTruck(x)).map(item)}].filter(g=>g.its.length);
  }
  /* a store's Add a driver: one with no store yet, or one with another store (moving them here) */
  if(kind==="storedriver"){
    const here=new Set(driversOfStore(e).map(x=>x.d.id)), live=S.drivers.filter(d=>!isClosed(d) && !here.has(d.id)).sort(SORT.driver);
    const item=d=>{ const o=storeById(d.storeId); return {v:d.id, lead:avatar(d, 24), t:title("driver", d), m:[stageOf("driver", d.stage).name, o ? "now with "+storeLabel(o) : ""].filter(Boolean).join(" · ")}; };
    return [{l:"No store yet", its:live.filter(d=>!storeById(d.storeId)).map(item)}, {l:"With another store (picking one moves them here)", its:live.filter(d=>storeById(d.storeId)).map(item)}].filter(g=>g.its.length);
  }
  if(kind==="driver"){
    const live=S.drivers.filter(d=>!isClosed(d) && d.id!==e.driverId).sort(SORT.driver);
    const s=storeOf(e), mine=d=>!!s && d.storeId===s.id, rest=live.filter(d=>!mine(d));
    const item=d=>{ const o=routesOfDriver(d);
      return {v:d.id, lead:avatar(d, 24), t:title("driver", d), m:[isHiredish(d) ? "" : stageOf("driver", d.stage).name, o.length ? "on "+o.map(x=>title("route", x)).join(", ") : ""].filter(Boolean).join(" · ")}; };
    return [s ? {l:"With store #"+s.num, its:live.filter(mine).map(item)} : null, {l:"Hired", its:rest.filter(isHiredish).map(item)},
      {l:"Still hiring", its:rest.filter(d=>!isHiredish(d)).map(item)}].filter(g=>g && g.its.length);
  }
  if(kind==="truck"){
    const live=S.trucks.filter(x=>!isClosed(x) && x.id!==e.truckId).sort(SORT.truck);
    const item=x=>{ const o=routesOfTruck(x);
      return {v:x.id, lead:linkLead("truck", x), mono:1, t:title("truck", x), m:[configLabel(x), truckReady(x) ? "" : stageOf("truck", x.stage).name, o.length ? "on "+o.map(y=>title("route", y)).join(", ") : ""].filter(Boolean).join(" · ")}; };
    return [{l:"On a route", its:live.filter(truckReady).map(item)}, {l:"Still coming", its:live.filter(x=>!truckReady(x)).map(item)}].filter(g=>g.its.length);
  }
  /* the routes, for a driver or a truck */
  const key=t==="driver" ? "driverId" : "truckId";
  const live=S.routes.filter(r=>!isClosed(r) && r[key]!==e.id).sort(SORT.route);
  const now=r=>{ const x=t==="driver" ? driverOf(r) : truckOf(r); return x ? "now "+(t==="driver" ? shortName(x) : title("truck", x)) : ""; };
  const item=r=>({v:r.id, lead:linkLead("route", r), t:title("route", r), m:[storeLabel(storeOf(r)), stageOf("route", r.stage).name, now(r)].filter(Boolean).join(" · ")});
  return [{l:"Needs a "+t, its:live.filter(r=>!r[key]).map(item)}, {l:"Already has one (picking one replaces it)", its:live.filter(r=>r[key]).map(item)}].filter(g=>g.its.length);
}
/* the list's rows for what's typed: every word has to match */
function pkList(kind, q){
  const t=sheet.type, e=byId(t, sheet.id); if(!e) return "";
  const words=String(q||"").toLowerCase().split(/\s+/).filter(Boolean), from=PK_FROM[kind];
  const hit=x=>words.every(w=>(x.t+" "+x.m).toLowerCase().indexOf(w)>=0);
  let shown=0, more=0, h="";
  pkGroups(kind, t, e).forEach(g=>{
    const its=g.its.filter(hit), take=its.slice(0, Math.max(0, PK_MAX-shown));
    more+=its.length-take.length; shown+=take.length;
    if(take.length) h+='<div role="group" aria-label="'+esc(g.l)+'"><p class="pk-g" aria-hidden="true">'+esc(g.l)+'</p>'
      +take.map(x=>'<button type="button" role="menuitem" class="pm-i pk-i" data-act="pk-pick" data-k="'+kind+'" data-v="'+esc(x.v)+'" data-from="'+from+'" tabindex="-1">'
        +x.lead+'<span class="pk-tx"><span class="pk-t'+(x.mono ? " mono" : "")+'">'+esc(x.t)+'</span>'+(x.m ? '<span class="pk-m">'+esc(x.m)+'</span>' : '')+'</span></button>').join("")+'</div>';
  });
  if(!shown) h+='<p class="pk-none">'+(words.length ? "Nothing matches “"+esc(String(q).trim())+"”." : "No "+PK_NOUN[kind]+"s to pick from yet.")+'</p>';
  if(more) h+='<p class="pk-none">'+more+' more. Type to narrow it down.</p>';

/* typing in the list's box narrows the list */
function pkFilter(q){
  const m=q.closest(".pk"), l=m && $(".pk-list", m); if(!l || !PMB) return;
  l.innerHTML=pkList(PMB.dataset.v, q.value); l.scrollTop=0;
}
/* keys in the list: from the box, Down goes into the list and Enter picks the first one; in the list, Up from
   the top goes back to the box, and a letter goes back to the box to keep typing */
function pkKey(ev, m){
  const q=$(".pk-q", m), its=$$('[role="menuitem"]', m), a=document.activeElement, i=its.indexOf(a);
  if(ev.key==="Escape" || ev.key==="Tab"){ ev.preventDefault(); pmClose(true); return true; }
  if(q && a===q){
    if(ev.key==="ArrowDown"){ ev.preventDefault(); if(its[0]) its[0].focus(); return true; }
    if(ev.key==="Enter"){ ev.preventDefault(); const first=$('.pk-list [role="menuitem"]', m); if(first) first.click(); return true; }
    return true;
  }
  if(q && ev.key==="ArrowUp" && i===0){ ev.preventDefault(); q.focus(); return true; }
  if(q && ev.key.length===1 && /\S/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey){ ev.preventDefault(); q.focus(); q.value+=ev.key; pkFilter(q); return true; }
  return false;
}

/* ---------- Overview, like a small Todoist (the owner, 2026-10-19, about the colored boxes before it: "This page

function vOverview(t, e){

const AUTO_GO={rs1:"Put a driver on it", rs2:"Put a truck on it", dh3:"Put them on a route", tu1:"Fill in the VIN and plate", tu5:"Put it on a route"};
/* the first step of the stage it's in that isn't done: the one the list puts first */

function tdAttention(t, e){

/* the steps of the stage picked on the bar (the one it's in, unless another is picked): the ones still to do,
   the next one first and marked; + Add step; the done ones folded under "N done". With every step done, the
   move to the next stage. Another stage picked says where it is now, with the move to this one */
function tdSteps(t, e){
  const f=FLOWS[t], k=sheetView(t, e), closed=isClosed(e), them=t==="driver" ? "them" : "it", They=t==="driver" ? "They’re" : "It’s";

        : '<p class="td-line">'+esc(f.closed.hint)+'? Mark '+them+' '+esc(lowFirst(nm))+(t==="route" ? "" : ": it takes "+them+" off any route")+'. You can undo it.</p>'

      +'</section>';

  const items=itemsFor(t, e, k), todo=items.filter(it=>!isDone(t, e, it)), done=items.filter(it=>isDone(t, e, it));
  const first=here ? todo[0] || null : null;

  /* what this list is (the owner: "explain or highlight something to make it stand out separate why it's different

    +(nx ? '<button type="button" class="btn sm" data-act="advance">Move '+them+' to '+esc(nx.name)+ic("next")+'</button>' : '')+'</p>';
  if(todo.length) h+='<ul class="td-list">'+todo.map(it=>tdStep(t, e, it, nx, first)).join("")+'</ul>';
  if(sheet.addStep===k) h+='<form class="td-form add-item" data-act="add-item" data-stage="'+esc(k)+'"><label class="sr" for="add_'+esc(k)+'">A step for this '+f.one+' only</label>'
    +'<input id="add_'+esc(k)+'" class="inp" placeholder="A step for this '+f.one+' only" autocomplete="off">'

  else if(!closed) h+='<button type="button" class="td-add" data-act="add-step" data-v="'+esc(k)+'" aria-label="Add a step for this '+f.one+' only">'+ic("plus")+'Add step</button>';

/* a task's day as Todoist shows it: overdue red, today green, tomorrow amber, later this week purple */

/* its tasks with their days, soonest first, then + Add task. A step's task shows its day on its step instead,

/* ---------- a small menu under a ⋯ button (a document's Rename or tag, Delete). Arrow keys move, Escape

  if(p[0]==="fc"){
    const sc=fcById(p[1]); if(!sc) return "";
    return pmItem("fc-rename", sc.id, "edit", "Rename")+pmItem("fc-copy", sc.id, "copy", "Make a copy")+pmItem("fc-del", sc.id, "trash", "Delete", true);
  }
  if(p[0]==="nav") return pmItem("nav-go", "money", "dollar", "Financials")+pmItem("nav-go", "settings", "settings", "Settings")+pmItem("tutorial", "", "cap", TUT.on ? "Stop the tutorial" : "Tutorial");
  if(p[0]==="doc"){
    const d=docById(p[1]); if(!d) return "";
    return pmItem("doc-edit", d.id, "edit", "Rename or tag")+pmItem("doc-move", d.id, "folder", "Move to…")+pmItem("doc-del", d.id, "trash", "Delete", true);
  }
  if(p[0]==="folder"){
    const f=folderById(p[1]); if(!f) return "";
    return pmItem("folder-rename", f.id, "edit", "Rename")+pmItem("folder-move", f.id, "folder", "Move to…")+pmItem("folder-del", f.id, "trash", "Delete", true);
  }
  return "";
}
function pmItem(act, v, icon, label, danger){
  return '<button type="button" role="menuitem" class="pm-i'+(danger ? " danger" : "")+'" data-act="'+act+'" data-v="'+esc(v)+'" tabindex="-1">'+ic(icon)+esc(label)+'</button>';
}
function pmOpen(btn){
  pmClose(false);
  const items=pmItems(btn.dataset.v); if(!items) return;
  btn.insertAdjacentHTML("afterend", '<div class="pm-menu" role="menu" aria-label="'+esc(btn.getAttribute("aria-label")||"More")+'">'+items+'</div>');
  btn.setAttribute("aria-expanded", "true"); PMB=btn;
  const m=btn.nextElementSibling, box=btn.closest(".sh-body") || document.documentElement;
  /* near the bottom of the page it opens upward, so it isn't cut off */
  if(m && box) menuUp(btn, m, box);
  const first=m && m.querySelector('[role="menuitem"]'); if(first) first.focus();
}
/* a menu that would run past the bottom of its page, or of the screen (a phone scrolls a whole record page), opens
   upward when there's more room above its button */
function menuUp(btn, m, box){
  const lim=Math.min(box.getBoundingClientRect().bottom, innerHeight), b=btn.getBoundingClientRect();
  if(m.getBoundingClientRect().bottom>lim-4 && b.top>lim-b.bottom) m.classList.add("up");
}
function pmClose(back){
  $$(".pm-menu").forEach(m=>m.remove());
  if(PMB){ PMB.setAttribute("aria-expanded", "false"); if(back && document.contains(PMB)) PMB.focus(); }
  PMB=null;
}

/* a step as a row: its round tick and name (the next one marked "Next"; clicking the name ticks it too, and
   Undo puts it back), with what to do with it right after the name: Add to my tasks (on the next one always,
   on the others when pointed at) and Remove for one added for this page only. Under it, in small type, only
   when there is one: the day it's on the task list (it opens the task), what's special about it (it moves
   them on, it ticks itself) and the button that gets one that ticks itself done. Done ones are crossed out */
function tdStep(t, e, it, nx, first){
  const done=isDone(t, e, it), id="ck_"+it.id, isNext=!!first && first.id===it.id, them=t==="driver" ? "them" : "it", auto=it.kind==="auto";
  const note=auto ? (done ? "Done for you" : AUTO_HINT[it.id]||"Ticks itself")
    : it.kind==="gate" && nx && !done ? "Ticking it moves "+them+" to "+nx.name : "";
  const meta=[], acts=[], chip=!done && !auto ? stepTaskChip(t, e, it) : '';
  if(chip) meta.push(chip);
  if(note) meta.push('<span class="td-note">'+esc(note)+'</span>');
  if(!done && auto) meta.push('<button type="button" class="'+(isNext ? "btn sm" : "hlink")+'" data-act="auto-go" data-item="'+it.id+'">'+esc(AUTO_GO[it.id]||"Do it")+(isNext ? ic("next") : '')+'</button>');
  else if(!done && !chip && stepsCanAdd(t, e)) acts.push('<button type="button" class="hlink td-hov" data-act="step-task" data-item="'+it.id+'">'+ic("calPlus")+'Add to my tasks</button>');
  if(it.kind==="custom") acts.push('<button type="button" class="hlink td-hov" data-act="del-item" data-item="'+it.id+'" aria-label="Remove the step '+esc(it.label)+'">'+ic("x")+'Remove</button>');
  const name=esc(it.label)+(isNext ? '<span class="td-next">Next</span>' : '');
  const lead=auto
    ? '<span class="td-cb" aria-hidden="true"><span class="td-ck">'+ic("check")+'</span></span>'
    : '<label class="td-cb" for="'+id+'"><input type="checkbox" class="sr-cb" id="'+id+'" data-act="check" data-item="'+it.id+'" aria-labelledby="'+id+'_t"'+(done ? ' checked' : '')+'>'
      +'<span class="td-ck" aria-hidden="true">'+ic("check")+'</span></label>';
  const title=auto ? '<span class="td-t">'+name+'<span class="sr">'+(done ? ", done" : ", not done yet")+'</span></span>' : '<label class="td-t" id="'+id+'_t" for="'+id+'">'+name+'</label>';
  return '<li class="td-row'+(done ? " done" : "")+(isNext ? " next" : "")+(auto ? " auto" : "")+'">'+lead
    +'<div class="td-c"><div class="td-l1">'+title+acts.join("")+'</div>'+(meta.length ? '<div class="td-m">'+meta.join("")+'</div>' : '')+'</div></li>';
}

/* ---------- checklist steps on the task list. A step's task remembers it (from: "step:driver:<id>:<step>"),
   and ticking either one off ticks the other ---------- */
function stepKey(t, e, itemId){ return "step:"+t+":"+e.id+":"+itemId; }
function stepTasks(t, e, itemId){ const k=stepKey(t, e, itemId); return S.tasks.filter(x=>x.from===k); }
/* the step a task was made from, while its page and the step are still there: {t, e, it, st} */
function stepOf(task){
  const p=String(task && task.from || "").split(":");
  if(p.length!==4 || p[0]!=="step" || !FLOWS[p[1]]) return null;
  const e=byId(p[1], p[2]); if(!e) return null;
  for(const st of FLOWS[p[1]].stages){
    const it=itemsFor(p[1], e, st.k).find(i=>i.id===p[3]);
    if(it) return it.kind==="auto" ? null : {t:p[1], e:e, it:it, st:st};
  }
  return null;
}
/* the buttons that put steps on the list stay out of the tutorial and off a page that's closed out */
function stepsCanAdd(t, e){ return !TUT.on && !isClosed(e); }
/* a stage's steps that can go on the task list: not done, not filled in from a link, and not there already */
function stepsToAdd(t, e, k){ return itemsFor(t, e, k).filter(it=>it.kind!=="auto" && !isDone(t, e, it) && !stepTasks(t, e, it.id).some(x=>nextOpen(x))); }
/* a step not done yet that's on the task list: {x: its task, iso: the day it's next due} */
function stepTaskOf(t, e, it){ return stepTasks(t, e, it.id).map(x=>({x:x, iso:nextOpen(x)})).find(y=>y.iso) || null; }
/* on a step's line: the day it's on the task list (opens its task). Putting one there is the next step's
   Add to my tasks, or the steps heading's (the owner didn't want lone calendar icons off at the right) */
function stepTaskChip(t, e, it){
  const o=stepTaskOf(t, e, it); if(!o) return '';
  const late=isLate(o.x), when=late ? "overdue since "+fmtDay(o.iso) : taskWhen(o.x, o.iso);
  return '<button type="button" class="ck-task td-when '+tdDayCls(o.x, o.iso)+'" data-act="task-open" data-v="'+o.x.id+'" data-day="'+o.iso+'" data-item="'+it.id+'"'
    +' aria-label="'+esc("On your task list, "+when+". Open the task")+'" title="'+esc("On your task list, "+when)+'">'
    +ic("calendar")+esc(late ? "Overdue" : dayWord(o.iso)+(o.x.time ? " "+fmtTimeShort(o.x.time) : ""))+'</button>';
}
/* ticks a step, or unticks it. A ticked "Moves it forward" step moves the page on to the next stage, which it returns */
function setCheck(t, e, itemId, on){
  e.checks=e.checks||{};
  if(on) e.checks[itemId]=Date.now(); else delete e.checks[itemId];
  touch(e);
  if(!on) return null;
  const f=FLOWS[t], si=f.stages.findIndex(s=>s.items.some(a=>a[0]===itemId && a[2]==="gate")), cur=stageIdx(t, e.stage);
  if(si<0 || si>=f.stages.length-1 || cur<0 || cur>si) return null;
  e.stage=f.stages[si+1].k; sheet.openStages={}; sheet.view="";
  return f.stages[si+1];
}
/* a step's task was ticked (or unticked): the step follows, and so does any other task made from it */
function tickStep(s, on){
  if(isDone(s.t, s.e, s.it)===on) return null;
  const moved=setCheck(s.t, s.e, s.it.id, on);
  stepTasks(s.t, s.e, s.it.id).forEach(k=>{ if(doneOn(k, k.date)!==on) setDone(k, k.date, on); });
  return moved;
}
/* a whole stage's steps put on the task list at once, on the day picked */
function stageTasksDialog(t, e, k){
  const st=stageOf(t, k), list=stepsToAdd(t, e, k), whose=title(t, e);
  if(!list.length) return;
  dialog({title:"Add to my tasks", ok:"Add to my tasks", kind:"stage-tasks",
    body:'<p>'+esc(st.name)+' steps for '+esc(whose)+'. Each one becomes a task, and ticking a task off ticks its step too.</p>'
      +'<label class="fld" for="sp_day"><span class="fl">Which day <span class="req" aria-hidden="true">*</span></span>'
      +'<input id="sp_day" name="day" type="date" class="inp" value="'+todayISO()+'" required aria-required="true" aria-describedby="sp_day_h"></label>'
      +'<p class="fhelp" id="sp_day_h">They go on your calendar as to-dos for that day. You can drag one to another day or time.</p>'
      +'<fieldset class="stepset"><legend>Steps</legend>'
      +list.map(it=>'<label class="ck-line" for="sp_'+it.id+'"><input type="checkbox" id="sp_'+it.id+'" name="step" value="'+esc(it.id)+'" checked>'+esc(it.label)+'</label>').join("")
      +'</fieldset>',
    onOk:f=>{
      const day=f.elements.day.value, pick=list.filter(it=>{ const c=document.getElementById("sp_"+it.id); return c && c.checked; });
      if(!parseISO(day)){ f.elements.day.focus(); return "Pick the day."; }
      if(!pick.length) return "Tick at least one step.";
      const before=snap(), now=Date.now();
      pick.forEach(it=>S.tasks.push({id:uid("k"), title:it.label, details:"", date:day, time:"", end:"", link:t+":"+e.id,
        repeat:"", until:"", remind:"", done:{}, created:now, updated:now, from:stepKey(t, e, it.id)}));
      save(); render(); if(sheet.open) refreshSheet();
      const w=dayWord(day), when=/^(Today|Tomorrow|Yesterday)$/.test(w) ? w.toLowerCase() : w;
      return ()=>toast((pick.length===1 ? "“"+pick[0].label+"” added" : plural(pick.length, "task")+" added")+" to your list for "+when, {undo:()=>restore(before)});
    }});
}

/* ============================================================
   STAGES AND STEPS — the owner's own, changed from Settings or a page's "Edit stages". The form works
   on a copy (FE) that's only put to use on Save, with Undo after. A stage taken out that still has
   routes, drivers or trucks in it says where they go; their own extra steps go along with them
   ============================================================ */
let FE=null;
function feCopy(stages){ return stages.map(s=>({k:s.k, name:s.name, tone:s.tone, items:s.items.map(a=>({id:a[0], label:a[1], kind:a[2]||""}))})); }
function feCount(t, k){ return all(t).filter(e=>e.stage===k).length; }
function flowDialog(t){
  if(!FLOWS[t] || TUT.on || SANDBOX) return;
  const f=FLOWS[t];
  FE={t:t, stages:feCopy(f.stages), out:[]};
  dialog({title:capFirst(f.one)+" stages", ok:"Save stages", kind:"flow", cls:"flowdlg",
    body:'<p class="fe-intro">Every '+f.one+' goes through these stages, in this order, and each stage has its steps. Ticking a step marked “Moves on” takes '+(t==="driver" ? "them" : "it")+' to the next stage.</p>'
      +'<div id="feList">'+feHTML()+'</div>',
    extra:'<button type="button" class="hlink left" data-fe="reset">'+ic("undo")+'Back to the original</button>',
    init:form=>{
      form.addEventListener("click", feClick);
      form.addEventListener("input", feInput);
      form.addEventListener("change", feInput);
      form.addEventListener("keydown", feKey);
    },
    onClose:()=>{ FE=null; },
    onOk:feSave});
}
function feBtn(a, i, j, icon, label, hide){
  return '<button type="button" class="btn sm icon ghost fe-b'+(hide ? " fe-hide" : "")+(a==="del" || a==="sdel" ? " danger" : "")+'" data-fe="'+a+'" data-i="'+i+'"'+(j>=0 ? ' data-j="'+j+'"' : '')
    +' aria-label="'+label+'" title="'+label+'"'+(hide ? ' tabindex="-1" aria-hidden="true"' : '')+'>'+ic(icon)+'</button>';
}
function feHTML(){
  const t=FE.t, f=FLOWS[t], n=FE.stages.length;
  let h='<ol class="fe-list">';
  FE.stages.forEach((s, i)=>{
    const nm=esc(s.name.trim() || "this stage"), last=i===n-1, cnt=feCount(t, s.k);
    h+='<li class="fe-stage tone-'+s.tone+'">'
      +'<div class="fe-sh">'
      +'<span class="fe-num" aria-hidden="true">'+(i+1)+'</span>'
      +'<label class="sr" for="fe_n'+i+'">Name of stage '+(i+1)+'</label>'
      +'<input id="fe_n'+i+'" class="inp fe-name" data-fe-name="'+i+'" value="'+esc(s.name)+'" maxlength="40" autocomplete="off" placeholder="Name this stage">'
      +(cnt ? '<span class="fe-cnt">'+plural(cnt, f.one)+' in it</span>' : '')
      +'<span class="grow"></span>'
      +'<div class="fe-tones" role="radiogroup" aria-label="Color of '+nm+'">'
      +TONES.map(x=>'<button type="button" role="radio" class="fe-tone tone-'+x[0]+'" data-fe="tone" data-i="'+i+'" data-v="'+x[0]+'" aria-checked="'+(s.tone===x[0])+'" aria-label="'+x[1]+'" title="'+x[1]+'"></button>').join("")
      +'</div>'
      +feBtn("up", i, -1, "arrowUp", "Move "+nm+" earlier", i===0)
      +feBtn("down", i, -1, "arrowDown", "Move "+nm+" later", last)
      +feBtn("del", i, -1, "trash", "Take out "+nm, n<2)
      +'</div>'
      +'<ul class="fe-steps" aria-label="Steps in '+nm+'">'
      +s.items.map((it, j)=>{
        const sn=esc(it.label.trim() || "this step");
        return '<li class="fe-step">'
          +'<label class="sr" for="fe_s'+i+'_'+j+'">Step '+(j+1)+' of '+nm+'</label>'
          +'<input id="fe_s'+i+'_'+j+'" class="inp fe-step-in" data-fe-step="'+i+':'+j+'" value="'+esc(it.label)+'" maxlength="120" autocomplete="off" placeholder="What gets done">'
          +(it.kind==="auto" ? '<span class="fe-auto" title="'+esc(AUTO_HINT[it.id]||"")+'">Ticks itself</span>'
            : last ? '<span class="fe-auto" aria-hidden="true"></span>' : '<label class="fe-gate"><input type="checkbox" data-fe-gate="'+i+':'+j+'"'+(it.kind==="gate" ? ' checked' : '')+'>Moves on</label>')
          +feBtn("sup", i, j, "arrowUp", "Move “"+sn+"” up", j===0)
          +feBtn("sdown", i, j, "arrowDown", "Move “"+sn+"” down", j===s.items.length-1)
          +feBtn("sdel", i, j, "x", "Take out the step “"+sn+"”", false)
          +'</li>';
      }).join("")
      +'</ul>'
      +'<button type="button" class="hlink fe-add" data-fe="sadd" data-i="'+i+'">'+ic("plus")+'Add a step</button>'
      +'</li>';

  h+='</ol><button type="button" class="hlink fe-addst" data-fe="add">'+ic("plus")+'Add a stage</button>';
  if(FE.out.length){
    h+='<div class="fe-out"><h3 class="fe-out-h">Taking out</h3><ul>'
      +FE.out.map((o, i)=>{
        if(!FE.stages.some(s=>s.k===o.to)) o.to=FE.stages[Math.min(o.at, FE.stages.length-1)].k;

          +(o.n ? '<label class="fe-to" for="fe_to'+i+'">Its '+plural(o.n, f.one)+' '+(o.n===1 ? "goes" : "go")+' to</label>'
