/* ============================================================
   FORECAST — a deal tried out before it's real (the owner, 2026-10-17: "so far the money tab [needs] the
   route… in running mode. what if like i just want to forecast scenarios and stuff?"; built from the three
   pictures they picked). A scenario is lines like their handwritten sheet: a kind of route, how many, the
   rate a day, days a week, the driver's pay a day, the truck's and the trailer's rent, fuel and insurance
   a day; and the paying company's terms (its pay day, a week late or not, the weeks it holds, a sign-on
   bonus a driver) and the day it starts. From those: what's left a week, a month and a year, the cash
   needed up front, and the cash week by week until it's back to even, worked out the way the Pay days tab
   does. Nothing in it touches the real money; "Make it real" adds its routes, trucks and trailers to the
   lists. Records: "scenario" (its lines inside). Versions before 1.15 don't know them and leave them alone.
   ============================================================ */
const FC_KINDS=TRUCK_CONFIG.filter(o=>o[0] && o[0]!=="trailer");
const FC_SHORT={tractor:"tractor", "tractor-flatbed":"tractor + trailer", "tractor-moffett":"tractor + trailer", "straight-flatbed":"straight truck",
  "straight-moffett":"straight truck", box:"box truck", other:"other"};
const FC_FIELDS=["kind","n","rate","days","driver","truck","truckPer","trailer","trailerPer","fuel","ins"];
const FC_MAX=104;   /* two years of weeks: enough to find when a slow one is back to even */
function fcById(id){ return id ? S.scenarios.find(x=>x.id===id)||null : null; }
function fcList(){ return S.scenarios.slice().sort((a, b)=>natural(a.name, b.name)); }
function fcCur(){ const u=MU(); let sc=fcById(u.fc); if(!sc){ sc=fcList()[0]||null; u.fc=sc ? sc.id : ""; } return sc; }
function fcKind(k){ const o=FC_KINDS.find(x=>x[0]===k); return o ? o[1] : "Other"; }
/* a kind that pulls a trailer has a trailer's rent (a tractor, or "other") */
function fcPulls(k){ return !!PULLS_TRAILER[k||""]; }
function fcLine(o){ return Object.assign({id:uid("fl"), kind:"straight-flatbed", n:"1", rate:"", days:"6", driver:"", truck:"", truckPer:"week", trailer:"", trailerPer:"week", fuel:"", ins:""}, o||{}); }
function fcRoutesN(sc){ return (sc.lines||[]).reduce((a, l)=>a+fcLineCalc(l).n, 0); }
function nextMonday(){ return addDays(mondayOf(todayISO()), 7); }
function weeksBetween(a, b){ return Math.round((parseISO(b)-parseISO(a))/(7*864e5)); }
/* a scenario keeps its own copy of the terms, so "what if they paid every week" doesn't change the real ones */
function fcTerms(sc){
  const int=(v, d)=>{ const x=parseInt(v, 10); return isFinite(x) ? x : d; };
  return {name:String(sc.payer||"").trim(), payDay:int(sc.payDay, 5), lag:int(sc.lag, 1), hold:int(sc.hold, 0), bonus:num(sc.bonus), start:parseISO(sc.start) ? sc.start : nextMonday(), deducts:false};
}
/* a company's saved terms (the Pay days tab's), to start a scenario with; the usual ones when it has none */
function fcTermsFrom(name){
  const t=payerTerms(name);
  return payerRec(name) ? {payDay:String(t.payDay), lag:String(t.lag), hold:String(t.hold), bonus:t.bonus ? String(t.bonus) : ""} : {payDay:"5", lag:"1", hold:"0", bonus:""};
}
/* one line's week, for one of its routes: what it brings in and what it costs */
function fcLineCalc(l){
  const d=Math.round(num(l.days)), days=d>=1 && d<=7 ? d : 6, n=Math.max(0, Math.min(999, Math.round(num(l.n))));
  const rate=num(l.rate), daily=num(l.driver)+num(l.fuel)+num(l.ins);
  const weekly=perWeek(l.truck, l.truckPer||"week", days)+(fcPulls(l.kind) ? perWeek(l.trailer, l.trailerPer||"week", days) : 0);
  const inWk=rate*days, outWk=daily*days+weekly;
  return {l:l, n:n, days:days, rate:rate, daily:daily, weekly:weekly, inWk:inWk, outWk:outWk, left:inWk-outWk};
}
/* what a scenario comes to: a week, a month, a year; and the cash at the end of each week from the start, the
   way the Pay days tab counts it: the costs as the week goes (the first week from the day it starts); each
   week's pay on the company's pay day, a week or more later, except the first weeks, which they hold (paid
   back when you stop); each third of the sign-on bonus on the first pay day after 30, 60 and 90 days */
function fcCalc(sc){
  const t=fcTerms(sc), L=(sc.lines||[]).map(fcLineCalc), routes=L.reduce((a, x)=>a+x.n, 0);
  const inWk=L.reduce((a, x)=>a+x.inWk*x.n, 0), outWk=L.reduce((a, x)=>a+x.outWk*x.n, 0), left=inWk-outWk;
  const R={t:t, lines:L, routes:routes, inWk:inWk, outWk:outWk, left:left, month:left*52/12, year:left*52, bonusAll:t.bonus*routes, held:0, heldWeeks:0, bonusWeeks:[]};
  R.firstYear=R.year+R.bonusAll;
  const mon0=mondayOf(t.start), off=(t.payDay+6)%7, earn=[], cost=[], pay=new Array(FC_MAX).fill(0), bonus=new Array(FC_MAX).fill(0);
  R.mon0=mon0;
  for(let w=0; w<FC_MAX; w++){
    let e=0, c=0;
    L.forEach(x=>{
      if(!x.n) return;
      const worked=w ? x.days : [0,1,2,3,4,5,6].slice(0, x.days).filter(i=>addDays(mon0, i)>=t.start).length;
      if(worked){ e+=x.rate*worked*x.n; c+=(x.daily*worked+x.weekly)*x.n; }
    });
    earn.push(e); cost.push(c);
  }
  let worked=0;
  for(let w=0; w<FC_MAX; w++){
    if(!earn[w] && !cost[w]) continue;
    if(worked<t.hold){ R.held+=earn[w]; R.heldWeeks++; }
    else if(w+t.lag<FC_MAX) pay[w+t.lag]+=earn[w];
    worked++;
  }
  if(t.bonus>0 && routes){
    const third=Math.floor(t.bonus/3*100)/100;
    [1,2,3].forEach(k=>{
      const w=weeksBetween(mon0, mondayOf(nextPayDay(addDays(t.start, 30*k), off)));
      if(w>=0 && w<FC_MAX){ bonus[w]+=(k<3 ? third : t.bonus-2*third)*routes; R.bonusWeeks.push(w); }
    });
  }
  const cash=[]; let c=0, low=0, lowW=-1;
  for(let w=0; w<FC_MAX; w++){ c+=pay[w]+bonus[w]-cost[w]; cash.push(c); if(c<low-0.5){ low=c; lowW=w; } }
  let even=-1;
  if(lowW>=0) for(let w=lowW+1; w<FC_MAX; w++) if(cash[w]>=0){ even=w; break; }
  R.cash=cash; R.need=Math.max(0, -low); R.lowW=lowW; R.even=even; R.firstPay=pay.findIndex(v=>v>0.5);
  /* the weeks to show: 16, or enough to see it back to even and the last of the bonus, up to a year */
  let W=16;
  if(even>=0) W=Math.max(W, even+3);
  if(R.bonusWeeks.length) W=Math.max(W, Math.max(...R.bonusWeeks)+2);
  if(even<0 && lowW>=0 && left>0) W=52;
  R.W=Math.min(W, 52);
  return R;
}
function fcWeekLabel(R, w){ return fmtDay(addDays(R.mon0, 7*w), {month:"short", day:"numeric"}); }
/* a short amount for a bar: +$4.2k, −$47.5k */
function fcK(v){ const a=Math.abs(v), s=v<-0.5 ? "−" : "+"; return a<999.5 ? s+"$"+Math.round(a) : s+"$"+(Math.round(a/100)/10).toFixed(1).replace(/\.0$/, "")+"k"; }
/* the end of a line: what all its routes leave a week (how many × one route), and under it one route's share;
   a line of one route has its money in and out there instead (one line under, so the rows stay the same height) */
function fcLeftHtml(x){

/* a scenario in a few words: "2 tractor + trailer, 2 straight truck · drivers $300 a day" */
function fcSummary(R){

function fcChartSay(R){

}

function vFcLines(sc, R){

/* the labels a phone has room for (the owner, 2026-10-21, on a phone: a chart's amounts and dates ran into each
   other). Its bars get about 300px there, so no two labels closer than one label is wide: the ones that matter
   first (want), then, with every, one each so far along. The rest are hidden on a phone only; a tap on a bar says
   its amount */
function phoneLabels(n, words, want, every){
  const wide=Math.max(0, ...words.map(s=>String(s).length))*7+6, gap=Math.max(1, Math.ceil(wide*n/300)), on=new Set();
  const fits=i=>[...on].every(j=>Math.abs(i-j)>=gap);
  want.forEach(i=>{ if(i>=0 && i<n && fits(i)) on.add(i); });
  if(every) for(let i=0; i<n; i+=gap) if(fits(i)) on.add(i);
  return on;
}
/* a chart label's classes: ph-x is hidden on a phone, wd-x everywhere else (on a phone it takes the place of one
   left out to make room) */
function rcHide(wide, phone){ return (wide ? "" : " wd-x")+(phone ? "" : " ph-x"); }
function rcTip(){ return '<p class="rc-tip">Tap any bar to see its amount.</p>'; }
/* the cash at the end of each week: red while you're in, green once it's back */
function vFcChart(R){
  const W=R.W, C=R.cash.slice(0, W), H=190, PAD=24, dense=W>20, every=Math.ceil(W/16);
  const top=Math.max(0, ...C), low=Math.max(0, ...C.map(v=>-v)), sc=H/Math.max(1, top+low), base=PAD+low*sc;
  const note={}, add=(w, s)=>{ if(w>=0 && w<W) note[w]=note[w] ? note[w]+" · "+s : s; };
  if(R.need>=1) add(R.lowW, "lowest");
  if(!dense){ add(R.firstPay, "first pay"); R.bonusWeeks.forEach(w=>add(w, "bonus")); }
  add(R.even, "even");
  const amts=C.map(fcK), days=C.map((v, w)=>fcWeekLabel(R, w));
  const phV=phoneLabels(W, amts, [R.need>=1 ? R.lowW : -1, R.even, W-1, R.firstPay], false), phX=phoneLabels(W, days, [], true);
  const bars=C.map((v, w)=>{ const hgt=Math.max(2, Math.abs(v)*sc), neg=v<-0.5, show=!dense || !!note[w] || w===W-1, say="Week "+(w+1)+", the week of "+days[w]+": "+usd(v);
    return '<div class="rc-col" data-act="rc-say" data-v="'+esc(say)+'" title="'+esc(say)+'"><i class="rc-bar'+(neg ? " neg" : "")+'" style="height:'+hgt+'px;bottom:'+(neg ? base-hgt : base)+'px;width:min(50px,74%)"></i>'
      +(show || phV.has(w) ? '<span class="rc-v'+rcHide(show, phV.has(w))+'" style="bottom:'+(neg ? base-hgt-20 : base+hgt+4)+'px">'+amts[w]+'</span>' : '')+'</div>'; }).join("");
  const cols='grid-template-columns:repeat('+W+',minmax(0,1fr));--rc-gap:'+(dense ? 3 : 8)+'px';
  return '<section class="mw-box"><div class="mw-box-h"><h2>Your cash, the first '+W+' weeks</h2><span class="n">what you’ve put in (red) or made back (green) by the end of each week'
    +(R.heldWeeks ? '. '+esc(R.t.name || "The company")+' holds '+plural(R.heldWeeks, "week")+' of pay ('+usd(R.held)+') and pays it back when you stop' : '')+'.</span></div>'
    +'<div class="rc fc"><div class="rc-plot" role="img" aria-label="'+esc(fcChartSay(R))+'" style="'+cols+';height:'+(H+PAD*2)+'px">'+bars+'<i class="rc-base" style="bottom:'+base+'px" aria-hidden="true"></i></div>'
    +'<div class="rc-x" aria-hidden="true" style="'+cols+'">'+C.map((v, w)=>{ const wide=!dense || w%every===0 || !!note[w];
      return '<span>'+(wide || phX.has(w) ? '<span class="rc-d'+rcHide(wide, phX.has(w))+'">'+esc(days[w])+'</span>' : '')
        +(note[w] ? '<small>'+esc(note[w])+'</small>' : '')+'</span>'; }).join("")+'</div>'+rcTip()+'</div></section>';
}

function vFcCompare(){

    const ok=vals.filter(v=>v!=null && isFinite(v));

    return '<div class="r'+(cls ? " "+cls : "")+'" style="'+cols+'"><span>'+esc(label)+'</span>'

    +row("A month", Rs.map(R=>R.month), v=>usdSigned(v), "high")
    +row("A year", Rs.map(R=>R.year), v=>usdSigned(v), "high")
    +(Rs.some(R=>R.bonusAll) ? row("First year, with the sign-on bonus", Rs.map(R=>R.firstYear), v=>usdSigned(v), "high") : '')
    +row("Cash you need up front", Rs.map(R=>R.left<=0 ? Infinity : R.need), v=>v===Infinity ? "It never pays back" : usd(v), "low")
    +row("Back to even", Rs.map(R=>R.left<=0 ? Infinity : R.need<1 ? 0 : R.even>=0 ? R.even+1 : Infinity), (v, i)=>v===0 ? "Never below zero" : v===Infinity ? (Rs[i].left<=0 ? "Never" : "Not in two years") : "Week "+v+" · "+esc(fcWeekLabel(Rs[i], v-1)), "low");
  const kinds=[]; Rs.forEach(R=>R.lines.forEach(x=>{ if(x.n && kinds.indexOf(x.l.kind)<0) kinds.push(x.l.kind); }));
  kinds.forEach(k=>{
    const vals=Rs.map(R=>{ const ls=R.lines.filter(x=>x.n && x.l.kind===k), m=ls.reduce((a, x)=>a+x.n, 0); return m ? ls.reduce((a, x)=>a+x.left*x.n, 0)/m : null; });

  });

    +'<button type="button" class="btn sm" data-act="fc-real" data-v="'+sc.id+'">'+ic("check")+'Make it real</button></span>').join("")+'</div></section>';
  return h+'<p class="mw-hint">Each scenario keeps its own lines and company terms. To try a change without losing one, make a copy of it first (the ⋯ next to its name).</p>';
}

function toggleDay(rid, iso){

/* ============================================================
   DOCUMENTS — contracts, insurance papers, W-9s, photos. Each can go with
   one of the stores, or with none (the owner's call, 2026-10-03: some papers
   aren't about one store), has a name that can be changed, and any number of
   tags. The list syncs with the rest of the data; each file is kept online
   in pieces of raw bytes (the database takes up to 1 MB per piece), and is
   read when it's opened. PDFs and pictures preview in the app.
   ============================================================ */
const DOC_MAX=20*1048576, DOC_PART=900000, DOC_BATCH=8;
const DOC_KINDS=[["pdf","PDF","red"],["image","Picture","purple"],["word","Word","blue"],["excel","Excel","green"],["other","Other","slate"]];
function extOf(name){ const m=/\.([A-Za-z0-9]{1,8})$/.exec(String(name||"")); return m ? m[1].toLowerCase() : ""; }
function baseName(name){ return String(name||"").replace(/\.[A-Za-z0-9]{1,8}$/, "").trim() || "Untitled"; }
function docKindOf(name, mime){
  const x=extOf(name), m=String(mime||"").toLowerCase();
  if(x==="pdf" || m==="application/pdf") return "pdf";
  if(/^(jpe?g|png|gif|webp|bmp|heic|heif|tiff?)$/.test(x) || m.indexOf("image/")===0) return "image";
  if(/^(docx?|odt|rtf|pages)$/.test(x) || /word/.test(m)) return "word";
  if(/^(xlsx?|xlsm|csv|ods|numbers)$/.test(x) || /spreadsheet|excel|csv/.test(m)) return "excel";
  return "other";
}
function docKind(k){ return DOC_KINDS.find(x=>x[0]===k) || DOC_KINDS[DOC_KINDS.length-1]; }

/* who a document goes with: one store, one driver (since 2026-10-05: a résumé, CDL, medical card, ID),
   or nobody. As the pickers and drop areas name it: "store:<id>", "driver:<id>" or "" */
function docOwnerKey(d){ return storeById(d.storeId) ? "store:"+d.storeId : byId("driver", d.driverId) ? "driver:"+d.driverId : ""; }
function ownerOf(key){
  const p=String(key||"").split(":");
  if(p.length===1) return storeById(p[0]) ? {type:"store", e:storeById(p[0]), key:"store:"+p[0]} : null;   /* a bare store id, as before */
  const e=p[0]==="store" ? storeById(p[1]) : p[0]==="driver" ? byId("driver", p[1]) : null;
  return e ? {type:p[0], e:e, key:p[0]+":"+e.id} : null;

/* ---------- folders (the owner, 2026-10-20: "any way to turn this into a folder system? like filehold… i need folders i
   can freely rename drag and drop move files to all that goodie"). A folder is its own synced record ("folder_<id>":
   its name, and the folder it's in, "" for the top). A document says which folder it's in (folderId, "" for the top);
   who it goes with (a store, a driver) is kept apart, so a driver's page still lists their documents wherever they're
   filed. A document or folder whose folder is gone shows at the top, and so does a folder caught in a loop (two
   computers moving two folders into each other at once), so nothing is ever out of sight. Versions before 1.17 skip
   folder records and keep them ---------- */
function folderById(id){ return id ? S.folders.find(f=>f.id===id) || null : null; }
function inLoop(f){ let p=f.parentId, n=0; while(p){ if(p===f.id || ++n>S.folders.length) return true; const q=folderById(p); if(!q) return false; p=q.parentId; } return false; }
function parentOf(f){ return f && f.parentId && folderById(f.parentId) && !inLoop(f) ? f.parentId : ""; }
function docFolder(d){ return d && d.folderId && folderById(d.folderId) ? d.folderId : ""; }
function curFolder(){ return folderById(S.ui.docFolder) ? S.ui.docFolder : ""; }
/* the folders in a folder ("" for the top), by name */
function subFolders(id){ return S.folders.filter(f=>parentOf(f)===(id||"")).sort((a,b)=>natural(a.name, b.name)); }
/* from the top down to this folder */
function folderPath(id){ const out=[]; let f=folderById(id); while(f && out.length<=S.folders.length){ out.unshift(f); f=folderById(parentOf(f)); } return out; }
function folderPathText(id){ return ["Documents"].concat(folderPath(id).map(f=>f.name)).join(" › "); }
function folderLabel(id){ const f=folderById(id); return f ? f.name : "Documents"; }
/* where something is filed, as a search shows it (the owner, 2026-10-20: "when i search for a file… show the folder its
   in"): "Drivers › Kevin Charles", or "Documents" for the top */
function folderWhere(id){ return folderById(id) ? folderPath(id).map(f=>f.name).join(" › ") : "Documents"; }
/* this folder and every folder inside it, at any depth */
function folderTree(id){ const out=new Set(id ? [id] : []), walk=p=>subFolders(p).forEach(f=>{ if(!out.has(f.id)){ out.add(f.id); walk(f.id); } }); walk(id||""); return out; }
/* what's in a folder: its own documents, or (deep) everything in the folders inside it too */
function docsIn(id, deep){ if(!deep) return S.docs.filter(d=>docFolder(d)===(id||"")); if(!id) return S.docs.slice(); const ids=folderTree(id); return S.docs.filter(d=>ids.has(docFolder(d))); }

function nameTaken(name, parent, not){ const n=name.toLowerCase(); return subFolders(parent).some(f=>f.id!==not && f.name.toLowerCase()===n); }

/* every folder to pick from, by where it is; skip: a folder being moved and the ones inside it */

  const list=S.folders.filter(f=>!(skip && skip.has(f.id))).map(f=>({id:f.id, path:folderPath(f.id).map(x=>x.name).join(" › ")})).sort((a,b)=>natural(a.path, b.path));
  return [{id:"", path:"Documents (the top)"}].concat(list).map(o=>'<option value="'+o.id+'"'+(o.id===(sel||"") ? ' selected' : '')+'>'+esc(o.path)+'</option>').join("");
}

function moveFolder(id, to){

  f.parentId=to; f.name=freeName(f.name, to, f.id); touch(f);

/* a folder taken away: what was in it moves up to the folder it was in, or (all) goes too */
function dropFolder(id, all){

  if(all){ S.docs=S.docs.filter(d=>!ids.has(docFolder(d))); S.folders=S.folders.filter(x=>!ids.has(x.id)); }
  else{
    S.docs.forEach(d=>{ if(docFolder(d)===id){ d.folderId=up; touch(d); } });
    S.folders.forEach(x=>{ if(x.id!==id && parentOf(x)===id){ x.parentId=up; x.name=freeName(x.name, up, x.id); touch(x); } });
    S.folders=S.folders.filter(x=>x.id!==id);

/* ---------- own folders, made by themselves (the owner, 2026-10-20: "automatically create a folder based on state and

   driver's or store's own folder sits in its state's folder ("New Jersey › Kevin Charles"), both made the first time a
   document of theirs is added. A folder remembers whose it is (folder.of: "driver:<id>", "store:<id>", "state:NJ"), so

function ownerState(key){
  const o=ownerOf(key); if(!o) return "";
  if(o.type==="store") return o.e.state||"";
  const all=[...statesOf("driver", o.e)]; return o.e.state && all.indexOf(o.e.state)>=0 ? o.e.state : all[0]||"";

function stateFolder(st, make){

/* their own folder; make: made (in their state's) if there's none yet. One waiting in "No state yet" moves to its

function ownFolder(key, make){
  const o=ownerOf(key); if(!o) return null;
  let f=linkedFolder(o.key);
  const st=ownerState(o.key);
  if(f && make && st){ const p=folderById(parentOf(f)); if(p && p.of==="state:"){ const sf=stateFolder(st, true); f.parentId=sf.id; f.name=freeName(f.name, sf.id, f.id); touch(f);
    /* "No state yet" goes once nothing is waiting in it */
    if(!subFolders(p.id).length && !S.docs.some(d=>docFolder(d)===p.id)) S.folders=S.folders.filter(x=>x.id!==p.id); } }
  if(!f && make){ const sf=stateFolder(st, true); f=makeFolder(ownerName(o), sf.id); f.of=o.key; f.auto=true; }
  return f;
}
/* where it'll be, said before it's made: "New Jersey › Kevin Charles" */
function ownFolderPath(key){
  const f=linkedFolder(key); if(f) return folderWhere(f.id);
  const o=ownerOf(key); if(!o) return "";
  const st=ownerState(key), sf=linkedFolder("state:"+st);
  return (sf ? folderWhere(sf.id) : st ? stateName(st) : "No state yet")+" › "+ownerName(o);
}
/* a driver renamed, or a store's number, city or retailer changed: their folder's name follows, unless it was renamed
   by hand */
function followOwnerName(key){
  const f=linkedFolder(key), o=ownerOf(key); if(!f || !o || !f.auto) return;
  const nm=freeName(ownerName(o), parentOf(f), f.id); if(nm!==f.name){ f.name=nm; touch(f); }
}
/* the add form's folder list: every folder, and (going with someone who has no folder yet) theirs, to be made */
function addFolderOptions(key, sel){
  return (key && !linkedFolder(key) ? '<option value="__own"'+(sel==="__own" ? ' selected' : '')+'>'+esc(ownFolderPath(key))+' (made now)</option>' : '')+folderChoices(sel);
}
/* a document of a driver's or store's that isn't in their own folder yet and can go there: at the top, or in a folder
   named after them that isn't anybody's (like the ones 1.17's "Make one for each driver and store" made). One filed
   anywhere else stays where it was put */
function sortable(d){
  const k=docOwnerKey(d); if(!k) return false;
  const cf=folderById(docFolder(d)), o=ownerOf(k);
  return !cf || (!cf.of && !!o && cf.name.toLowerCase()===ownerName(o).toLowerCase());
}
function sortIntoOwnFolders(){
  const before=snap(), had=new Set(S.folders.map(f=>f.id)), emptied=new Set(); let moved=0;
  S.docs.filter(sortable).forEach(d=>{
    const own=ownFolder(docOwnerKey(d), true); if(!own) return;
    const cf=docFolder(d); if(cf===own.id) return;
    if(cf) emptied.add(cf);
    d.folderId=own.id; touch(d); moved++;
  });
  /* folders this left empty go, and the folders they were in once those are empty too */
  let gone=0, again=true;
  while(again){
    again=false;
    [...emptied].forEach(id=>{
      const f=folderById(id); emptied.delete(id);
      if(!f || !had.has(id) || f.of || S.docs.some(d=>docFolder(d)===id) || subFolders(id).length) return;
      const p=parentOf(f); S.folders=S.folders.filter(x=>x.id!==id); gone++;
      if(p){ emptied.add(p); again=true; }
    });
  }
  if(!moved){ toast("Every driver’s and store’s documents are in their folders already."); return; }
  if(!folderById(S.ui.docFolder)) S.ui.docFolder="";
  save(); render();
  toast("Put "+plural(moved, "document")+" in state and driver folders"+(gone ? ", and took away "+plural(gone, "folder")+" left empty" : ""), {undo:()=>restore(before), long:true});
}
/* the stores and drivers to choose from, in two groups; keep(type, e) says which to list */
function ownerGroups(cur, keep){
  const opt=(k, label)=>'<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(label)+'</option>';
  const ss=S.stores.filter(s=>keep("store", s)).sort(cmpStores), ds=S.drivers.filter(d=>keep("driver", d)).sort(SORT.driver);
  return (ss.length ? '<optgroup label="Stores">'+ss.map(s=>opt("store:"+s.id, storeName(s))).join("")+'</optgroup>' : '')
    +(ds.length ? '<optgroup label="Drivers">'+ds.map(d=>opt("driver:"+d.id, d.name||"No name")).join("")+'</optgroup>' : '');
}
/* for adding or moving a document: every store, and the drivers still in play (plus the one it's on) */
function ownerPicker(cur){ return ownerGroups(cur, (t, e)=>t==="store" || !isClosed(e) || "driver:"+e.id===cur); }
function fmtSize(n){ n=n||0; return n<1024 ? n+" B" : n<1048576 ? Math.round(n/1024)+" KB" : (n/1048576).toFixed(1)+" MB"; }
function allTags(){ const set=new Set(); S.docs.forEach(d=>(d.tags||[]).forEach(t=>set.add(t))); return [...set].sort((a,b)=>a.localeCompare(b)); }
/* what shows inside the app: PDFs, and the kinds of picture a browser can show */
function canPreview(d){ return d.kind==="pdf" || (d.kind==="image" && /^(jpe?g|png|gif|webp|bmp)$/.test(d.ext||"")); }
function storeName(s){ return s ? (s.retailer ? s.retailer+" " : "")+storeLong(s) : "No store yet"; }

/* ---------- the files, online ---------- */
const docCache=new Map();   /* file id → its file, once read this session */
function fileRef(...p){ return [CL.db, "users", CL.user.uid, "files"].concat(p); }
async function putFile(fileId, bytes, progress){
  const n=Math.max(1, Math.ceil(bytes.length/DOC_PART)), at=i=>String(i).padStart(3,"0");
  for(let i=0;i<n;i+=DOC_BATCH){
    const b=FB.writeBatch(CL.db);
    for(let j=i;j<Math.min(n, i+DOC_BATCH);j++) b.set(FB.doc(...fileRef(fileId, "parts", at(j))), {b:FB.Bytes.fromUint8Array(bytes.subarray(j*DOC_PART, (j+1)*DOC_PART))});
    /* the file's own entry goes in last: when it's there, every piece is */
    if(i+DOC_BATCH>=n) b.set(FB.doc(...fileRef(fileId)), {parts:n, size:bytes.length, at:FB.serverTimestamp()});
    const sent=b.commit();
    /* offline, the pieces wait on this computer and go up once it's back online */
    if(navigator.onLine) await sent; else sent.catch(()=>{});
    if(progress) progress(Math.min(n, i+DOC_BATCH)/n);
  }
  return n;
}
async function getFile(d){
  if(docCache.has(d.file)) return docCache.get(d.file);
  const snap=await FB.getDocs(FB.collection(...fileRef(d.file, "parts")));
  const parts=[]; snap.forEach(x=>parts.push([x.id, x.data().b]));
  if(!parts.length || parts.length<(d.parts||1)) throw new Error("missing");
  parts.sort((a,b)=>a[0]<b[0] ? -1 : 1);
  const blob=new Blob(parts.map(p=>p[1].toUint8Array()), {type:d.mime||"application/octet-stream"});
  docCache.set(d.file, blob);
  return blob;
}
async function dropFile(fileId){
  const snap=await FB.getDocs(FB.collection(...fileRef(fileId, "parts")));
  const refs=[]; snap.forEach(x=>refs.push(FB.doc(...fileRef(fileId, "parts", x.id))));
  refs.push(FB.doc(...fileRef(fileId)));
  for(let i=0;i<refs.length;i+=400){ const b=FB.writeBatch(CL.db); refs.slice(i, i+400).forEach(r=>b.delete(r)); await b.commit(); }
  docCache.delete(fileId);
}
/* a file no document points to any more (deleted, or its store was) is cleared out a day
   after it went up, the next time the app starts: that leaves time for Undo, and for another
   computer still sending a new one. Erase everything clears them all at once */
async function sweepFiles(every){
  if(!CLOUD || !CL.ready || !CL.user || SANDBOX) return;
  try{
    const used=new Set(S.docs.map(d=>d.file)), snap=await FB.getDocs(FB.collection(...fileRef())), dead=[];
    snap.forEach(x=>{
      const at=x.data().at, t=at && typeof at.toMillis==="function" ? at.toMillis() : 0;
      if(every || (!used.has(x.id) && t && Date.now()-t>864e5)) dead.push(x.id);
    });
    for(const id of dead) await dropFile(id);
  }catch(err){}
}

async function uploadDocs(items, owner, tags, folder){
  const added=[], o=ownerOf(owner);
  /* their own folder is made with the first document that goes in it */
  let fid=null; const where=()=>{ if(fid===null) fid=folder==="__own" ? (o ? (ownFolder(o.key, true)||{}).id||"" : "") : folderById(folder) ? folder : ""; return fid; };
  try{
    for(let k=0;k<items.length;k++){
      const it=items[k], bytes=new Uint8Array(await it.file.arrayBuffer()), fileId=uid("f");
      const label=(items.length>1 ? "Adding "+(k+1)+" of "+items.length+": " : "Adding ")+"“"+it.name+"”";
      toast(label+"…", {long:true});
      const parts=await putFile(fileId, bytes, p=>toast(label+" · "+Math.round(p*100)+"%", {long:true}));
      const d={id:uid("d"), name:it.name, ext:extOf(it.file.name), mime:it.file.type||"", kind:docKindOf(it.file.name, it.file.type),
        size:bytes.length, file:fileId, parts:parts, storeId:"", driverId:"", tags:tags.slice(), folderId:where(), created:Date.now(), updated:Date.now()};
      setDocOwner(d, owner);
      docCache.set(fileId, new Blob([bytes], {type:d.mime||"application/octet-stream"}));
      S.docs.push(d); added.push(d);
      save(); render(); if(sheet.open) refreshSheet();
    }
    toast((added.length===1 ? "“"+added[0].name+"” added" : plural(added.length,"document")+" added")
      +(o ? (o.type==="store" ? " to store #"+o.e.num : " to "+ownerName(o)+"’s page") : "")+(fid ? (o ? ", in " : " to ")+folderWhere(fid) : "")
      +(navigator.onLine ? "" : ". "+(added.length===1 ? "It goes" : "They go")+" online when the internet is back"), {long:true});
  }catch(err){
    toast((added.length ? "Added "+added.length+", then the upload stopped" : "Couldn’t add it")+(navigator.onLine ? ". Try again." : ": no internet."), {long:true});
  }
}

function tagChip(t, on){ return '<button type="button" class="tagchip" data-tag="'+esc(t)+'" aria-pressed="'+on+'">'+esc(t)+'</button>'; }
function tagPicker(px, sel){
  const tags=allTags(); sel.forEach(t=>{ if(tags.indexOf(t)<0) tags.push(t); });
  return '<fieldset class="tagpick" id="'+px+'_tags"><legend class="fl">Tags</legend>'
    +'<div class="tp-list">'+(tags.length ? tags.map(t=>tagChip(t, sel.indexOf(t)>=0)).join("") : '<span class="fhelp tp-none">No tags yet. Type one below, like Insurance or Contract.</span>')+'</div>'

    +'<button type="button" class="btn sm" data-tag-add="'+px+'">'+ic("plus")+'Add tag</button></div></fieldset>';

function wireTagPicker(root, px){
  const box=$("#"+px+"_tags", root), inp=$("#"+px+"_newtag", root);
  const add=()=>{
    const t=inp.value.trim().replace(/\s+/g, " "); if(!t) return;
    const have=$$(".tagchip", box).find(c=>c.dataset.tag.toLowerCase()===t.toLowerCase());
    if(have) have.setAttribute("aria-pressed", "true");
    else{ const none=$(".tp-none", box); if(none) none.remove(); $(".tp-list", box).insertAdjacentHTML("beforeend", tagChip(t, true)); }
    inp.value=""; inp.focus();
  };
  box.addEventListener("click", ev=>{
    const c=ev.target.closest(".tagchip"); if(c){ c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed")!=="true")); return; }
    if(ev.target.closest("[data-tag-add]")) add();
  });
  /* Enter in the new-tag box adds the tag, instead of sending the form */
  inp.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); add(); } });
}
function pickedTags(root, px){
  const box=$("#"+px+"_tags", root), inp=$("#"+px+"_newtag", root);

  const t=inp ? inp.value.trim().replace(/\s+/g, " ") : "";
  if(t && !out.some(x=>x.toLowerCase()===t.toLowerCase())) out.push(t);
  return out;
}

/* ---------- saving a copy, opening it in its own program, emailing it ---------- */
async function docBlob(d){
  try{ return await getFile(d); }
  catch(err){ toast(navigator.onLine ? "Couldn’t get “"+d.name+"”. Try again in a moment." : "“"+d.name+"” needs the internet the first time it’s opened.", {long:true}); return null; }
}
async function docDownload(d){
  const blob=await docBlob(d); if(!blob) return;
  const name=docFileName(d);
  if(DESK && DESK.saveFile){
    const r=await DESK.saveFile(name, new Uint8Array(await blob.arrayBuffer()));
    if(r && r.ok) toast("Saved “"+name+"”", {action:{label:"Show in folder", fn:()=>DESK.showFile(r.path)}});
    return;
  }
  fileOut(blob, name);
}
function fileOut(blob, name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function docOpen(d){
  const blob=await docBlob(d); if(!blob || !(DESK && DESK.openFile)) return;
  const r=await DESK.openFile(docFileName(d), new Uint8Array(await blob.arrayBuffer()));
  if(!r || !r.ok) toast("No program on this computer opens "+docKind(d.kind)[1]+" files. Use Download to save a copy instead.", {long:true});
}
async function docEmail(d){
  const blob=await docBlob(d); if(!blob) return;
  const name=docFileName(d), o=ownerOf(docOwnerKey(d));
  const subject=d.name+(!o ? "" : " - "+(o.type==="store" ? (o.e.retailer ? o.e.retailer+" " : "")+"#"+o.e.num : ownerName(o)));
  if(DESK && DESK.emailFile){
    toast("Opening a new email with “"+name+"” attached…", {long:true});
    const r=await DESK.emailFile({name:name, mime:d.mime||"", subject:subject, body:"Attached: "+name, data:new Uint8Array(await blob.arrayBuffer())});
    if(r && r.ok) toast("A new email with “"+name+"” attached is opening in Outlook.", {long:true, action:{label:"Not attached? Show the file", fn:()=>DESK.showFile(r.file)}});
    else toast("Couldn’t attach it for you. The file’s folder is open, so drag it into the email.", {long:true});
    return;
  }
  /* on a phone: its own share sheet (Mail, Messages, WhatsApp, Files…) with the file in it. Getting the file can
     take long enough that the phone wants a fresh tap, so then it asks for one */
  if(navigator.canShare && (matchMedia("(pointer:coarse)").matches || PHONE.matches)){
    const file=new File([blob], name, {type:d.mime||blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[file]})){
      const send=()=>navigator.share({files:[file], title:name}).catch(err=>{
        if(err && err.name==="NotAllowedError") toast("“"+name+"” is ready to send.", {long:true, action:{label:"Send it", fn:send}});
        else if(err && err.name!=="AbortError") toast("Couldn’t open the share sheet. Use Download instead.");
      });
      send(); return;
    }
  }
  /* in a web browser: save a copy to drag in, and start the email */
  fileOut(blob, name);
  const a=document.createElement("a"); a.href="mailto:?subject="+encodeURIComponent(subject); a.click();
  toast("A copy of “"+name+"” is in your downloads. Drag it into the email.", {long:true});
}

/* ---------- the preview window ---------- */
const VW={id:null, url:"", state:"", back:null};
async function openViewer(d){
  if(!d) return;
  if(!$("#viewer").hidden && VW.id===d.id) return;
  if(VW.url){ URL.revokeObjectURL(VW.url); VW.url=""; }
  if($("#viewer").hidden) VW.back=document.activeElement;
  VW.id=d.id; VW.state=canPreview(d) ? "loading" : "none";
  $("#viewer").hidden=false; document.body.classList.add("locked");
  viewerDraw();
  setTimeout(()=>{ const t=$("#vwTitle"); if(t) t.focus({preventScroll:true}); }, 0);
  if(VW.state!=="loading") return;
  try{
    const blob=await getFile(d);
    if(VW.id!==d.id) return;
    VW.url=URL.createObjectURL(blob); VW.state="ready";
  }catch(err){ if(VW.id!==d.id) return; VW.state="error"; }
  viewerDraw();
}
function closeViewer(){
  if($("#viewer").hidden) return;
  $("#viewer").hidden=true; $("#viewer .viewer").innerHTML="";
  if(VW.url){ URL.revokeObjectURL(VW.url); VW.url=""; }
  VW.id=null;
  if(!sheet.open) document.body.classList.remove("locked");
  if(VW.back && document.contains(VW.back)) VW.back.focus({preventScroll:true});
  VW.back=null;
}
function viewerDraw(){
  const d=docById(VW.id), box=$("#viewer .viewer");
  if(!d){ closeViewer(); return; }
  const k=docKind(d.kind), o=ownerOf(docOwnerKey(d));

  if(VW.state==="loading") body='<div class="vw-msg" role="status"><div class="gate-spin" aria-hidden="true"></div><p>Getting the file…</p></div>';
  else if(VW.state==="error") body='<div class="vw-msg" role="alert"><p>'+(navigator.onLine ? "Couldn’t get this file. Try again in a moment." : "This file needs the internet the first time it’s opened.")+'</p>'
    +'<button type="button" class="btn" data-act="vw-retry">Try again</button></div>';
  else if(VW.state==="none") body='<div class="vw-msg"><span class="vw-big tone-'+k[2]+'" aria-hidden="true">'+ic("docs")+'</span>'
    +'<p>'+esc(k[1])+' files can’t be shown inside the app.</p><div class="row">'
    +(DESK && DESK.openFile ? '<button type="button" class="btn primary" data-act="doc-open" data-v="'+d.id+'">'+ic("external")+'Open in its program</button>' : '')
    +'<button type="button" class="btn" data-act="doc-download" data-v="'+d.id+'">'+ic("download")+'Download</button></div></div>';
  else body=d.kind==="pdf" ? '<iframe class="vw-pdf" src="'+esc(VW.url)+'" title="'+esc(d.name)+'"></iframe>'
    : '<div class="vw-pic"><img src="'+esc(VW.url)+'" alt="'+esc(d.name)+'"></div>';
  box.innerHTML='<header class="vw-head">'
    +'<div class="vw-tt"><h2 id="vwTitle" tabindex="-1">'+esc(d.name)+'</h2>'
    +'<div class="vw-meta"><span class="pill tone-'+k[2]+'">'+esc(k[1])+'</span>'
    +(o ? '<span class="meta">'+esc(ownerName(o))+'</span>' : '')
    +'<span class="meta vw-where">'+ic("folder")+esc(folderWhere(docFolder(d)))+'</span>'
    +(d.tags||[]).map(t=>'<span class="tag tone-slate">'+esc(t)+'</span>').join("")
    +'<span class="meta">'+esc(fmtSize(d.size))+'</span></div></div>'
    +'<div class="vw-acts">'
    +'<button type="button" class="btn sm" data-act="doc-download" data-v="'+d.id+'">'+ic("download")+'Download</button>'
    +'<button type="button" class="btn sm" data-act="doc-email" data-v="'+d.id+'">'+ic("mail")+'Email</button>'
    +(DESK && DESK.openFile && VW.state!=="none" ? '<button type="button" class="btn sm" data-act="doc-open" data-v="'+d.id+'">'+ic("external")+'Open in its program</button>' : '')

/* ---------- the Documents tab (the owner's design review, 2026-10-16: the same lines as a driver's Documents tab,
   not a bordered box per file with four buttons at the far edge). A heading with how many and "Add documents"
   right after it; files dropped anywhere on the page are added. The filters are the app's own lists, like the
   lists' pickers: what kind, who it goes with (type to find a store or driver) and its tag ---------- */
/* the "Goes with" filter: one store or driver ("store:<id>" / "driver:<id>"), or "__none" for
   the documents that go with nobody. (A bare store id, saved by an older version, still works.) */
function docFilter(){ const u=S.ui; return {kind:u.docKind||"", store:u.docStore==="__none" ? "__none" : (ownerOf(u.docStore)||{}).key || "", tag:u.docTag||"", q:u.docQ||""}; }
/* scope: a folder; then only what's in it, or in a folder inside it */
function shownDocs(scope){
  const f=docFilter(), q=f.q.trim().toLowerCase(), inside=scope ? folderTree(scope) : null;
  return S.docs.filter(d=>(!inside || inside.has(docFolder(d))) && (!f.kind || d.kind===f.kind) && (!f.store || (f.store==="__none" ? !docOwnerKey(d) : docOwnerKey(d)===f.store)) && (!f.tag || (d.tags||[]).indexOf(f.tag)>=0)
      && (!q || d.name.toLowerCase().indexOf(q)>=0))
    .sort((a,b)=>b.created-a.created);
}
/* what the open folder shows: its folders and documents. A search or filter looks in it and every folder inside it */
function docView(){
  const cur=curFolder(), f=docFilter(), q=f.q.trim().toLowerCase(), any=!!(f.kind || f.store || f.tag || q);
  const folders=!any ? subFolders(cur) : q && !f.kind && !f.store && !f.tag ? [...folderTree(cur)].filter(id=>id!==cur).map(folderById).filter(x=>x && x.name.toLowerCase().indexOf(q)>=0).sort((a,b)=>natural(a.name, b.name)) : [];
  const list=any ? shownDocs(cur) : docsIn(cur, false).sort((a,b)=>b.created-a.created);
  return {cur:cur, any:any, folders:folders, list:list};
}
function vDocList(){

/* the folder list: Documents (the top) and every folder, each with how many documents are in it (the ones in its
   folders too); a folder with folders in it opens and closes. Each takes what's dragged or dropped onto it */
function vFolderTree(){
  const cur=curFolder(), open=S.ui.docOpen||{}, kids=new Map(), own=new Map(), total=new Map();
  S.folders.forEach(f=>{ const p=parentOf(f); if(!kids.has(p)) kids.set(p, []); kids.get(p).push(f); });
  kids.forEach(l=>l.sort((a,b)=>natural(a.name, b.name)));
  S.docs.forEach(d=>{ const f=docFolder(d); own.set(f, (own.get(f)||0)+1); });
  const count=id=>{ if(total.has(id)) return total.get(id); total.set(id, 0); let n=own.get(id)||0; (kids.get(id)||[]).forEach(k=>{ n+=count(k.id); }); total.set(id, n); return n; };
  const row=(f, lvl)=>{
    const id=f ? f.id : "", ks=kids.get(id)||[], shut=!!f && ks.length>0 && !open[id], nm=f ? f.name : "Documents", here=id===cur;
    return '<li><div class="ft-row'+(here ? " on" : "")+'" data-fdrop="'+(id||"root")+'"'+(f ? ' data-dnd="folder:'+id+'"' : '')+' style="--lvl:'+lvl+'">'
      +(f && ks.length ? '<button type="button" class="ft-tg" data-act="ft-toggle" data-v="'+id+'" aria-expanded="'+!shut+'" aria-label="'+(shut ? "Show" : "Hide")+' the folders in '+esc(nm)+'">'+ic(shut ? "chevR" : "chevD")+'</button>' : '<span class="ft-tg" aria-hidden="true"></span>')
      +'<button type="button" class="ft-nm" data-act="folder-open" data-v="'+id+'" title="'+esc(nm)+'"'+(here ? ' aria-current="true"' : '')+'>'+ic(f ? "folder" : "docs")+'<span class="ft-tx">'+esc(nm)+'</span><span class="ft-n">'+count(id)+'</span></button></div>'
      +(ks.length && !shut ? '<ul class="ft">'+ks.map(k=>row(k, lvl+1)).join("")+'</ul>' : '')+'</li>';
  };
  return '<div class="ft-h"><h3 id="ftH">Folders</h3><button type="button" class="hlink" data-act="folder-new">'+ic("plus")+'New folder</button></div>'
    +'<ul class="ft" aria-labelledby="ftH">'+row(null, 0)+'</ul>'
    +'<p class="ft-tip">'+(S.folders.length ? 'Drag documents onto a folder to move them, or drop files from the computer on one. ' : 'No folders yet. ')
    +'A driver’s or store’s files go in their own folder, inside their state’s, made with the first one.'
    +(S.docs.some(sortable) ? ' <button type="button" class="hlink" data-act="folder-sort">Put the ones already here in those folders</button>' : '')+'</p>';

/* ============================================================
   SEARCH — everything, from anywhere (Ctrl+F or /)
   ============================================================ */
let results=[], resIdx=-1;
function searchAll(q){
  const tok=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!tok.length) return [];
  const hit=s=>{ const x=s.toLowerCase(); return tok.every(k=>x.indexOf(k)>=0); };
  const out=[];
  S.routes.slice().sort(SORT.route).forEach(r=>{
    const s=storeOf(r), d=driverOf(r), tk=truckOf(r);
    if(hit([title("route",r), r.company, s&&"#"+s.num, s&&s.city, s&&s.state, s&&stateName(s.state), d&&d.name, tk&&tk.unit].join(" ")))
      out.push({type:"route", e:r, label:title("route",r), sub:[storeName(s), stageOf("route",r.stage).name].join(" · ")});
  });
  /* a driver is also found by the store they're with: its number or city */
  S.drivers.slice().sort(SORT.driver).forEach(d=>{
    const s=storeById(d.storeId);
    if(hit([d.name, d.phone, fmtPhone(d.phone), phoneDigits(d.phone), d.email, d.city, d.state, d.state&&stateName(d.state), d.source, (d.cdl||{}).num, s&&"#"+s.num, s&&s.city].join(" ")))
      out.push({type:"driver", e:d, label:title("driver",d), sub:[stageOf("driver",d.stage).name, s ? storeName(s) : "", fmtPhone(d.phone)].filter(Boolean).join(" · ")});
  });
  S.trucks.slice().sort(SORT.truck).forEach(tk=>{
    if(hit([tk.unit, tk.ymm, tk.vendor, tk.branch, tk.vin, tk.plate, tk.location, tk.state, tk.state&&stateName(tk.state), configLabel(tk)].join(" ")))
      out.push({type:"truck", e:tk, label:title("truck",tk), sub:[configLabel(tk), stageOf("truck",tk.stage).name].filter(Boolean).join(" · ")});
  });
  S.stores.slice().sort((a,b)=>natural(a.num,b.num)).forEach(s=>{
    /* a store is also found by its contacts: their name, what they do, phone or email */
    const ways=c=>[c.name, c.role, c.phone, fmtPhone(c.phone), phoneDigits(c.phone), c.email].join(" "), cs=s.contacts||[];
    if(hit(["#"+s.num, s.city, s.state, stateName(s.state), s.retailer, s.address].concat(cs.map(ways)).join(" "))){
      const who=cs.find(c=>hit(ways(c)));
      out.push({type:"store", e:s, label:storeName(s), sub:who ? "Contact: "+[who.name, who.role].filter(Boolean).join(", ")
        : [s.retailer||"Store", plural(routesOfStore(s).length,"route")].join(" · ")});
    }
  });
  /* trailers, by their number, VIN, plate, kind or the truck they're on */
  S.trailers.slice().sort((a, b)=>natural(a.num, b.num)).forEach(x=>{
    const tk=trailerTruck(x);
    if(hit(["trailer", x.num, x.vin, x.plate, x.vendor, trailerKind(x), tk && tk.unit].join(" ")))
      out.push({type:"trailer", e:x, label:trailerTitle(x), sub:[trailerKind(x), x.vin ? "VIN "+x.vin : "", tk ? "on "+title("truck", tk) : "Not on a truck"].filter(Boolean).join(" · ")});
  });
  /* documents, by their name, file name, tags, type, or the store or driver they go with */
  S.docs.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{
    const o=ownerOf(docOwnerKey(d)), s=o && o.type==="store" ? o.e : null, dr=o && o.type==="driver" ? o.e : null;
    if(hit([d.name, docFileName(d), (d.tags||[]).join(" "), docKind(d.kind)[1], s && "#"+s.num, s && s.city, s && s.retailer, dr && dr.name, docFolder(d) && folderPathText(docFolder(d))].join(" ")))
      out.push({type:"doc", e:d, label:d.name, sub:[docKind(d.kind)[1], s ? storeName(s) : dr ? dr.name : "", "in "+folderWhere(docFolder(d)), (d.tags||[]).join(", ")].filter(Boolean).join(" · ")});
  });
  /* tasks, by what they are, their details or what they're linked to; the ones still to do first */
  S.tasks.map(t=>({t:t, iso:nextOpen(t)})).sort((a,b)=>(!a.iso-!b.iso) || (a.iso||a.t.date).localeCompare(b.iso||b.t.date)).forEach(o=>{
    const t=o.t;
    if(hit([t.title, t.details, linkLabel(t.link)].join(" ")))
      out.push({type:"task", e:t, day:o.iso||t.date, label:t.title, sub:[o.iso ? (isLate(t) ? "Overdue since "+fmtDay(o.iso) : taskWhen(t, o.iso)) : "Done", linkLabel(t.link)].filter(Boolean).join(" · ")});
  });
  return out.slice(0, 40);
}
function onSearch(){ const q=$("#q").value; results=searchAll(q); resIdx=results.length ? 0 : -1; renderResults(q); }
function renderResults(q){
  const box=$("#results"), inp=$("#q");
  if(!q.trim()){ closeResults(); return; }
  inp.setAttribute("aria-expanded","true");
  if(!results.length){
    box.innerHTML='<div class="none">Nothing matches “'+esc(q.trim())+'”.</div>';
    box.classList.add("on"); inp.removeAttribute("aria-activedescendant"); return;
  }
  const names={route:"Routes", driver:"Drivers", truck:"Trucks", trailer:"Trailers", store:"Stores", doc:"Documents", task:"Tasks"};
  let h="", last="";
  results.forEach((r,i)=>{
    if(r.type!==last){ h+='<div class="grp" role="presentation">'+names[r.type]+'</div>'; last=r.type; }
    const tone=r.type==="store" ? "slate" : r.type==="trailer" ? "teal" : r.type==="doc" ? docKind(r.e.kind)[2] : r.type==="task" ? (isLate(r.e) ? "red" : "blue") : stageOf(r.type, r.e.stage).tone;
    const icon=r.type==="store" ? "store" : r.type==="trailer" ? "trailer" : r.type==="doc" ? (r.e.kind==="image" ? "image" : "note") : r.type==="task" ? "task" : FLOWS[r.type].icon;
    const lead=r.type==="driver" ? avatar(r.e,30) : '<span class="ri tone-'+tone+'" aria-hidden="true">'+ic(icon)+'</span>';
    h+='<div class="opt" role="option" id="res-'+i+'" data-res="'+i+'" aria-selected="'+(i===resIdx)+'">'+lead
      +'<span><b>'+esc(r.label)+'</b><small>'+esc(r.sub)+'</small></span></div>';
  });
  box.innerHTML=h; box.classList.add("on");
  if(resIdx>=0) inp.setAttribute("aria-activedescendant", "res-"+resIdx);
}
function closeResults(){
  const box=$("#results"), inp=$("#q");
  box.classList.remove("on"); box.innerHTML="";
  inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant");
}
function pickResult(i){
  const r=results[i]; if(!r) return;
  $("#q").value=""; closeResults(); $("#q").blur();
  if(r.type==="doc") openViewer(r.e); else if(r.type==="task") taskDialog(r.e, {day:r.day}); else if(r.type==="trailer") trailerDialog(r.e); else openSheet(r.type, r.e.id);
}
function searchKey(ev){
  const n=results.length, q=$("#q");
  if(ev.key==="ArrowDown" && n){ ev.preventDefault(); resIdx=(resIdx+1)%n; renderResults(q.value); scrollRes(); }
  else if(ev.key==="ArrowUp" && n){ ev.preventDefault(); resIdx=(resIdx-1+n)%n; renderResults(q.value); scrollRes(); }
  else if(ev.key==="Enter"){ if(resIdx>=0){ ev.preventDefault(); pickResult(resIdx); } }
  else if(ev.key==="Escape"){ ev.preventDefault(); if(q.value){ q.value=""; closeResults(); } else q.blur(); }
}
function scrollRes(){ const el=$("#res-"+resIdx); if(el) el.scrollIntoView({block:"nearest"}); }

function offInTutorial(){ if(SANDBOX){ toast("That’s turned off during the tutorial."); return true; } return false; }
function exportBackup(){
  if(offInTutorial()) return;
  flush();
  const photos={};
  S.drivers.forEach(d=>{ const p=photoOf(d.id); if(p) photos[d.id]=p; });
  S.lastBackup=Date.now();
  const blob=new Blob([JSON.stringify({app:"project-tracker", v:1, exported:new Date().toISOString(), data:S, photos:photos})], {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="project-tracker-backup-"+isoOf(new Date())+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  save(); render();
  toast("Backup downloaded. Keep it somewhere safe.");
}
function importBackup(file){
  if(offInTutorial()) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let j=null; try{ j=JSON.parse(rd.result); }catch(err){ j=null; }
    const data=j && j.app==="project-tracker" ? j.data : null;
    if(!data || !Array.isArray(data.routes)){ toast("That file isn’t a backup from this app."); return; }
    confirmBox("Replace everything?",
      "This replaces what’s "+HERE+" with the backup from "+(j.exported||j.saved ? new Date(j.exported||j.saved).toLocaleString("en-US") : "that file")
      +" ("+plural(data.routes.length,"route")+", "+plural((data.drivers||[]).length,"driver")+", "+plural((data.trucks||[]).length,"truck")
      +"). Export first if you want to keep what’s here.", "Replace", ()=>{
        useFlows(data.flows); S=migrate(data);
        Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]);
        Object.keys(j.photos||{}).forEach(id=>setPhoto(id, j.photos[id]));
        flush(); prunePhotos(); render();
        toast("Backup restored");
      }, true);
  };
  rd.readAsText(file);
}
function eraseAll(){
  if(offInTutorial()) return;
  S=blank(); useFlows(S.flows);
  try{
    const dead=[];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(PHOTO_PREFIX)===0) dead.push(k); }
    dead.forEach(k=>localStorage.removeItem(k));
  }catch(err){}
  Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]);
  flush(); render();
  sweepFiles(true);   /* and every document's file */
  toast("Everything erased");
}
function clearExample(){
  if(offInTutorial()) return;
  const before=snap();
  const gone={};
  TYPES.forEach(t=>{ S[LIST[t]]=all(t).filter(e=>{ if(e.ex){ gone[e.id]=1; return false; } return true; }); });
  S.stores=S.stores.filter(s=>{ if(s.ex){ gone[s.id]=1; return false; } return true; });
  S.routes.forEach(r=>{ if(gone[r.driverId]) r.driverId=""; if(gone[r.truckId]) r.truckId=""; if(gone[r.storeId]) r.storeId=""; });
  S.drivers.forEach(d=>{ if(gone[d.storeId]) d.storeId=""; });
  S.docs=S.docs.filter(d=>!gone[d.storeId] && !gone[d.driverId]);
  S.tasks=S.tasks.filter(t=>!t.ex);
  S.trailers=S.trailers.filter(x=>!x.ex); S.trailers.forEach(x=>{ if(gone[x.truckId]) x.truckId=""; });
  S.money=S.money.filter(x=>!x.ex); S.payers=S.payers.filter(x=>!x.ex); S.scenarios=S.scenarios.filter(x=>!x.ex);
  S.weeks.forEach(w=>{ Object.keys(w.off||{}).forEach(rid=>{ if(gone[rid]) delete w.off[rid]; }); if(w.locked && w.locked.routes) w.locked.routes=w.locked.routes.filter(f=>!gone[f.route]); });
  S.weeks=S.weeks.filter(w=>Object.keys(w.off||{}).length || (w.locked && w.locked.routes && w.locked.routes.length));
  save(); render();
  toast("Example data cleared", {undo:()=>restore(before)});
}

function tutStart(){
  if(TUT.on){ const b=$("#tutPop [data-tut]"); if(b) b.focus(); return; }
  if(dialog.active) dialog.active.close();
  if(sheet.open) closeSheet();
  flush(); hideToast(); closeResults();
  TUT.real=S; TUT.realView=VIEW; TUT.on=true; SANDBOX=true;
  /* the practice runs on the stages the app came with, so its steps (and the tutorial's words) match */
  S=blank(); useFlows(S.flows);
  VIEW="home";
  if(location.hash!=="#home") history.replaceState(null, "", "#home");
  window.scrollTo(0,0);
  render();
  tutGo(0);
  const b=$('#tutPop [data-tut="start"]'); if(b) b.focus({preventScroll:true});
}
function tutEnd(msg){
  if(!TUT.on) return;
  if(dialog.active) dialog.active.close();
  if(sheet.open) closeSheet();
  hideToast();
  S.drivers.forEach(d=>{ delete PHOTOS[d.id]; });
  S=TUT.real; TUT.real=null; TUT.on=false; SANDBOX=false; useFlows(S.flows);
  $("#tutPop").hidden=true; $("#tutRing").hidden=true; $("#dlg").classList.remove("tut-room");
  VIEW=VIEWS.indexOf(TUT.realView)>=0 ? TUT.realView : "home";
  history.replaceState(null, "", "#"+VIEW);
  render(); window.scrollTo(0,0);
  toast(msg || "Tutorial closed. Your own list is back, just as you left it.");
  const b=$('#rail [data-act="tutorial"]'); if(b) b.focus({preventScroll:true});
}
function tutGo(n){
  TUT.i=Math.max(0, Math.min(n, TSTEPS.length-1));
  TUT.filled=false; TUT.shown=""; TUT.missSince=0; TUT.scroll=true;
  tutRender();
}
function tutAction(a){
  if(!TUT.on) return;
  const st=TSTEPS[TUT.i];
  if(a==="exit") return tutEnd(TUT.i===0 ? "No problem. The tutorial is "+(PHONE.matches?"at the bottom":"on the left")+" whenever you want it." : null);
  if(a==="start" || a==="next") return tutGo(TUT.i+1);
  if(a==="finish") return tutEnd("Nice work! Your own list is back, just as you left it.");
  if(a==="again"){
    if(dialog.active) dialog.active.close();
    if(sheet.open) closeSheet();
    hideToast();
    S.drivers.forEach(d=>{ delete PHOTOS[d.id]; });
    S=blank(); useFlows(S.flows); VIEW="home"; history.replaceState(null, "", "#home");
    render(); window.scrollTo(0,0);
    return tutGo(1);
  }
  if(a==="do" && st.doIt){ st.doIt(); tutSync(); return; }
  if(a==="fill" && st.fillIt){
    st.fillIt(); TUT.filled=true; tutRender();
    const sb=$('#dlg button[type="submit"]'); if(sb) sb.focus();
    return;
  }
  if(a==="submit"){ const f=$("#dlgF"); if(f) f.requestSubmit(); return; }
  if(a==="fix" && st.fix){ st.fix(); TUT.missSince=0; tutSync(); }
}
function tutRender(){
  if(!TUT.on) return;
  const st=TSTEPS[TUT.i], pop=$("#tutPop");
  const have={store:tStore, route:tRoute, driver:tDriver, truck:tTruck};
  const lost=(st.needs||[]).some(k=>!have[k]());
  const el=(!lost && st.target) ? st.target() : null;
  const found=isShown(el);
  /* a target can vanish for a moment while a page redraws, so wait a
     beat before deciding the user has wandered off */
  let off=false, waiting=false;
  if(!st.center && !lost && !found){
    if(!TUT.missSince){ TUT.missSince=Date.now(); setTimeout(tutSync, 450); }
    off=Date.now()-TUT.missSince>=400;
    waiting=!off;
  }else TUT.missSince=0;
  let head, text, note="", btns;
  if(lost){
    head="Part of the practice is gone";
    text="Something we made got deleted. Start over to pick it back up.";
    btns=[["again","Start over",1],["exit","Exit",0]];
  }else if(off){
    head=st.title();
    text="Looks like we got a little off track. "+tapWord()+" "+bold("Take me there")+" and we’ll pick up where we left off.";
    btns=[["fix","Take me there",1]].concat(st.doIt ? [["do","Do it for me",0]] : []);
  }else{
    head=st.title(); text=st.text(); note=st.note ? st.note() : "";
    btns=st.buttons ? st.buttons
      : st.info ? [["next","Next",1]]
      : st.fillIt ? (TUT.filled ? [["submit","Do it for me",0]] : [["fill","Fill it in for me",0]])
      : st.doIt ? [["do","Do it for me",0]] : [];
  }
  const key=[TUT.i, head, text, note, btns.map(x=>x[0]).join()].join("|");
  if(key!==TUT.shown){
    TUT.shown=key;
    $("#tutPart").textContent = st.part!=null ? "Part "+(st.part+1)+" of "+PARTS.length+" · "+PARTS[st.part] : st.id==="done" ? "All done" : "Tutorial";
    $("#tutProg").style.width=Math.round(TUT.i/(TSTEPS.length-1)*100)+"%";
    $("#tutT").textContent=head;
    $("#tutX").innerHTML=text;
    const n=$("#tutN"); n.hidden=!note; n.textContent=note;
    $("#tutActs").innerHTML=btns.map(x=>'<button type="button" class="btn'+(x[2]?" tut":"")+'" data-tut="'+x[0]+'">'+esc(x[1])+'</button>').join("");
  }
  pop.hidden=false;
  if(waiting){ $("#tutRing").hidden=true; return; }
  tutPlace(found ? el : null, st.spot!==false && !dialog.active, found && st.near ? st.near() : null);
  if(TUT.scroll && found){
    TUT.scroll=false;
    const r=el.getBoundingClientRect();
    if(r.top<70 || r.bottom>innerHeight-70) el.scrollIntoView({block:"center", behavior:smooth()});
  }
}
/* the card sits beside what it points at on a wide screen, and at the
   top or bottom (whichever is clear of it) on a phone. A step can name
   a bigger "near" box for the card to keep clear of, such as the whole
   store card above its + Route folder. */
function tutPlace(el, spot, near){
  const pop=$("#tutPop"), ring=$("#tutRing"), m=12;
  const vw=document.documentElement.clientWidth, vh=innerHeight, phone=PHONE.matches;
  const navH=(phone && !sheet.open && !dialog.active) ? $("#rail").offsetHeight : 0;
  if(phone){ pop.style.left=m+"px"; pop.style.width=(vw-2*m)+"px"; }
  /* a phone has no room beside a form, so the form slides down and the
     card sits above it; the class only changes when it must, so this
     never feeds the page watcher a loop */
  const d=$("#dlg"), room=phone && !!dialog.active;
  if(room){
    d.style.setProperty("--tut-h", (pop.offsetHeight+2*m)+"px");
    if(!d.classList.contains("tut-room")) d.classList.add("tut-room");
    pop.style.top=m+"px";
  }else if(d.classList.contains("tut-room")) d.classList.remove("tut-room");
  if(!el){
    ring.hidden=true;
    if(phone){ if(!room) pop.style.top=Math.max(m, vh-navH-pop.offsetHeight-m)+"px"; }
    else{
      const w=Math.min(400, vw-2*m); pop.style.width=w+"px";
      pop.style.left=Math.round((vw-w)/2)+"px";
      pop.style.top=Math.max(m, Math.round((vh-pop.offsetHeight)/2))+"px";
    }
    return;
  }
  const r=el.getBoundingClientRect(), pad=6;
  ring.hidden=false;
  ring.style.left=(r.left-pad)+"px"; ring.style.top=(r.top-pad)+"px";
  ring.style.width=(r.width+pad*2)+"px"; ring.style.height=(r.height+pad*2)+"px";
  ring.classList.toggle("spot", !!spot);
  if(phone){
    if(!room) pop.style.top=(r.top+r.height/2>vh/2) ? m+"px" : Math.max(m, vh-navH-pop.offsetHeight-m)+"px";
    return;
  }
  const b=isShown(near) ? near.getBoundingClientRect() : r;
  const spaceR=vw-b.right-pad, spaceL=b.left-pad, spaceB=vh-b.bottom-pad, spaceT=b.top-pad;
  const side=Math.max(spaceR, spaceL);
  let w, x, y;
  if(side>=280+2*m){
    w=Math.min(360, side-2*m); pop.style.width=w+"px";
    const h=pop.offsetHeight;
    x=spaceR>=spaceL ? b.right+pad+m : b.left-pad-m-w;
    y=Math.min(Math.max(m, b.top+b.height/2-h/2), vh-h-m);
  }else{
    w=Math.min(360, vw-2*m); pop.style.width=w+"px";
    const h=pop.offsetHeight;
    y=spaceB>=h+2*m ? b.bottom+pad+m : spaceT>=h+2*m ? b.top-pad-m-h : vh-h-m;
    x=Math.min(Math.max(m, b.left+b.width/2-w/2), vw-w-m);
  }
  pop.style.left=Math.round(x)+"px"; pop.style.top=Math.round(y)+"px";
}
/* after anything on the page changes: move on if the step is done, then redraw.
   Runs on the next frame, or after a short timer if frames are slow to come,
   so the guide can't stall; several changes in a row collapse into one run. */
let tutRaf=0, tutTimer=0, tutQueued=false, tutPosRaf=0;
function tutSync(){
  if(!TUT.on || tutQueued) return;
  tutQueued=true;
  const run=()=>{
    if(!tutQueued) return;
    tutQueued=false; cancelAnimationFrame(tutRaf); clearTimeout(tutTimer);
    if(!TUT.on) return;
    for(let g=0; g<6; g++){
      const st=TSTEPS[TUT.i];
      if(!(st.when && st.when())) break;
      TUT.i=Math.min(TUT.i+1, TSTEPS.length-1);
      TUT.filled=false; TUT.shown=""; TUT.missSince=0; TUT.scroll=true;
    }
    tutRender();
  };
  tutRaf=requestAnimationFrame(run);
  tutTimer=setTimeout(run, 120);
}
new MutationObserver(recs=>{
  if(!TUT.on) return;
  const ours=recs.every(r=>{ const t=r.target.nodeType===1 ? r.target : r.target.parentElement; return !!t && !!t.closest("#tutPop,#tutRing"); });
  if(!ours) tutSync();
}).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["hidden","class","aria-expanded"]});
addEventListener("resize", ()=>{ if(TUT.on) tutSync(); });
document.addEventListener("scroll", ()=>{
  if(!TUT.on) return;
  cancelAnimationFrame(tutPosRaf);
  tutPosRaf=requestAnimationFrame(()=>{
    const st=TSTEPS[TUT.i], el=st.target ? st.target() : null;
    if(isShown(el)) tutPlace(el, st.spot!==false && !dialog.active, st.near ? st.near() : null);
  });
}, true);

function refocus(sel){

/* the top bar's height, for the page's scroll padding (see --top-h). It's measured after
   every render and whenever the bar changes size (its buttons wrap in a narrow window) */
function noteTopHeight(){

}

function onAct(el, ev){
  const a=el.dataset.act, v=el.dataset.v, t=sheet.type, e=sheet.open ? byId(sheet.type, sheet.id) : null;
  switch(a){
    case "undo": if(toast.undo){ const u=toast.undo; hideToast(); u(); } break;
    case "toast-act": if(toast.action){ const f=toast.action; hideToast(); f(); } break;
    /* a chart's bar tapped: its amount (a phone shows only some of them on the chart) */
    case "rc-say": if(v) toast(v); break;
    /* documents */
    case "doc-add": docPick(v || (sheet.open && (sheet.type==="store" || sheet.type==="driver") && el.closest("#sheet") ? sheet.type+":"+sheet.id : "")); break;
    case "doc-view": openViewer(docById(v)); break;
    case "doc-download": { const d=docById(v); if(d) docDownload(d); break; }
    case "doc-email": { const d=docById(v); if(d) docEmail(d); break; }
    case "doc-open": { const d=docById(v); if(d) docOpen(d); break; }
    case "doc-edit": { const d=docById(v); if(d) editDocDialog(d); break; }
    case "doc-del": { const d=docById(v); if(d) deleteDoc(d); break; }
    case "doc-move": moveDialog({docs:[v]}); break;
    case "nav-go": pmClose(false); go(v); break;
    case "folder-open": openFolder(v); break;
    case "folder-new": newFolder(); break;
    case "folder-rename": renameFolder(v, el.dataset.at); break;
    case "folder-move": moveDialog({folder:v}); break;
    case "folder-del": deleteFolder(v); break;
    case "folder-sort": sortIntoOwnFolders(); break;
    case "folder-goto": { if(sheet.open) closeSheet(); if(VIEW!=="docs") go("docs"); openFolder(v); break; }
    case "ft-toggle": { const op=S.ui.docOpen||(S.ui.docOpen={}); op[v]=!op[v]; saveView(); const tr=$("#ftree"); if(tr) tr.innerHTML=vFolderTree(); refocus('[data-act="ft-toggle"][data-v="'+CSS.escape(v)+'"]'); break; }
    case "dsel-move": moveDialog({docs:[...DSEL].filter(docById)}); break;
    case "dsel-del": deleteDocs([...DSEL]); break;
    case "dsel-clear": { DSEL.clear(); const l=$("#docList"); if(l){ l.innerHTML=vDocList(); markMixed(l); } refocus("#docTitle"); break; }
    case "doc-clear": S.ui.docKind=S.ui.docStore=S.ui.docTag=S.ui.docQ=""; save(); renderPage(); refocus("#df_kind"); break;
    case "tags-manage": tagsDialog(); break;
    case "vw-close": closeViewer(); break;
    case "vw-retry": { const d=docById(VW.id); if(d){ VW.id=null; openViewer(d); } break; }
    case "tutorial": tutStart(); break;

    case "att-grp": case "att-all": {

      const u=LU(g); u.q=u.pick=u.stage=""; if(g!=="route") u.view=""; if(g==="truck") S.ui.truckTab=""; S.ui.stateFilter=""; NEED[g]=v; save();

    case "need-clear": { const lt=TAB_TYPE[VIEW]; if(!lt) break; NEED[lt]=""; renderPage(); refocus("#lq"); break; }

      if(a==="today-late") TODAYX.late=!TODAYX.late; else TODAYX.all=!TODAYX.all;

    case "toggle-closed": { const ty=el.dataset.type; S.ui.showClosed[ty]=!S.ui.showClosed[ty]; save(); renderPage(); refocus('[data-act="toggle-closed"]'); break; }
    /* the lists: a stage tab, list or board, a group folded, the filters cleared, a group's + Add */
    case "list-stage": { const lt=listTypeNow(); if(!lt) break; LU(lt).stage=v||""; save(); renderPage(); refocus('[data-act="list-stage"][data-v="'+CSS.escape(v||"")+'"]'); break; }
    /* a list's picker: its menu opened or closed, or a choice made (a state, a vendor, a store) */

    case "lp-set": {
      if(VIEW==="money"){ const mk={mstore:"store", mpayer:"payer", mtype:"type", mroutes:"routes", fcsc:"fc"}[el.dataset.k]; if(mk){ MU()[mk]=v||""; save(); renderPage(); renderTop(); refocus("#lp-"+el.dataset.k+"-btn"); } break; }

    case "list-group": { const lt=listTypeNow(); if(!lt) break; const u=LU(lt); if(u.shut[v]) delete u.shut[v]; else u.shut[v]=true; save(); renderPage(); refocus('[data-act="list-group"][data-v="'+CSS.escape(v)+'"]'); break; }
    case "list-clear": { const lt=listTypeNow(); if(!lt) break; const u=LU(lt); u.q=u.pick=u.stage=""; if(lt!=="trailer"){ NEED[lt]=""; S.ui.stateFilter=""; } save(); renderPage(); renderTop(); refocus("#lq"); break; }

      else if(lt==="driver") newDialog("driver", key ? {storeId:key} : {});

    }

    case "sel-clear": { const lt=listTypeNow(); if(SEL[lt]){ SEL[lt].clear(); renderPage(); refocus("#lq"); } break; }
    case "bulk-set": { const lt=listTypeNow(); if(SEL[lt] && SEL[lt].size){ if(lt==="trailer") tlBulkSet(); else bulkSetDialog(lt); } break; }
    case "bulk-del": { const lt=listTypeNow(); if(SEL[lt] && SEL[lt].size){ if(lt==="trailer") tlBulkDelete(); else bulkDelete(lt); } break; }
    case "tl-off": tlBulkOff(); break;
    case "tl-new": trailersDialog({}); break;
    /* the Money tab: its tabs, the week or the time shown, a day off, a lock, and its forms */
    case "mn-tab": MU().tab=v||"week"; save(); renderPage(); renderTop(); refocus('[data-act="mn-tab"][data-v="'+(v||"week")+'"]'); break;
    case "mn-week": { const u=MU(); u.week=v==="0" ? "" : addDays(moneyWeek(), 7*(+v||0)); if(u.week===mondayOf(todayISO())) u.week=""; save(); renderPage(); renderTop(); refocus('[data-act="mn-week"][data-v="'+(v==="0" ? "1" : v)+'"]'); break; }
    case "mn-move": moveMoneyPeriod(+v||0); save(); renderPage(); renderTop(); refocus('[data-act="mn-move"][data-v="'+(v==="0" ? "1" : v)+'"]'); break;

    case "mn-costall": MN_ALL.costs=!MN_ALL.costs; renderPage(); refocus('[data-act="mn-costall"]'); break;

    case "mn-terms": payerDialog(v); break;
    case "mn-export": moneyExport(); break;
    case "mn-routes": MU().routes=v==="coming" ? "coming" : ""; save(); renderPage(); renderTop(); refocus("#lp-mroutes-btn"); break;
    /* Money's Forecast tab: its scenarios, their lines and terms, side by side, and made real */
    case "fc-new": fcNewDialog(); break;
    case "fc-mine": fcFromMine(); break;
    case "fc-view": {
      const u=MU(); u.fcView=v==="compare" ? "compare" : "";
      if(u.fcView && !fcCmpIds().length) u.fcCmp=S.scenarios.slice().sort((a, b)=>(b.updated||0)-(a.updated||0)).slice(0, 3).map(x=>x.id);
      save(); renderPage(); renderTop(); refocus('[data-act="fc-view"]'); break;
    }
    case "fc-cmp": fcToggleCmp(v); break;
    case "fc-open": { const sc=fcById(v); if(sc){ fcPick(sc); save(); renderPage(); renderTop(); refocus("#lp-fcsc-btn"); } break; }
    case "fc-real": { const sc=fcById(v) || fcCur(); if(sc) fcRealDialog(sc); break; }
    case "fc-terms": { const sc=fcCur(); if(sc) fcTermsDialog(sc); break; }
    case "fc-line-add": fcAddLine(); break;
    case "fc-line-del": fcDelLine(v); break;
    case "fc-rename": { const sc=fcById(v); if(sc) fcRenameDialog(sc); break; }
    case "fc-copy": { const sc=fcById(v); if(sc) fcCopy(sc); break; }
    case "fc-del": { const sc=fcById(v); if(sc) fcDelete(sc); break; }
    /* the Trucks page's two tabs: its trucks, or the trailers */
    case "truck-tab": S.ui.truckTab=v||""; lpClose(false); save(); renderTop(); renderPage(); refocus('[data-act="truck-tab"][data-v="'+(v||"")+'"]'); break;
    case "load-example": loadExample(); break;
    case "clear-example": confirmBox("Clear the example data?", "Removes the example stores, routes, drivers, trucks, trailers, tasks and money. Anything you added yourself stays.", "Clear it", clearExample, true); break;
    case "export": exportBackup(); break;
    case "import": { const i=$("#importInput"); i.value=""; i.click(); break; }
    case "erase": confirmBox("Erase everything?", "This deletes every store, route, driver, truck, trailer, task, money entry, photo and document "+HERE+". It can’t be undone without a backup file, and documents can’t come back at all.", "Erase everything", eraseAll, true); break;
    case "open-backups": if(DESK) DESK.openBackups(); break;
    case "sign-out": if(CLOUD) confirmBox("Sign out?", "Your data stays in your account. Sign in again any time, on this computer or another.", "Sign out", ()=>{ flush(); FB.signOut(CL.auth); }); break;
    case "install-update": if(updReady()){ flush(); DESK.installUpdate(); } break;
    case "check-updates": if(DESK){ DESK.checkUpdates(); updChanged({state:"checking"}); } break;
    case "theme": applyTheme(v); renderPage(); refocus('[data-act="theme"][data-v="'+CSS.escape(v||"")+'"]'); break;
    /* inside the project window */
    case "sheet-close": closeSheet(); break;
    case "sheet-back": sheetBack(); break;
    case "sheet-step": stepSheet(+v); break;
    case "sheet-delete": if(e){ if(t==="store") deleteStore(e); else confirmBox("Delete "+title(t,e)+"?", deleteText(t,e), "Delete", ()=>deleteEntity(t,e), true); } break;
    case "advance": { if(!e) break; const nx=nextStage(t, e.stage); if(nx) setStage(t, e, nx.k); break; }
    case "photo": if(e && t==="driver") photoDialog(e); break;
    case "photo-remove": if(e){ setPhoto(e.id, ""); touch(e); save(); render(); refreshSheet(); toast("Photo removed"); } break;
    case "focus": focusTarget(v); break;
    /* the page's tabs and stage bar: a stage picked shows its steps on Overview; "Move them to …" moves there */
    case "sheet-tab": setSheetTab(v, true); break;
    case "stage-view": {
      if(!e) break;
      sheet.view=v||""; sheet.addStep="";
      if(sheetTab(t)==="overview"){ refreshSheet(); break; }
      /* from another tab: Overview shows that stage's steps, and the keyboard stays on the stage bar */
      setSheetTab("overview");
      const b=(v ? $('#sheet .stbar [data-v="'+CSS.escape(v)+'"]') : null) || $('#sheet .stb[aria-pressed="true"]'); if(b) b.focus();
      break;
    }
    case "move-here": if(e && v){ sheet.view=""; sheet.addStep=""; if(e.stage===v) refreshSheet(); else setStage(t, e, v); } break;
    case "add-step": { sheet.addStep=v||""; renderSheet(false); const i=v ? document.getElementById("add_"+v) : $('#sheet [data-act="add-step"]'); if(i) i.focus(); break; }
    case "td-done": { sheet.showDone=!sheet.showDone; renderSheet(false); const b=$('#sheet [data-act="td-done"]'); if(b) b.focus(); break; }
    case "grp-open": { sheet.groups[v]=true; renderSheet(false); const b=$('#sheet .ss-g[data-g="'+CSS.escape(v||"")+'"] [data-act="edit"]'); if(b) editField(b.dataset.v); break; }
    /* Details: a value clicked turns into its box; the header's Copy puts a phone number or email on the clipboard */
    /* (the Enter that picked from a menu's list lands on the value it turned back into: not a new click) */
    case "edit": if(e && v && !(v===sheet.endedK && Date.now()-sheet.endedAt<400)) editField(v); break;
    case "copy": if(v) copyText(v, el.dataset.what||"", el); break;
    case "opt-set": if(e && el.dataset.k) optSet(el.dataset.k, v||""); break;
    case "flow-edit": flowDialog(v || t); break;
    case "pm": if(PMB===el) pmClose(true); else pmOpen(el); break;
    case "auto-go": focusTarget(AUTO_FOCUS[el.dataset.item]); break;
    /* a checklist step onto the task list: one step (the task form, filled in), or a whole stage (on the day picked) */
    case "step-task": {
      const s=e && stepOf({from:stepKey(t, e, el.dataset.item)});
      if(s) taskDialog(null, {title:s.it.label, date:todayISO(), link:t+":"+e.id, from:stepKey(t, e, s.it.id)});
      break;
    }
    case "stage-tasks": if(e) stageTasksDialog(t, e, el.dataset.stage); break;
    case "del-item": if(e){ e.custom=e.custom.filter(c=>c.id!==el.dataset.item); if(e.checks) delete e.checks[el.dataset.item]; touch(e); save(); render(); refreshSheet(); } break;
    /* a link's box opens its list; a pick from it (the keyboard goes back to the box first, so it's there
       after the page redraws) */
    case "pick": if(PMB===el) pmClose(true); else pkOpen(el); break;
    case "pk-pick": {
      const k=el.dataset.k, b=document.getElementById(el.dataset.from||""); if(b) b.focus({preventScroll:true});
      if(!e || !v) break;
      /* a store's Add a driver: a new one starts with this store; one picked goes with it */
      if(k==="storedriver"){ if(v==="__new") newDialog("driver", {storeId:e.id, stay:true}); else tieDriver(byId("driver", v), e); break; }
      if(k==="trailer"){ if(v==="__new") trailerDialog(null, {truckId:e.id}); else attachTrailer(e, trailerById(v)); break; }
      if(v==="__new"){ newDialog(k, k==="route" ? (t==="driver" ? {driverId:e.id, stay:true} : {truckId:e.id, stay:true}) : {routeId:e.id, stay:true}); break; }
      if(k==="driver") assignDriver(e, byId("driver", v)); else if(k==="truck") assignTruck(e, byId("truck", v)); else assignRouteFrom(t, e, v);
      break;
    }
    case "pk-open": { const p=String(v||"").split(":"); if(p[1]) openSheet(p[0], p[1]); break; }
    case "unlink-trailer": { const b=document.getElementById(el.dataset.from||""); if(b) b.focus({preventScroll:true}); if(e) attachTrailer(null, trailerOf(e)); break; }
    case "trailer-edit": trailerDialog(trailerById(v)); break;
    case "unlink-driver": case "unlink-truck": case "unlink-route": {
      const b=document.getElementById(el.dataset.from||""); if(b) b.focus({preventScroll:true});
      if(!e) break;
      if(a==="unlink-driver") assignDriver(e, null);
      else if(a==="unlink-truck") assignTruck(e, null);
      else { const r=byId("route", el.dataset.route); if(r){ if(t==="driver") assignDriver(r, null); else assignTruck(r, null); } }
      break;
    }
    case "log-type": sheet.logType=v; $$('#sheet [data-act="log-type"]').forEach(b=>b.setAttribute("aria-checked", String(b.dataset.v===v))); break;
    case "log-filter": sheet.logFilter=v; refreshSheet(); break;
    case "resolve": { const o=logEntry(el.dataset.log); if(o.x){ o.x.resolved=Date.now(); touch(o.e); save(); render(); refreshSheet(); toast("Issue resolved"); } break; }
    case "reopen": { const o=logEntry(el.dataset.log); if(o.x){ delete o.x.resolved; touch(o.e); save(); render(); refreshSheet(); } break; }
    case "del-log": {
      const o=logEntry(el.dataset.log); if(!o.x) break;
      const before=snap(); o.e.log=o.e.log.filter(l=>l.id!==o.x.id); touch(o.e);
      save(); render(); refreshSheet(); toast("Entry deleted", {undo:()=>restore(before)}); break;
    }
  }
}

let scrimDown=false, dlgDown=false, vwDown=false;
document.addEventListener("mousedown", ev=>{ scrimDown=ev.target===$("#scrim"); dlgDown=ev.target===$("#dlg"); vwDown=ev.target===$("#viewer"); });
document.addEventListener("click", ev=>{
  const tg=ev.target;
  if(!tg.closest(".search")) closeResults();
  if(sfOpen && !tg.closest("#sfWrap")) sfClose(false);
  if(LPICK && !tg.closest(".lp")) lpClose(false);
  /* a ⋯ menu closes on a click anywhere else, and once one of its choices is picked */
  if(PMB){
    const m=tg.closest(".pm-menu [data-act]");
    if(m){ pmClose(false); onAct(m, ev); return; }
    if(!tg.closest(".pm-menu")){ const trig=PMB; pmClose(false); if(trig.contains(tg)) return; }   /* a second click on what opened it just closes it */
  }
  const tb=tg.closest("[data-tut]"); if(tb){ ev.preventDefault(); tutAction(tb.dataset.tut); return; }
  if(tg===$("#scrim")){ if(scrimDown) closeSheet(); return; }
  if(tg===$("#dlg")){ if(dlgDown && dialog.active) dialog.active.close(); return; }
  if(tg===$("#viewer")){ if(vwDown) closeViewer(); return; }
  const res=tg.closest("[data-res]"); if(res){ pickResult(+res.dataset.res); return; }
  const nav=tg.closest("[data-nav]"); if(nav){ ev.preventDefault(); go(nav.dataset.nav); return; }
  const op=tg.closest("[data-open]");
  if(op){
    ev.preventDefault(); const p=op.dataset.open.split(":");
    if(p[0]==="trailer"){ trailerDialog(trailerById(p[1])); return; }
    /* a tab in a store's window keeps the keyboard on the tabs */
    openSheet(p[0], p[1], op.classList.contains("rail-tab") ? {focusSel:'.sh-rail [data-open="'+CSS.escape(op.dataset.open)+'"]'} : {focus:op.dataset.focus});
    return;
  }
  const act=tg.closest("[data-act]");
  if(act && act.tagName!=="SELECT" && act.tagName!=="FORM" && act.tagName!=="INPUT"){ onAct(act, ev); return; }
  if(tg.closest("a,button,input,select,textarea,label")) return;
  /* the calendar: a task's edge clicked (not dragged) opens it; an empty spot adds a task, for that
     hour in the week and day views, or for that day in the month view and the all-day row */
  const grip=tg.closest("[data-grip]");
  if(grip){ const k=taskById(grip.dataset.v), c=grip.closest("[data-drop-day]"); if(k) taskDialog(k, {day:c ? c.dataset.dropDay : k.date}); return; }
  const hour=tg.closest(".tg-col[data-drop-day]");
  if(hour && !tg.closest(".tg-ev")){
    const s=Math.max(+hour.dataset.dropLo, Math.floor(colMinute(hour, ev.clientY)/60)*60);
    dropBoxes("tg-hover");
    taskDialog(null, {date:hour.dataset.dropDay, time:hhmm(s), end:hhmm(Math.min(1439, s+60))});
    return;
  }
  const day=tg.closest(".cal-d[data-drop-day], .tg-allc[data-drop-day]");
  if(day){ taskDialog(null, {date:day.dataset.dropDay}); return; }
  const card=tg.closest(".card"); if(card){ const p=card.dataset.card.split(":"); openSheet(p[0], p[1]); return; }
  /* clicking anywhere on a document (not its buttons) opens its preview */
  const fl=tg.closest(".dline[data-folder]"); if(fl){ if(!tg.closest("input")) openFolder(fl.dataset.folder); return; }
  const dr=tg.closest(".doc[data-doc], .dline[data-doc]"); if(dr){ if(!tg.closest(".lr-ck")) openViewer(docById(dr.dataset.doc)); return; }
  /* clicking anywhere on a store's heading in the Routes list (not its buttons) opens the store */
  const sc=tg.closest(".sg-h[data-store]"); if(sc){ if(storeById(sc.dataset.store)) openSheet("store", sc.dataset.store); return; }
});

document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="photoInput" || el.id==="importInput" || el.id==="setCompany") return;
  if(el.id==="docInput"){ if(el.files && el.files.length) addDocsDialog(el.files, docPickFor); return; }
  /* a document ticked on the Documents page, or every one shown */
  if(el.dataset.dsel!=null || el.dataset.dselAll){
    if(el.dataset.dselAll) docView().list.forEach(d=>{ if(el.checked) DSEL.add(d.id); else DSEL.delete(d.id); });
    else if(el.checked) DSEL.add(el.dataset.dsel); else DSEL.delete(el.dataset.dsel);
    const l=$("#docList"); if(l){ l.innerHTML=vDocList(); markMixed(l); }
    refocus(el.dataset.dselAll ? "[data-dsel-all]" : '[data-dsel="'+CSS.escape(el.dataset.dsel)+'"]');
    return;
  }
  /* a task ticked off (on Home, or on a page) */
  if(el.dataset.act==="task-done"){
