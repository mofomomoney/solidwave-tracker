/* keep Tab inside the open window — plus the tutorial's guide card, so a
   keyboard user can always reach its buttons */
function trap(ev, root){
  if(!root) return;
  const sel='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  /* a tab that isn't picked, or a choice in a menu, is reached with the arrow keys instead (tabindex -1) */
  let f=$$(sel, root).filter(x=>(x.offsetParent!==null || x.classList.contains("sr-cb")) && x.getAttribute("tabindex")!=="-1");
  const pop=$("#tutPop");
  if(TUT.on && pop && !pop.hidden) f=f.concat($$(sel, pop));
  if(!f.length) return;
  ev.preventDefault();
  const i=f.indexOf(document.activeElement), n=f.length;
  f[i<0 ? (ev.shiftKey ? n-1 : 0) : (i+(ev.shiftKey ? -1 : 1)+n)%n].focus();
}
document.addEventListener("keydown", ev=>{
  /* a form's open list, or a box's suggestions, takes the keys first: Escape closes just the list */
  if(FP && fpKey(ev)) return;
  if(sgKey(ev)) return;
  if(dialog.active){
    if(ev.key==="Escape"){ ev.preventDefault(); dialog.active.close(); }
    else if(ev.key==="Tab") trap(ev, $("#dlg .dlg"));
    return;
  }
  if(!$("#viewer").hidden){
    if(ev.key==="Escape"){ ev.preventDefault(); closeViewer(); }
    else if(ev.key==="Tab") trap(ev, $("#viewer .viewer"));
    return;
  }
  if((ev.ctrlKey||ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase()==="z" && toast.undo && !isTyping(ev.target)){
    ev.preventDefault(); const u=toast.undo; hideToast(); u(); return;
  }
  if(ev.target && ev.target.id==="q"){ searchKey(ev); return; }
  if(sheet.open){
    /* a ⋯ menu: the arrow keys move through it; Escape or Tab closes it, back on its button */
    if(PMB){
      /* a link's list, with its box to type in */
      const pk=$(".pm-menu.pk"); if(pk && pkKey(ev, pk)) return;
      const its=$$(".pm-menu [role^=menuitem]"), i=its.indexOf(document.activeElement), n=its.length;
      if(ev.key==="Escape" || ev.key==="Tab"){ ev.preventDefault(); pmClose(true); return; }
      const to=ev.key==="ArrowDown" ? (i+1)%n : ev.key==="ArrowUp" ? (i-1+n)%n : ev.key==="Home" ? 0 : ev.key==="End" ? n-1 : -1;
      if(to>=0 && its[to]){ ev.preventDefault(); its[to].focus(); return; }
      /* a letter jumps to the next choice starting with it ("N" for New Jersey) */
      if(ev.key.length===1 && /\S/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
        const ch=ev.key.toLowerCase();
        for(let j=1; j<=n; j++){ const it=its[(i+j+n)%n]; if(it && it.textContent.trim().toLowerCase().indexOf(ch)===0){ ev.preventDefault(); it.focus(); break; } }
        return;
      }
    }
    /* the page's tabs: the arrow keys go from one to the next */
    if(ev.target && ev.target.getAttribute && ev.target.getAttribute("role")==="tab" && ev.target.closest("#sheet") && /^(ArrowLeft|ArrowRight|Home|End)$/.test(ev.key)){
      const tabs=$$('#sheet [role="tab"]'), i=tabs.indexOf(ev.target), n=tabs.length;
      const to=ev.key==="Home" ? 0 : ev.key==="End" ? n-1 : ev.key==="ArrowRight" ? (i+1)%n : (i-1+n)%n;
      ev.preventDefault(); setSheetTab(tabs[to].dataset.v, true); return;
    }
    /* a value being changed in Details: Escape puts back what was there, Enter keeps it; neither closes the page */
    if(sheet.edit && ev.key==="Escape"){ ev.preventDefault(); cancelEdit(); return; }
    if(sheet.edit && ev.key==="Enter" && ev.target && ev.target.id===fid(sheet.edit) && ev.target.tagName==="INPUT"){ ev.preventDefault(); finishEdit(); return; }
    /* Escape in the box for a step of its own closes the box, not the page */
    if(ev.key==="Escape" && ev.target && ev.target.closest && ev.target.closest(".add-item")){
      ev.preventDefault();
      const k=sheet.addStep; sheet.addStep=""; renderSheet(false);
      const b=$('#sheet [data-act="add-step"][data-v="'+CSS.escape(k||"")+'"]'); if(b) b.focus();
      return;
    }
    if(ev.key==="Escape"){ ev.preventDefault(); closeSheet(); return; }
    if(ev.key==="Tab"){ trap(ev, $("#sheet")); return; }
    if(ev.key==="Enter" && (ev.ctrlKey||ev.metaKey) && ev.target.id==="logText"){ ev.preventDefault(); submitLog(); }
    return;
  }
  /* a list's picker: the down arrow opens it; in its menu, arrows move, Escape or Tab closes it and returns to its button */
  if(ev.target && ev.target.classList && ev.target.classList.contains("lp-btn") && ev.key==="ArrowDown" && LPICK!==ev.target.dataset.v){ ev.preventDefault(); lpOpen(ev.target.dataset.v); return; }
  if(LPICK && ev.target && ev.target.closest && ev.target.closest(".lp")){
    const opts=$$("#lp-"+LPICK+"-menu .sf-opt"), i=opts.indexOf(document.activeElement);
    if(ev.key==="Escape" || ev.key==="Tab"){ ev.preventDefault(); lpClose(true); return; }
    let to=-1;
    if(ev.key==="ArrowDown") to=i<0 ? 0 : (i+1)%opts.length;
    if(ev.key==="ArrowUp") to=i<0 ? opts.length-1 : (i-1+opts.length)%opts.length;
    if(ev.key==="Home") to=0;
    if(ev.key==="End") to=opts.length-1;
    if(to>=0 && opts[to]){ ev.preventDefault(); opts[to].focus(); return; }
  }
  /* the state menu: arrows move, Escape or Tab closes it and returns to the button */
  if(ev.target && ev.target.id==="sfBtn" && ev.key==="ArrowDown" && !sfOpen){ ev.preventDefault(); onAct(ev.target, ev); return; }
  if(sfOpen && ev.target && ev.target.closest && ev.target.closest("#sfWrap")){
    const opts=$$("#sfMenu .sf-opt"), i=opts.indexOf(document.activeElement);
    if(ev.key==="Escape" || ev.key==="Tab"){ ev.preventDefault(); sfClose(true); return; }
    let to=-1;
    if(ev.key==="ArrowDown") to=i<0 ? 0 : (i+1)%opts.length;
    if(ev.key==="ArrowUp") to=i<0 ? opts.length-1 : (i-1+opts.length)%opts.length;
    if(ev.key==="Home") to=0;
    if(ev.key==="End") to=opts.length-1;
    if(to>=0 && opts[to]){ ev.preventDefault(); opts[to].focus(); return; }
  }
  if((ev.key==="/" && !isTyping(ev.target)) || ((ev.ctrlKey||ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase()==="f")){
    ev.preventDefault(); const q=$("#q"); q.focus(); q.select();
  }

/* ---------- the calendar with a mouse ----------
   - Drag a task to another day, or in the week and day views to another time.
   - In the week and day views, drag a task's top or bottom edge to change when it starts or ends.
   - Click an empty hour there to add a task for that hour, or drag down the hours to pick the
     time. (Clicking an empty spot on a day, in the month view or the all-day row, is in the
     click handler.)
   All of it snaps to 15 minutes, a dashed box (or the task itself) shows what you'll get, and Esc
   cancels. It's done by the page itself: the browser's own dragging won't pick up a button in
   Firefox. The task's form does all of it too, for the keyboard. */
let tdrag=null, tdragEnded=0;
const snap15=m=>Math.round(m/15)*15;
/* the minute of the day at a height in a column of hours */
function colMinute(col, y){ return +col.dataset.dropLo+(y-col.getBoundingClientRect().top)/HOUR*60; }
function spanText(s, e){ return fmtTime(hhmm(s))+" – "+fmtTime(hhmm(e)); }
/* a box in a column of hours, from one minute to another: the dashed preview, or the hint under the mouse */
function colBox(col, cls, s, e, html){
  let g=$("."+cls, col);
  if(!g){ g=document.createElement("div"); g.className=cls; g.setAttribute("aria-hidden","true"); col.appendChild(g); }
  g.style.top=((s- +col.dataset.dropLo)/60*HOUR)+"px"; g.style.height=Math.max(22, (e-s)/60*HOUR-2)+"px";
  if(g.dataset.html!==html){ g.innerHTML=html; g.dataset.html=html; }
  return g;
}
function dropBoxes(cls, keep){ $$("."+cls).forEach(g=>{ if(g!==keep) g.remove(); }); }

/* moving: where it would land, and showing that */
function taskDropAt(x, y){
  const el=document.elementFromPoint(x, y), cell=el && el.closest ? el.closest("[data-drop-day]") : null;
  if(!cell) return null;
  const at={cell:cell, iso:cell.dataset.dropDay};
  if(cell.dataset.dropAllday) at.allDay=true;
  else if(cell.dataset.dropLo!=null) at.minute=Math.max(0, Math.min(1425, snap15(colMinute(cell, y-tdrag.dy))));
  return at;
}
function taskDropShow(at){
  $$(".drop-on").forEach(c=>{ if(!at || c!==at.cell) c.classList.remove("drop-on"); });
  dropBoxes("tg-drop", at && at.minute!=null ? $(".tg-drop", at.cell) : null);
  if(!at) return;
  /* a day lights up; in the hours, a dashed box shows the new time instead */
  if(at.minute==null){ at.cell.classList.add("drop-on"); return; }
  const t=tdrag.t, len=t.time && t.end ? mins(t.end)-mins(t.time) : 60;
  colBox(at.cell, "tg-drop", at.minute, at.minute+len, '<b>'+esc(fmtTime(hhmm(at.minute)))+'</b> '+esc(t.title));
}

/* the end of any of them: let go (drop) or cancelled */
function taskDragEnd(drop){
  const d=tdrag; tdrag=null;
  if(!d) return;
  if(d.ghost) d.ghost.remove();
  document.body.classList.remove("tdragging", "tresizing");
  $$(".cchip.dragging").forEach(c=>c.classList.remove("dragging"));
  taskDropShow(null);
  if(!d.on) return;
  tdragEnded=Date.now();
  if(d.mode==="move"){
    const at=drop && d.at, t=d.t;
    if(!at || !taskById(t.id)) return;
    const same=at.iso===t.date && (at.allDay ? !t.time : at.minute==null || t.time===hhmm(at.minute));
    if(!same) moveTask(t, at.iso, at.minute, !!at.allDay);
  }else if(d.mode==="resize"){
    if(drop && taskById(d.t.id) && (d.ns!==d.s || d.ne!==d.e)) resizeTask(d.t, d.ns, d.ne);
    else renderPage();   /* the task goes back to how it was */
  }else if(d.mode==="select"){
    if(drop && d.s!=null) taskDialog(null, {date:d.iso, time:hhmm(d.s), end:hhmm(d.e)});
  }
}

document.addEventListener("pointerdown", ev=>{
  tdragEnded=0;   /* a new press: whatever click comes next is a real one */
  if(ev.button!==0 || dialog.active || tdrag || !ev.target.closest) return;
  const tg=ev.target, d={x:ev.clientX, y:ev.clientY, on:false};
  /* the top or bottom edge of a task in the hours */
  const grip=tg.closest("[data-grip]");
  if(grip){
    const t=taskById(grip.dataset.v), col=grip.closest(".tg-col"), box=grip.closest(".tg-ev");
    if(!t || !col || !box || mins(t.time)==null) return;
    ev.preventDefault();
    const s=mins(t.time), e=endOf({time:t.time, end:t.end});
    tdrag=Object.assign(d, {mode:"resize", edge:grip.dataset.grip, t:t, col:col, box:box, b:$(".cchip b", box), s:s, e:e, ns:s, ne:e});
    return;
  }
  /* a task: one that repeats doesn't move, it only says how to */
  const b=tg.closest(".cchip.task");
  if(b){
    const t=taskById(b.dataset.v); if(!t) return;
    const r=b.getBoundingClientRect();
    tdrag=Object.assign(d, {mode:b.dataset.dragTask ? "move" : "still", t:t, el:b, dx:ev.clientX-r.left, dy:ev.clientY-r.top, w:r.width, ghost:null, at:null});
    return;
  }
  /* an empty stretch of hours: picking the time for a new task */
  const col=tg.closest(".tg-col");
  if(col && !tg.closest(".tg-ev")){ ev.preventDefault(); tdrag=Object.assign(d, {mode:"select", col:col, iso:col.dataset.dropDay, s:null, e:null}); }
});

/* in the hours, the empty hour under the mouse says "+ 10 AM": clicking it adds a task for that hour */
function hoverHour(ev){
  const col=ev.pointerType==="mouse" && !dialog.active && ev.target.closest ? ev.target.closest(".tg-col") : null;
  if(!col || ev.target.closest(".tg-ev")){ dropBoxes("tg-hover"); return; }
  const s=Math.max(+col.dataset.dropLo, Math.floor(colMinute(col, ev.clientY)/60)*60);
  dropBoxes("tg-hover", $(".tg-hover", col));
  colBox(col, "tg-hover", s, Math.min(1440, s+60), ic("plus")+esc(fmtTime(hhmm(s))));
}
document.documentElement.addEventListener("pointerleave", ()=>dropBoxes("tg-hover"));

document.addEventListener("pointermove", ev=>{
  const d=tdrag;
  if(!d){ hoverHour(ev); return; }
  if(!d.on){
    if(Math.abs(ev.clientX-d.x)+Math.abs(ev.clientY-d.y)<(d.mode==="resize" ? 3 : 6)) return;
    d.on=true;
    dropBoxes("tg-hover");
    if(d.mode==="still"){ toast("“"+d.t.title+"” repeats, so it doesn’t drag to another day. Click it to change its day or time."); return; }
    if(d.mode==="move"){
      const g=d.el.cloneNode(true);
      g.classList.add("cchip-ghost"); g.classList.remove("block"); g.removeAttribute("data-act"); g.removeAttribute("data-drag-task"); g.setAttribute("aria-hidden","true"); g.tabIndex=-1;
      g.style.width=Math.min(d.w, 260)+"px";
      document.body.appendChild(g); d.ghost=g;
      d.el.classList.add("dragging"); document.body.classList.add("tdragging");
    }
    if(d.mode==="resize") document.body.classList.add("tresizing");
  }
  if(d.mode==="still") return;
  if(d.mode==="move"){
    d.ghost.style.left=(ev.clientX-Math.min(d.dx, Math.min(d.w, 260)-12))+"px"; d.ghost.style.top=(ev.clientY-Math.min(d.dy, 14))+"px";
    d.at=taskDropAt(ev.clientX, ev.clientY);
    taskDropShow(d.at);
    d.ghost.style.visibility=d.at && d.at.minute!=null ? "hidden" : "";   /* over the hours, the dashed box is enough */
  }else{
    const lo=+d.col.dataset.dropLo, hi=+d.col.dataset.dropHi;
    if(d.mode==="resize"){
      /* the task itself stretches, 15 minutes at a time, and never gets shorter than 15 minutes */
      const m=snap15(colMinute(d.col, ev.clientY));
      if(d.edge==="bot"){ d.ns=d.s; d.ne=Math.max(d.s+15, Math.min(hi, 1439, m)); }
      else{ d.ne=d.e; d.ns=Math.min(d.e-15, Math.max(lo, m)); }
      d.box.style.top=((d.ns-lo)/60*HOUR)+"px"; d.box.style.height=Math.max(24, (d.ne-d.ns)/60*HOUR-2)+"px"; d.box.style.setProperty("--h", d.box.style.height);
      if(d.b) d.b.textContent=fmtTime(hhmm(d.ns))+"–"+fmtTime(hhmm(d.ne));
    }else{
      /* picking a time: from where the mouse went down to where it is now */
      const a=colMinute(d.col, d.y), z=colMinute(d.col, ev.clientY);
      const s=Math.max(lo, Math.floor(Math.min(a, z)/15)*15), e=Math.min(hi, 1439, Math.max(s+15, Math.ceil(Math.max(a, z)/15)*15));
      d.s=s; d.e=e;
      colBox(d.col, "tg-drop", s, e, '<b>'+esc(spanText(s, e))+'</b> New task');
    }
  }
  /* near the top or bottom of the window, the page scrolls along */
  const edge=ev.clientY<(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top-h"))||90)+30 ? -14 : ev.clientY>innerHeight-36 ? 14 : 0;
  if(edge) window.scrollBy(0, edge);
});
document.addEventListener("pointerup", ev=>{ if(tdrag){ if(tdrag.on && tdrag.mode==="move") tdrag.at=taskDropAt(ev.clientX, ev.clientY); taskDragEnd(true); } });
document.addEventListener("pointercancel", ()=>taskDragEnd(false));
window.addEventListener("blur", ()=>taskDragEnd(false));
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && tdrag && tdrag.on){ ev.preventDefault(); ev.stopPropagation(); taskDragEnd(false); } }, true);
/* letting go after a drag isn't a click: the one click it makes doesn't open the task (or a new one) too */
document.addEventListener("click", ev=>{ if(tdragEnded && Date.now()-tdragEnded<400){ tdragEnded=0; ev.preventDefault(); ev.stopPropagation(); } }, true);

let photoFor=null;
$("#photoInput").addEventListener("change", async ev=>{
  const f=ev.target.files && ev.target.files[0], id=photoFor; photoFor=null;
  /* picked in the photo window: it's framed there before it's kept */
  if(PH && dialog.active && dialog.active.kind==="photo"){
    if(!f) return;
    if(!/^image\//.test(f.type||"image/")){ toast("That file isn’t a picture."); return; }
    try{ await PH.load(f); const c=$("#phCanvas"); if(c) c.focus(); }catch(err){ toast(err.message); }
    return;
  }
  if(!f || !id) return;
  try{
    const url=await readPhoto(f);
    if(setPhoto(id, url)){ const d=byId("driver", id); touch(d); save(); render(); if(sheet.open) refreshSheet(); toast("Photo saved"); }
  }catch(err){ toast(err.message || "Couldn’t use that image."); }
});
$("#importInput").addEventListener("change", ev=>{ const f=ev.target.files && ev.target.files[0]; if(f) importBackup(f); });

/* files dragged in from Windows: dropped on a drop area, they're added as documents. Anywhere
   else nothing happens, and the window never swaps the tracker for the file */
const hasFiles=ev=>!!ev.dataTransfer && [...ev.dataTransfer.types].indexOf("Files")>=0;
/* on the Documents page, a folder (in the folder list, a folder's line, the path) takes them into it */
const fileFolder=ev=>ev.target.closest && !dialog.active ? ev.target.closest("[data-fdrop]") : null;
document.addEventListener("dragover", ev=>{
  if(!hasFiles(ev)) return;
  ev.preventDefault();
  const fz=fileFolder(ev), z=ev.target.closest && !dialog.active ? ev.target.closest("[data-drop-docs]") : null;
  ev.dataTransfer.dropEffect=fz || z ? "copy" : "none";
  $$("[data-fdrop].fdrop-on").forEach(x=>{ if(x!==fz) x.classList.remove("fdrop-on"); });
  $$("[data-drop-docs].drop").forEach(x=>{ if(x!==z || fz) x.classList.remove("drop"); });
  if(fz) fz.classList.add("fdrop-on"); else if(z) z.classList.add("drop");
});
document.addEventListener("dragleave", ev=>{
  const z=ev.target.closest ? ev.target.closest("[data-drop-docs]") : null; if(z && !z.contains(ev.relatedTarget)) z.classList.remove("drop");
  const fz=ev.target.closest ? ev.target.closest("[data-fdrop]") : null; if(fz && !fz.contains(ev.relatedTarget)) fz.classList.remove("fdrop-on");
});
document.addEventListener("drop", ev=>{
  if(!hasFiles(ev)) return;
  ev.preventDefault();
  $$("[data-drop-docs].drop").forEach(x=>x.classList.remove("drop"));
  $$("[data-fdrop].fdrop-on").forEach(x=>x.classList.remove("fdrop-on"));
  const fz=fileFolder(ev), z=ev.target.closest && !dialog.active ? ev.target.closest("[data-drop-docs]") : null;
  if(!ev.dataTransfer.files.length) return;
  if(fz) addDocsDialog(ev.dataTransfer.files, "", fz.dataset.fdrop==="root" ? "" : fz.dataset.fdrop);
  else if(z) addDocsDialog(ev.dataTransfer.files, z.dataset.dropDocs);
});

/* ---------- dragging documents and folders onto folders. The page's own pointer handling, like the calendar's
   tasks (Firefox won't drag a button): a press that moves 6px becomes a drag; the ticked documents go together when
   one of them is dragged; a closed folder held over for a moment opens; near the top or bottom of the window the
   page scrolls; Escape puts it all back ---------- */
let DND=null, dndEnded=0;
function dndTarget(x, y){
  const el=document.elementFromPoint(x, y), z=el && el.closest ? el.closest("[data-fdrop]") : null;
  if(!z || !DND) return null;
  const to=z.dataset.fdrop==="root" ? "" : z.dataset.fdrop;
  if(to && !folderById(to)) return null;
  if(DND.kind==="folder"){ const f=folderById(DND.ids[0]); if(!f || folderTree(f.id).has(to) || parentOf(f)===to) return null; }
  else if(!DND.ids.some(id=>{ const d=docById(id); return d && docFolder(d)!==to; })) return null;
  return {el:z, to:to};
}
function dndStart(){
  const k=DND.kind;
  DND.ids=k==="doc" && DSEL.has(DND.id) ? [...DSEL].filter(docById) : [DND.id];
  const one=k==="doc" ? docById(DND.ids[0]) : folderById(DND.id); if(!one){ DND=null; return false; }
  const g=document.createElement("div"); g.className="dnd-ghost"; g.setAttribute("aria-hidden", "true");
  g.innerHTML=ic(k==="folder" ? "folder" : DND.ids.length>1 ? "docs" : one.kind==="image" ? "image" : "note")+'<span>'+esc(k==="doc" && DND.ids.length>1 ? plural(DND.ids.length, "document") : one.name)+'</span>';
  document.body.appendChild(g); DND.ghost=g; DND.started=true;
  document.body.classList.add("dnd");
  const sel=window.getSelection ? window.getSelection() : null; if(sel) sel.removeAllRanges();
  /* what's being moved fades where it is */
  DND.ids.forEach(i=>$$(k==="folder" ? '[data-dnd="folder:'+CSS.escape(i)+'"]' : '[data-dnd="doc:'+CSS.escape(i)+'"]').forEach(r=>r.classList.add("dnd-src")));
  return true;
}
function dndMove(x, y){
  DND.x=x; DND.y=y;
  DND.ghost.style.transform="translate("+(x+14)+"px,"+(y+12)+"px)";
  const t=dndTarget(x, y), was=DND.over;
  if(was && (!t || was.el!==t.el)){ was.el.classList.remove("fdrop-on"); clearTimeout(DND.hover); }
  if(t && (!was || was.el!==t.el)){
    t.el.classList.add("fdrop-on");
    const tg=t.el.querySelector('.ft-tg[aria-expanded="false"]');
    if(tg) DND.hover=setTimeout(()=>{
      if(!DND || !DND.started) return;
      (S.ui.docOpen||(S.ui.docOpen={}))[t.to]=true; saveView();
      const tr=$("#ftree"); if(tr) tr.innerHTML=vFolderTree();
      DND.ids.forEach(i=>$$('[data-dnd="'+DND.kind+':'+CSS.escape(i)+'"]').forEach(r=>r.classList.add("dnd-src")));
      DND.over=null; dndMove(DND.x, DND.y);
    }, 650);
  }
  DND.over=t;
  cancelAnimationFrame(DND.raf);
  const top=($("header.top") ? $("header.top").getBoundingClientRect().bottom : 90)+36, v=y<top ? -14 : y>innerHeight-36 ? 14 : 0;
  if(v) DND.raf=requestAnimationFrame(()=>{ if(!DND || !DND.started) return; window.scrollBy(0, v); dndMove(DND.x, DND.y); });
}
function dndEnd(drop){
  const d=DND; DND=null; if(!d || !d.started) return;
  clearTimeout(d.hover); cancelAnimationFrame(d.raf);
  if(d.ghost) d.ghost.remove();
  document.body.classList.remove("dnd");
  $$(".fdrop-on").forEach(x=>x.classList.remove("fdrop-on"));
  $$(".dnd-src").forEach(x=>x.classList.remove("dnd-src"));
  dndEnded=Date.now();
  if(!drop) return;
  DND=d; const t=dndTarget(d.x, d.y); DND=null;
  if(t){ if(d.kind==="folder") moveFolder(d.ids[0], t.to); else moveDocs(d.ids, t.to); }
}
document.addEventListener("pointerdown", ev=>{
  if(VIEW!=="docs" || ev.button!==0 || ev.pointerType==="touch" || dialog.active || DND) return;
  const tg=ev.target; if(!tg.closest || tg.closest("input, textarea, select, .dl-acts, .lr-ck, .ft-tg")) return;
  const r=tg.closest("[data-dnd]"); if(!r) return;
  const p=r.dataset.dnd.split(":");
  DND={kind:p[0], id:p.slice(1).join(":"), x0:ev.clientX, y0:ev.clientY, x:ev.clientX, y:ev.clientY, pid:ev.pointerId, started:false, over:null};
});
document.addEventListener("pointermove", ev=>{
  if(!DND || ev.pointerId!==DND.pid) return;
  if(!(ev.buttons & 1)){ dndEnd(false); return; }   /* let go outside the window */
  if(!DND.started){ if(Math.hypot(ev.clientX-DND.x0, ev.clientY-DND.y0)<6) return; if(!dndStart()) return; }
  ev.preventDefault();
  dndMove(ev.clientX, ev.clientY);
});
document.addEventListener("pointerup", ev=>{ if(DND && ev.pointerId===DND.pid) dndEnd(true); });
document.addEventListener("pointercancel", ()=>dndEnd(false));
/* the click a drop leaves behind doesn't open what was dragged */
document.addEventListener("click", ev=>{ if(dndEnded && Date.now()-dndEnded<400){ dndEnded=0; ev.preventDefault(); ev.stopPropagation(); } }, true);
/* Escape stops a drag; a folder's name being typed: Enter keeps it, Escape puts the old one back; F2 on a folder renames
   it, as on Windows */
document.addEventListener("keydown", ev=>{
  if(DND && DND.started && ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); dndEnd(false); return; }
  if(FRN && ev.key==="Escape" && !dialog.active && $("#frIn")){ ev.preventDefault(); ev.stopPropagation(); cancelRename(); return; }
  if(ev.target && ev.target.id==="frIn"){ if(ev.key==="Enter"){ ev.preventDefault(); commitRename(true); } return; }
  if(ev.key==="F2" && VIEW==="docs" && !dialog.active && ev.target.closest){
    const b=ev.target.closest('[data-act="folder-open"]'), id=b ? b.dataset.v : "";
    if(!id || !folderById(id)) return;
    ev.preventDefault();
    if($('.dline[data-folder="'+CSS.escape(id)+'"]')) renameFolder(id, "row"); else { openFolder(id); renameFolder(id, "head"); }
  }
}, true);
/* leaving the box keeps the name too (only that box: a name box opened meanwhile for another folder is left alone) */
document.addEventListener("focusout", ev=>{ const t=ev.target; if(t && t.id==="frIn" && FRN){ const fr=t.dataset.fr; setTimeout(()=>{ if(FRN && FRN.id===fr && document.activeElement!==$("#frIn")) commitRename(false); }, 0); } });
$("#results").addEventListener("mousedown", ev=>ev.preventDefault());

/* ---------- toast ---------- */
let toastTimer=null;
/* o.undo: an Undo button; o.action: {label, fn}, one more button; o.long: stays longer */
function toast(msg, o){
  o=o||{};
  const el=$("#toast");
  el.innerHTML='<span>'+esc(msg)+'</span>'+(o.undo?'<button type="button" data-act="undo">Undo</button>':'')
    +(o.action?'<button type="button" data-act="toast-act">'+esc(o.action.label)+'</button>':'');
  el.classList.add("on");
  toast.undo=o.undo||null; toast.action=o.action ? o.action.fn : null;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast, o.action ? 10000 : (o.undo||o.long) ? 7000 : 3500);
}
toast.undo=null; toast.action=null;
function hideToast(){ $("#toast").classList.remove("on"); toast.undo=null; toast.action=null; }

/* ---------- versions and updates (desktop app only) ----------
   The app looks for a new version on its own and downloads it quietly (main.js).
   Once it's ready, this offers it: Install now, or Later. Later installs it the next
   time the app closes. Settings > About shows the version and what changed. */
let UPD={state:"idle"}, updOffered="";   /* updOffered: the version already offered this session */
function updReady(){ return !!DESK && UPD.state==="ready"; }
/* release notes are a few lines of text; bullets and blank lines dropped */
function noteLines(t){ return String(t||"").split(/\n+/).map(s=>s.replace(/^\s*[-*•]\s*/, "").trim()).filter(Boolean); }
function whatsNew(notes){ return notes.length ? '<p class="wn-t">What’s new</p><ul class="whatsnew">'+notes.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>' : ''; }
function vUpdStatus(){
  const u=UPD, chk=t=>'<button type="button" class="btn sm" data-act="check-updates">'+ic("download")+esc(t)+'</button>';
  let line, btn="";
  if(u.state==="ready"){ line='<b>Version '+esc(u.version)+' is ready to install.</b>'; btn='<button type="button" class="btn primary sm" data-act="install-update">'+ic("download")+'Install now</button>'; }
  else if(u.state==="downloading") line='Downloading version '+esc(u.version||"")+'… '+(u.percent||0)+'%';
  else if(u.state==="checking") line='Checking for a new version…';
  else if(u.state==="error"){ line='Couldn’t check for a new version. Are you online?'; btn=chk("Try again"); }
  else if(u.state==="none"){ line='You have the newest version.'; btn=chk("Check for updates"); }
  /* the phone and web version (web.js) is the newest one each time it opens */
  else if(DESK.web) line='This is the phone and web version. It updates itself each time it opens.';
  else if(!DESK.about().packaged) line='This is a test copy, so it doesn’t look for updates.';
  else { line='New versions are checked for automatically.'; btn=chk("Check for updates"); }
  return '<div class="upd-row" id="updStatus" aria-live="polite"><span>'+line+'</span>'+btn+'</div>';
}
/* About: the version, whether a newer one is ready, what this version changed, and
   earlier versions folded away so the card stays short */
function vAbout(){
  const ab=DESK.about(), log=ab.changelog||[], cur=log.find(c=>c.version===ab.version)||log[0], older=log.filter(c=>c!==cur);
  const entry=c=>'<div class="wn"><div class="wn-h"><b>'+esc(c.version)+'</b><span class="meta">'+esc(c.date||"")+'</span></div>'
    +'<ul class="whatsnew">'+(c.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul></div>';
  return '<section class="panel" aria-labelledby="setAbout"><div class="panel-h"><h2 id="setAbout">'+ic("info")+'About</h2></div><div class="set-b">'
    +'<dl class="kv"><dt>Version</dt><dd>'+esc(ab.version)+'</dd></dl>'+vUpdStatus()
    +(cur ? '<p class="wn-t">What’s new in '+esc(cur.version)+'</p><ul class="whatsnew">'+(cur.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>' : '')
    +(older.length ? '<details class="wn-old"><summary>Earlier versions</summary>'+older.map(entry).join("")+'</details>' : '')
    +'</div></section>';
}
/* a new version finished downloading: offer it once per version, when nothing's half-done */
function offerUpdate(){
  if(!updReady() || updOffered===UPD.version) return;
  if(dialog.active || SANDBOX || isTyping(document.activeElement)){ setTimeout(offerUpdate, 5000); return; }
  updOffered=UPD.version;
  dialog({title:"New version available", kind:"update", ok:"Install now", cancel:"Later",
    body:'<p><b>Version '+esc(UPD.version)+'</b> is ready to install. You have '+esc(DESK.about().version)+'.</p>'
      +whatsNew(noteLines(UPD.notes))
      +'<p class="fhelp">Installing takes a few seconds: the app closes, updates and opens again. Your data isn’t touched. '
      +'If you choose Later, it installs the next time you close the app.</p>',
    onOk:()=>{ flush(); DESK.installUpdate(); return null; }});
}
/* the first time a new version runs: say what changed */
function showUpdated(ju){
  if(dialog.active || SANDBOX){ setTimeout(()=>showUpdated(ju), 3000); return; }
  const entry=(DESK.about().changelog||[]).find(c=>c.version===ju.to);
  dialog({title:"Updated to version "+ju.to, kind:"updated", ok:"Got it", noCancel:true,
    body:'<p>SolidWave Tracker updated itself from version '+esc(ju.from)+'.</p>'+whatsNew(entry ? entry.notes||[] : []),
    onOk:()=>null});
}
function updChanged(s){
  const wasReady=updReady();
  UPD=s||{state:"idle"};
  if(wasReady!==updReady()) renderRail();
  const el=$("#updStatus"); if(el) el.outerHTML=vUpdStatus();
  offerUpdate();
}

/* ---------- boot ---------- */
(function boot(){
  load();
  prunePhotos();
  if(DESK){
    if(CLOUD) cloudInit();
    else{ CL.error="This copy of the app is missing its online part. Install it again from the latest installer."; showGate("error"); }
    UPD=DESK.about().update || UPD;
    DESK.onUpdate(updChanged);
    const ju=DESK.justUpdated(); if(ju) setTimeout(()=>showUpdated(ju), 700);
    setTimeout(offerUpdate, 1500);
  }
  const h=location.hash.slice(1);
  VIEW=VIEWS.indexOf(h)>=0 ? h : "home";
  render();
})();
</script>
