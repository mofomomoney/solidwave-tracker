              +FE.stages.map(s=>'<option value="'+esc(s.k)+'"'+(s.k===o.to ? ' selected' : '')+'>'+esc(s.name.trim() || "Unnamed stage")+'</option>').join("")+'</select>'
            : '<span class="fe-out-n">Nothing’s in it</span>')
          +'<button type="button" class="btn sm" data-fe="keep" data-i="'+i+'">Keep it</button></li>';
      }).join("")+'</ul></div>';
  }
  return h+'<p class="fhelp fe-closed">'+esc(f.closed.name)+' is always there too, for any '+f.one+' that drops out.</p>';
}
/* draw the form again and put the keyboard back: the first of these that's there and showing */
function feRender(sels){
  const box=$("#feList"); if(!box) return;
  box.innerHTML=feHTML();
  for(const s of [].concat(sels||[])){ const el=$(s, $("#dlg")); if(el && !el.classList.contains("fe-hide")){ el.focus(); return; } }
}
function feNewStep(){ return {id:"", label:"", kind:""}; }
function feClick(ev){
  const b=ev.target.closest("[data-fe]"); if(!b || !FE) return;
  const a=b.dataset.fe, i=+b.dataset.i, j=+b.dataset.j, st=FE.stages, t=FE.t;
  if(a==="tone"){ st[i].tone=b.dataset.v; feRender('[data-fe="tone"][data-i="'+i+'"][data-v="'+b.dataset.v+'"]'); return; }
  if(a==="up" || a==="down"){
    const to=i+(a==="up" ? -1 : 1); if(to<0 || to>=st.length) return;
    st.splice(to, 0, st.splice(i, 1)[0]);
    feRender(['[data-fe="'+a+'"][data-i="'+to+'"]', "#fe_n"+to]); return;
  }
  if(a==="del"){
    if(st.length<2) return;
    const s=st.splice(i, 1)[0], next=st[i] || st[i-1];
    /* only a stage that's in use now is listed; one added in this form just goes */
    if(FLOWS[t].stages.some(x=>x.k===s.k)) FE.out.push({k:s.k, name:s.name.trim() || "Unnamed stage", n:feCount(t, s.k), to:next.k, at:i, stage:s});
    feRender(["#fe_n"+Math.min(i, st.length-1)]); return;
  }
  if(a==="keep"){
    const o=FE.out.splice(i, 1)[0]; if(!o) return;
    const at=Math.min(o.at, st.length); st.splice(at, 0, o.stage);
    feRender(["#fe_n"+at]); return;
  }
  if(a==="sadd"){ st[i].items.push(feNewStep()); feRender(["#fe_s"+i+"_"+(st[i].items.length-1)]); return; }
  if(a==="sup" || a==="sdown"){
    const it=st[i].items, to=j+(a==="sup" ? -1 : 1); if(to<0 || to>=it.length) return;
    it.splice(to, 0, it.splice(j, 1)[0]);
    feRender(['[data-fe="'+a+'"][data-i="'+i+'"][data-j="'+to+'"]', "#fe_s"+i+"_"+to]); return;
  }
  if(a==="sdel"){
    st[i].items.splice(j, 1);
    feRender(["#fe_s"+i+"_"+j, "#fe_s"+i+"_"+(j-1), '[data-fe="sadd"][data-i="'+i+'"]']); return;
  }
  if(a==="add"){
    const used=st.map(s=>s.tone), tone=(TONES.find(x=>used.indexOf(x[0])<0) || TONES[st.length%TONES.length])[0];
    st.push({k:uid("st"), name:"", tone:tone, items:[feNewStep()]});
    feRender(["#fe_n"+(st.length-1)]); return;
  }
  if(a==="reset"){
    /* the original stages; any of the owner's own that has something in it is listed, to say where it goes */
    const cur=FLOWS[t].stages;
    FE.stages=feCopy(BASE[t]);
    FE.out=cur.filter(s=>!BASE[t].some(x=>x.k===s.k)).map(s=>{
      const at=Math.min(cur.indexOf(s), BASE[t].length-1);
      return {k:s.k, name:s.name, n:feCount(t, s.k), to:BASE[t][at].k, at:at, stage:feCopy([s])[0]};
    });
    const err=$("#dlgErr"); if(err) err.textContent="";
    feRender(["#fe_n0"]);
  }
}
/* typing goes straight into the copy; nothing is drawn again, so the box keeps its place */
function feInput(ev){
  const el=ev.target; if(!FE) return;
  const ij=v=>String(v).split(":").map(Number);
  if(el.dataset.feName!=null){ FE.stages[+el.dataset.feName].name=el.value; return; }
  if(el.dataset.feStep!=null){ const [i, j]=ij(el.dataset.feStep); FE.stages[i].items[j].label=el.value; return; }
  if(el.dataset.feGate!=null){ const [i, j]=ij(el.dataset.feGate); FE.stages[i].items[j].kind=el.checked ? "gate" : ""; return; }
  if(el.dataset.feTo!=null){ FE.out[+el.dataset.feTo].to=el.value; }
}
/* Enter in a step starts the next one (it doesn't save); Enter in a stage's name goes to its first step */
function feKey(ev){
  if(ev.key!=="Enter" || !FE) return;
  const el=ev.target;
  if(el.dataset.feStep!=null){
    ev.preventDefault();
    const [i, j]=el.dataset.feStep.split(":").map(Number);
    FE.stages[i].items.splice(j+1, 0, feNewStep());
    feRender(["#fe_s"+i+"_"+(j+1)]);
  }else if(el.dataset.feName!=null){
    ev.preventDefault();
    const i=+el.dataset.feName;
    if(!FE.stages[i].items.length) FE.stages[i].items.push(feNewStep());
    feRender(["#fe_s"+i+"_0"]);
  }
}
function feSave(){
  const t=FE.t, f=FLOWS[t], st=FE.stages;
  if(!st.length) return "Keep at least one stage.";
  const seen={};
  for(let i=0; i<st.length; i++){
    const name=st[i].name.trim(), el=$("#fe_n"+i);
    if(!name){ if(el) el.focus(); return "Give every stage a name."; }
    if(seen[name.toLowerCase()]){ if(el) el.focus(); return "Two stages are called “"+name+"”. Give each its own name."; }
    seen[name.toLowerCase()]=1;
  }
  const stages=st.map((s, i)=>({k:s.k, name:s.name.trim(), tone:s.tone, items:s.items.filter(it=>it.label.trim()).map(it=>{
    const kind=it.kind==="auto" ? "auto" : it.kind==="gate" && i<st.length-1 ? "gate" : "";
    return kind ? [it.id || uid("i"), it.label.trim(), kind] : [it.id || uid("i"), it.label.trim()];
  })}));
  const keys=new Set(stages.map(s=>s.k)), before=snap();
  /* the ones in a stage that's going move to the stage picked for them, with their own extra steps */
  let moved=0;
  FE.out.forEach(o=>{
    const to=keys.has(o.to) ? o.to : stages[0].k;
    all(t).forEach(e=>{
      let ch=false;
      if(e.stage===o.k){ e.stage=to; ch=true; moved++; }
      (e.custom||[]).forEach(c=>{ if(c.stage===o.k){ c.stage=to; ch=true; } });
      if(ch) touch(e);
    });
  });
  /* back to exactly the original: nothing of the owner's is kept, so a later version's changes to them show */
  const same=JSON.stringify(stages)===JSON.stringify(BASE[t].map(s=>({k:s.k, name:s.name, tone:s.tone, items:s.items})));
  S.flows=S.flows.filter(x=>x.id!==t);
  if(!same) S.flows.push({id:t, stages:stages, updated:Date.now()});
  useFlows(S.flows); fixStages();
  if(sheet.open && sheet.type===t) sheet.view="";
  save(); render(); if(sheet.open) refreshSheet();
  return ()=>toast(capFirst(f.one)+" stages saved"+(moved ? ". "+plural(moved, f.one)+" moved" : ""), {undo:()=>restore(before)});
}

/* ============================================================
   DIALOGS
   ============================================================ */
/* ---------- a form's lists (the owner's design review, 2026-10-16: the forms' plain dropdowns had "no way to
   type"): each list in a form shows as a box like the rest, with an arrow, and opens the app's own list
   under it; a long one (stores, states, what a task is linked to) has a box to type in on top. The real
   dropdown stays in the form, hidden, so every form reads it, sets it and hears it change as before. The
   box follows it whether it's picked here, set by the form (the tutorial's "Fill it in for me"), or given
   new choices (a task's reminders once it has a time) ---------- */
let FP=null;   /* the open list: {sel, btn, pop} */
const FP_FIND=9;   /* a list this long or longer gets the box to type in */
function fpEnhance(root){
  $$("select.inp", root).forEach(sel=>{
    if(sel.dataset.fp) return;
    sel.dataset.fp="1";
    const btn=document.createElement("button");
    btn.type="button"; btn.className="inp fp-btn"; btn.id=(sel.id || "fp"+Math.random().toString(36).slice(2, 8))+"_fp";
    btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
    const k=sel.dataset.fpLabel; if(k) btn.classList.add("pick");
    btn.innerHTML=(k ? '<span class="fp-k" aria-hidden="true">'+esc(k)+'</span>' : '')+'<span class="fp-tx" id="'+btn.id+'_t"></span>'+ic("chevD", "fp-ic");
    /* its label now opens the list, and names it */
    const lab=sel.id ? document.querySelector('label[for="'+CSS.escape(sel.id)+'"]') : sel.closest("label");
    const fl=lab && $(".fl", lab);
    if(fl){ if(!fl.id) fl.id=btn.id+"_l"; btn.setAttribute("aria-labelledby", fl.id+" "+btn.id+"_t"); }
    if(lab && lab.getAttribute("for")===sel.id) lab.setAttribute("for", btn.id);
    sel.classList.add("fp-sel"); sel.tabIndex=-1; sel.setAttribute("aria-hidden", "true");
    sel.after(btn); sel._fpBtn=btn;
    const desc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value");
    Object.defineProperty(sel, "value", {configurable:true, get(){ return desc.get.call(this); }, set(v){ desc.set.call(this, v); fpSync(this); }});
    sel.addEventListener("change", ()=>fpSync(sel));
    new MutationObserver(()=>fpSync(sel)).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:["aria-label", "disabled"]});
    btn.addEventListener("click", ()=>{ if(FP && FP.sel===sel) fpClose(true); else fpOpen(sel); });
    btn.addEventListener("keydown", ev=>{ if((ev.key==="ArrowDown" || ev.key==="ArrowUp") && !(FP && FP.sel===sel)){ ev.preventDefault(); ev.stopPropagation(); fpOpen(sel); } });
    fpSync(sel);
  });
}
/* a choice that only says "nothing yet" ("—", "Pick a state…", Fill in's "Keep as is"): the box shows it greyed,
   as a hint (a "—" as "Choose…"); in the list a "—" reads "None", as on a page's Details, and a "Pick…" hint
   isn't there at all */
function fpDash(o){ return !!o && !o.value && /^[—–-]$/.test(o.text.trim()); }
function fpHint(o){ return !!o && !o.value && /…$/.test(o.text.trim()); }
function fpBlank(o){ return fpDash(o) || fpHint(o) || (!!o && !o.value && o.hasAttribute("data-ph")); }
/* the box shows what's picked; one with no label of its own (a line in Add trucks) is named by the list's own name */
function fpSync(sel){
  const btn=sel._fpBtn; if(!btn) return;
  const o=sel.options[sel.selectedIndex], blank=fpBlank(o), text=!o ? "" : fpDash(o) ? "Choose…" : o.text;
  const tx=$(".fp-tx", btn); if(tx){ tx.textContent=text; tx.classList.toggle("ph", blank); }
  btn.disabled=sel.disabled;
  if(btn.classList.contains("pick")) btn.classList.toggle("on", !!sel.value);
  const al=sel.getAttribute("aria-label");
  if(al && !btn.getAttribute("aria-labelledby")) btn.setAttribute("aria-label", al+": "+text);
}
/* how well a choice fits what's typed: starting with it first ("ks", Kansas), then with a word starting
   with it ("ka", Kansas), then the rest that have it somewhere (Alaska) */
function fitRank(text, q){
  const t=String(text).toLowerCase(), w=q.split(/\s+/)[0];
  return t.indexOf(q)===0 ? 0 : t.split(/[^a-z0-9]+/).some(x=>x.indexOf(w)===0) ? 1 : 2;
}
function fpList(sel, q){
  q=String(q||"").trim().toLowerCase();
  const words=q.split(/\s+/).filter(Boolean), hit=o=>words.every(w=>o.text.toLowerCase().indexOf(w)>=0), id=sel._fpBtn.id;
  let shown=0, more=0;
  const opts=list=>{
    let its=list.filter(o=>!o.disabled && !o.hidden && !fpHint(o) && hit(o));
    if(q) its=its.map((o, i)=>({o:o, r:fitRank(o.text, q), i:i})).sort((a, b)=>a.r-b.r || a.i-b.i).map(x=>x.o);
    const take=its.slice(0, Math.max(0, 100-shown));
    more+=its.length-take.length;
    return take.map(o=>{ const on=o.value===sel.value;
      return '<button type="button" role="option" class="pm-i fp-i" id="'+id+'_o'+(shown++)+'" data-fpv="'+esc(o.value)+'" aria-selected="'+on+'" tabindex="-1">'
        +(on ? ic("check") : '<span class="pm-sp" aria-hidden="true"></span>')+esc(fpDash(o) ? "None" : o.text)+'</button>'; }).join(""); };
  /* choices outside a group are sorted together, each group within itself */
  let h="", run=[];
  const flush=()=>{ if(run.length){ h+=opts(run); run=[]; } };
  [...sel.children].forEach(ch=>{
    if(ch.tagName!=="OPTGROUP"){ run.push(ch); return; }
    flush();
    const its=opts([...ch.children]); if(its) h+='<div role="group" aria-label="'+esc(ch.label)+'"><p class="pk-g" aria-hidden="true">'+esc(ch.label)+'</p>'+its+'</div>';
  });
  flush();
  if(!shown) h+='<p class="pk-none">Nothing matches “'+esc(q)+'”.</p>';
  if(more) h+='<p class="pk-none">'+more+' more. Type to narrow it down.</p>';
  return h;
}
function fpOpen(sel){
  fpClose(false);
  const btn=sel._fpBtn; if(!btn || btn.disabled) return;
  const lid=(btn.getAttribute("aria-labelledby")||"").split(" ")[0], lab=lid && document.getElementById(lid);
  const n=[...sel.options].filter(o=>!o.hidden).length, name=(lab ? lab.textContent.replace(/\*/g, "").trim() : sel.getAttribute("aria-label")) || "Choices";
  const pop=document.createElement("div");
  pop.className="fp-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", name);
  pop.innerHTML=(n>=FP_FIND ? '<div class="pk-find">'+ic("search")+'<input class="fp-q" type="text" placeholder="Type to find" aria-label="Type to find" autocomplete="off" spellcheck="false"></div>' : '')
    +'<div class="pk-list" role="listbox" aria-label="'+esc(name)+'">'+fpList(sel, "")+'</div>';
  (sel.closest("#dlg") || document.body).appendChild(pop);
  FP={sel:sel, btn:btn, pop:pop};
  btn.setAttribute("aria-expanded", "true");
  pop.addEventListener("click", ev=>{ const b=ev.target.closest("[data-fpv]"); if(b) fpPick(b.dataset.fpv); });
  /* typing narrows it, best fits first; the first one is lit, as the one Enter takes */
  const q=$(".fp-q", pop); if(q) q.addEventListener("input", ()=>{
    const l=$(".pk-list", pop); l.innerHTML=fpList(sel, q.value); l.scrollTop=0;
    const first=q.value.trim() && $('[role="option"]', l);
    if(first){ first.classList.add("hot"); q.setAttribute("aria-activedescendant", first.id); } else q.removeAttribute("aria-activedescendant");
    fpPlace();
  });
  fpPlace();
  const cur=$('[aria-selected="true"]', pop);
  if(q) q.focus(); else if(cur) cur.focus(); else { const f=$('[role="option"]', pop); if(f) f.focus(); }
  if(cur) cur.scrollIntoView({block:"center"});
}
/* a list under its box, as wide as the box (a narrow box's list is wider, and kept inside the form's edge),
   above the box when below is cramped; it never covers the box */
function popPlace(anchor, p){
  const r=anchor.getBoundingClientRect(), below=innerHeight-r.bottom-12, above=r.top-12, w=Math.min(Math.max(r.width, 260), innerWidth-16);
  const form=anchor.closest(".dlg"), edge=form ? form.getBoundingClientRect().right : innerWidth-8;
  p.style.left=Math.max(8, r.left+w>edge ? r.right-w : r.left)+"px"; p.style.width=w+"px";
  const h=Math.min(p.scrollHeight, 380);
  if(below>=Math.min(h, 240) || below>=above){ p.style.top=(r.bottom+4)+"px"; p.style.bottom=""; p.style.maxHeight=Math.max(150, Math.min(380, below))+"px"; }
  else{ p.style.top=""; p.style.bottom=(innerHeight-r.top+4)+"px"; p.style.maxHeight=Math.max(150, Math.min(380, above))+"px"; }
}
function fpPlace(){ if(FP) popPlace(FP.btn, FP.pop); }
function fpClose(back){
  if(!FP) return;
  const f=FP; FP=null;
  if(f.pop.parentNode) f.pop.remove();
  f.btn.setAttribute("aria-expanded", "false");
  if(back && document.contains(f.btn)) f.btn.focus({preventScroll:true});
}
/* a pick: the real list takes it and says so, so the form does what it always did ("+ Add a new store…") */
function fpPick(v){
  if(!FP) return;
  const sel=FP.sel; fpClose(true);
  if(sel.value!==v){ sel.value=v; sel.dispatchEvent(new Event("input", {bubbles:true})); sel.dispatchEvent(new Event("change", {bubbles:true})); }
}
/* keys while a form's list is open: Escape closes just the list (not the form), Tab leaves it; from the box
   to type in, Down goes into the list and Enter picks the first; Up from the top goes back to typing, and a
   letter goes back to the box to type in, or, on a short list, jumps to the next choice starting with it */
function fpKey(ev){
  if(!FP) return false;
  if(!document.contains(FP.pop)){ FP=null; return false; }
  const q=$(".fp-q", FP.pop), its=$$('[role="option"]', FP.pop), a=document.activeElement, i=its.indexOf(a);
  if(ev.key==="Escape"){ ev.preventDefault(); fpClose(true); return true; }
  if(ev.key==="Tab"){ fpClose(true); return false; }   /* back on its box, so Tab goes on to the next one */
  if(q && a===q){
    if(ev.key==="ArrowDown"){ ev.preventDefault(); if(its[0]) its[0].focus(); return true; }
    if(ev.key==="Enter"){ ev.preventDefault(); if(its[0]) fpPick(its[0].dataset.fpv); return true; }
    return true;
  }
  const n=its.length;
  if(ev.key==="ArrowUp" && i<=0 && q){ ev.preventDefault(); q.focus(); return true; }
  const to=ev.key==="ArrowDown" ? (i+1)%n : ev.key==="ArrowUp" ? (i-1+n)%n : ev.key==="Home" ? 0 : ev.key==="End" ? n-1 : -1;
  if(n && to>=0){ ev.preventDefault(); its[to].focus(); return true; }
  if(ev.key.length===1 && /\S/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    ev.preventDefault();
    if(q){ q.focus(); q.value+=ev.key; q.dispatchEvent(new Event("input")); return true; }
    const ch=ev.key.toLowerCase();
    for(let j=1; j<=n; j++){ const it=its[(i+j+n)%n]; if(it && it.textContent.trim().toLowerCase().indexOf(ch)===0){ it.focus(); break; } }
    return true;
  }
  return false;
}
/* ---------- a box with suggestions (a vendor, a company, a source, a retailer): the ones used before show in
   the app's own list under it, narrowed to what's typed, instead of the computer's own list (the owner's design
   review, 2026-10-16). A click in the box or Down shows them all; Up and Down move through them, Enter takes
   one, Escape closes just the list, and anything else can still be typed. The box's datalist stays in the page
   and holds the suggestions; the box is switched over the first time it's used ---------- */
let SG=null;   /* the open list: {inp, pop, vals, at, id} */
let sgQuiet=false;   /* a suggestion being put in the box, which mustn't open the list again */
function sgWire(inp){
  if(!inp.getAttribute("list")) return;
  inp.dataset.sg=inp.getAttribute("list"); inp.removeAttribute("list");
  inp.setAttribute("role", "combobox"); inp.setAttribute("aria-autocomplete", "list"); inp.setAttribute("aria-expanded", "false");
}
function sgOpen(inp, all){
  const dl=document.getElementById(inp.dataset.sg), typed=inp.value.trim().toLowerCase(), q=all ? "" : typed;
  let vals=dl ? [...new Set([...dl.options].map(o=>o.value.trim()).filter(Boolean))] : [];
  if(q){
    const words=q.split(/\s+/);
    vals=vals.filter(v=>v.toLowerCase()!==typed && words.every(w=>v.toLowerCase().indexOf(w)>=0))
      .map((v, i)=>({v:v, r:fitRank(v, q), i:i})).sort((a, b)=>a.r-b.r || a.i-b.i).map(x=>x.v);
  }
  vals=vals.slice(0, 50);
  if(!vals.length){ sgClose(); return; }
  if(!SG || SG.inp!==inp){
    sgClose();
    const pop=document.createElement("div"), id=(inp.id || "sg"+Math.random().toString(36).slice(2, 8))+"_sg";
    pop.className="fp-pop sg-pop";
    pop.innerHTML='<div class="pk-list" role="listbox" id="'+id+'" aria-label="Suggestions"></div>';
    (inp.closest("#dlg") || document.body).appendChild(pop);
    pop.addEventListener("mousedown", ev=>ev.preventDefault());   /* the keyboard stays in the box */
    pop.addEventListener("click", ev=>{ const o=ev.target.closest("[data-sgi]"); if(o) sgPick(+o.dataset.sgi); });
    SG={inp:inp, pop:pop, vals:[], at:-1, id:id};
    inp.setAttribute("aria-controls", id); inp.setAttribute("aria-expanded", "true");
  }
  SG.vals=vals; SG.at=-1;
  $(".pk-list", SG.pop).innerHTML=vals.map((v, i)=>'<div role="option" class="pm-i fp-i" id="'+SG.id+'_'+i+'" data-sgi="'+i+'" aria-selected="false">'+esc(v)+'</div>').join("");
  inp.removeAttribute("aria-activedescendant");
  popPlace(inp, SG.pop);
}
function sgMark(i){
  if(!SG) return;
  SG.at=i;
  $$('[role="option"]', SG.pop).forEach((o, j)=>{ o.classList.toggle("hot", j===i); o.setAttribute("aria-selected", String(j===i)); });
  const o=i>=0 && document.getElementById(SG.id+"_"+i);
  if(o){ SG.inp.setAttribute("aria-activedescendant", o.id); o.scrollIntoView({block:"nearest"}); } else SG.inp.removeAttribute("aria-activedescendant");
}
function sgClose(){
  if(!SG) return;
  const s=SG; SG=null;
  if(s.pop.parentNode) s.pop.remove();
  s.inp.setAttribute("aria-expanded", "false"); s.inp.removeAttribute("aria-activedescendant");
}
/* a suggestion taken: the box gets it and says so, as if it had been typed (a page's Details keeps it) */
function sgPick(i){
  if(!SG) return;
  const inp=SG.inp, v=SG.vals[i]; sgClose();
  if(v==null || !document.contains(inp)) return;
  inp.value=v; sgQuiet=true;
  try{ inp.dispatchEvent(new Event("input", {bubbles:true})); inp.dispatchEvent(new Event("change", {bubbles:true})); }
  finally{ sgQuiet=false; }
}
function sgKey(ev){
  const inp=ev.target;
  if(!SG){
    if(ev.key==="ArrowDown" && !ev.altKey && inp && inp.dataset && inp.dataset.sg){ ev.preventDefault(); sgOpen(inp, true); if(SG) sgMark(0); return true; }
    return false;
  }
  if(!document.contains(SG.inp)){ sgClose(); return false; }
  if(SG.inp!==inp) return false;
  const n=SG.vals.length;
  if(ev.key==="Escape"){ ev.preventDefault(); sgClose(); return true; }
  if(ev.key==="ArrowDown"){ ev.preventDefault(); sgMark((SG.at+1)%n); return true; }
  if(ev.key==="ArrowUp"){ ev.preventDefault(); sgMark(SG.at<=0 ? n-1 : SG.at-1); return true; }
  if(ev.key==="Enter" && SG.at>=0){ ev.preventDefault(); sgPick(SG.at); return true; }
  if(ev.key==="Enter" || ev.key==="Tab") sgClose();
  return false;
}
function sgEnhance(root){ $$("input[list]", root).forEach(sgWire); }
document.addEventListener("focusin", ev=>{ const t=ev.target; if(t && t.tagName==="INPUT" && t.hasAttribute("list")) sgWire(t); });
document.addEventListener("input", ev=>{ const t=ev.target; if(sgQuiet || !t || !t.dataset || !t.dataset.sg) return; if(t.value.trim()) sgOpen(t, false); else sgClose(); });
document.addEventListener("click", ev=>{ const t=ev.target; if(t && t.dataset && t.dataset.sg && document.activeElement===t && !(SG && SG.inp===t)) sgOpen(t, true); });
document.addEventListener("focusout", ev=>{ if(SG && ev.target===SG.inp) sgClose(); });

/* a press anywhere but a list or its box closes the list; a list follows its box when the form scrolls */
document.addEventListener("pointerdown", ev=>{
  if(FP && !FP.pop.contains(ev.target) && !FP.btn.contains(ev.target)) fpClose(false);
  if(SG && !SG.pop.contains(ev.target) && ev.target!==SG.inp) sgClose();
}, true);
document.addEventListener("scroll", ev=>{
  if(FP && !FP.pop.contains(ev.target)) fpPlace();
  if(SG && !SG.pop.contains(ev.target)){ if(document.contains(SG.inp)) popPlace(SG.inp, SG.pop); else sgClose(); }
}, true);
addEventListener("resize", ()=>{ if(FP) fpPlace(); if(SG) popPlace(SG.inp, SG.pop); });
function dialog(o){
  const sc=$("#dlg"), prev=document.activeElement;
  sc.innerHTML='<div class="dlg'+(o.wide?" wide":"")+(o.cls?" "+o.cls:"")+'" role="dialog" aria-modal="true" aria-labelledby="dlgT"><form id="dlgF" novalidate>'
    +'<h2 class="dlg-h" id="dlgT">'+esc(o.title)+'</h2><div class="dlg-b">'+o.body+'</div>'
    +'<div class="dlg-err" id="dlgErr" role="alert"></div>'
    +'<div class="dlg-f">'+(o.extra||"")+(o.noCancel ? '' : '<button type="button" class="btn" data-dlg="cancel">'+esc(o.cancel||"Cancel")+'</button>')
    +'<button type="submit" class="btn '+(o.danger?"danger-fill":"primary")+'">'+esc(o.ok||"Save")+'</button></div></form></div>';
  sc.classList.add("on");
  const f=$("#dlgF");
  /* its lists become the app's own (fpEnhance), and so does any list a line added later brings */
  const watch=new MutationObserver(()=>{ fpEnhance(f); sgEnhance(f); });
  const close=()=>{
    watch.disconnect(); fpClose(false); sgClose();
    sc.classList.remove("on"); sc.innerHTML=""; dialog.active=null;
    if(o.onClose) o.onClose();
    if(prev && document.contains(prev)) prev.focus({preventScroll:true});
  };
  dialog.active={close:close, kind:o.kind||""};
  f.addEventListener("submit", ev=>{
    ev.preventDefault();
    const r=o.onOk ? o.onOk(f) : null;
    if(typeof r==="string"){ $("#dlgErr").textContent=r; return; }
    close();
    if(typeof r==="function") r();
  });
  const cancelBtn=$('[data-dlg="cancel"]', sc); if(cancelBtn) cancelBtn.addEventListener("click", close);
  if(o.init) o.init(f, close);
  fpEnhance(f); sgEnhance(f); watch.observe(f, {childList:true, subtree:true});
  setTimeout(()=>{
    /* the first box to type in or pick from (a list's real dropdown is hidden: its box takes the keyboard) */
    const first=o.danger ? $('[data-dlg="cancel"]', f)
      : ([...f.querySelectorAll("input,select,textarea,.fp-btn")].find(x=>x.offsetParent!==null && !x.disabled && x.type!=="hidden") || $('button[type="submit"]', f));
    if(first) first.focus();
  }, 0);
}
dialog.active=null;
function confirmBox(ttl, text, ok, fn, danger){ dialog({title:ttl, kind:"confirm", body:'<p>'+esc(text)+'</p>', ok:ok, danger:!!danger, onOk:()=>fn}); }

/* ============================================================
   ADDRESS LOOKUP — as you type in a store's Address box, real addresses
   show up underneath to pick from. They come from OpenStreetMap's free
   search (Photon, run by Komoot): no account or key, but it needs the
   internet and each answer takes a few seconds. Results lean toward the
   city already filled in, so typing "Home Depot" finds the ones in town.
   ============================================================ */
const GEO="https://photon.komoot.io/api/";
const geoCache=new Map();
function geoFetch(params, signal){
  const url=GEO+"?"+new URLSearchParams(params);
  if(geoCache.has(url)) return Promise.resolve(geoCache.get(url));
  return fetch(url, {signal:signal}).then(r=>{ if(!r.ok) throw new Error("lookup "+r.status); return r.json(); })
    .then(j=>{ const f=(j && j.features) || []; geoCache.set(url, f); return f; });
}
function stateCodeOf(name){ const n=String(name||"").toLowerCase(), hit=STATES.find(x=>x[1].toLowerCase()===n); return hit ? hit[0] : ""; }
/* a search result as an address to pick, or null when it has no street to send a truck to */
function geoAddress(p){
  if(p.countrycode && p.countrycode!=="US") return null;
  const street=[p.housenumber, p.street].filter(Boolean).join(" ") || (p.osm_key==="highway" ? p.name||"" : "");
  if(!street) return null;
  const city=p.city || p.town || p.village || p.locality || "", st=stateCodeOf(p.state);
  const tail=[city, [st, p.postcode].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const value=[street, tail].filter(Boolean).join(", ");
  const place=p.name && p.osm_key!=="highway" && p.name!==street ? p.name : "";
  return {main:place || street, sub:place ? value : tail, value:value, city:city, state:st};
}
/* ctx.city and ctx.state are the form's City box and State menu */
function addressLookup(input, ctx){
  /* the list hangs off the dimmed backdrop, not the form: the form slides in as it opens,
     and anything inside it would slide (and be cut off at its edges) with it */
  const box=input.closest(".dlg-scrim") || input.closest(".dlg") || input.closest(".scrim"); if(!box) return;
  /* a store's page is drawn again after each change: its old list goes with the old box */
  $$(".ac-pop", box).forEach(p=>{ if(p.dataset.for===input.id) p.remove(); });
  const id=input.id+"_list", pop=document.createElement("div");
  pop.className="ac-pop"; pop.hidden=true; pop.dataset.for=input.id;
  pop.innerHTML='<ul class="ac-list" role="listbox" id="'+id+'" aria-label="Address suggestions"></ul>'
    +'<p class="ac-note" aria-live="polite"></p>'
    +'<p class="ac-src">Addresses from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> contributors</p>';
  box.appendChild(pop);
  const list=$(".ac-list", pop), note=$(".ac-note", pop), src=$(".ac-src", pop), body=input.closest(".dlg-b") || input.closest(".sh-body");
  input.setAttribute("role", "combobox"); input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-expanded", "false"); input.setAttribute("aria-controls", id);
  let items=[], active=-1, timer=0, ctl=null, near=null, nearKey="";

  /* where the store's city is, looked up once so results can lean toward it */
  function nearCity(){
    const city=ctx.city.value.trim(), st=ctx.state.value, key=city && st ? city.toLowerCase()+"|"+st : "";
    if(key!==nearKey || !near){
      nearKey=key;
      near=key ? geoFetch({q:city+", "+stateName(st), layer:"city", limit:"1"}).then(f=>f[0] ? f[0].geometry.coordinates : null).catch(()=>null)
               : Promise.resolve(null);
    }
    return near;
  }
  /* under the box when there's fair room there, above it only when below is cramped */
  function place(){
    if(pop.hidden) return;
    const r=input.getBoundingClientRect(), below=innerHeight-r.bottom-12, above=r.top-12;
    const h=Math.min(list.scrollHeight+note.offsetHeight+src.offsetHeight+4, 360);
    pop.style.left=r.left+"px"; pop.style.width=r.width+"px";
    if(below>=Math.min(h, 220) || below>=above){ pop.style.top=(r.bottom+4)+"px"; pop.style.bottom=""; pop.style.maxHeight=Math.max(120, below)+"px"; }
    else{ pop.style.top=""; pop.style.bottom=(innerHeight-r.top+4)+"px"; pop.style.maxHeight=Math.max(120, above)+"px"; }
  }
  function show(){ pop.hidden=false; input.setAttribute("aria-expanded", "true"); place(); }
  function hide(){
    clearTimeout(timer); if(ctl){ ctl.abort(); ctl=null; }
    pop.hidden=true; active=-1; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant");
  }
  function status(t){ note.textContent=t; place(); }
  function mark(){
    $$(".ac-opt", list).forEach((li, i)=>li.setAttribute("aria-selected", String(i===active)));
    if(active>=0){ input.setAttribute("aria-activedescendant", id+"_"+active); const li=document.getElementById(id+"_"+active); if(li) li.scrollIntoView({block:"nearest"}); }
    else input.removeAttribute("aria-activedescendant");
  }
  function draw(){
    list.innerHTML=items.map((a, i)=>'<li class="ac-opt" role="option" id="'+id+'_'+i+'" data-i="'+i+'" aria-selected="false">'
      +'<span class="ac-1">'+esc(a.main)+'</span>'+(a.sub ? '<span class="ac-2">'+esc(a.sub)+'</span>' : '')+'</li>').join("");
    mark(); place();
  }
  function pick(i){
    const a=items[i]; if(!a) return;
    hide();
    /* the change events save it on a store's page; a form just reads the boxes when it's sent */
    const put=(el, v)=>{ el.value=v; el.dispatchEvent(new Event("change", {bubbles:true})); };
    /* fill in the city and state too, but only when they're still empty */
    if(!ctx.city.value.trim() && a.city) put(ctx.city, a.city);
    if(!ctx.state.value && a.state) put(ctx.state, a.state);
    put(input, a.value);
  }
  async function search(){
    const text=input.value.trim();
    if(!document.contains(input) || text.length<3){ hide(); return; }
    const st=ctx.state.value, stName=st ? stateName(st) : "";
    const q=text+(stName && text.toLowerCase().indexOf(stName.toLowerCase())<0 ? ", "+stName : "");
    if(ctl) ctl.abort();
    const my=ctl=new AbortController();
    status("Looking up addresses… this can take a few seconds."); show();
    try{
      /* lean toward the city. Its spot is looked up as soon as the City box is filled,
         so it's usually ready; if not, wait for it, but not forever */
      const at=await Promise.race([nearCity(), new Promise(res=>setTimeout(()=>res(null), 6000))]);
      const params={q:q, limit:"10", lang:"en"};
      if(at){ params.lon=String(at[0]); params.lat=String(at[1]); }
      const feats=await geoFetch(params, my.signal);
      if(my!==ctl || input.value.trim()!==text) return;
      const seen=new Set(); items=[];
      for(const f of feats){
        const a=geoAddress(f.properties || {});
        if(a && !seen.has(a.value)){ seen.add(a.value); items.push(a); }
        if(items.length===6) break;
      }
      active=-1; draw();
      status(items.length ? "" : "No matches yet. Keep typing, or type the address yourself.");
    }catch(err){
      if(err.name==="AbortError" || my!==ctl) return;
      items=[]; draw();
      status("Couldn’t reach the address lookup. You can still type the address yourself.");
    }
  }

  /* start finding the city early: when the form opens, and whenever the city or state changes */
  nearCity();
  ctx.city.addEventListener("change", nearCity);
  ctx.state.addEventListener("change", nearCity);
  input.addEventListener("focus", ()=>{ nearCity(); });
  input.addEventListener("input", ()=>{
    clearTimeout(timer);
    if(input.value.trim().length<3){ hide(); return; }
    timer=setTimeout(search, 400);
  });
  input.addEventListener("keydown", ev=>{
    /* Escape closes the list first; the form only closes on a second Escape */
    if(ev.key==="Escape" && !pop.hidden){ ev.preventDefault(); ev.stopPropagation(); hide(); return; }
    if(ev.key==="ArrowDown" && pop.hidden && items.length){ ev.preventDefault(); show(); return; }
    if(pop.hidden || !items.length) return;
    const n=items.length;
    if(ev.key==="ArrowDown"){ ev.preventDefault(); active=(active+1)%n; mark(); }
    else if(ev.key==="ArrowUp"){ ev.preventDefault(); active=active<=0 ? n-1 : active-1; mark(); }
    else if(ev.key==="Enter" && active>=0){ ev.preventDefault(); pick(active); }
    else if(ev.key==="Tab") hide();
  });
  input.addEventListener("blur", ()=>setTimeout(()=>{ if(document.activeElement!==input) hide(); }, 150));
  /* clicking a suggestion keeps the cursor in the box */
  pop.addEventListener("mousedown", ev=>{ if(!ev.target.closest("a")) ev.preventDefault(); });
  list.addEventListener("click", ev=>{ const li=ev.target.closest(".ac-opt"); if(li) pick(+li.dataset.i); });
  list.addEventListener("mousemove", ev=>{ const li=ev.target.closest(".ac-opt"); if(li && +li.dataset.i!==active){ active=+li.dataset.i; mark(); } });
  /* the box's page scrolling moves the list with it (on a phone the whole record page scrolls, not its body) */
  [body, input.closest("#sheet")].forEach(s=>{ if(s) s.addEventListener("scroll", place); });
  const onResize=()=>{ if(!document.contains(input)){ removeEventListener("resize", onResize); return; } place(); };
  addEventListener("resize", onResize);
}

function lastOf(field){ for(let i=S.stores.length-1;i>=0;i--) if(S.stores[i][field]) return S.stores[i][field]; return ""; }
function storeDialog(s, after){
  const isNew=!s, d=s || {num:"", city:"", state:lastOf("state"), retailer:lastOf("retailer"), address:""};
  const opts='<option value="">Pick a state…</option>'+STATES.map(x=>'<option value="'+x[0]+'"'+(x[0]===d.state?' selected':'')+'>'+esc(x[1])+'</option>').join("");
  dialog({
    title:isNew ? "Add a store" : "Edit store #"+s.num, ok:isNew ? "Add store" : "Save", kind:isNew ? "store" : "edit-store",
    body:'<div class="two"><label class="fld" for="sd_num"><span class="fl">Store # <span class="req" aria-hidden="true">*</span></span>'
      +'<input id="sd_num" name="num" class="inp" value="'+esc(d.num)+'" autocomplete="off" required aria-required="true" placeholder="e.g. 2231"></label>'
      +'<label class="fld" for="sd_state"><span class="fl">State <span class="req" aria-hidden="true">*</span></span>'
      +'<select id="sd_state" name="state" class="inp" required aria-required="true">'+opts+'</select></label></div>'
      +'<div class="two"><label class="fld" for="sd_city"><span class="fl">City <span class="req" aria-hidden="true">*</span></span>'
      +'<input id="sd_city" name="city" class="inp" value="'+esc(d.city)+'" autocomplete="off" required aria-required="true" placeholder="e.g. Olathe"></label>'
      +'<label class="fld" for="sd_ret"><span class="fl">Retailer</span>'
      +'<input id="sd_ret" name="retailer" class="inp" value="'+esc(d.retailer||"")+'" list="dl-retailer" autocomplete="off" placeholder="e.g. Lowe’s"></label></div>'
      +'<label class="fld" for="sd_addr"><span class="fl">Address</span><input id="sd_addr" name="address" class="inp" value="'+esc(d.address||"")+'" autocomplete="off"'
      +' placeholder="Start typing a street, or the store’s name"></label>'
      +'<datalist id="dl-retailer">'+uniqVals(S.stores.map(x=>x.retailer), ["Lowe’s","Home Depot"]).map(v=>'<option value="'+esc(v)+'">').join("")+'</datalist>'
      +(isNew ? '' : '<p class="fhelp">'+plural(routesOfStore(s).length,"route")+' at this store.</p>'),
    extra:isNew ? '' : '<button type="button" class="btn danger left" data-dlg="del">'+ic("trash")+'Delete store</button>',
    init:(f, close)=>{
      const del=$('[data-dlg="del"]', f); if(del) del.addEventListener("click", ()=>{ close(); deleteStore(s); });
      addressLookup($("#sd_addr", f), {city:$("#sd_city", f), state:$("#sd_state", f)});
    },
    onOk:f=>{
      const E=f.elements, num=E.num.value.trim().replace(/^#/,""), city=E.city.value.trim(), state=E.state.value;
      if(!num){ E.num.focus(); return "Store # is required."; }
      if(!state){ E.state.focus(); return "Pick the state it’s in."; }
      if(!city){ E.city.focus(); return "City is required."; }
      if(S.stores.some(x=>x!==s && String(x.num).toLowerCase()===num.toLowerCase() && x.state===state)) return "Store #"+num+" in "+state+" is already here.";
      let target=s;
      const vals={num:num, city:city, state:state, retailer:E.retailer.value.trim(), address:E.address.value.trim()};
      if(isNew){ target=Object.assign({id:uid("s")}, vals); S.stores.push(target); } else Object.assign(s, vals);
      save(); render(); if(sheet.open) refreshSheet();
      return ()=>{
        if(after) after(target);
        else if(isNew){
          toast("Store #"+num+" added under "+stateName(state)+".");
          revealStoreCard(target);
          /* then the store's window, ready for its contacts (the tutorial stays on the card) */
          if(!TUT.on) setTimeout(()=>openSheet("store", target.id, {focusSel:'[data-act="ct-add"]'}), 120);
        }
      };
    }
  });
}
/* a deleted store takes its routes, contacts, activity and documents with it (the owner's call,
   2026-10-02). Drivers and trucks stay, just off those routes, and the drivers who went with it
   go with no store; tasks linked to the store or its routes stay on the calendar, no longer
   linked. Undo puts it all back */
function deleteStore(s){
  const rs=S.routes.filter(r=>r.storeId===s.id).sort(SORT.route), ds=S.docs.filter(d=>d.storeId===s.id);
  const keys=new Set(["store:"+s.id].concat(rs.map(r=>"route:"+r.id))), ts=S.tasks.filter(t=>keys.has(t.link));
  const names=rs.map(r=>title("route", r)), crew=rs.some(r=>r.driverId || r.truckId), tied=S.drivers.filter(d=>d.storeId===s.id);
  const goes=(rs.length>1 ? [rs.length+" routes ("+names.join(", ")+")"] : rs.length ? ["route ("+names[0]+")"] : [])
    .concat("contacts", "activity", ds.length ? [plural(ds.length, "document")] : []);
  confirmBox("Delete store #"+s.num+"?", "Its "+goes.slice(0, -1).join(", ")+" and "+goes[goes.length-1]+" go with it."
    +(crew ? " Drivers and trucks stay, just off "+(rs.length>1 ? "those routes" : "that route")+"." : "")
    +(tied.length ? " "+(tied.length>1 ? "The "+tied.length+" drivers with this store stay" : "The driver with this store stays")+", with no store." : "")
    +(ts.length ? " "+(ts.length>1 ? ts.length+" tasks linked to it stay" : "The task linked to it stays")+" on your calendar, no longer linked." : "")
    +" You can undo right after.", "Delete store", ()=>{
    const before=snap(), gone=new Set(rs.map(r=>r.id));
    S.routes=S.routes.filter(r=>!gone.has(r.id));
    /* a document only ever goes with a store that exists, and so does a driver */
    S.docs=S.docs.filter(d=>d.storeId!==s.id);
    tied.forEach(d=>{ d.storeId=""; touch(d); });
    ts.forEach(t=>{ t.link=""; touch(t); });
    S.stores.splice(S.stores.indexOf(s), 1);
    sheet.stack=sheet.stack.filter(x=>!(x.type==="store" && x.id===s.id) && !(x.type==="route" && gone.has(x.id)));
    save();
    if(sheet.open && ((sheet.type==="store" && sheet.id===s.id) || (sheet.type==="route" && gone.has(sheet.id)))){ if(sheet.stack.length) sheetBack(); else closeSheet(); }
    render(); if(sheet.open) refreshSheet();
    toast("Store #"+s.num+" deleted"+(rs.length ? ", with "+plural(rs.length, "route") : ""), {undo:()=>restore(before)});
  }, true);
}

/* State box for a new driver or truck. It starts on the route's state when
   added from a route, or on the state the board is filtered to, so the new
   card lands where the user is looking */
function newStateField(id, link){
  const r=link && link.routeId ? byId("route", link.routeId) : null, s=link && link.storeId ? storeById(link.storeId) : null;
  const f=stateFilter();

/* names in order from the first one typed: "T-06" goes on as T-07, T-08…, "1" as 2, 3…, skipping
   any already taken; a name with no number at the end goes on as -2, -3… */
function seqNames(first, n, taken){
  const out=[], m=/^(.*?)(\d+)$/.exec(first);
  for(let k=m ? +m[2] : 1; out.length<n && k<1000000; k++){
    const nm=m ? m[1]+String(k).padStart(m[2].length, "0") : k===1 ? first : first+"-"+k;
    if(!taken.has(nm.toUpperCase())) out.push(nm);
  }
  return out;
}
/* route numbers only have to differ within a store (or among the routes with no store yet) */
function routeNames(first, n, storeId){
  return seqNames(first, n, new Set(S.routes.filter(r=>!isClosed(r) && (r.storeId||"")===(storeId||"")).map(r=>String(r.num||"").trim().toUpperCase())));
}
/* the next route number at a store: one past the route given, or past the highest number there; 1 if none */
function nextRouteNum(storeId, after){
  const m=/^(.*?)(\d+)$/.exec(String(after||"").trim());
  if(m) return routeNames(m[1]+String(+m[2]+1).padStart(m[2].length, "0"), 1, storeId)[0];
  const nums=S.routes.filter(r=>!isClosed(r) && (r.storeId||"")===(storeId||"")).map(r=>/^(.*?)(\d+)$/.exec(String(r.num||"").trim())).filter(Boolean);
  if(!nums.length) return routeNames("1", 1, storeId)[0];
  const top=nums.reduce((a,b)=>+b[2]>+a[2] ? b : a);
  return routeNames(top[1]+String(+top[2]+1).padStart(top[2].length, "0"), 1, storeId)[0];
}
/* routes are set up several at a time, often before the stores are known (the owner, 2026-10-14:
   "7 routes but don't know the stores yet… make route 1-7"): how many, numbered on from the first,
   at a store or with none yet. Duplicating a route opens the same form, filled in from it: copies
   keep its store, company, pay and schedule; driver, truck and checklist start fresh. Added from a
   driver's or truck's page it's just the one, which they go on */
function routesDialog(link, startAt, startName, src){

      +'<input id="nr_num" name="num" class="inp" autocomplete="off" required aria-required="true" value="'+esc(nextRouteNum(store0, src ? src.num : ""))+'" aria-describedby="nrSum"></label>'
      +'</div>'

      +'<input id="nr_co" name="company" class="inp" list="dl-nco" autocomplete="off" placeholder="e.g. J.B. Hunt" value="'+esc(src ? src.company||"" : "")+'"></label>'
      +'<datalist id="dl-nco">'+uniqVals(S.routes.map(r=>r.company), ["J.B. Hunt"]).map(v=>'<option value="'+esc(v)+'">').join("")+'</datalist>'

      +'<label class="fld" for="nr_rate"><span class="fl">Rate offered</span><span class="money"><input id="nr_rate" name="rate" class="inp" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(p.rate||"")+'"></span></label></div>'

    init:f=>{

        if(ev && ev.target===E.store && !touched) E.num.value=nextRouteNum(E.store.value, src && E.store.value===store0 ? src.num : "");

/* new routes show up on the Routes list: its filters let them through, and their rows flash */
function showNewRoutes(made){
  const u=LU("route"), s=storeOf(made[0]);
  if(u.stage && !made.some(r=>r.stage===u.stage)) u.stage="";
  u.q="";
  if(stateFilter() && (!s || s.state!==stateFilter())) S.ui.stateFilter="";
  made.forEach(r=>FRESH.add(r.id)); setTimeout(()=>FRESH.clear(), 1800);

/* the lines in an add-several form: + adds one (and goes to it), x takes one away, and every
   change relabels them (tidy also sets the Add button's count) */
function manyLines(f, make, tidy){
  const box=$("#mLines", f), ok=$('button[type="submit"]', f), lines=()=>$$(".mline", box);
  const redo=()=>{
    const ls=lines(), hd=$(".mhead", f);
    ls.forEach((l, i)=>{ const d=$("[data-line-del]", l); d.hidden=ls.length<2; d.setAttribute("aria-label", "Remove line "+(i+1)); });
    box.classList.toggle("one", ls.length<2); if(hd) hd.classList.toggle("one", ls.length<2);
    tidy(ls, ok);
  };
  f.addEventListener("input", redo); f.addEventListener("change", redo);
  box.addEventListener("click", ev=>{
    const d=ev.target.closest("[data-line-del]"); if(!d) return;
    const l=d.closest(".mline"), next=l.nextElementSibling||l.previousElementSibling;
    l.remove(); redo(); if(next) $("input", next).focus();
  });
  const more=$("#mMore", f);
  if(more) more.addEventListener("click", ()=>{ const ls=lines(); box.insertAdjacentHTML("beforeend", make(ls[ls.length-1])); redo(); $("input", lines().pop()).focus(); });
  redo();
}
function setId(el, id){ if(id) el.id=id; else el.removeAttribute("id"); }

/* unit names, starting from the one typed: "T-06" goes on as T-07, T-08…, skipping any name already
   used (by a returned truck too); a name with no number at the end goes on as -2, -3… */
function unitNames(first, n){ return seqNames(first, n, new Set(S.trucks.map(x=>String(x.unit||"").trim().toUpperCase()))); }
/* what the next truck is called: one past the highest number in the naming the newest truck uses */
function nextUnit(){
  const named=S.trucks.map(x=>({x:x, m:/^(.*?)(\d+)$/.exec(String(x.unit||"").trim())})).filter(o=>o.m);
  if(!named.length) return unitNames("T-01", 1)[0];
  const pre=named.reduce((a,b)=>(b.x.created||0)>=(a.x.created||0) ? b : a).m[1];
  const top=named.filter(o=>o.m[1].toUpperCase()===pre.toUpperCase()).reduce((a,b)=>+b.m[2]>+a.m[2] ? b : a);
  return unitNames(pre+String(+top.m[2]+1).padStart(top.m[2].length, "0"), 1)[0];
}
/* trucks are sourced several at a time, from more than one vendor (the owner, 2026-10-14): one line
   per vendor with how many, what kind, and the monthly rent if there's a quote; they're named in

    +mf("Rent", '<span class="money"><input class="inp" name="rent" inputmode="decimal" autocomplete="off" placeholder="0"></span>')

  dialog({title:onRoute ? "Add a truck" : "Add trucks", ok:"Add truck", kind:"new-truck", cls:"many",

      +newStateField("nt_state", link)+'</div>'
      +'<div class="two"><label class="fld" for="nt_per"><span class="fl">Rent is</span><select id="nt_per" name="rentPer" class="inp">'+RENT_PER.map(o=>'<option value="'+o[0]+'">'+capFirst(o[1])+'</option>').join("")+'</select></label></div>'
      +'<p class="fhelp" id="mSum" aria-live="polite"></p>'
      +'<datalist id="dl-nven">'+uniqVals(S.trucks.map(x=>x.vendor), ["Penske","Ryder","Enterprise Truck Rental","Owned"]).map(v=>'<option value="'+esc(v)+'">').join("")+'</datalist>',
    /* another vendor's line starts on the same kind of truck as the line above it */
    init:f=>manyLines(f, last=>line({config:last ? $('[name="config"]', last).value : ""}), (ls, ok)=>{
      ls.forEach((l, i)=>{

      });
      const total=ls.reduce((n, l)=>n+count(l), 0), first=f.elements.unit.value.trim().toUpperCase()||nextUnit();

      const per=f.elements.rentPer.value, cost=x=>Object.assign(x.rent ? {monthly:x.rent, per:per} : {}, x.mile ? {mile:x.mile} : {});

        else toast(span+" added", {undo:()=>restore(before)});
      };
    }});
}

/* ============================================================
   MONEY — what should come in and go out, week by week and store by store,
   next to what really did (the owner, 2026-10-16: "a left bar money tab… select
   a store and see how much was expected to come in. Then… go over the actual
   financials for the week and see what day what money came in or any unexpected
   costs and compare… it's going to be A HUGE part of this app"; built from the
   five pictures they approved).
   Expected comes from what the app already knows: each running route's rate and
   days, its driver's pay, its truck's rent, fuel guess and insurance, and its
   trailer's rent. What happened is what's put in here: the days a route didn't
   run, the money that came in (each company's payments, matched to the week they
   pay for, and sign-on bonus thirds), and costs. A real amount for a planned cost
   (driver pay, fuel, insurance, rent) replaces its estimate for that week; any
   other cost is a surprise. A week that's over can be locked: its numbers are
   kept as they were, so changing a rate or pay later doesn't rewrite it.
   Records: "money" (what came in and what was spent), "week" (days a route
   didn't run, and a locked week's numbers), "payer" (a company's payment terms).
   Versions before 1.14 don't know them and leave them alone.
   ============================================================ */
const COST_TYPES=[["driver","Driver pay",1],["fuel","Fuel",1],["insurance","Insurance",1],["truckRent","Truck rent",1],["trailerRent","Trailer rent",1],
  ["repair","Repair",0],["tolls","Tolls",0],["ticket","Ticket",0],["claim","Damage claim",0],["advance","Driver advance",0],["other","Other",0]];
const PLAN_TYPES=["driver","fuel","insurance","truckRent","trailerRent"];
const MN_KEYS=["in","driver","fuel","insurance","truckRent","trailerRent"];
const MN_OUT=["driver","fuel","insurance","truckRent","trailerRent"];
const PAID_WITH=["Company card","Bank transfer","Check","Cash","Taken out of pay","Not paid yet"];
const WDAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MNC=null;   /* each week's numbers, worked out once until the data changes */
const MN_ALL={pay:false, costs:false};   /* "Show all" on the long lists, for this visit */

function costLabel(k){ const c=COST_TYPES.find(x=>x[0]===k); return c ? c[1] : "Other"; }
function isPlanType(k){ return PLAN_TYPES.indexOf(k)>=0; }
function usd(n){ const r=Math.round(+n||0); return (r<0 ? "−" : "")+money(Math.abs(r)); }
function usdSigned(n){ const r=Math.round(+n||0); return (r<0 ? "−" : "+")+money(Math.abs(r)); }
function rentText(a, per){ const n=num(a); return n ? usd(n)+(PER_SHORT[per]||"/mo") : ""; }
/* an amount a day, a week or a month, as a week (a day counts the days it works) or a month */
function perWeek(a, per, days){ const n=num(a); return !n ? 0 : per==="week" ? n : per==="day" ? n*(days||6) : n*12/52; }
function perMonth(a, per, days){ return perWeek(a, per, days)*52/12; }
function mondayOf(iso){ const d=parseISO(iso); return d ? addDays(iso, -((d.getDay()+6)%7)) : ""; }
function weekRange(mon, last){
  const end=addDays(mon, last==null ? 5 : last), a=parseISO(mon), b=parseISO(end);
  return fmtDay(mon, {month:"short", day:"numeric"})+" – "+(a.getMonth()===b.getMonth() ? b.getDate() : fmtDay(end, {month:"short", day:"numeric"}))+", "+b.getFullYear();
}
function longDay(iso){ return fmtDay(iso, {weekday:"long"}); }

/* ---------- this computer's settings for the tab ---------- */
function MU(){
  const u=S.ui.money=S.ui.money && typeof S.ui.money==="object" ? S.ui.money : {};
  ["tab","week","store","payer","span","at","type","show","fc","fcView","routes"].forEach(k=>{ if(typeof u[k]!=="string") u[k]=""; });
  if(["week","pay","costs","reports","forecast"].indexOf(u.tab)<0) u.tab="week";
  if(u.fcView!=="compare") u.fcView="";
  if(u.routes!=="coming") u.routes="";
  if(!Array.isArray(u.fcCmp)) u.fcCmp=[];
  if(["week","month","year"].indexOf(u.span)<0) u.span="month";
  if(["all","plan","surprise"].indexOf(u.show)<0) u.show="all";
  if(u.store && !storeById(u.store)) u.store="";
  return u;
}
function moneyFilter(){ const u=MU(); return {store:u.store, payer:u.payer}; }
function moneyWeek(){ const u=MU(); return mondayOf(u.week || todayISO()); }
function moneyPeriod(){
  const u=MU(), at=u.at || todayISO(), d=parseISO(at);
  if(u.span==="week"){ const m=mondayOf(at); return {from:m, to:addDays(m, 6), label:"Week of "+weekRange(m)}; }
  if(u.span==="year"){ const y=d.getFullYear(); return {from:y+"-01-01", to:y+"-12-31", label:String(y)}; }
  return {from:isoOf(new Date(d.getFullYear(), d.getMonth(), 1)), to:isoOf(new Date(d.getFullYear(), d.getMonth()+1, 0)), label:d.toLocaleDateString("en-US", {month:"long", year:"numeric"})};
}
function moveMoneyPeriod(n){
  const u=MU();
  if(!n){ u.at=""; return; }
  const at=u.at || todayISO(), d=parseISO(at);
  u.at=u.span==="week" ? addDays(mondayOf(at), 7*n) : u.span==="year" ? (d.getFullYear()+n)+"-01-01" : isoOf(new Date(d.getFullYear(), d.getMonth()+n, 1));
}

/* ---------- routes, drivers, trucks and the companies that pay ---------- */
function runKey(){ const s=FLOWS.route.stages; return s[s.length-1].k; }
function routeDaysN(r){ const n=Math.round(num(r.days)); return n>=1 && n<=7 ? n : 6; }
function routeDayRate(r){ const n=routeDaysN(r); return weeklyRoute(Object.assign({}, r, {days:String(n)}))/n; }
function routeFrom(r){ return r.start || (r.created ? isoOf(new Date(r.created)) : ""); }
/* a driver's pay for one day on a route (per hour or per mile can't be worked out ahead: 0) */
function driverDayPay(d, r){
  if(!d) return 0;
  const p=d.pay||{}, rate=num(p.rate); if(!rate) return 0;
  switch(p.basis||"day"){ case "day": case "route": return rate; case "week": return rate/routeDaysN(r); case "stop": return rate*num(r.stops); default: return 0; }
}
function payerKey(n){ return String(n||"").trim().toLowerCase(); }
function payerRec(n){ const k=payerKey(n); return k ? S.payers.find(p=>payerKey(p.name)===k)||null : null; }
function payerTerms(n){
  const p=payerRec(n)||{}, int=(v, d)=>{ const x=parseInt(v, 10); return isFinite(x) ? x : d; };
  return {name:String(p.name||n||"").trim(), payDay:int(p.payDay, 5), lag:int(p.lag, 1), hold:int(p.hold, 0), start:p.start||"", bonus:num(p.bonus), deducts:p.deducts==="yes"};
}
/* every company that pays: the ones named on routes, and any with terms saved; [key, name] */
function payerNames(){
  const m=new Map();
  S.routes.forEach(r=>{ const k=payerKey(r.company); if(k && !m.has(k)) m.set(k, String(r.company).trim()); });
  S.payers.forEach(p=>{ const k=payerKey(p.name); if(k && !m.has(k)) m.set(k, String(p.name).trim()); });
  return [...m.entries()].sort((a, b)=>natural(a[1], b[1]));
}
function payerName(pk){ const hit=payerNames().find(x=>x[0]===pk); return hit ? hit[1] : pk; }
function firstRunStart(pk){ const run=runKey(); return S.routes.filter(r=>r.stage===run && payerKey(r.company)===pk).map(routeFrom).filter(Boolean).sort()[0] || ""; }
/* a route that isn't running yet but is on its way: won (accepted or being set up) and with a start date. Money
   counts these too when asked (Routes: Running and coming, on the Week and Reports tabs), from that date */
function comingRoute(r){ return !!r && !isClosed(r) && r.stage!==runKey() && !earlyRoute(r) && !!parseISO(r.start); }
function mnComing(){ const u=MU(); return u.routes==="coming" && (u.tab==="week" || u.tab==="reports"); }

/* ---------- a week's numbers ---------- */
/* what a route was set to earn and cost in a week (these are what a locked week keeps); one that's only coming
   counts from today on (notBefore), never in days gone by */
function routeFacts(r, mon, notBefore){
  const sun=addDays(mon, 6), from=routeFrom(r);
  if(from && from>sun) return null;
  const n=routeDaysN(r), dates=[0,1,2,3,4,5,6].slice(0, n).map(i=>addDays(mon, i)).filter(iso=>(!from || iso>=from) && (!notBefore || iso>=notBefore));
  if(!dates.length) return null;
  const d=byId("driver", r.driverId), tk=byId("truck", r.truckId), tl=tk ? trailerOf(tk) : null, c=tk ? tk.cost||{} : {};
  return {route:r.id, num:String(r.num||""), store:r.storeId||"", payer:String(r.company||"").trim(), rate:routeDayRate(r), dates:dates, n:n,
    driver:d ? d.id : "", driverName:d ? d.name : "", driverDay:driverDayPay(d, r), driverBasis:d ? ((d.pay||{}).basis||"day") : "",
    truck:tk ? tk.id : "", unit:tk ? title("truck", tk) : "", truckVendor:tk ? String(tk.vendor||"").trim() : "",
    fuelDay:num(c.fuel), insWeek:perWeek(c.ins, c.insPer, n), rentWeek:perWeek(c.monthly, c.per, n),
    trailer:tl ? tl.id : "", trailerNum:tl ? tl.num : "", trailerVendor:tl ? String(tl.vendor||"").trim() : "", trailerWeek:tl ? perWeek(tl.rent, tl.rentPer, n) : 0};
}
function liveWeek(mon, coming){
  const run=runKey(), sun=addDays(mon, 6), today=todayISO();
  const routes=S.routes.filter(r=>r.stage===run).sort(SORT.route).map(r=>routeFacts(r, mon)).filter(Boolean);
  if(coming) S.routes.filter(comingRoute).sort(SORT.route).forEach(r=>{
    const f=routeFacts(r, mon, today); if(f) routes.push(Object.assign(f, {coming:true, stageName:stageOf("route", r.stage).name, start:r.start}));
  });
  /* trucks and trailers on rent but on no running route still cost money: they count in "All stores" */
  const used=new Set(routes.map(f=>f.truck).filter(Boolean)), usedTl=new Set(routes.map(f=>f.trailer).filter(Boolean)), idle=[];
  S.trucks.forEach(t=>{
    if(used.has(t.id) || isClosed(t) || !truckOnRent(t)) return;
    const from=t.pickup || (t.created ? isoOf(new Date(t.created)) : ""); if(from && from>sun) return;
    const c=t.cost||{}, rent=perWeek(c.monthly, c.per, 6), ins=perWeek(c.ins, c.insPer, 6);
    if(rent || ins) idle.push({kind:"truck", id:t.id, label:title("truck", t), vendor:String(t.vendor||"").trim(), rentWeek:rent, insWeek:ins, trailerWeek:0});
  });
  S.trailers.forEach(x=>{
    if(usedTl.has(x.id)) return;
    const from=x.created ? isoOf(new Date(x.created)) : ""; if(from && from>sun) return;
    const rent=perWeek(x.rent, x.rentPer, 6);
    if(rent) idle.push({kind:"trailer", id:x.id, label:x.num, vendor:String(x.vendor||"").trim(), rentWeek:0, insWeek:0, trailerWeek:rent});
  });
  return {routes:routes, idle:idle};
}
function weekId(mon){ return "wk"+mon; }
function weekRec(mon){ const id=weekId(mon); return S.weeks.find(w=>w.id===id)||null; }
function dayOff(mon, rid, iso){ const w=weekRec(mon); return (w && w.off && w.off[rid] && w.off[rid][iso]) || ""; }
function weekOf(mon, make){
  let w=weekRec(mon);
  if(!w && make){ w={id:weekId(mon), mon:mon, off:{}, locked:null, created:Date.now(), updated:Date.now()}; S.weeks.push(w); }
  return w;
}
/* a cost's place: a route, truck, trailer, driver or store; null when it goes with the whole company */
function costRows(e, rows){
  if(e.routeId) return rows.filter(r=>r.f.route===e.routeId);
  if(e.truckId) return rows.filter(r=>r.f.truck===e.truckId);
  if(e.trailerId) return rows.filter(r=>r.f.trailer===e.trailerId);
  if(e.driverId) return rows.filter(r=>r.f.driver===e.driverId);
  if(e.storeId) return rows.filter(r=>r.f.store===e.storeId);
  return null;
}
/* each route's days that week, planned and as they went, with the costs entered for it placed in */
function ledger(mon, coming){
  if(!MNC) MNC=new Map();
  const key=(coming ? "c" : "")+mon;
  if(MNC.has(key)) return MNC.get(key);
  const sun=addDays(mon, 6), w=weekRec(mon), data=w && w.locked ? w.locked : liveWeek(mon, !!coming);
  const L={mon:mon, sun:sun, locked:!!(w && w.locked), coming:!!coming && !(w && w.locked), rows:[], idle:[], surprise:[], loose:[], recorded:{}};
  (data.routes||[]).forEach(f=>{
    const days={}, nd=f.dates.length||1;
    f.dates.forEach(iso=>{
      const why=dayOff(mon, f.route, iso), ran=!why;
      const plan={in:f.rate, driver:f.driverDay, fuel:f.fuelDay, insurance:f.insWeek/nd, truckRent:f.rentWeek/nd, trailerRent:f.trailerWeek/nd};
      const est={in:ran ? f.rate : 0, driver:ran ? f.driverDay : 0, fuel:ran ? f.fuelDay : 0, insurance:plan.insurance, truckRent:plan.truckRent, trailerRent:plan.trailerRent};
      days[iso]={why:why, plan:plan, est:est, act:Object.assign({}, est)};
    });
    L.rows.push({f:f, days:days});
  });
  (data.idle||[]).forEach(it=>{ const est={truckRent:it.rentWeek||0, insurance:it.insWeek||0, trailerRent:it.trailerWeek||0}; L.idle.push({it:it, est:est, act:Object.assign({}, est), zero:{}}); });
  const costs=S.money.filter(e=>e.kind==="cost");
  PLAN_TYPES.forEach(tp=>{
    const mine=costs.filter(e=>e.type===tp && (e.week || mondayOf(e.date))===mon);
    L.recorded[tp]=mine;
    if(!mine.length) return;
    const covered=new Set(), specific=[], wide=[];
    mine.forEach(e=>{
      const t=costRows(e, L.rows);
      if(t===null) wide.push(e);
      else if(t.length){ specific.push([e, t]); t.forEach(r=>covered.add(r)); }
      else{
        /* a truck or trailer that wasn't on a route that week */
        const ix=L.idle.find(x=>(e.truckId && x.it.kind==="truck" && x.it.id===e.truckId) || (e.trailerId && x.it.kind==="trailer" && x.it.id===e.trailerId));
        if(ix){ if(!ix.zero[tp]){ ix.act[tp]=0; ix.zero[tp]=1; } ix.act[tp]+=num(e.amount); } else L.loose.push(e);
      }
    });
    const rest=L.rows.filter(r=>!covered.has(r));
    const zero=rows=>rows.forEach(r=>Object.values(r.days).forEach(c=>{ c.act[tp]=0; }));
    zero([...covered]); if(wide.length && rest.length) zero(rest);
    /* the real amount goes where its estimate was: across those routes' days, the way the estimate was */
    const spread=(amt, rows)=>{
      const cells=[]; rows.forEach(r=>Object.values(r.days).forEach(c=>cells.push(c)));
      if(!cells.length) return false;
      const base=cells.reduce((n, c)=>n+c.est[tp], 0);
      cells.forEach(c=>{ c.act[tp]+=base>0 ? amt*c.est[tp]/base : amt/cells.length; });
      return true;
    };
    specific.forEach(([e, t])=>spread(num(e.amount), t));
    wide.forEach(e=>{ if(!rest.length || !spread(num(e.amount), rest)) L.loose.push(e); });
  });
  costs.filter(e=>!isPlanType(e.type) && e.date>=mon && e.date<=sun).forEach(e=>L.surprise.push({e:e, rows:costRows(e, L.rows)}));
  MNC.set(key, L);
  return L;
}
/* the numbers for some routes (a store, a company, or all of them) over the days from..to of one week */
function tally(L, flt, from, to){
  from=from && from>L.mon ? from : L.mon; to=to && to<L.sun ? to : L.sun;
  const ok=r=>(!flt.store || r.f.store===flt.store) && (!flt.payer || payerKey(r.f.payer)===flt.payer);
  const whole=!flt.store && !flt.payer;
  const T={plan:{}, act:{}, est:{}, day:{}, routes:[], surprise:[], offs:[], idle:0, idlePlan:0, loose:0, unplaced:0, recorded:L.recorded};
  const add=(o, k, v)=>{ if(v) o[k]=(o[k]||0)+v; };
  const dayOf=iso=>T.day[iso] || (T.day[iso]={plan:{}, act:{}});
  let earnedAll=0, earnedHere=0;
  L.rows.forEach(r=>{ const e=Object.values(r.days).reduce((n, c)=>n+c.act.in, 0); earnedAll+=e; if(ok(r)) earnedHere+=e; });
  L.rows.forEach(r=>{
    if(!ok(r)) return;
    const R={f:r.f, ran:0, sched:0, plan:{}, act:{}, surprise:0};
    Object.keys(r.days).forEach(iso=>{
      if(iso<from || iso>to) return;
      const c=r.days[iso];
      R.sched++; if(c.why) T.offs.push({f:r.f, iso:iso, why:c.why, c:c}); else R.ran++;
      MN_KEYS.forEach(k=>{ add(R.plan, k, c.plan[k]); add(R.act, k, c.act[k]); add(T.plan, k, c.plan[k]); add(T.act, k, c.act[k]); add(T.est, k, c.est[k]); add(dayOf(iso).plan, k, c.plan[k]); add(dayOf(iso).act, k, c.act[k]); });
      add(T.plan, "truckRent|"+r.f.truckVendor, c.plan.truckRent); add(T.act, "truckRent|"+r.f.truckVendor, c.act.truckRent);
      add(T.plan, "trailerRent|"+r.f.trailerVendor, c.plan.trailerRent); add(T.act, "trailerRent|"+r.f.trailerVendor, c.act.trailerRent);
    });
    if(R.sched) T.routes.push(R);
  });
  if(whole){
    const ds=[0,1,2,3,4,5].map(i=>addDays(L.mon, i)).filter(iso=>iso>=from && iso<=to), frac=ds.length/6;
    if(frac) L.idle.forEach(x=>{
      ["truckRent","insurance","trailerRent"].forEach(k=>{
        const p=(x.est[k]||0)*frac, a=(x.act[k]||0)*frac;
        add(T.plan, k, p); add(T.act, k, a); add(T.est, k, (x.est[k]||0)*frac); T.idlePlan+=p; T.idle+=a;
        if(k!=="insurance"){ add(T.plan, k+"|"+x.it.vendor, p); add(T.act, k+"|"+x.it.vendor, a); }
      });
    });
    L.loose.forEach(e=>{ if(e.date>=from && e.date<=to){ const a=num(e.amount); add(T.act, e.type, a); T.loose+=a; } });
  }
  L.surprise.forEach(s=>{
    const e=s.e; if(e.date<from || e.date>to) return;
    const share=s.rows===null ? (whole ? 1 : earnedAll ? earnedHere/earnedAll : 0) : !s.rows.length ? (whole ? 1 : 0) : s.rows.filter(ok).length/s.rows.length;
    if(!share) return;
    const amt=num(e.amount)*share;
    add(T.act, "surprise", amt); add(T.act, "s|"+e.type, amt); add(dayOf(e.date).act, "surprise", amt);
    T.surprise.push({e:e, amt:amt});
    const rows=s.rows===null ? T.routes : s.rows.length ? T.routes.filter(R=>s.rows.some(r=>r.f.route===R.f.route)) : [];
    if(!rows.length){ T.unplaced+=amt; return; }
    const base=rows.reduce((n, R)=>n+(R.act.in||0), 0);
    rows.forEach(R=>{ R.surprise+=s.rows===null && base ? amt*(R.act.in||0)/base : amt/rows.length; });
  });
  T.planIn=T.plan.in||0; T.actIn=T.act.in||0;
  T.planOut=MN_OUT.reduce((n, k)=>n+(T.plan[k]||0), 0);
  T.actOut=MN_OUT.reduce((n, k)=>n+(T.act[k]||0), 0)+(T.act.surprise||0);
  T.routes.forEach(R=>{ R.in=R.act.in||0; R.out=MN_OUT.reduce((n, k)=>n+(R.act[k]||0), 0)+R.surprise; R.left=R.in-R.out; });
  /* the routes that are only coming, when they're counted */
  const soon=T.routes.filter(R=>R.f.coming);
  T.soon={n:soon.length, in:soon.reduce((n, R)=>n+R.in, 0), out:soon.reduce((n, R)=>n+R.out, 0)};
  return T;
}
/* the same over any days (a month, a year), week by week */
function tallyRange(from, to, flt, coming){
  const out={plan:{}, act:{}, est:{}, day:{}, routes:new Map(), surprise:[], offs:[], idle:0, idlePlan:0, loose:0, unplaced:0, weeks:[]};
  const sum=(a, b)=>Object.keys(b).forEach(k=>{ a[k]=(a[k]||0)+b[k]; });
  for(let m=mondayOf(from); m<=to; m=addDays(m, 7)){
    const T=tally(ledger(m, coming), flt, from, to);
    sum(out.plan, T.plan); sum(out.act, T.act); sum(out.est, T.est);
    Object.keys(T.day).forEach(iso=>{ out.day[iso]=T.day[iso]; });
    T.routes.forEach(R=>{
      const x=out.routes.get(R.f.route) || {f:R.f, ran:0, sched:0, in:0, out:0, left:0, surprise:0, weeks:0, plan:{}, act:{}};
      x.f=R.f; x.ran+=R.ran; x.sched+=R.sched; x.in+=R.in; x.out+=R.out; x.left+=R.left; x.surprise+=R.surprise; x.weeks++; sum(x.plan, R.plan); sum(x.act, R.act);
      out.routes.set(R.f.route, x);
    });
    out.surprise=out.surprise.concat(T.surprise); out.offs=out.offs.concat(T.offs);
    out.idle+=T.idle; out.idlePlan+=T.idlePlan; out.loose+=T.loose; out.unplaced+=T.unplaced;
    out.weeks.push({mon:m, T:T});
  }
  const soon=[...out.routes.values()].filter(x=>x.f.coming);
  out.soon={n:soon.length, in:soon.reduce((n, x)=>n+x.in, 0), out:soon.reduce((n, x)=>n+x.out, 0)};
  out.planIn=out.plan.in||0; out.actIn=out.act.in||0;
  out.planOut=MN_OUT.reduce((n, k)=>n+(out.plan[k]||0), 0);
  out.actOut=MN_OUT.reduce((n, k)=>n+(out.act[k]||0), 0)+(out.act.surprise||0);
  return out;
}

/* ---------- pay days: what each company should pay, and when, against what came in ---------- */
function sumIn(key){ const list=S.money.filter(e=>e.kind==="in" && e.forKey===key); return {list:list, amt:list.reduce((n, e)=>n+num(e.amount), 0)}; }
function nextPayDay(iso, off){ const d=addDays(mondayOf(iso), off); return d>=iso ? d : addDays(d, 7); }
/* what a company should pay for a week: what its routes earned, less the rent for its own trucks and trailers
   when it takes that out */
function payExpected(T, t, pk){
  let exp=T.actIn;
  if(t.deducts) Object.keys(T.act).forEach(k=>{ const v=k.split("|"); if(v.length===2 && (v[0]==="truckRent" || v[0]==="trailerRent") && v[1] && payerKey(v[1]).indexOf(pk)>=0) exp-=T.act[k]; });
  return Math.round(exp*100)/100;
}
function paySchedule(pk){
  const name=payerName(pk), t=payerTerms(name), first=t.start || firstRunStart(pk), today=todayISO();
  const P={pk:pk, name:name, t:t, items:[], first:first};
  if(!first) return P;
  const off=(t.payDay+6)%7, start=mondayOf(first), stop=addDays(today, 21);
  let worked=0;   /* weeks with work in them: the first ones are the ones held */
  for(let m=start, i=0; i<520; m=addDays(m, 7), i++){
    const date=addDays(m, 7*t.lag+off);
    if(date>stop) break;
    const T=tally(ledger(m), {payer:pk}), p=sumIn("pay:"+pk+":"+m), exp=payExpected(T, t, pk);
    if(!T.routes.length && !p.amt) continue;   /* a week before any route started: nothing to pay */
    const rates=[...new Set(T.routes.map(R=>Math.round(R.f.rate*100)))];
    P.items.push({kind:"pay", key:"pay:"+pk+":"+m, mon:m, date:date, expected:Math.round(exp*100)/100, paid:p.amt, entries:p.list, held:worked<t.hold,
      ran:T.routes.reduce((n, R)=>n+R.ran, 0), rate:rates.length===1 ? rates[0]/100 : 0});
    worked++;
  }
  if(t.bonus>0){
    const third=Math.floor(t.bonus/3*100)/100, groups=new Map();
    S.drivers.forEach(d=>{
      if(!d.bonusApproved || !S.routes.some(r=>r.driverId===d.id && payerKey(r.company)===pk)) return;
      [1,2,3].forEach(k=>{
        const due=addDays(d.bonusApproved, 30*k), date=nextPayDay(due, off), amt=k<3 ? third : Math.round((t.bonus-2*third)*100)/100;
        const g=groups.get(date) || {kind:"bonus", key:"bonus:"+pk+":"+date, date:date, expected:0, drivers:[], lost:[], thirds:new Set()};
        if(isClosed(d) && date>today) g.lost.push({d:d, k:k, amt:amt}); else { g.expected+=amt; g.drivers.push({d:d, k:k, amt:amt}); g.thirds.add(k); }
        groups.set(date, g);
      });
    });
    groups.forEach(g=>{ const p=sumIn(g.key); g.paid=p.amt; g.entries=p.list; g.expected=Math.round(g.expected*100)/100; if(g.drivers.length) P.items.push(g); });
  }
  if(t.hold>0){
    const held=P.items.filter(x=>x.kind==="pay" && x.held), p=sumIn("held:"+pk);
    if(held.length) P.items.push({kind:"held", key:"held:"+pk, date:"", expected:Math.round(held.reduce((n, x)=>n+x.expected, 0)*100)/100, paid:p.amt, entries:p.list, weeks:held.length});
  }
  P.items.sort((a, b)=>(a.date||"9999").localeCompare(b.date||"9999") || (a.kind==="pay" ? -1 : 1));
  return P;
}
function payItemFor(it){
  if(it.kind==="pay") return "Week of "+weekRange(it.mon);
  if(it.kind==="held") return "The held "+(it.weeks===1 ? "week" : it.weeks+" weeks")+", paid back";
  const ks=[...it.thirds], which=ks.length===1 ? ["first","second","last"][ks[0]-1]+" third" : "thirds";
  return "Sign-on bonus, "+which+" · "+plural(it.drivers.length, "driver");
}
function payStatus(it, P){
  const today=todayISO(), diff=it.paid-it.expected;
  if(it.kind==="pay" && it.held) return {cls:"held", icon:"clock", text:"Held by "+P.name};
  if(it.kind==="held") return it.paid && diff>-1 ? {cls:"ok", icon:"checkCircle", text:"Paid back"} : it.paid ? {cls:"bad", icon:"alert", text:usd(-diff)+" still held"} : {cls:"held", icon:"clock", text:"Ask when it comes back"};
  if(!it.paid) return it.date>today ? {cls:"due", icon:"", text:daysUntil(it.date)<=6 ? "Due "+longDay(it.date) : "Due"} : {cls:"bad", icon:"alert", text:"Not paid yet"};
  if(Math.abs(diff)<1) return {cls:"ok", icon:"checkCircle", text:"Matches"};
  if(diff<0){
    const n=it.rate ? Math.round(-diff/it.rate) : 0, days=n && Math.abs(-diff-n*it.rate)<1;
    return {cls:"bad", icon:"alert", text:usd(-diff)+" short"+(days ? ": "+plural(n, "day")+" of pay. "+P.name+" paid for "+(it.ran-n)+", you have "+it.ran : "")};
  }
  return {cls:"more", icon:"info", text:usd(diff)+" more than expected"};
}
function termsText(t){
  const lag=t.lag===0 ? "the same week" : t.lag===1 ? "a week after each week" : t.lag+" weeks after each week";
  return ["Pays "+WDAY[t.payDay]+"s, "+lag, t.hold ? "holds the first "+plural(t.hold, "week") : "", t.bonus ? "sign-on bonus "+usd(t.bonus)+" a driver" : "", t.deducts ? "takes the rent for their own trucks and trailers out" : ""].filter(Boolean).join(" · ");
}

/* the reasons the week came out different from expected, and the payment for it */
function mnWeekDiff(L, T, flt){
  const items=[], today=todayISO(), whole=!flt.store && !flt.payer;
  const li=(cls, icon, html)=>items.push('<li class="'+cls+'">'+ic(icon)+'<span>'+html+'</span></li>');
  /* routes that are only coming, counted from their start dates */
  const soonR=T.routes.filter(R=>R.f.coming);
  if(soonR.length){
    const one=soonR.length===1, f0=soonR[0].f, late=soonR.some(R=>R.f.start<today);
    li("i", "info", '<b>'+(one ? "Route "+esc(f0.num)+" isn’t running yet" : soonR.length+" routes aren’t running yet")+'</b> ('+esc(one ? f0.stageName : listNums(soonR.map(R=>R.f.num)))+'). '
      +(one ? (late ? "Its start date, "+esc(fmtDay(f0.start, {month:"short", day:"numeric"}))+", has passed: it’s counted from today" : "It’s counted from its start date, "+esc(fmtDay(f0.start, {weekday:"long", month:"short", day:"numeric"})))
        : "They’re counted from their start dates"+(late ? ", or from today where that has passed" : ""))
      +'. <button type="button" class="hlink" data-act="mn-routes" data-v="">Count only running routes</button>');
  }
  /* days that didn't run: a whole day off for every route, or a route's call-offs */
  const byDay=new Map(); T.offs.forEach(o=>{ if(!byDay.has(o.iso)) byDay.set(o.iso, []); byDay.get(o.iso).push(o); });
  const closedDays=[...byDay.keys()].filter(iso=>byDay.get(iso).length===T.routes.filter(R=>R.f.dates.indexOf(iso)>=0).length && byDay.get(iso).every(o=>o.why==="closed")).sort();
  closedDays.forEach(iso=>{ const os=byDay.get(iso); li("x", "xCircle", '<b>No routes '+esc(longDay(iso))+'</b> (closed): '+usd(os.reduce((n, o)=>n+o.c.plan.in, 0))+' less in.'); });
  const byRoute=new Map(); T.offs.filter(o=>closedDays.indexOf(o.iso)<0).forEach(o=>{ if(!byRoute.has(o.f.route)) byRoute.set(o.f.route, []); byRoute.get(o.f.route).push(o); });
  byRoute.forEach(os=>{
    const f=os[0].f, saved=os.reduce((n, o)=>n+o.c.plan.driver+o.c.plan.fuel, 0), inn=os.reduce((n, o)=>n+o.c.plan.in, 0);
    const when=os.map(o=>longDay(o.iso)).join(" and "), why=os.every(o=>o.why==="closed") ? "closed" : f.driverName ? shortName({name:f.driverName})+" called off" : "called off";
    li("x", "xCircle", '<b>Route '+esc(f.num)+' didn’t run '+esc(when)+'</b>: '+esc(why)+'. '+usd(inn)+' less in'+(saved ? ', '+usd(saved)+' less driver pay and fuel' : '')+'.');
  });
  T.surprise.forEach(s=>{
    const e=s.e, wh=goesWithText(e);
    li("w", "alert", '<b>'+esc(costLabel(e.type)+(wh ? " · "+wh : "")+" "+longDay(e.date))+'</b>, not planned: '+usd(s.amt)+(e.paidTo ? ' to '+esc(e.paidTo) : '')+'.'
      +' <button type="button" class="hlink" data-act="mn-entry" data-v="'+e.id+'">Open it</button>'+(e.docId && docById(e.docId) ? '<button type="button" class="hlink" data-act="doc-view" data-v="'+e.docId+'">See the receipt</button>' : ''));
  });
  PLAN_TYPES.forEach(tp=>{
    if(!(L.recorded[tp]||[]).length) return;
    const d=(T.act[tp]||0)-(T.est[tp]||0);
    if(Math.abs(d)<1) li("k", "checkCircle", '<b>'+esc(costLabel(tp))+'</b> came in as expected.');
    else li("w", "alert", '<b>'+esc(costLabel(tp))+' came in '+usd(Math.abs(d))+(d>0 ? " over" : " under")+'</b> the guess for the week.');

    let it=P.items.find(x=>x.kind==="pay" && x.mon===L.mon);
    /* counting the routes that are coming: what the company would pay for this week with them in */
    if(soonHere && (!it || (!it.paid && !it.held && it.date>today))){
      const off=(P.t.payDay+6)%7, first=P.first || T.routes.filter(R=>R.f.coming && payerKey(R.f.payer)===pk).map(R=>R.f.start).sort()[0], idx=first ? weeksBetween(mondayOf(first), L.mon) : 0;
      it={kind:"pay", key:"", mon:L.mon, date:addDays(L.mon, 7*P.t.lag+off), expected:payExpected(tally(L, {payer:pk}), P.t, pk), paid:0, held:!P.first && idx>=0 && idx<P.t.hold};
    }

    else if(!it.paid) li(it.date>today ? "i" : "x", it.date>today ? "calendar" : "alert", it.date>today ? nm+' pays for this week on '+esc(fmtDay(it.date, {weekday:"long", month:"short", day:"numeric"}))+': '+usd(it.expected)+' expected.'
      : '<b>'+nm+' hasn’t paid for this week</b>: it was due '+esc(fmtDay(it.date, {weekday:"long", month:"short", day:"numeric"}))+'. <button type="button" class="hlink" data-act="mn-pay" data-v="'+esc(it.key)+'">Put in what came</button>');
    else li(st.cls==="ok" ? "k" : st.cls==="bad" ? "x" : "i", st.icon || "info", '<b>'+nm+' paid '+usd(it.paid)+'</b> for this week: '+esc(st.cls==="ok" ? "it matches." : st.text+"."));
  });
  if(addDays(L.mon, 6)<today && !L.locked) li("i", "lock", 'This week is over. Lock it so changing a rate or pay later doesn’t change it. <button type="button" class="hlink" data-act="mn-lock">Lock this week</button>');
  /* what's missing for the numbers to be right */
  const noRate=T.routes.filter(R=>!R.f.rate), noPay=T.routes.filter(R=>R.f.driver && !R.f.driverDay), noFuel=T.routes.filter(R=>R.f.truck && !R.f.fuelDay), noTruck=T.routes.filter(R=>!R.f.truck);
  if(noRate.length) li("i", "info", 'No rate on '+esc(noRate.map(R=>"route "+R.f.num).join(", "))+': put its pay on its page (Details, Pay).');
  if(noPay.length) li("i", "info", 'No day pay for '+esc(noPay.map(R=>shortName({name:R.f.driverName})).join(", "))+': put it on the driver’s page (Details, Pay) as a day or route rate.');
  if(noFuel.length) li("i", "info", 'No fuel guess for '+esc([...new Set(noFuel.map(R=>R.f.unit))].join(", "))+': put one on the truck’s page (Details, Cost).');
  if(noTruck.length) li("i", "info", plural(noTruck.length, "route")+' with no truck, so no truck costs: '+esc(noTruck.map(R=>R.f.num).join(", "))+'.');
  const noDrv=T.routes.filter(R=>!R.f.driver);
  if(noDrv.length) li("i", "info", plural(noDrv.length, "route")+' with no driver, so no driver pay: '+esc(listNums(noDrv.map(R=>R.f.num)))+'.');
  if(!items.length) li("k", "checkCircle", 'Everything went as expected.');
  return '<section class="ovb slate mw-diff"><div class="ovb-h"><span class="ovb-i" aria-hidden="true">'+ic("flag")+'</span><h3>What’s different from expected</h3></div><ul>'+items.join("")+'</ul></section>';
}

function surCounts(sur){
