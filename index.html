/* ---------- states, for the filter on the three boards ----------
   A route's state is its store's. A driver or truck is in the states of
   the routes it's on, plus the state on its own page (for the ones not on
   a route yet); a driver is also in the state of the store they're with.
   With a state picked, anything that has no state at all still shows,
   flagged "No state yet", so nothing quietly disappears. */
function statesOf(t, e){
  const out=new Set();
  if(t==="route"){ const s=storeOf(e); if(s && s.state) out.add(s.state); return out; }
  if(e.state) out.add(e.state);
  if(t==="driver"){ const s=storeById(e.storeId); if(s && s.state) out.add(s.state); }
  (t==="driver" ? routesOfDriver(e) : routesOfTruck(e)).forEach(r=>{ const s=storeOf(r); if(s && s.state) out.add(s.state); });
  return out;
}
function stateFilter(){ return S.ui.stateFilter || ""; }   /* "" all · "__none" no state yet · "KS" a state */
function passesState(t, e){
  const f=stateFilter(); if(!f) return true;
  const st=statesOf(t, e);
  return f==="__none" ? st.size===0 : (st.has(f) || st.size===0);
}
function knownStates(){
  const set=new Set();
  S.stores.forEach(s=>{ if(s.state) set.add(s.state); });
  S.drivers.concat(S.trucks).forEach(e=>{ if(e.state) set.add(e.state); });
  return Array.from(set).sort((a,b)=>stateName(a).localeCompare(stateName(b)));
}
/* stores in board order: by state name, then store number; no store goes last */
function cmpStores(a, b){
  if(!a || !b) return (a ? 0 : 1)-(b ? 0 : 1);
  return stateName(a.state).localeCompare(stateName(b.state)) || natural(a.num, b.num);
}
/* prev / next in a page window step through what the board is showing:
   routes go store by store (the Routes tab is laid out by store),
   drivers and trucks go column by column */
function boardOrder(t){
  if(t==="store"){
    const f=stateFilter(), shown=f && VIEW==="routes" ? S.stores.filter(s=>s.state===f) : S.stores;
    return (shown.some(s=>s.id===sheet.id) ? shown : S.stores).slice().sort(cmpStores);
  }
  /* a driver or truck opened from its list steps through the list as it's shown: group by group */
  if(t!=="route" && TAB_TYPE[VIEW]===t && listMode(t)){
    const shown=listGroups(t, listShown(t, listBase(t))).reduce((a, g)=>a.concat(g.list), []);
    if(!sheet.open || shown.some(e=>e.id===sheet.id)) return shown;
  }
  let list=all(t);
  if(stateFilter() && TAB_TYPE[VIEW]===t){
    const shown=list.filter(e=>passesState(t, e));
    if(!sheet.open || shown.some(e=>e.id===sheet.id)) list=shown;
  }
  const cmp = t==="route" ? (a,b)=>cmpStores(storeOf(a), storeOf(b)) || SORT.route(a,b)
                          : (a,b)=>(stageRank(t,a)-stageRank(t,b)) || SORT[t](a,b);
  return list.slice().sort(cmp);
}
function itemsFor(t, e, k){
  const st=FLOWS[t].stages.find(s=>s.k===k);
  const base=(st ? st.items : []).map(a=>({id:a[0], label:a[1], kind:a[2]||""}));
  const cust=(e.custom||[]).filter(c=>c.stage===k).map(c=>({id:c.id, label:c.label, kind:"custom"}));
  return base.concat(cust);
}
function isDone(t, e, it){
  if(it.kind==="auto") return !!(AUTO[it.id] && AUTO[it.id](e));
  return !!(e.checks && e.checks[it.id]);
}
function progress(t, e){
  let n=0, d=0;
  FLOWS[t].stages.forEach(s=>itemsFor(t,e,s.k).forEach(it=>{ n++; if(isDone(t,e,it)) d++; }));
  return {done:d, total:n, pct:n ? Math.round(d/n*100) : 0};
}
/* paperwork that runs out: flagged 30 days ahead, red once it's past */
function expiries(t, e){
  const out=[];
  if(isClosed(e)) return out;
  const add=(label, iso)=>{
    const n=daysUntil(iso); if(n==null) return;
    if(n<0) out.push({label:label, iso:iso, n:n, level:"bad", text:label+" expired "+fmtDate(iso)});
    else if(n<=30) out.push({label:label, iso:iso, n:n, level:"warn",
      text:label+" expires "+(n===0 ? "today" : n===1 ? "tomorrow" : "in "+n+" days")});
  };
  if(t==="driver"){ const c=e.cdl||{}; add("CDL", c.exp); add("Medical card", c.med); }
  if(t==="truck"){ add("Registration", e.regExp); add("Inspection", e.inspExp); }
  return out;
}

/* ============================================================
   PERSISTENCE — one key for the data, one key per driver photo, so
   photos never bloat the save that runs on every keystroke
   ============================================================ */
let saveTimer=null, saveBroken=false;
/* true while the tutorial runs: nothing is written to storage, so the
   practice copy can never overwrite the real list */
let SANDBOX=false;
function migrate(d){
  const b=blank();
  if(!d || typeof d!=="object") return b;
  for(const k in b) if(d[k]==null) d[k]=b[k];
  ["stores","routes","drivers","trucks","trailers","money","weeks","payers","scenarios","docs","folders","tasks"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.trailers.forEach(x=>{ if(!x.id) x.id=uid("tl"); ["num","kind","vin","plate","plateState","regExp","inspExp","notes","truckId","vendor","rent","rentPer"].forEach(k=>{ if(typeof x[k]!=="string") x[k]=x[k]==null ? "" : String(x[k]); }); });
  d.money.forEach(x=>{ if(!x.id) x.id=uid("m"); ["kind","type","amount","date","week","payer","forKey","routeId","truckId","trailerId","driverId","storeId","paidTo","paidWith","note","docId"].forEach(k=>{ if(typeof x[k]!=="string") x[k]=x[k]==null ? "" : String(x[k]); }); if(x.kind!=="in") x.kind="cost"; });
  d.weeks.forEach(x=>{ if(!x.id && x.mon) x.id="wk"+x.mon; if(!x.off || typeof x.off!=="object") x.off={}; if(!x.locked || typeof x.locked!=="object") x.locked=null; });
  d.payers.forEach(x=>{ if(!x.id) x.id=uid("py"); ["name","payDay","lag","hold","start","bonus","deducts"].forEach(k=>{ if(typeof x[k]!=="string") x[k]=x[k]==null ? "" : String(x[k]); }); });
  d.scenarios.forEach(x=>{ if(!x.id) x.id=uid("sc"); ["name","payer","payDay","lag","hold","bonus","start","real"].forEach(k=>{ if(typeof x[k]!=="string") x[k]=x[k]==null ? "" : String(x[k]); });
    x.lines=(Array.isArray(x.lines) ? x.lines : []).filter(l=>l && typeof l==="object");
    x.lines.forEach(l=>{ if(!l.id) l.id=uid("fl"); ["kind","n","rate","days","driver","truck","truckPer","trailer","trailerPer","fuel","ins"].forEach(k=>{ if(typeof l[k]!=="string") l[k]=l[k]==null ? "" : String(l[k]); }); });
    if(!x.lines.length) x.lines.push(fcLine()); });
  d.tasks.forEach(x=>{ if(!x.id) x.id=uid("k"); if(!x.done || typeof x.done!=="object") x.done={}; });
  d.docs.forEach(x=>{ if(!x.id) x.id=uid("d"); x.tags=Array.isArray(x.tags) ? x.tags : []; if(!x.kind) x.kind=docKindOf(x.ext ? "x."+x.ext : "", x.mime); if(typeof x.folderId!=="string") x.folderId=""; });
  d.folders.forEach(x=>{ if(!x.id) x.id=uid("fo"); x.name=String(x.name==null ? "" : x.name).trim() || "New folder"; if(typeof x.parentId!=="string") x.parentId=""; if(typeof x.of!=="string") x.of=""; x.auto=!!x.auto; });
  d.flows=(Array.isArray(d.flows) ? d.flows : []).map(cleanFlow).filter(Boolean);
  d.ui=Object.assign(b.ui, d.ui||{});
  ["showClosed","secClosed"].forEach(k=>{ if(!d.ui[k] || typeof d.ui[k]!=="object") d.ui[k]={}; });
  delete d.ui.openStates; delete d.ui.openStores;   /* Home's old State › Store › Route map */
  TYPES.forEach(t=>d[LIST[t]].forEach(e=>{
    if(!e.id) e.id=uid(t[0]);
    e.checks=e.checks||{};
    e.custom=Array.isArray(e.custom) ? e.custom : [];
    e.log=Array.isArray(e.log) ? e.log : [];
    /* there used to be a Notes box as well as Activity: what was typed there becomes a note
       in Activity. Its id and time come from the item, so every computer turns it into the same entry */
    if(typeof e.notes==="string" && e.notes.trim()){
      const text=e.notes.trim(), at=e.updated||e.created||Date.now();
      if(!e.log.some(x=>x.type==="note" && x.text===text)) e.log.push({id:"ln"+e.id+"-"+at.toString(36), t:at, type:"note", text:text});
    }
    delete e.notes;
    if(!e.stage || (e.stage!=="closed" && !FLOWS[t].stages.some(s=>s.k===e.stage))) e.stage=FLOWS[t].stages[0].k;
    e.pay=e.pay||{};
    if(t==="driver") e.cdl=e.cdl||{};
    if(t==="truck") e.cost=e.cost||{};
  }));
  d.stores.forEach(s=>{
    if(!s.id) s.id=uid("s");
    s.contacts=Array.isArray(s.contacts) ? s.contacts : [];
    s.log=Array.isArray(s.log) ? s.log : [];
  });
  return d;
}
function load(){
  /* the desktop app starts empty; the data comes from the online account (see CLOUD) */
  if(DESK){ S=migrate(null); loadView(); return; }
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(err){ d=null; }
  /* the stages first, so a record in one of the owner's own stages is read as being in it */
  useFlows(d && d.flows);
  S=migrate(d);
}

  return JSON.stringify({app:"project-tracker", v:1, saved:new Date().toISOString(), data:S, photos:photos});

function save(){ MNC=null; if(SANDBOX) return; clearTimeout(saveTimer); saveTimer=setTimeout(flush, 180); }
function flush(){
  clearTimeout(saveTimer); saveTimer=null;
  if(SANDBOX) return;
  if(DESK){ cloudFlush(); return; }
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    if(saveBroken){ saveBroken=false; toast("Saving works again."); }
  }catch(err){
    if(!saveBroken){ saveBroken=true; toast("Couldn’t save: this browser’s storage is full. Export a backup from Settings.", {long:true}); }
  }
}
addEventListener("pagehide", ()=>{ if(saveTimer) flush(); });
addEventListener("beforeunload", ()=>{ if(saveTimer) flush(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && saveTimer) flush(); });

const PHOTOS={};
function photoOf(id){
  if(DESK) return PHOTOS[id] || "";   /* the desktop app read every photo from the data file at start */
  if(!(id in PHOTOS)){ try{ PHOTOS[id]=localStorage.getItem(PHOTO_PREFIX+id)||""; }catch(err){ PHOTOS[id]=""; } }
  return PHOTOS[id];
}
function setPhoto(id, url){
  if(SANDBOX){ PHOTOS[id]=url||""; return true; }   /* practice photos live in memory only */
  if(DESK){ if(url) PHOTOS[id]=url; else delete PHOTOS[id]; save(); return true; }
  try{
    if(url) localStorage.setItem(PHOTO_PREFIX+id, url); else localStorage.removeItem(PHOTO_PREFIX+id);
    PHOTOS[id]=url||"";
    return true;
  }catch(err){ toast("Couldn’t save the photo: this browser’s storage is full."); return false; }
}
/* ============================================================
   CLOUD (desktop app): the data lives online, in Firebase project "project-tractor".
   - Each person signs in once per computer, with an email and password.
   - Every store, route, driver and truck is its own record under the signed-in person
     (users/{uid}/records/{type}_{id}, holding the item as JSON text), so changes from
     two computers merge item by item. Driver photos (users/{uid}/photos/{driverId})
     and the company name (users/{uid}/meta/app) are records too.
   - Firebase keeps a copy on this computer, so the app works offline and catches up.
   - cloudFlush() sends what changed here. What changed elsewhere waits in CL.remote
     until nobody is mid-edit, then applyRemote() takes it in. CL.shadow holds each
     record as the cloud last had it, which is how the two are told apart.
   - The database's rules let each person read and change only their own records.
   The settings below are public by design: they say which database, not who may use it.
   ============================================================ */

/* where each kind of record lives in the data (stores, documents, tasks and the owner's stages sit
   beside the three boards). Versions before 1.10 don't know "flow" records, so they leave them be */
function listKey(t){ return t==="store" ? "stores" : t==="doc" ? "docs" : t==="folder" ? "folders" : t==="task" ? "tasks" : t==="flow" ? "flows" : t==="trailer" ? "trailers" : t==="money" ? "money" : t==="week" ? "weeks" : t==="payer" ? "payers" : t==="scenario" ? "scenarios" : LIST[t]; }
/* fill in anything a record from an older version of the app left out */
function fixRecord(t, e){ const d={}, k=listKey(t); d[k]=[e]; migrate(d); return d[k][0]||null; }

/* ---------- signing in ---------- */
function cloudInit(){
  try{
    const app=FB.initializeApp(FIREBASE_CONFIG);
    CL.auth=FB.initializeAuth(app, {persistence:[FB.indexedDBLocalPersistence, FB.browserLocalPersistence]});
    CL.db=FB.initializeFirestore(app, {localCache:FB.persistentLocalCache({tabManager:FB.persistentSingleTabManager()})});
  }catch(err){
    CL.error="The online part of the app didn’t start ("+((err && err.message)||err)+"). Close the app and open it again.";
    showGate("error"); return;
  }
  gateWire();
  showGate("loading");
  FB.onAuthStateChanged(CL.auth, user=>{
    if(CL.user && (!user || user.uid!==CL.user.uid)) stopSync();
    /* a new account that hasn't clicked its email link yet waits on "Confirm your email" */
    if(user && !CL.user && mustConfirm(user)){ CL.pending=user; showGate("confirm"); checkConfirmed(false); return; }
    CL.pending=null; stopConfirmWatch();
    if(user && !CL.user) startSync(user);
    if(!user){ CL.mode="in"; showGate("signin"); }
  });
  addEventListener("online", ()=>{ cloudStatus(); toast("Back online. Your changes are going up now."); });
  addEventListener("offline", ()=>{ cloudStatus(); toast("You’re offline. Keep working: changes are kept on this computer and go online when you’re back.", {long:true}); });
}

/* ---------- confirming the email (new accounts) ----------
   Creating an account sends an email with a link (Firebase sends it, from noreply@ the project's
   firebaseapp.com address; its wording is set in the Firebase console, under Authentication >
   Templates). Until the link is clicked the app shows "Confirm your email" instead of the data,
   checking every few seconds so it moves on by itself. Accounts made before this came in
   (October 4, 2026) carry on as they were, so nobody already using the app is locked out. */
const CONFIRM_SINCE=Date.parse("2026-10-04T00:00:00Z");
let confirmTimer=null, confirmSent=0;
function mustConfirm(user){
  const made=Date.parse((user && user.metadata && user.metadata.creationTime) || "");
  return !!user && !user.emailVerified && made>=CONFIRM_SINCE;
}
function confirmCard(){
  const u=CL.pending||{};
  return '<div class="gate-card">'
    +gateLogo()
    +'<h1>Confirm your email</h1>'
    +'<p class="gate-sub">We emailed a link to <b>'+esc(u.email||"your email address")+'</b>. Click it to confirm the address is yours, and this screen moves on by itself.</p>'
    +'<p class="gate-msg" id="gMsg" role="alert"></p>'
    +'<button type="button" class="btn primary gate-go" data-gate="confirmed">I’ve clicked the link</button>'
    +'<div class="gate-links"><button type="button" class="linkbtn" data-gate="resend">Send the email again</button>'
    +'<button type="button" class="linkbtn" data-gate="signout">Use a different email</button></div>'
    +'<p class="fhelp">Not there? Check Junk or Spam for an email from <span class="gate-from">noreply@'+esc(FIREBASE_CONFIG.authDomain)+'</span>.</p></div>';
}
/* has the link been clicked? (by hand: the button, which says so if not yet) */
async function checkConfirmed(byHand){
  const u=CL.pending; if(!u) return false;
  try{ await FB.reload(u, byHand); }
  catch(err){ if(byHand) gateMsg(navigator.onLine ? "Couldn’t check just now. Try again in a moment." : "You’re offline. Connect to the internet, then try again."); return false; }
  if(CL.pending!==u) return false;
  if(u.emailVerified){ stopConfirmWatch(); CL.pending=null; if(!CL.user) startSync(u); return true; }
  if(byHand) gateMsg("Not confirmed yet. Click the link in the email first. It can take a minute to arrive.");
  return false;
}
function startConfirmWatch(){ stopConfirmWatch(); confirmTimer=setInterval(()=>{ if(!document.hidden && navigator.onLine) checkConfirmed(false); }, 4000); }
function stopConfirmWatch(){ clearInterval(confirmTimer); confirmTimer=null; }
async function sendConfirm(u, again){
  if(again && Date.now()-confirmSent<60000){ gateMsg("It was sent a moment ago. Give it a minute, and check Junk or Spam too."); return; }
  try{
    await FB.sendEmailVerification(u); confirmSent=Date.now();
    if(again) gateMsg("Sent again to "+u.email+". It can take a minute or two to arrive.", true);
  }catch(err){
    gateMsg(/too-many-requests/.test((err && err.code)||"") ? "Too many emails sent. Wait a few minutes, then try again."
      : navigator.onLine ? "Couldn’t send the email just now. Try “Send the email again” in a moment." : "You’re offline. Connect to the internet, then send the email again.");
  }
}

/* a password box with an eye button that shows or hides what's typed */
function pwField(id, label, autocomplete, extra){

/* while making an account: say whether the two passwords match. A match shows right away;
   a mismatch waits until the second box has been left once, so nobody is told they're
   wrong halfway through typing (left: called as a box loses focus) */
function showMatch(left){
  const a=$("#gPass"), b=$("#gPass2"), m=$("#gMatch"); if(!a || !b || !m) return;
  if(left && b.value) b.dataset.left="1";
  const same=b.value!=="" && a.value===b.value, bad=!!b.value && !same && b.dataset.left==="1";
  m.innerHTML=same ? ic("check")+"The passwords match." : bad ? "The passwords don’t match. Type the password the same way in both lines." : esc(MATCH_HELP);
  m.classList.toggle("ok", same); m.classList.toggle("bad", bad);
  b.setAttribute("aria-invalid", bad ? "true" : "false");
}
/* what a sign-in problem means, in plain words */
function authWords(err){
  const c=(err && err.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "That email and password don’t match. Check them, or choose Forgot password.";
  if(/invalid-email|missing-email/.test(c)) return "That doesn’t look like an email address.";
  if(/email-already-in-use/.test(c)) return "There’s already an account with that email. Choose “I already have an account” to sign in.";
  if(/weak-password|missing-password/.test(c)) return "The password needs at least 6 characters.";
  if(/network-request-failed/.test(c)) return "Can’t reach the internet. Check the connection and try again.";
  if(/too-many-requests/.test(c)) return "Too many tries. Wait a few minutes, then try again.";
  return "Couldn’t sign in ("+(c || "unknown problem")+"). Try again in a moment.";
}
function gateWire(){
  const g=$("#gate");
  g.addEventListener("input", ev=>{ if(ev.target.id==="gPass" || ev.target.id==="gPass2") showMatch(); });
  /* leaving a password box counts as finished; a step between the box and its own eye button doesn't */
  g.addEventListener("focusout", ev=>{
    const box=ev.target.closest(".pw"), inp=box && $("input", box);
    if(!inp || (inp.id!=="gPass" && inp.id!=="gPass2")) return;
    if(ev.relatedTarget && box.contains(ev.relatedTarget)) return;
    showMatch(true);
  });
  g.addEventListener("submit", async ev=>{
    ev.preventDefault();
    const em=$("#gEmail"), pw=$("#gPass"), go=$(".gate-go", g), isNew=CL.mode==="new";
    const email=em.value.trim(), pass=pw.value;
    if(!email){ gateMsg("Type your email."); em.focus(); return; }
    if(!pass){ gateMsg("Type your password."); pw.focus(); return; }
    if(isNew && pass.length<6){ gateMsg("The password needs at least 6 characters."); pw.focus(); return; }
    const pw2=$("#gPass2");
    if(isNew && pw2 && !pw2.value){ gateMsg("Type the password again in the second line."); pw2.focus(); return; }
    /* a mismatch is said once, right under the second box */
    if(isNew && (!pw2 || pw2.value!==pass)){ showMatch(true); gateMsg(""); if(pw2) pw2.focus(); return; }
    go.disabled=true; go.textContent=isNew ? "Creating your account…" : "Signing in…"; gateMsg("");
    try{
      if(isNew){
        /* a new account: the email with the confirm link goes out straight away */
        const cred=await FB.createUserWithEmailAndPassword(CL.auth, email, pass);
        if(cred && cred.user) sendConfirm(cred.user, false);
      }
      else await FB.signInWithEmailAndPassword(CL.auth, email, pass);
      /* signed in: onAuthStateChanged in cloudInit takes it from here */
    }catch(err){ go.disabled=false; go.textContent=isNew ? "Create my account" : "Sign in"; gateMsg(authWords(err)); }
  });
  g.addEventListener("click", async ev=>{
    const b=ev.target.closest("[data-gate]"); if(!b) return;
    const a=b.dataset.gate;
    if(a==="eye"){
      const inp=document.getElementById(b.dataset.for); if(!inp) return;
      const show=inp.type==="password", say=show ? "Hide password" : "Show password";
      inp.type=show ? "text" : "password";
      b.innerHTML=ic(show ? "eyeOff" : "eye");
      b.setAttribute("aria-pressed", String(show)); b.setAttribute("aria-label", say); b.title=say;
      inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(err){}
      return;
    }
    if(a==="new" || a==="in"){ const email=($("#gEmail")||{}).value||""; CL.mode=a; showGate("signin"); $("#gEmail").value=email; return; }
    if(a==="reset"){
      const em=$("#gEmail"), email=em.value.trim();
      if(!email){ gateMsg("Type your email first, then choose Forgot password."); em.focus(); return; }
      try{ await FB.sendPasswordResetEmail(CL.auth, email); gateMsg("If there’s an account for "+email+", a link to set a new password is on its way. Check your email.", true); }
      catch(err){ gateMsg(authWords(err)); }
      return;
    }
    if(a==="retry"){ if(CL.user){ const u=CL.user; stopSync(); startSync(u); } else location.reload(); return; }
    if(a==="confirmed"){ b.disabled=true; const ok=await checkConfirmed(true); if(!ok && document.contains(b)) b.disabled=false; return; }
    if(a==="resend"){ if(CL.pending) sendConfirm(CL.pending, true); return; }
    if(a==="signout"){ stopConfirmWatch(); FB.signOut(CL.auth); }
  });
}

/* ---------- keeping in sync ---------- */
function startSync(user){
  CL.user=user; CL.ready=false; CL.error="";
  showGate("loading", navigator.onLine ? "" : "You’re offline. This computer needs the internet once to get your data.");
  const at=(...p)=>["users", user.uid, ...p];
  CL.unsub.push(FB.onSnapshot(FB.collection(CL.db, ...at("records")), {includeMetadataChanges:true}, onRecords, cloudFail));
  CL.unsub.push(FB.onSnapshot(FB.collection(CL.db, ...at("photos")), onPhotos, cloudFail));
  CL.unsub.push(FB.onSnapshot(FB.doc(CL.db, ...at("meta", "app")), onMeta, cloudFail));
}
/* signed out: drop this person's data from the screen (it stays in their account) */
function stopSync(){
  CL.unsub.forEach(u=>{ try{ u(); }catch(err){} }); CL.unsub=[];
  clearTimeout(CL.retry);
  CL.user=null; CL.ready=false; CL.shadow.clear(); CL.photoShadow.clear(); CL.metaShadow=null; CL.remote.clear();
  if(sheet.open) closeSheet();
  if(dialog.active) dialog.active.close();
  const ui=S.ui, lb=S.lastBackup; S=blank(); S.ui=ui; S.lastBackup=lb; useFlows(S.flows);
  Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]);
  render();
}
function onRecords(snap){
  if(!CL.ready){
    /* An empty copy on this computer proves nothing (it may never have synced), so then wait
       for the server's answer. Otherwise build the data from what arrived. */
    if(snap.empty && snap.metadata.fromCache) return;
    const d={stores:[], routes:[], drivers:[], trucks:[], trailers:[], money:[], weeks:[], payers:[], scenarios:[], docs:[], folders:[], tasks:[], flows:[]};
    snap.forEach(x=>{ const r=x.data(), k=listKey(r.t); try{ if(k) d[k].push(JSON.parse(r.j)); }catch(err){} });
    const ui=S.ui, lb=S.lastBackup, co=S.company;
    useFlows(d.flows);
    S=migrate(d); S.ui=ui; S.lastBackup=lb; S.company=co;
    fixStages();
    CL.shadow.clear(); records().forEach(([id, j])=>CL.shadow.set(id, j));
    CL.ready=true; gateOn(false);
    render(); applyRemote(); cloudStatus(); backupNow();
    setTimeout(()=>sweepFiles(false), 30000);   /* files left behind by deleted documents */
    if(snap.empty) setTimeout(offerOldData, 400);
    return;
  }
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;
    if(ch.type==="removed"){ if(CL.shadow.has(id)) CL.remote.set(id, null); else CL.remote.delete(id); return; }
    const r=ch.doc.data();
    if(CL.shadow.get(id)!==r.j) CL.remote.set(id, r); else CL.remote.delete(id);
  });
  applyRemote(); cloudStatus();
}
function onPhotos(snap){
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id, key="photo:"+id;
    if(ch.type==="removed"){ if(CL.photoShadow.has(id)) CL.remote.set(key, null); else CL.remote.delete(key); return; }
    const u=ch.doc.data().u||"";
    if(CL.photoShadow.get(id)!==u) CL.remote.set(key, u); else CL.remote.delete(key);
  });
  applyRemote();
}
function onMeta(snap){
  const co=(snap.exists() && snap.data().company)||"";
  if(JSON.stringify({company:co})===CL.metaShadow) return;
  CL.remote.set("meta", {company:co});
  applyRemote();
}
/* someone is mid-edit here: an unsaved change, an open form or page box, the tutorial */
function cloudBusy(){ return !!(saveTimer || dialog.active || SANDBOX || TUT.on || tdrag || isTyping(document.activeElement)); }
/* take in what changed on another computer, once nobody's mid-edit here */
function applyRemote(){
  if(!CL.ready || !CL.remote.size) return;
  if(cloudBusy()){ clearTimeout(CL.retry); CL.retry=setTimeout(applyRemote, 1500); return; }
  let n=0, flowsIn=false, anyFlow=false;
  /* changed stages first, so a driver moved into a new stage on the other computer lands in it here */
  const isFlow=id=>id.indexOf("flow_")===0;
  [...CL.remote].sort((a, b)=>isFlow(b[0])-isFlow(a[0])).forEach(([id, r])=>{
    if(flowsIn && !isFlow(id)){ useFlows(S.flows); flowsIn=false; }
    if(id==="meta"){ S.company=r.company; CL.metaShadow=JSON.stringify({company:r.company}); n++; return; }
    if(id.indexOf("photo:")===0){
      const did=id.slice(6);
      if(r){ PHOTOS[did]=r; CL.photoShadow.set(did, r); } else { delete PHOTOS[did]; CL.photoShadow.delete(did); }
      n++; return;
    }
    const k=id.indexOf("_"), t=id.slice(0, k), eid=id.slice(k+1), list=listKey(t) ? S[listKey(t)] : null;
    if(!list) return;
    const i=list.findIndex(e=>e.id===eid);
    /* changed here since the last save went out: keep this computer's version; the next save sends it */
    if((i>=0 ? JSON.stringify(list[i]) : undefined)!==CL.shadow.get(id)) return;
    if(r===null){ if(i>=0) list.splice(i, 1); CL.shadow.delete(id); }
    else{
      let e=null; try{ e=fixRecord(t, JSON.parse(r.j)); }catch(err){ return; }
      if(!e) return;
      if(i>=0) list[i]=e; else list.push(e);
      CL.shadow.set(id, JSON.stringify(e));
    }
    if(t==="flow") flowsIn=anyFlow=true;
    n++;
  });
  CL.remote.clear();
  if(flowsIn) useFlows(S.flows);
  if(anyFlow && fixStages()) save();
  if(n){ render(); if(sheet.open){ if(byId(sheet.type, sheet.id)) refreshSheet(); else closeSheet(); } }
}
/* send what changed here: each changed item, photo, or the company name */
function cloudFlush(){
  saveView();
  if(!CL.ready || !CL.user) return;
  const ops=[], want=new Map(records());
  want.forEach((j, id)=>{ if(CL.shadow.get(id)!==j){ ops.push({k:"rec", id, t:id.slice(0, id.indexOf("_")), j}); CL.shadow.set(id, j); } });
  [...CL.shadow.keys()].forEach(id=>{ if(!want.has(id)){ ops.push({k:"rec-del", id}); CL.shadow.delete(id); } });
  const keep=new Set(S.drivers.map(d=>d.id));
  Object.keys(PHOTOS).forEach(id=>{ const u=PHOTOS[id]; if(keep.has(id) && u && CL.photoShadow.get(id)!==u){ ops.push({k:"photo", id, u}); CL.photoShadow.set(id, u); } });
  [...CL.photoShadow.keys()].forEach(id=>{ if(!keep.has(id) || !PHOTOS[id]){ ops.push({k:"photo-del", id}); CL.photoShadow.delete(id); } });
  const meta=JSON.stringify({company:S.company||""});
  if(meta!==CL.metaShadow){ ops.push({k:"meta", company:S.company||""}); CL.metaShadow=meta; }
  if(!ops.length) return;
  const at=(...p)=>FB.doc(CL.db, "users", CL.user.uid, ...p);
  for(let i=0; i<ops.length; i+=400){
    const b=FB.writeBatch(CL.db);
    ops.slice(i, i+400).forEach(o=>{
      if(o.k==="rec") b.set(at("records", o.id), {t:o.t, j:o.j, at:FB.serverTimestamp()});
      else if(o.k==="rec-del") b.delete(at("records", o.id));
      else if(o.k==="photo") b.set(at("photos", o.id), {u:o.u, at:FB.serverTimestamp()});
      else if(o.k==="photo-del") b.delete(at("photos", o.id));
      else b.set(at("meta", "app"), {company:o.company, at:FB.serverTimestamp()});
    });
    CL.writing++; cloudStatus();
    b.commit().then(()=>{ CL.writing--; cloudStatus(); }, err=>{ CL.writing--; cloudFail(err); });
  }
  backupSoon();
}
function cloudFail(err){
  const c=(err && err.code)||"";
  CL.error=c==="permission-denied"
    ? "The online database didn’t let this account in. In Firebase, check that the Rules step was published."
    : "Couldn’t reach your online data ("+(c || (err && err.message) || "unknown problem")+").";
  if(!CL.ready) showGate("error"); else { toast(CL.error, {long:true}); cloudStatus(); }
}
function cloudStatusText(){
  if(!CL.user) return "Not signed in.";
  if(!navigator.onLine) return "Offline. Your changes are kept on this computer and go online when you’re back.";
  if(CL.writing>0) return "Saving…";
  return "All changes are saved online.";
}
function cloudStatus(){ const el=$("#cloudStatus"); if(el) el.textContent=cloudStatusText(); }

addEventListener("beforeunload", ()=>{ if(CLOUD && CL.ready) backupNow(); });
/* the account is empty online, but this computer has the data version 1.0.0 kept: offer to move it */

function prunePhotos(){
  if(DESK){ const keep=new Set(S.drivers.map(d=>d.id)); Object.keys(PHOTOS).forEach(k=>{ if(!keep.has(k)) delete PHOTOS[k]; }); return; }
  try{
    const keep=new Set(S.drivers.map(d=>d.id)), dead=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf(PHOTO_PREFIX)===0 && !keep.has(k.slice(PHOTO_PREFIX.length))) dead.push(k);
    }

/* square-crop and shrink to 256px so forty drivers still fit in storage.
   Portraits crop a little high so the face stays in frame. */
function readPhoto(file){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type||"image/")) return reject(new Error("That file isn’t an image."));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const S2=256, c=document.createElement("canvas"); c.width=S2; c.height=S2;
      const x=c.getContext("2d"), w=img.naturalWidth, h=img.naturalHeight, m=Math.min(w,h);
      const sx=(w-m)/2, sy=h>w ? (h-m)*0.22 : (h-m)/2;
      x.drawImage(img, sx, sy, m, m, 0, 0, S2, S2);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn’t read that image.")); };
    img.src=url;
  });
}
/* a driver's photo (the owner, 2026-10-14: "should be able to pick from the uploaded documents"): one
   of the pictures among their documents (a CDL or a DOT card has their face on it) or a picture from the
   computer, then framed: drag it and zoom in so the face sits in the circle. It's kept as a 256px square */
let PH=null;   /* the photo window that's open: its picture, framing and drawing */
function photoDialog(d){
  const pics=docsOf("driver:"+d.id).filter(x=>x.kind==="image"), F=280, urls=[];
  /* the photo's own box left the page (the round picture is the way in), so taking it off is here */
  dialog({title:"Photo for "+title("driver", d), ok:"Use this photo", kind:"photo", wide:true,
    extra:photoOf(d.id) ? '<button type="button" class="btn danger left" data-ph-remove>'+ic("trash")+'Remove photo</button>' : '',
    body:(pics.length ? '<div class="fld"><span class="fl">From their documents</span><div class="ph-docs">'
        +pics.map(x=>'<button type="button" class="ph-doc" data-ph-doc="'+x.id+'" aria-pressed="false">'
          +'<span class="ph-thumb" id="pht-'+x.id+'">'+ic("image")+'</span><span class="ph-nm">'+esc(x.name)+'</span></button>').join("")
        +'</div></div>' : '')
      +'<div class="ph-or"><button type="button" class="btn sm" data-ph-file>'+ic("upload")+'Choose a picture from this computer…</button>'
      +'<span class="fhelp">'+(pics.length ? 'Only pictures can be used, not PDFs.' : 'Pictures added to their Documents (a CDL, an ID) show here to pick from.')+'</span></div>'
      +'<div class="ph-crop" id="phCrop" hidden>'
      +'<canvas id="phCanvas" tabindex="0" role="img" aria-label="The photo. Drag it, or use the arrow keys, so their face sits in the circle."></canvas>'
      +'<label class="fld ph-zoom" for="phZoom"><span class="fl">Zoom</span><input id="phZoom" type="range" min="1" max="6" step="0.05" value="1"></label>'
      +'<p class="fhelp">Drag the picture so their face sits in the circle, and zoom in if it’s small.</p></div>',
    init:(f, close)=>{
      const cv=$("#phCanvas", f), zoom=$("#phZoom", f), dpr=window.devicePixelRatio||1, ctx=cv.getContext("2d");
      cv.width=F*dpr; cv.height=F*dpr; cv.style.width=F+"px"; cv.style.height=F+"px";
      const st=PH={img:null, s0:1, z:1, ox:0, oy:0, urls:urls};
      const clamp=()=>{ const s=st.s0*st.z, w=st.img.naturalWidth*s, h=st.img.naturalHeight*s; st.ox=Math.min(0, Math.max(F-w, st.ox)); st.oy=Math.min(0, Math.max(F-h, st.oy)); };
      const draw=()=>{
        if(!st.img) return;
        const s=st.s0*st.z;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, F, F);
        ctx.drawImage(st.img, st.ox, st.oy, st.img.naturalWidth*s, st.img.naturalHeight*s);
        /* outside the circle is shaded: that part won't show */
        ctx.fillStyle="rgba(10,20,30,.55)"; ctx.beginPath(); ctx.rect(0, 0, F, F); ctx.arc(F/2, F/2, F/2-3, 0, Math.PI*2, true); ctx.fill("evenodd");
        ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(F/2, F/2, F/2-3, 0, Math.PI*2); ctx.stroke();
      };
      /* a new picture fills the frame; a tall one starts a little high, where faces are */
      st.load=blob=>new Promise((ok, no)=>{
        const u=URL.createObjectURL(blob), img=new Image(); urls.push(u);
        img.onload=()=>{
          st.img=img; st.z=1; zoom.value="1"; st.s0=F/Math.min(img.naturalWidth, img.naturalHeight);
          const w=img.naturalWidth*st.s0, h=img.naturalHeight*st.s0; st.ox=(F-w)/2; st.oy=h>w ? (F-h)*0.22 : (F-h)/2;
          $("#phCrop", f).hidden=false; draw(); ok();
        };
        img.onerror=()=>no(new Error("Couldn’t read that picture."));
        img.src=u;
      });
      const zoomTo=z=>{
        const s=st.s0*st.z, cx=(F/2-st.ox)/s, cy=(F/2-st.oy)/s;   /* the point in the middle stays put */
        st.z=Math.max(1, Math.min(6, z)); const s2=st.s0*st.z; st.ox=F/2-cx*s2; st.oy=F/2-cy*s2; clamp(); draw(); zoom.value=String(st.z);
      };
      zoom.addEventListener("input", ()=>{ if(st.img) zoomTo(+zoom.value); });
      cv.addEventListener("wheel", ev=>{ if(!st.img) return; ev.preventDefault(); zoomTo(st.z*(ev.deltaY<0 ? 1.1 : 1/1.1)); }, {passive:false});
      let drag=null;
      cv.addEventListener("pointerdown", ev=>{ if(!st.img) return; drag={x:ev.clientX, y:ev.clientY}; cv.setPointerCapture(ev.pointerId); cv.classList.add("grabbing"); });
      cv.addEventListener("pointermove", ev=>{ if(!drag) return; st.ox+=ev.clientX-drag.x; st.oy+=ev.clientY-drag.y; drag={x:ev.clientX, y:ev.clientY}; clamp(); draw(); });
      const stop=()=>{ drag=null; cv.classList.remove("grabbing"); };
      cv.addEventListener("pointerup", stop); cv.addEventListener("pointercancel", stop);
      cv.addEventListener("keydown", ev=>{
        if(!st.img) return;
        const k=ev.key, step=ev.shiftKey ? 40 : 10;
        if(k==="+" || k==="=" || k==="-"){ ev.preventDefault(); zoomTo(k==="-" ? st.z/1.15 : st.z*1.15); return; }
        if(k==="ArrowLeft") st.ox+=step; else if(k==="ArrowRight") st.ox-=step; else if(k==="ArrowUp") st.oy+=step; else if(k==="ArrowDown") st.oy-=step;
        else return;
        ev.preventDefault(); clamp(); draw();
      });

      pics.forEach(x=>getFile(x).then(b=>{ const u=URL.createObjectURL(b), t=document.getElementById("pht-"+x.id); urls.push(u); if(t){ t.style.backgroundImage='url("'+u+'")'; t.innerHTML=""; } }).catch(()=>{}));
      f.addEventListener("click", async ev=>{
        const pd=ev.target.closest("[data-ph-doc]"), pf=ev.target.closest("[data-ph-file]");
        if(ev.target.closest("[data-ph-remove]")){ setPhoto(d.id, ""); touch(d); save(); render(); if(sheet.open) refreshSheet(); close(); toast("Photo removed"); return; }
        if(pf){ const i=$("#photoInput"); i.value=""; i.click(); return; }
        if(!pd) return;
        const x=docById(pd.dataset.phDoc); if(!x) return;
        $$("[data-ph-doc]", f).forEach(b=>b.setAttribute("aria-pressed", String(b===pd)));
        const blob=await docBlob(x); if(!blob) return;
        try{ await st.load(blob); cv.focus(); }catch(err){ toast(err.message); }
      });
      setTimeout(()=>{ const first=$("[data-ph-doc]", f)||$("[data-ph-file]", f); if(first) first.focus(); }, 20);
    },
    onClose:photoDone,
    onOk:()=>{
      const st=PH; if(!st || !st.img) return "Pick a picture first.";
      const out=document.createElement("canvas"), O=256, k=O/F, s=st.s0*st.z; out.width=O; out.height=O;
      out.getContext("2d").drawImage(st.img, st.ox*k, st.oy*k, st.img.naturalWidth*s*k, st.img.naturalHeight*s*k);
      if(!setPhoto(d.id, out.toDataURL("image/jpeg", 0.82))) return "Couldn’t save the photo.";
      touch(d); save(); render(); if(sheet.open) refreshSheet();
      return ()=>toast("Photo saved");
    }});
}
/* the photo window closed: the pictures it borrowed are let go */
function photoDone(){ if(PH){ PH.urls.forEach(u=>URL.revokeObjectURL(u)); PH=null; } }
function storageUsed(){
  let n=0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf("project-tracker/")===0) n+=k.length+(localStorage.getItem(k)||"").length;
    }
  }catch(err){}
  return n<1024 ? n+" B" : n<1048576 ? Math.round(n/1024)+" KB" : (n/1048576).toFixed(1)+" MB";
}

/* ============================================================
   HOME — the planner. A calendar (month, week or day) of your tasks and of
   the dates already in the app (starts, pickups, paperwork running out),
   with Today, Needs attention and the headline numbers beside it.
   A task has a day, maybe a time, maybe a link to a store, route, driver or
   truck (it shows on that page too), maybe a repeat and a reminder. A
   repeating task is one task: each of its days is ticked off on its own.
   ============================================================ */

/* ---------- days and times ---------- */
function todayISO(){ return isoOf(new Date()); }
function addDays(iso, n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function dow(iso){ return parseISO(iso).getDay(); }   /* 0 Sunday … 6 Saturday */
function weekStart(iso){ return addDays(iso, -dow(iso)); }
function mins(t){ const m=/^(\d{1,2}):(\d{2})/.exec(t||""); return m ? +m[1]*60+ +m[2] : null; }
function hhmm(m){ m=Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60))+":"+pad(m%60); }
function fmtTime(t){ const m=mins(t); if(m==null) return ""; const h=Math.floor(m/60), mm=m%60; return (h%12||12)+(mm ? ":"+pad(mm) : "")+(h<12 ? " AM" : " PM"); }
/* the month view's narrow days use the short way calendars write it: 9am, 1:30pm */
function fmtTimeShort(t){ const m=mins(t); if(m==null) return ""; const h=Math.floor(m/60), mm=m%60; return (h%12||12)+(mm ? ":"+pad(mm) : "")+(h<12 ? "am" : "pm"); }
function fmtDay(iso, o){ const d=parseISO(iso); return d ? d.toLocaleDateString("en-US", o||{weekday:"short", month:"short", day:"numeric"}) : ""; }
function dayWord(iso){ const n=daysUntil(iso); return n===0 ? "Today" : n===1 ? "Tomorrow" : n===-1 ? "Yesterday" : fmtDay(iso); }

/* ---------- tasks ---------- */
const REPEATS=[["","Doesn’t repeat"],["day","Every day"],["weekday","Every weekday (Mon–Fri)"],["week","Every week"],["2weeks","Every 2 weeks"],["month","Every month"]];
const REMIND_AT=[["","No reminder"],["0","At the start time"],["10","10 minutes before"],["30","30 minutes before"],["60","1 hour before"],["1440","1 day before"]];
const REMIND_DAY=[["","No reminder"],["m0","That morning at 8 AM"],["m1","The day before at 8 AM"]];
function taskById(id){ return S.tasks.find(t=>t.id===id) || null; }
/* the days a task falls on between two dates, both included */
function taskDays(t, from, to){
  if(!t.date) return [];
  const out=[], last=t.until && t.until<to ? t.until : to;
  if(!t.repeat){ if(t.date>=from && t.date<=last) out.push(t.date); return out; }
  if(t.repeat==="month"){
    const s=parseISO(t.date), day=s.getDate();
    for(let k=0; k<1200; k++){
      const y=s.getFullYear(), m=s.getMonth()+k, len=new Date(y, m+1, 0).getDate(), iso=isoOf(new Date(y, m, Math.min(day, len)));
      if(iso>last) break;
      if(iso>=from) out.push(iso);
    }
    return out;
  }
  const step=t.repeat==="2weeks" ? 14 : t.repeat==="week" ? 7 : 1;
  let iso=t.date;
  /* start near the range instead of walking from the first day */
  if(iso<from){ const gap=Math.round((parseISO(from)-parseISO(iso))/864e5); iso=addDays(iso, Math.floor(gap/step)*step); }
  for(let k=0; k<4000 && iso<=last; k++, iso=addDays(iso, step)){
    if(iso<from || (t.repeat==="weekday" && (dow(iso)===0 || dow(iso)===6))) continue;
    out.push(iso);
  }
  return out;
}
function doneOn(t, iso){ return !!(t.done && t.done[iso]); }
/* a one-time task left undone after its day; a repeating one stays on its days instead */
function isLate(t){ return !t.repeat && !!t.date && t.date<todayISO() && !doneOn(t, t.date); }
/* the next day it's still to do (an overdue one-time task counts), or "" */
function nextOpen(t){
  if(!t.repeat) return doneOn(t, t.date) ? "" : t.date;
  const today=todayISO();
  return taskDays(t, today, addDays(today, 400)).find(iso=>!doneOn(t, iso)) || "";
}
function linked(link){ const p=String(link||"").split(":"); return p.length===2 && ["store","route","driver","truck"].indexOf(p[0])>=0 ? byId(p[0], p[1]) : null; }
function linkLabel(link){
  const p=String(link||"").split(":"), e=linked(link);
  if(!e) return "";
  return p[0]==="store" ? storeName(e) : p[0]==="route" ? title("route", e)+" · "+storeLabel(storeOf(e)) : title(p[0], e);
}
function taskWhen(t, iso){
  return [dayWord(iso), t.time ? fmtTime(t.time)+(t.end ? "–"+fmtTime(t.end) : "") : ""].filter(Boolean).join(", ");
}
function repeatWord(t){ const r=REPEATS.find(x=>x[0]===t.repeat); return t.repeat && r ? r[1] : ""; }

/* ---------- the dates already in the app ---------- */
function autoEvents(from, to){
  const out=[], add=(iso, time, label, open, kind, sub)=>{ if(iso && iso>=from && iso<=to) out.push({auto:true, date:iso, time:time||"", label:label, open:open, kind:kind, sub:sub||kind}); };
  S.routes.forEach(r=>{ if(!isClosed(r)) add(r.start, r.report, title("route",r)+" starts", "route:"+r.id, "start"); });
  S.drivers.forEach(d=>{
    if(isClosed(d)) return;
    const c=d.cdl||{};
    add(d.start, "", shortName(d)+" starts", "driver:"+d.id, "start");
    add(c.exp, "", shortName(d)+"’s CDL runs out", "driver:"+d.id, "due");
    add(c.med, "", shortName(d)+"’s medical card runs out", "driver:"+d.id, "due");
  });
  S.trucks.forEach(t=>{
    if(isClosed(t)) return;
    add(t.pickup, "", "Pick up "+title("truck",t), "truck:"+t.id, "start", "pickup");
    add(t.regExp, "", title("truck",t)+" registration runs out", "truck:"+t.id, "due");
    add(t.inspExp, "", title("truck",t)+" inspection due", "truck:"+t.id, "due");
  });
  S.trailers.forEach(x=>{
    add(x.regExp, "", trailerTitle(x)+" registration runs out", "trailer:"+x.id, "due");
    add(x.inspExp, "", trailerTitle(x)+" inspection due", "trailer:"+x.id, "due");
  });
  return out;
}
/* everything on each day from one date to another: day → items, all-day ones first, then by time */
function itemsByDay(from, to){
  const map={}, put=x=>(map[x.date]=map[x.date]||[]).push(x);
  S.tasks.forEach(t=>taskDays(t, from, to).forEach(iso=>put({task:t, date:iso, time:t.time||"", end:t.end||"", label:t.title, done:doneOn(t, iso)})));
  autoEvents(from, to).forEach(put);
  Object.keys(map).forEach(k=>map[k].sort((a,b)=>((a.time?1:0)-(b.time?1:0)) || ((mins(a.time)||0)-(mins(b.time)||0)) || a.label.localeCompare(b.label)));
  return map;
}

/* ---------- the calendar ---------- */
function calView(){ return ["month","week","day"].indexOf(S.ui.calView)>=0 ? S.ui.calView : "month"; }
function calDate(){ return parseISO(S.ui.calDate) ? S.ui.calDate : todayISO(); }
function calTitle(){
  const v=calView(), d=calDate();
  if(v==="month") return fmtDay(d, {month:"long", year:"numeric"});
  if(v==="day") return fmtDay(d, {weekday:"long", month:"long", day:"numeric", year:"numeric"});
  /* "Oct 4 – 10, 2026", "Sep 27 – Oct 3, 2026", "Dec 27, 2026 – Jan 2, 2027", put together by hand:
     asked for a day and a year without the month, the desktop app writes "2026 (day: 10)" */
  const a=weekStart(d), b=addDays(a, 6), A=parseISO(a), B=parseISO(b), md=iso=>fmtDay(iso, {month:"short", day:"numeric"});
  if(A.getFullYear()!==B.getFullYear()) return md(a)+", "+A.getFullYear()+" – "+md(b)+", "+B.getFullYear();
  return md(a)+" – "+(A.getMonth()===B.getMonth() ? B.getDate() : md(b))+", "+B.getFullYear();
}
/* one thing on the calendar: a task (opens it; a one-time one can be dragged to another day) or a date from the app (opens its page) */
function calChip(x, block){
  const time=x.time ? '<b class="cc-tm">'+esc(block ? fmtTime(x.time) : fmtTimeShort(x.time))+'</b> ' : '';
  if(x.group){ const names=x.list.map(y=>y.label);
    return '<button type="button" class="cchip k-'+x.kind+' cgrp" data-act="cal-day" data-v="'+x.date+'" title="'+esc(names.join("\n"))+'"'
      +' aria-label="'+esc(x.list.length+" "+x.word+": "+names.join(", ")+". Show the day")+'"><span class="cc-t"><b>'+x.list.length+'</b> '+esc(x.word)+'</span></button>'; }
  if(x.auto) return '<button type="button" class="cchip k-'+x.kind+'" data-open="'+x.open+'" title="'+esc(x.label)+'"><span class="cc-t">'+time+esc(x.label)+'</span></button>';
  const t=x.task, late=isLate(t) && x.date===t.date, st=taskStore(t), who=st ? null : taskWho(t);
  const tag=st ? '<span class="cc-st'+(brandOf(st.retailer) ? " "+brandOf(st.retailer) : "")+'">#'+esc(st.num)+'</span>'
    : who ? '<span class="cc-st'+(who.driver ? " who" : "")+'">'+esc(who.name)+'</span>' : '';
  const say=x.label+", "+taskWhen(t, x.date)+(linked(t.link) ? ", "+linkLabel(t.link) : "")+(x.done ? ", done" : late ? ", overdue" : "");
  return '<button type="button" class="cchip task'+(x.done?" done":"")+(late?" late":"")+(block?" block":"")+'" data-act="task-open" data-v="'+t.id+'" data-day="'+x.date+'"'
    +(t.repeat ? '' : ' data-drag-task="'+t.id+'"')+' aria-label="'+esc(say)+'" title="'+esc(say)+'">'
    +'<span class="cc-t">'+(t.repeat ? ic("repeat","rep") : '')+time+esc(x.label)+(tag ? ' '+tag : '')+'</span></button>';
}
/* the store a task is about: the one it's linked to, or its route's (shown as "#2231" on the calendar) */
function taskStore(t){
  const p=String(t.link||"").split(":"), e=linked(t.link);
  return !e ? null : p[0]==="store" ? e : p[0]==="route" ? storeOf(e) : null;
}
/* the driver or truck a task is about, shown on the calendar as "Marcus T." or "T-02",
   unless the task's name already says who ("Interview Keisha Grant") */
function taskWho(t){
  const p=String(t.link||"").split(":"), e=linked(t.link);
  if(!e || (p[0]!=="driver" && p[0]!=="truck")) return null;
  const driver=p[0]==="driver", word=driver ? String(e.name||"").trim().split(/\s+/)[0] : String(e.unit||"").trim();
  if(word && new RegExp("(^|[^\\w])"+word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")+"($|[^\\w])", "i").test(t.title||"")) return null;
  return {driver:driver, name:driver ? shortName(e) : title("truck", e)};
}
/* a day's things where the days are narrow (the month, a week's all-day row): the dates from the app first, two or
   more of a kind as one ("3 starting", "2 pickups", "4 papers due") that opens the day, then your tasks */
const AUTO_GROUP=[["start", "start", "starting"], ["pickup", "start", "pickups"], ["due", "due", "papers due"]];
function dayList(items, iso){
  const autos=items.filter(x=>x.auto), out=[];
  AUTO_GROUP.forEach(g=>{ const list=autos.filter(x=>x.sub===g[0]);
    if(list.length===1) out.push(list[0]); else if(list.length>1) out.push({group:true, kind:g[1], word:g[2], list:list, date:iso}); });
  return out.concat(items.filter(x=>!x.auto));
}
const MONTH_SHOWN=4;   /* what a day on the month shows before "… more" */
function vMonth(){
  const d=parseISO(calDate()), first=isoOf(new Date(d.getFullYear(), d.getMonth(), 1)), start=weekStart(first), end=addDays(start, 41);
  const map=itemsByDay(start, end), today=todayISO(), month=d.getMonth();
  let h='<table class="cal-month"><thead><tr>'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w=>'<th scope="col">'+w+'</th>').join("")+'</tr></thead><tbody>';
  for(let w=0; w<6; w++){
    h+='<tr>';
    for(let i=0; i<7; i++){
      const iso=addDays(start, w*7+i), items=map[iso]||[], list=dayList(items, iso), shown=list.slice(0, MONTH_SHOWN);
      const more=list.slice(MONTH_SHOWN).reduce((n, x)=>n+(x.group ? x.list.length : 1), 0);
      h+='<td class="cal-d'+(parseISO(iso).getMonth()!==month?" out":"")+(iso===today?" today":"")+'" data-drop-day="'+iso+'">'

/* the week or day view: an all-day row, then the hours, with timed things placed by time */
const HOUR=48;
function vTimeGrid(days){
  const map=itemsByDay(days[0], days[days.length-1]), today=todayISO();
  /* 7 AM to 7 PM, widened to fit what's on, with an hour to spare after the last thing so it can be stretched */
  let lo=7*60, hi=19*60;
  days.forEach(iso=>(map[iso]||[]).forEach(x=>{ const s=mins(x.time); if(s!=null){ lo=Math.min(lo, Math.floor(s/60)*60); hi=Math.max(hi, Math.min(1440, Math.ceil(endOf(x)/60)*60+60)); } }));
  const cols='60px repeat('+days.length+', minmax(0, 1fr))';
  let h='<div class="tgrid'+(days.length>1 ? ' wk' : '')+'" style="--cols:'+cols+'"><div class="tg-head"><span></span>'
    +days.map(iso=>'<button type="button" class="tg-day'+(iso===today?" today":"")+'" data-act="cal-day" data-v="'+iso+'">'
      +'<span class="w">'+esc(fmtDay(iso, {weekday:"short"}))+'</span><span class="n">'+parseISO(iso).getDate()+'</span></button>').join("")+'</div>'
    +'<div class="tg-all"><span class="tg-lbl">All day</span>'
    +days.map(iso=>{ const allDay=(map[iso]||[]).filter(x=>!x.time);
      return '<div class="tg-allc" data-drop-day="'+iso+'" data-drop-allday="1">'+(days.length>1 ? dayList(allDay, iso) : allDay).map(x=>calChip(x)).join("")+'</div>'; }).join("")+'</div>'
    +'<div class="tg-body" style="height:'+((hi-lo)/60*HOUR)+'px"><div class="tg-hours">';
  for(let m=lo; m<hi; m+=60) h+='<span style="top:'+((m-lo)/60*HOUR)+'px">'+fmtTime(hhmm(m))+'</span>';
  h+='</div>';
  days.forEach(iso=>{
    h+='<div class="tg-col'+(iso===today?" today":"")+'" data-drop-day="'+iso+'" data-drop-lo="'+lo+'" data-drop-hi="'+hi+'">';
    lanes((map[iso]||[]).filter(x=>x.time)).forEach(p=>{
      const s=mins(p.x.time), e=endOf(p.x), tall=Math.max(24, (e-s)/60*HOUR-2);
      /* a task's top and bottom edges can be dragged to change when it starts or ends */
      const grip=k=>p.x.task ? '<span class="tg-grip g-'+k+'" data-grip="'+k+'" data-v="'+p.x.task.id+'" aria-hidden="true"></span>' : '';
      /* a short one keeps to one line; a longer one wraps, but only to the lines that fit */
      h+='<div class="tg-ev'+(tall<40 ? ' short' : '')+'" style="top:'+((s-lo)/60*HOUR)+'px;height:'+tall+'px;--h:'+tall+'px;left:calc('+(p.lane/p.of*100)+'% + 2px);width:calc('+(100/p.of)+'% - 4px);--lines:'+Math.max(1, Math.floor((tall-6)/16))+'">'
        +calChip(p.x, true)+grip("top")+grip("bot")+'</div>';
    });
    if(iso===today){ const n=new Date(), nm=n.getHours()*60+n.getMinutes(); if(nm>=lo && nm<=hi) h+='<div class="tg-now" style="top:'+((nm-lo)/60*HOUR)+'px" aria-hidden="true"></div>'; }
    h+='</div>';
  });
  return h+'</div></div>';
}
function endOf(x){ const s=mins(x.time), e=mins(x.end); return e!=null && e>s ? e : Math.min(1440, s+60); }
/* things at the same time sit side by side: each gets a lane, out of however many its group needs */
function lanes(list){
  const out=[]; let group=[], groupEnd=-1, ends=[];
  const close=()=>{ const of=Math.max(1, ends.length); group.forEach(p=>p.of=of); group=[]; ends=[]; };
  list.slice().sort((a,b)=>mins(a.time)-mins(b.time)).forEach(x=>{
    const s=mins(x.time), e=endOf(x);
    if(s>=groupEnd) close();
    let lane=ends.findIndex(v=>v<=s); if(lane<0){ lane=ends.length; ends.push(e); } else ends[lane]=e;
    const p={x:x, lane:lane}; group.push(p); out.push(p); groupEnd=Math.max(groupEnd, e);
  });
  close();
  return out;
}

/* ---------- Needs attention, in groups (the owner, 2026-10-16: with 240 routes it listed 431 things, five at a
   time). Each kind is one line saying how many, most urgent first, with a line under it about what's in it.
   Clicking a line opens it right there: its first few, then all of them, or the list that shows just those,
   where many can be ticked at once. NEEDS says what each list-backed kind is, for Home and the lists alike ---------- */
const NEEDS={
  route:{
    driver:{hit:r=>!isClosed(r) && !earlyRoute(r) && !driverOf(r), one:"route that needs a driver", many:"routes that need a driver", none:"No routes need a driver now."},
    truck:{hit:r=>!isClosed(r) && !earlyRoute(r) && !truckOf(r), one:"route that needs a truck", many:"routes that need a truck", none:"No routes need a truck now."},
    crew:{hit:r=>{ if(isClosed(r) || earlyRoute(r)) return false; const rd=readiness(r); return !!((rd.d && !rd.dOk) || (rd.t && !rd.tOk)); },
      one:"route waiting on its driver or truck", many:"routes waiting on their driver or truck", none:"No routes are waiting on their driver or truck now."},
    early:{hit:r=>earlyRoute(r) && !readiness(r).ready, one:"offered route not staffed yet", many:"offered routes not staffed yet", none:"Every offered route is staffed."}
  },
  truck:{idletruck:{hit:t=>!isClosed(t) && truckOnRent(t) && !routesOfTruck(t).length, one:"truck on rent but not on a route", many:"trucks on rent but not on a route", none:"Every truck on rent is on a route."}},
  driver:{idledriver:{hit:d=>!isClosed(d) && isHiredish(d) && !routesOfDriver(d).length, one:"hired driver not on a route", many:"hired drivers not on a route", none:"Every hired driver is on a route."}}
};
/* what a list shows just now from a group on Home ("Show all 42 on the Routes list"); it lasts until another tab is picked */
const NEED={route:"", driver:"", truck:""};
function needOf(t){ const k=NEED[t]; return (k && NEEDS[t] && NEEDS[t][k]) || null; }
const ATT={open:new Set(), all:new Set()}, ATT_FIRST=6;
const PAPER={"CDL":["CDL","CDLs"], "Medical card":["medical card","medical cards"], "Registration":["registration","registrations"], "Inspection":["inspection","inspections"]};
function attentionGroups(){
  const G=[], byTs=a=>a.sort((x, y)=>y.ts-x.ts);
  const add=(k, tone, icon, items, words, sub, list)=>{ if(items.length) G.push({k:k, tone:tone, icon:icon, items:items, words:words, sub:sub(items), list:list||""}); };
  const nm=(t, e)=>t==="store" ? storeName(e) : title(t, e);
  const issues=[], expired=[], soon=[];
  TYPES.forEach(t=>all(t).forEach(e=>{
    if(isClosed(e)) return;
    openIssues(e).forEach(x=>issues.push({ts:x.t, who:nm(t, e), what:x.text, when:"Open since "+fmtWhen(x.t), open:t+":"+e.id, focus:"sec-activity"}));
    expiries(t, e).forEach(x=>(x.level==="bad" ? expired : soon).push({ts:-x.n, who:nm(t, e), what:x.text, label:x.label, open:t+":"+e.id,

  }));
  S.stores.forEach(s=>openIssues(s).forEach(x=>issues.push({ts:x.t, who:nm("store", s), what:x.text, when:"Open since "+fmtWhen(x.t), open:"store:"+s.id, focus:"sec-activity"})));
  S.trailers.forEach(x=>expiries("truck", x).forEach(y=>(y.level==="bad" ? expired : soon).push({ts:-y.n, who:trailerTitle(x), what:y.text, label:y.label, open:"trailer:"+x.id})));
  /* the routes still in play: won ones first (they "need" a driver or truck), ones still being offered last */
  const R=S.routes.filter(r=>!isClosed(r)), N=NEEDS.route;
  const rItem=(r, what, open, focus)=>({ts:stageIdx("route", r.stage), r:r, who:title("route", r), what:what, when:stageOf("route", r.stage).name+" · "+storeName(storeOf(r)), open:open||"route:"+r.id, focus:focus});

      "", !rd.d ? "f_driverId" : !rd.t ? "f_truckId" : "");

  const idleT=S.trucks.filter(NEEDS.truck.idletruck.hit).map(t=>{ const m=truckMonthly(t);
    return {ts:m, m:m, who:title("truck", t), what:"On rent, not on a route"+(m ? " ("+money(m)+"/mo)" : ""), when:stageOf("truck", t.stage).name+(t.vendor ? " · "+t.vendor : ""), open:"truck:"+t.id, focus:"f__routes"}; });
  const idleD=S.drivers.filter(NEEDS.driver.idledriver.hit).sort(SORT.driver).map(d=>{ const s=driverStore(d);

  add("issue", "red", "alert", issues, n=>n===1 ? "open problem" : "open problems", l=>"Newest: "+l[0].who+", "+l[0].what);
  add("expired", "red", "clock", expired, n=>n===1 ? "paper expired" : "papers expired", kinds);
  add("driver", "amber", "driver", needD, n=>n===1 ? "route needs a driver" : "routes need a driver", stages, "route");
  add("truck", "amber", "truck", needT, n=>n===1 ? "route needs a truck" : "routes need a truck", stages, "route");
  add("idletruck", "amber", "truck", idleT, n=>n===1 ? "truck on rent, not on a route" : "trucks on rent, not on a route", l=>money(l.reduce((s, x)=>s+x.m, 0))+" a month in rent", "truck");
  add("crew", "amber", "route", crew, n=>n===1 ? "route waiting on its driver or truck" : "routes waiting on their driver or truck",
    l=>{ const d=l.filter(x=>x.open.indexOf("driver:")===0).length, t=l.length-d; return [d ? plural(d, "driver")+" not hired yet" : "", t ? plural(t, "truck")+" not on the road yet" : ""].filter(Boolean).join(", "); }, "route");
  add("soon", "amber", "clock", soon, n=>(n===1 ? "paper runs out" : "papers run out")+" within 30 days", l=>"Soonest: "+l[0].who+", "+lowFirst(l[0].what));
  add("idledriver", "amber", "driver", idleD, n=>n===1 ? "hired driver not on a route" : "hired drivers not on a route",
    l=>l.slice(0, 2).map(x=>x.short).join(", ")+(l.length>2 ? " and "+(l.length-2)+" more" : ""), "driver");
  add("early", "slate", "route", early, n=>n===1 ? "offered route not staffed yet" : "offered routes not staffed yet", stages, "route");
  /* in a browser (not the desktop app, which keeps its own daily copies) a backup reminder, after two weeks */
  if(!SANDBOX && !DESK && S.routes.length+S.drivers.length+S.trucks.length>=3 && (!S.lastBackup || Date.now()-S.lastBackup>14*864e5))
    G.push({k:"backup", tone:"slate", icon:"download", nav:"settings", title:S.lastBackup ? "Last backup was "+ago(S.lastBackup) : "No backup yet", sub:"Everything lives only in this browser. Save a copy in Settings."});
  return G;
}

  h+='<div class="ag-body" id="'+id+'"><ul class="ag-items">'+show.map(x=>'<li><button type="button" class="ag-it" data-open="'+x.open+'"'+(x.focus ? ' data-focus="'+x.focus+'"' : '')+'>'
    +'<span class="ag-w">'+esc(x.who)+'</span> <span class="ag-x">'+esc(x.what)+'</span>'+(x.when ? ' <span class="ag-when">'+esc(x.when)+'</span>' : '')+'</button></li>').join("")+'</ul>';
  if(n>ATT_FIRST) h+=g.list
    ? '<button type="button" class="hlink ag-more" data-act="att-list" data-v="'+g.k+'">'+ic("next")+'Show all '+n+' on the '+esc(FLOWS[g.list].title)+' list</button>'
    : '<button type="button" class="hlink ag-more" data-act="att-all" data-v="'+g.k+'">'+(all ? "Show fewer" : "Show all "+n)+'</button>';
  return h+'</div></li>';
}

/* what a task can link to: any store, and the routes, drivers and trucks still in play */
function linkOptions(cur){
  const grp=(label, list)=>list.length ? '<optgroup label="'+label+'">'+list.map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join("")+'</optgroup>' : '';
  const keep=(t, e)=>!isClosed(e) || t+":"+e.id===cur;
  return '<option value="">Not linked</option>'
    +grp("Stores", S.stores.slice().sort(cmpStores).map(s=>["store:"+s.id, storeName(s)]))
    +grp("Routes", S.routes.filter(r=>keep("route", r)).sort(SORT.route).map(r=>["route:"+r.id, title("route",r)+" · "+storeLabel(storeOf(r))]))
    +grp("Drivers", S.drivers.filter(d=>keep("driver", d)).sort(SORT.driver).map(d=>["driver:"+d.id, title("driver",d)]))
    +grp("Trucks", S.trucks.filter(x=>keep("truck", x)).sort(SORT.truck).map(x=>["truck:"+x.id, title("truck",x)]));
}
function remindOptions(timed, cur){
  return (timed ? REMIND_AT : REMIND_DAY).map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>').join("");
}
/* t: the task, or null for a new one. pre: what a new one starts with ({date, time, end, link, title, from}),
   and for either, day: which of a repeating task's days it was opened from */
function taskDialog(t, pre){
  pre=pre||{};
  const isNew=!t, d=t || {title:pre.title||"", details:"", date:pre.date||todayISO(), time:pre.time||"", end:pre.time ? pre.end||"" : "", link:pre.link||"", repeat:"", until:"", remind:""};
  const day=pre.day || d.date;
  /* made from a checklist step: it's ticked off with the step, so it happens once (no repeat) */
  const step=stepOf(t || {from:pre.from}), whose=step ? title(step.t, step.e) : "";
  const fld=(id, label, input, cls)=>'<label class="fld'+(cls?" "+cls:"")+'" for="'+id+'"><span class="fl">'+label+'</span>'+input+'</label>';
  dialog({title:isNew ? "New task" : "Task", ok:isNew ? "Add task" : "Save", kind:isNew ? "task" : "edit-task", wide:true,
    body:fld("tk_title", 'What <span class="req" aria-hidden="true">*</span>', '<input id="tk_title" name="title" class="inp" value="'+esc(d.title)+'" autocomplete="off" required aria-required="true" placeholder="Call Penske about T-02">')
      +(step ? '<p class="fhelp tk-from">'+ic("link")+'<span>From'+esc(whose)+'’s checklist ('+esc(step.st.name)+'). Ticking this task off ticks the step too, and the other way round.</span></p>' : '')
      +'<div class="three">'
      +fld("tk_date", 'Day <span class="req" aria-hidden="true">*</span>', '<input id="tk_date" name="date" type="date" class="inp" value="'+esc(d.date)+'" required aria-required="true">')
      +fld("tk_time", "Starts", '<input id="tk_time" name="time" type="time" class="inp" value="'+esc(d.time)+'">')
      +fld("tk_end", "Ends", '<input id="tk_end" name="end" type="time" class="inp" value="'+esc(d.end)+'">')
      +'</div><p class="fhelp tk-hint">No time makes it a to-do for that day.</p>'
      +'<div class="two"'+(step ? ' hidden' : '')+'>'
      +fld("tk_rep", "Repeats", '<select id="tk_rep" name="repeat" class="inp">'+REPEATS.map(o=>'<option value="'+o[0]+'"'+(o[0]===(d.repeat||"")?' selected':'')+'>'+o[1]+'</option>').join("")+'</select>')
      +fld("tk_until", "Until (leave empty to keep going)", '<input id="tk_until" name="until" type="date" class="inp" value="'+esc(d.until||"")+'">')
      +'</div>'
      +fld("tk_link", "Linked to", '<select id="tk_link" name="link" class="inp">'+linkOptions(linked(d.link) ? d.link : "")+'</select>')
      +fld("tk_rem", "Reminder", '<select id="tk_rem" name="remind" class="inp">'+remindOptions(!!d.time, d.remind||"")+'</select>')
      +'<p class="fhelp">Reminders pop up while SolidWave Tracker is open.</p>'
      +fld("tk_det", "Details", '<textarea id="tk_det" name="details" class="inp" rows="3" placeholder="Address, who to ask for, what to bring">'+esc(d.details||"")+'</textarea>')
      +(isNew ? '' : '<label class="ck-line" for="tk_done"><input type="checkbox" id="tk_done" name="done"'+(doneOn(t, day)?' checked':'')+'> Done'+(t.repeat ? ' for '+esc(fmtDay(day)) : '')+'</label>'),
    extra:isNew ? '' : '<button type="button" class="btn danger left" data-dlg="del">'+ic("trash")+'Delete</button>'
      +'<button type="button" class="btn" data-dlg="outlook">'+ic("calendar")+'Add to Outlook</button>',
    init:(f, close)=>{
      const E=f.elements, until=E.until.closest(".fld");
      /* Until only means something for a repeating task; the reminder choices follow whether there's a time */
      const sync=()=>{
        until.hidden=!E.repeat.value;
        const timed=!!E.time.value, cur=E.remind.value, ok=(timed ? REMIND_AT : REMIND_DAY).some(o=>o[0]===cur);
        if(E.remind.dataset.timed!==String(timed)){ E.remind.innerHTML=remindOptions(timed, ok ? cur : ""); E.remind.dataset.timed=String(timed); }
        E.end.disabled=!timed;
      };
      E.remind.dataset.timed=String(!!d.time);
      ["change","input"].forEach(k=>f.addEventListener(k, ev=>{ if(ev.target===E.repeat || ev.target===E.time) sync(); }));
      sync();
      const del=$('[data-dlg="del"]', f); if(del) del.addEventListener("click", ()=>{ close(); deleteTask(t); });
      const out=$('[data-dlg="outlook"]', f); if(out) out.addEventListener("click", ()=>taskToOutlook(t));
    },
    onOk:f=>{
      const E=f.elements, title=E.title.value.trim(), date=E.date.value, time=E.time.value, end=time ? E.end.value : "";
      if(!title){ E.title.focus(); return "Say what the task is."; }
      if(!parseISO(date)){ E.date.focus(); return "Pick the day it’s on."; }
      if(end && mins(end)<=mins(time)){ E.end.focus(); return "It has to end after it starts."; }
      const rep=step ? "" : E.repeat.value;
      if(rep && E.until.value && E.until.value<date){ E.until.focus(); return "“Until” has to be on or after the first day."; }
      /* a step's task linked somewhere else is just a task from then on */
      const tied=!!step && E.link.value===step.t+":"+step.e.id;
      const vals={title:title, details:E.details.value.trim(), date:date, time:time, end:end, link:E.link.value,
        repeat:rep, until:rep ? E.until.value : "", remind:E.remind.value};
      const before=snap();
      let task=t, moved=null;
      if(isNew){ task=Object.assign({id:uid("k"), done:{}, created:Date.now(), from:step && !tied ? "" : pre.from||""}, vals); S.tasks.push(task); }
      else{ Object.assign(t, vals); if(step && !tied) t.from=""; }
      if(!isNew){
        const on=E.done.checked, dd=t.repeat ? day : t.date;
        if(on!==doneOn(t, dd)){
          if(t.repeat) setDone(t, dd, on); else { t.done={}; if(on) t.done[t.date]=Date.now(); }
          /* the step it came from is ticked (or unticked) with it */
          if(tied) moved=tickStep(step, on);
        }
      }
      touch(task); save(); render(); if(sheet.open) refreshSheet();
      /* the first reminder asks once whether Windows may show them (the app says yes on its own) */
      if(vals.remind && window.Notification && Notification.permission==="default"){ try{ Notification.requestPermission(); }catch(err){} }
      return ()=>toast(isNew ? "Added “"+title+"”, "+taskWhen(task, task.date) : "Saved “"+title+"”"+(moved ? ". "+whose+" moved on to "+moved.name : ""),
        moved ? {undo:()=>restore(before)} : null);
    }});
}
function setDone(t, iso, on){ t.done=t.done||{}; if(on) t.done[iso]=Date.now(); else delete t.done[iso]; touch(t); }
function toggleTask(t, iso, on){
  const before=snap();
  setDone(t, iso, on);
  /* a task made from a checklist step ticks the step too, which can move its page on to the next stage */
  const s=stepOf(t), moved=s ? tickStep(s, on) : null;
  save(); render(); if(sheet.open) refreshSheet();
  if(on) toast("Done: “"+t.title+"”"+(moved ? ". "+title(s.t, s.e)+" moved on to "+moved.name : ""), {undo:()=>restore(before)});
}
function deleteTask(t){
  confirmBox("Delete “"+t.title+"”?", (t.repeat ? "It comes off every day it repeats on. " : "")+"You can undo right after.", "Delete", ()=>{
    const before=snap();
    S.tasks=S.tasks.filter(x=>x.id!==t.id);
    save(); render(); if(sheet.open) refreshSheet();
    toast("Deleted “"+t.title+"”", {undo:()=>restore(before)});
  }, true);
}
/* dragged to another day (and in the week or day view, another time). A repeating one isn't
   draggable: which of its days would move? It changes in its form instead */
function moveTask(t, iso, minute, allDay){
  const before=snap(), len=t.time ? (t.end ? mins(t.end)-mins(t.time) : 0) : 0, was=t.date;
  t.date=iso;
  /* one that's ticked off stays ticked off on its new day */
  if(!t.repeat && was!==iso && doneOn(t, was)){ t.done={}; t.done[iso]=Date.now(); }
  /* a reminder keeps going when a task gains or loses its time: "the day before" stays the day before, anything else becomes the nearest kind */
  if(allDay){ if(t.time && t.remind) t.remind=t.remind==="1440" ? "m1" : "m0"; t.time=""; t.end=""; }
  else if(minute!=null){
    const s=Math.max(0, Math.min(1425, Math.round(minute/15)*15));
    if(!t.time && t.remind) t.remind=t.remind==="m1" ? "1440" : "60";
    t.time=hhmm(s); t.end=len>0 ? hhmm(Math.min(1439, s+len)) : "";
  }
  touch(t); save(); render();
  toast("Moved “"+t.title+"” to "+taskWhen(t, iso), {undo:()=>restore(before)});
}
/* its top or bottom edge dragged in the week or day view: it starts or ends at another time.
   A repeating one changes on every day it repeats, as it would in its form */
function resizeTask(t, s, e){
  const before=snap();
  t.time=hhmm(s); t.end=hhmm(e);
  touch(t); save(); render();
  toast("“"+t.title+"” is now "+fmtTime(t.time)+"–"+fmtTime(t.end)+(t.repeat ? ", "+repeatWord(t).toLowerCase() : ""), {undo:()=>restore(before)});
}

/* ---------- reminders: a Windows notification (and a note in the app) while it's open ---------- */
function remindAt(t, iso){
  if(!t.remind) return null;
  const day=parseISO(iso);
  if(t.remind==="m0"){ day.setHours(8, 0, 0, 0); return day.getTime(); }
  if(t.remind==="m1"){ day.setDate(day.getDate()-1); day.setHours(8, 0, 0, 0); return day.getTime(); }
  const s=mins(t.time); if(s==null) return null;
  day.setHours(0, s-(+t.remind||0), 0, 0); return day.getTime();
}
function checkReminders(){
  if(SANDBOX || !S.tasks || !S.tasks.length) return;
  const now=Date.now(), from=isoOf(new Date(now-864e5)), to=isoOf(new Date(now+2*864e5)), seen=S.ui.reminded=S.ui.reminded||{};
  S.tasks.forEach(t=>{
    if(!t.remind || t.ex) return;   /* the example tasks are only there to look at */
    taskDays(t, from, to).forEach(iso=>{
      const at=remindAt(t, iso), key=t.id+"|"+iso+"|"+t.remind+"|"+t.time;
      /* due in the last 15 minutes, not done, and not shown yet on this computer */
      if(at==null || at>now || now-at>15*60000 || doneOn(t, iso) || seen[key]) return;
      seen[key]=now; remindNow(t, iso);
    });
  });
  Object.keys(seen).forEach(k=>{ if(now-seen[k]>7*864e5) delete seen[k]; });
  saveView();
}
function remindNow(t, iso){
  const body=[taskWhen(t, iso), linkLabel(t.link)].filter(Boolean).join(" · ");
  toast("Reminder: “"+t.title+"”, "+body, {action:{label:"Open", fn:()=>taskDialog(t, {day:iso})}});
  if(window.Notification && Notification.permission==="granted"){
    /* the phone app (an iPhone home-screen app most of all) shows it through its offline helper */
    if(navigator.serviceWorker && navigator.serviceWorker.controller){ navigator.serviceWorker.ready.then(r=>r.showNotification(t.title, {body:body, tag:t.id+"|"+iso})).catch(()=>{}); return; }
    try{
      const n=new Notification(t.title, {body:body, tag:t.id+"|"+iso});
      n.onclick=()=>{ if(DESK && DESK.focus) DESK.focus(); taskDialog(t, {day:iso}); };
    }catch(err){}
  }
}
setInterval(checkReminders, 30000);
setTimeout(checkReminders, 5000);
/* the calendar keeps time while it's open: the red "now" line moves, and after midnight Home moves on to the new day */
let planDay=todayISO();
setInterval(()=>{

/* ---------- Add to Outlook: a calendar file Outlook opens, ready to save ---------- */
function icsText(t){
  const x=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const day=iso=>iso.replace(/-/g,""), at=(iso, hm)=>day(iso)+"T"+hm.replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SolidWave Tracker//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:"+t.id+"@project-tracker","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),"SUMMARY:"+x(t.title)];
  if(t.time){
    const e=mins(t.end)!=null && mins(t.end)>mins(t.time) ? mins(t.end) : mins(t.time)+60;
    L.push("DTSTART:"+at(t.date, t.time), "DTEND:"+(e>=1440 ? at(addDays(t.date,1), hhmm(e-1440)) : at(t.date, hhmm(e))));
  }else L.push("DTSTART;VALUE=DATE:"+day(t.date), "DTEND;VALUE=DATE:"+day(addDays(t.date,1)));
  const rule={day:"FREQ=DAILY", weekday:"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", week:"FREQ=WEEKLY", "2weeks":"FREQ=WEEKLY;INTERVAL=2", month:"FREQ=MONTHLY"}[t.repeat];
  if(rule) L.push("RRULE:"+rule+(t.until ? ";UNTIL="+day(t.until)+(t.time ? "T235959" : "") : ""));
  const about=[t.details, linkLabel(t.link) ? "Linked to "+linkLabel(t.link) : ""].filter(Boolean).join("\n\n");
  if(about) L.push("DESCRIPTION:"+x(about));
  const before={"0":"PT0M","10":"-PT10M","30":"-PT30M","60":"-PT1H","1440":"-P1D","m0":"PT8H","m1":"-PT16H"}[t.remind];
  if(before) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+x(t.title),"TRIGGER:"+before,"END:VALARM");
  L.push("END:VEVENT","END:VCALENDAR");
  /* lines over 75 characters are folded, as calendar files need */
  return L.map(l=>{ let o=""; while(l.length>74){ o+=l.slice(0,74)+"\r\n "; l=l.slice(74); } return o+l; }).join("\r\n")+"\r\n";
}
async function taskToOutlook(t){
  const name=(t.title.replace(/[\\/:*?"<>|]/g, "_").slice(0, 60) || "Task")+".ics", text=icsText(t);
  if(DESK && DESK.openCalendar){
    const r=await DESK.openCalendar(name, text);
    if(r && r.ok) toast("Opening “"+t.title+"” in Outlook. Save it there to add it to your calendar.", {long:true});
    else{ if(r && r.file) DESK.showFile(r.file); toast("Nothing on this computer opens calendar files, so its folder opened instead. Drag the file into Outlook.", {long:true}); }
    return;
  }
  fileOut(new Blob([text], {type:"text/calendar"}), name);
  toast("Saved “"+name+"”. Open it to add it to your calendar.", {long:true});
}

/* ============================================================

const SEL={route:new Set(), driver:new Set(), truck:new Set(), trailer:new Set()};
let FRESH=new Set();   /* just added: their rows flash once */
const LIST_FIND={route:"Find a route, store or company", driver:"Find a driver, phone or CDL #", truck:"Find a truck, VIN or plate", trailer:"Find a trailer, VIN, plate or truck"};
/* this computer's settings for one list: the stage tab, the search, the vendor or store picked,
   list or board, and the groups folded away */
function LU(t){
  const L=S.ui.lists=S.ui.lists && typeof S.ui.lists==="object" ? S.ui.lists : {};
  const u=L[t]=L[t] && typeof L[t]==="object" ? L[t] : {};
  if(!u.shut || typeof u.shut!=="object") u.shut={};
  ["stage","q","pick","view"].forEach(k=>{ if(typeof u[k]!=="string") u[k]=""; });

}
function listMode(t){ return t==="route" || LU(t).view!=="board"; }
/* the store a driver is grouped under: the one they go with, or else the store of their first route */
function driverStore(d){ const r=routesOfDriver(d)[0]; return storeById(d.storeId) || (r ? storeOf(r) : null); }
function vendorKey(tk){ return String(tk.vendor||"").trim().toLowerCase(); }
function listKeyOf(t, e){ if(t==="truck") return vendorKey(e)||"__none"; const s=driverStore(e); return s ? s.id : "__none"; }
function qWords(t){ return LU(t).q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function qHit(words, text){ const x=String(text||"").toLowerCase(); return words.every(k=>x.indexOf(k)>=0); }
function listText(t, e){
  if(t==="truck"){ const tr=trailerOf(e); return [e.unit, e.ymm, e.vendor, e.branch, e.account, e.vin, e.plate, e.location, configLabel(e), routesOfTruck(e).map(r=>title("route",r)).join(" "), tr && tr.num, tr && tr.vin, tr && tr.plate].join(" "); }
  if(t==="driver"){ const s=driverStore(e); return [e.name, e.phone, fmtPhone(e.phone), phoneDigits(e.phone), e.email, e.city, e.source, (e.cdl||{}).num, s && "#"+s.num, s && s.city, routesOfDriver(e).map(r=>title("route",r)).join(" ")].join(" "); }
  const d=driverOf(e), tk=truckOf(e); return [title("route",e), e.company, e.contact, d && d.name, tk && tk.unit].join(" ");
}
function storeText(s){ return ["#"+s.num, s.city, s.retailer, s.address, stateName(s.state)].join(" "); }
/* what gets past the search, the state and the vendor or store picked (every stage). skip leaves one
   of those out ("state" or "pick"), to count what each of its choices would show */
function listBase(t, skip){
  const u=LU(t), w=qWords(t), nd=needOf(t);
  return all(t).filter(e=>{
    if(nd && !nd.hit(e)) return false;
    if(skip!=="state" && !passesState(t, e)) return false;
    if(skip!=="pick" && t==="truck" && u.pick && (u.pick==="__none" ? vendorKey(e) : vendorKey(e)!==u.pick)) return false;
    if(skip!=="pick" && t==="driver" && u.pick){ const s=driverStore(e); if(u.pick==="__none" ? s : !s || s.id!==u.pick) return false; }
    if(!w.length) return true;
    if(t==="route"){ const s=storeOf(e); if(s && qHit(w, storeText(s))) return true; }
    return qHit(w, listText(t, e));
  });
}
/* the stage tab picked: All is everything still in play */
function listShown(t, base){ const u=LU(t); return (u.stage ? base.filter(e=>e.stage===u.stage) : base.filter(e=>!isClosed(e))).sort(SORT[t]); }
function markMixed(root){ $$("input[data-mixed]", root).forEach(x=>{ x.indeterminate=true; }); }

/* "Showing the 42 routes that need a driver", from Home's Needs attention, and the way back to all of them */
function vNeedBar(t){

  return '<div class="need-bar" role="status">'+ic("flag")+'<span>'+esc(n ? "Showing the "+(n===1 ? "1 "+nd.one : n+" "+nd.many)+"." : nd.none)+'</span>'
    +'<button type="button" class="linkbtn" data-act="need-clear">Show all '+esc(f.many)+'</button></div>';
}
function vListTabs(t){
  const u=LU(t), f=FLOWS[t], base=listBase(t), closed=base.filter(isClosed).length;
  const tab=(k, label, n, tone)=>'<button type="button" class="ltab'+(k ? ' tone-'+tone : ' all')+'" data-act="list-stage" data-v="'+k+'" aria-pressed="'+(u.stage===k)+'">'
    +esc(label)+' <b>'+n+'</b><span class="sr"> '+(n===1 ? f.one : f.many)+'</span></button>';
  return tab("", "All", base.filter(e=>!isClosed(e)).length)
    +f.stages.map(s=>tab(s.k, s.name, base.filter(e=>e.stage===s.k).length, s.tone)).join("")
    +(closed || u.stage==="closed" ? tab("closed", f.closed.name, closed, "muted") : '');
}
function vListFilters(t){
  const u=LU(t), sf=stateFilter(), pick=t==="route" ? null : pickerOpts(t, "pick"), state=pickerOpts(t, "state");
  return '<input id="lq" class="inp lq" type="search" value="'+esc(u.q)+'" placeholder="'+esc(LIST_FIND[t])+'" aria-label="'+esc(LIST_FIND[t])+'" autocomplete="off">'
    +(pick ? listPicker("pick", t==="truck" ? "Vendor" : "Store", pick, u.pick) : '')
    +listPicker("state", "State", state, sf)
    +((u.q || u.pick || sf) ? '<button type="button" class="btn sm" data-act="list-clear">Clear filters</button>' : '')
